  if (items.length === 0) {
    html += '<div class="card empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div class="empty-title">No problems match</div><div class="empty-desc">' + (state.history.length === 0 ? 'Start practicing to build your history.' : 'Try a different filter or search term.') + '</div>' + (state.history.length === 0 ? '<button class="btn-primary" onclick="setView(\'browse\')">Browse topics</button>' : '') + '</div>';
  } else {
    items.forEach(h => {
      const t = TOPIC_MAP[h.topicId];
      html += '<div class="history-item" onclick="reopenHistory(\'' + h.id + '\')">';
      html += '<div class="history-thumb">' + escapeHtml(h.problem.slice(0, 22)) + '</div>';
      html += '<div class="history-main"><div class="history-prob">' + escapeHtml(h.problem) + '</div>';
      html += '<div class="history-meta"><span class="badge badge-neutral">' + t.name + '</span><span>·</span><span>' + relTime(h.at) + '</span><span>·</span><span>' + (h.timeSpent || 0) + 's</span></div></div>';
      html += '<div class="row">' + (h.correct ? '<span class="badge badge-success">Correct</span>' : '<span class="badge badge-danger">Incorrect</span>') + '</div></div>';
    });
  }
  html += '</div>';
  return html;
}

function setHistFilter(f) { state.histFilter = f; render(); }

function reopenHistory(id) {
  const item = state.history.find(h => h.id === id);
  if (!item) return;
  showModal(
    '<div class="modal-header"><div><div class="caption">' + TOPIC_MAP[item.topicId].name + ' · ' + relTime(item.at) + '</div><div class="h1" style="margin-top:4px;">Problem review</div></div><button class="btn-icon" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    '<div class="mono" style="padding:10px;background:var(--surface-2);border-radius:var(--radius-sm);margin-bottom:12px;">' + escapeHtml(item.problem) + '</div>' +
    '<div class="row" style="margin-bottom:12px;">' + (item.correct ? '<span class="badge badge-success">Correct</span>' : '<span class="badge badge-danger">Incorrect</span>') + '<span class="badge badge-neutral">' + (item.timeSpent || 0) + 's</span></div>' +
    '<div class="caption" style="margin-bottom:6px;">Final answer</div><div class="mono" style="padding:8px 12px;background:var(--success-bg);border-radius:var(--radius-sm);margin-bottom:12px;">' + escapeHtml(item.answer) + '</div>' +
    '<div class="caption" style="margin-bottom:6px;">Solution steps</div><div class="steps">' +
    item.steps.map((s, i) => '<div class="step"><div class="step-num">' + (i+1) + '</div><div class="step-content"><div class="step-title">' + escapeHtml(s.title) + '</div><div class="step-explain">' + escapeHtml(s.explain) + '</div><div class="step-expr">' + escapeHtml(s.expr) + '</div></div></div>').join('') +
    '</div>' +
    (state.notes[item.id] ? '<div class="caption" style="margin-top:12px;margin-bottom:6px;">Your notes</div><div style="padding:10px;background:var(--surface-2);border-radius:var(--radius-sm);font-size:13px;">' + escapeHtml(state.notes[item.id]) + '</div>' : '') +
    '<div class="row" style="margin-top:16px;"><button class="btn-primary" onclick="retrySimilar(\'' + item.topicId + '\')">Try similar problem</button><button class="btn-secondary" onclick="openTopic(\'' + item.topicId + '\');closeModal()">Open topic</button></div>'
  );
}

function retrySimilar(topicId) {
  closeModal();
  state.currentTopic = topicId;
  state.tab = 'practice';
  newPractice();
}

function relTime(t) {
  const diff = Date.now() - t;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  if (d < 7) return d + 'd ago';
  return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

/* PROFILE */
function renderProfile() {
  const name = state.profileName || 'Student';
  const grade = state.profileGrade || '10';
  let html = '<div class="page"><div class="page-header"><div class="display">Profile</div><div class="muted" style="margin-top:4px;">Personal info and learning preferences.</div></div>';
  html += '<div class="card" style="margin-bottom:16px;max-width:520px;">';
  html += '<div class="caption" style="margin-bottom:6px;">Name</div><input class="input" id="profName" value="' + escapeHtml(name) + '" oninput="state.profileName=this.value" style="margin-bottom:12px;">';
  html += '<div class="caption" style="margin-bottom:6px;">Grade</div><select class="input" id="profGrade" onchange="state.profileGrade=this.value" style="margin-bottom:12px;">';
  ['9','10','11'].forEach(g => { html += '<option value="' + g + '" ' + (g === grade ? 'selected' : '') + '>Grade ' + g + '</option>'; });
  html += '</select>';
  html += '<div class="caption" style="margin-bottom:6px;">Default difficulty</div><div class="segmented" style="margin-bottom:12px;">';
  ['easier','grade','challenge'].forEach(d => {
    const label = d === 'easier' ? 'Easier' : d === 'grade' ? 'Grade Level' : 'Challenge';
    html += '<button class="' + (state.difficulty === d ? 'active' : '') + '" onclick="state.difficulty=\'' + d + '\';render()">' + label + '</button>';
  });
  html += '</div>';
  html += '<button class="btn-primary" onclick="saveProfile()">Save</button></div>';
  html += '<div class="card"><div class="h2" style="margin-bottom:12px;">Saved bookmarks</div>';
  const bookmarked = state.history.filter(h => state.bookmarks.has(h.id));
  if (bookmarked.length === 0) html += '<div class="empty" style="padding:20px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><div class="empty-title">No bookmarks yet</div><div class="empty-desc">Bookmark problems while practicing to find them here.</div></div>';
  else bookmarked.forEach(h => {
    html += '<div class="history-item" onclick="reopenHistory(\'' + h.id + '\')"><div class="history-thumb">' + escapeHtml(h.problem.slice(0,22)) + '</div><div class="history-main"><div class="history-prob">' + escapeHtml(h.problem) + '</div><div class="history-meta"><span class="badge badge-neutral">' + TOPIC_MAP[h.topicId].name + '</span><span>·</span><span>' + relTime(h.at) + '</span></div></div></div>';
  });
  html += '</div></div>';
  return html;
}

function saveProfile() { toast('Profile saved.', 'success'); }

/* FORMULA SHEET */
function showFormulaSheet() {
  const html = '<div class="modal-header"><div class="h1">Formula Reference</div><button class="btn-icon" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    '<div class="formula-section"><h4>Algebra</h4><div class="formula-list">' +
    formulaRow('Quadratic formula', 'x = (−b ± √(b² − 4ac)) / 2a') +
    formulaRow('Slope', 'm = (y₂ − y₁) / (x₂ − x₁)') +
    formulaRow('Slope-intercept', 'y = mx + b') +
    formulaRow('Difference of squares', 'a² − b² = (a + b)(a − b)') +
    formulaRow('Exponent product', 'aᵐ · aⁿ = aᵐ⁺ⁿ') +
    '</div></div>' +
    '<div class="formula-section"><h4>Geometry</h4><div class="formula-list">' +
    formulaRow('Pythagorean theorem', 'a² + b² = c²') +
    formulaRow('Triangle area', 'A = ½bh') +
    formulaRow('Circle area', 'A = πr²') +
    formulaRow('Circle circumference', 'C = 2πr') +
    formulaRow('Distance', 'd = √((x₂−x₁)² + (y₂−y₁)²)') +
    formulaRow('Midpoint', '((x₁+x₂)/2, (y₁+y₂)/2)') +
    '</div></div>';
  showModal(html);
}

function formulaRow(name, expr) {
  return '<div class="formula"><span class="formula-name">' + name + '</span><span>' + escapeHtml(expr) + '</span></div>';
}

document.getElementById('formulaBtn').addEventListener('click', showFormulaSheet);

/* ---------- DRAWING CANVAS HANDLERS ---------- */
function attachTopicHandlers() {
  const c = document.getElementById('drawCanvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = c.getBoundingClientRect();
  c.width = rect.width * dpr;
  c.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#000';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  let drawing = false;
  function pos(e) {
    const r = c.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return [x, y];
  }
  function start(e) { drawing = true; const [x,y] = pos(e); ctx.beginPath(); ctx.moveTo(x,y); e.preventDefault(); }
  function move(e) { if (!drawing) return; const [x,y] = pos(e); ctx.lineTo(x,y); ctx.stroke(); e.preventDefault(); }
  function end() { drawing = false; }
  c.addEventListener('mousedown', start); c.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  c.addEventListener('touchstart', start); c.addEventListener('touchmove', move); c.addEventListener('touchend', end);
}

/* INITIAL RENDER */
render();
</script>
