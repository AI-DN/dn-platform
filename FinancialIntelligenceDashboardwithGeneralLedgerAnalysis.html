<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Intelligence Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--surface:#fff;--surface-2:#f5f5f5;--text:#18181b;--text-muted:#52525b;--text-subtle:#a1a1aa;--border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.16);--accent:#5e6ad2;--accent-hover:#4f59c4;--accent-bg:rgba(94,106,210,.08);--success:#16a34a;--success-bg:rgba(22,163,74,.08);--warning:#d97706;--warning-bg:rgba(217,119,6,.08);--danger:#dc2626;--danger-bg:rgba(220,38,38,.08);--info:#0284c7;--info-bg:rgba(2,132,199,.08);--radius-sm:4px;--radius-md:6px;--chart-rev:#5e6ad2;--chart-opex:#d97706;--chart-net:#16a34a}
[data-theme="dark"]{--bg:#09090b;--surface:#131316;--surface-2:#1c1c20;--text:#fafafa;--text-muted:#a1a1aa;--text-subtle:#71717a;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);--accent:#7b85e3;--accent-hover:#8d96e8;--accent-bg:rgba(123,133,227,.10);--success:#22c55e;--success-bg:rgba(34,197,94,.10);--warning:#f59e0b;--warning-bg:rgba(245,158,11,.10);--danger:#ef4444;--danger-bg:rgba(239,68,68,.10);--info:#38bdf8;--info-bg:rgba(56,189,248,.10);--chart-rev:#7b85e3;--chart-opex:#f59e0b;--chart-net:#22c55e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
.container{max-width:1440px;margin:0 auto;background:var(--surface);min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;font-weight:600}
.header-right{display:flex;align-items:center;gap:16px}
.theme-toggle{background:transparent;border:1px solid var(--border-strong);color:var(--text-muted);width:32px;height:32px;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 150ms ease}
.theme-toggle:hover{background:var(--surface-2);color:var(--text)}
.connection-status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--text-muted)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--danger)}
.status-dot.connecting{background:var(--warning);animation:pulse 2s infinite}
.status-dot.connected{background:var(--success)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;gap:8px}
.tab{padding:12px 16px;background:none;border:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-muted);transition:all 150ms ease;border-bottom:2px solid transparent}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none;padding:32px}
.tab-content.active{display:block}
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
@media (max-width:900px){.kpi-strip{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.kpi-strip{grid-template-columns:1fr}}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;cursor:pointer;transition:border-color 150ms ease,background 150ms ease}
.kpi-card:hover{border-color:var(--border-strong);background:var(--surface-2)}
.kpi-card h3{font-size:11px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.kpi-card .value{font-size:24px;font-weight:600;color:var(--text);margin-bottom:4px}
.kpi-card .prior{font-size:11px;color:var(--text-subtle);margin-bottom:4px;font-weight:400}
.kpi-card .variance{font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.kpi-card .variance.up-good{color:var(--success)}
.kpi-card .variance.down-good{color:var(--success)}
.kpi-card .variance.up-bad{color:var(--danger)}
.kpi-card .variance.down-bad{color:var(--danger)}
.kpi-card .variance.neutral{color:var(--text-subtle)}
.kpi-card .sparkline{margin-top:8px;display:block;width:100%;height:28px;opacity:.85}
.ratio-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:24px}
@media (max-width:900px){.ratio-strip{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.ratio-strip{grid-template-columns:repeat(2,1fr)}}
.ratio-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px}
.ratio-card .label{font-size:10px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.ratio-card .val{font-size:18px;font-weight:600;color:var(--text)}
.ratio-card .sub{font-size:11px;color:var(--text-subtle);margin-top:2px;font-weight:400}
.ratio-card .delta{font-size:11px;font-weight:500;margin-top:2px}
.ratio-card .delta.pos{color:var(--success)}
.ratio-card .delta.neg{color:var(--danger)}
.ratio-card .delta.neu{color:var(--text-subtle)}
.config-section{background:var(--warning-bg);border:1px solid var(--warning);border-radius:var(--radius-md);padding:24px;margin-bottom:32px}
.config-section h3{font-size:16px;font-weight:600;margin-bottom:12px}
.config-section p{color:var(--text-muted);margin-bottom:16px}
.input{width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);font-family:inherit;font-size:13px;margin-bottom:12px;transition:border-color 150ms ease,background 150ms ease}
.input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.input::placeholder{color:var(--text-subtle)}
.upload-section{background:var(--surface);border:2px dashed var(--border-strong);border-radius:var(--radius-md);padding:32px;text-align:center}
.upload-section h2{font-size:16px;font-weight:600;margin-bottom:8px}
.upload-section p{color:var(--text-muted);margin-bottom:20px;font-size:13px}
.file-input-wrapper{display:inline-block;position:relative}
.file-input-wrapper input[type=file]{position:absolute;left:-9999px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:500;font-family:'Inter',sans-serif;transition:all 150ms ease}
.btn-primary{background:var(--accent);color:#fff;border:1px solid var(--accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border-strong)}
.btn-secondary:hover{background:var(--surface-2);border-color:var(--text-subtle)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid transparent}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toast-container{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:12px}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;display:flex;align-items:flex-start;gap:12px;min-width:320px;max-width:480px;animation:slideIn .3s ease-out}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--info)}
.toast.warning{border-left:3px solid var(--warning)}
.toast-icon{font-size:18px;line-height:1}
.toast-content{flex:1}
.toast-title{font-weight:600;margin-bottom:4px}
.toast-message{font-size:13px;color:var(--text-muted);white-space:pre-line}
.table-wrapper{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:20px}
table{width:100%;border-collapse:collapse;background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
thead{background:var(--surface-2);border-bottom:1px solid var(--border)}
th{padding:8px 12px;text-align:left;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.number-cell{text-align:right;font-variant-numeric:tabular-nums}
.negative{color:var(--danger)}
.positive{color:var(--success)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state h3{font-size:16px;font-weight:600;margin-bottom:8px;color:var(--text)}
.empty-state p{font-size:14px}
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1500}
.loading-content{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:32px;text-align:center;min-width:300px}
.loading-spinner{width:36px;height:36px;border:3px solid var(--border);border-radius:50%;border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;font-weight:500}
.loading-subtext{font-size:13px;color:var(--text-muted);margin-top:6px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge-success{background:var(--success-bg);color:var(--success)}
.badge-warning{background:var(--warning-bg);color:var(--warning)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-neutral{background:var(--surface-2);color:var(--text-muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1700;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:24px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;margin-bottom:12px}
.modal p{color:var(--text-muted);margin-bottom:16px;line-height:1.6;white-space:pre-line}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal ul.overlap-list{list-style:none;padding:0;margin:8px 0 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2)}
.modal ul.overlap-list li{padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
.modal ul.overlap-list li:last-child{border-bottom:none}
.filter-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px;margin-bottom:24px}
.filter-group{flex:0 1 auto;min-width:160px}
.filter-group label{display:block;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.02em;color:var(--text-muted);margin-bottom:4px}
.filter-group select,.filter-group input{width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);font-family:inherit;font-size:13px}
.period-buttons{display:flex;gap:4px;flex-wrap:wrap}
.period-btn{padding:6px 10px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;transition:all 150ms ease}
.period-btn:hover{background:var(--surface-2);color:var(--text)}
.period-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.custom-range{display:flex;gap:6px;align-items:center}
.custom-range input[type=date]{padding:5px 8px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);font-family:inherit;font-size:12px}
.report-section{margin-bottom:40px}
.report-section h2{font-size:16px;font-weight:600;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.section-header{background:var(--surface-2);font-weight:600;color:var(--text)}
.report-total{font-weight:600;background:var(--surface-2)}
.side-panel{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border);z-index:1600;transform:translateX(100%);transition:transform 200ms ease;overflow-y:auto}
.side-panel.open{transform:translateX(0)}
.side-panel-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:1}
.side-panel-header h3{font-size:16px;font-weight:600}
.side-panel-close{background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:4px;font-size:20px;line-height:1}
.side-panel-close:hover{color:var(--text)}
.side-panel-content{padding:24px}
.field-group{margin-bottom:16px}
.field-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.02em;color:var(--text-muted);margin-bottom:4px}
.field-value{font-size:13px;color:var(--text);padding:4px 0}
.field-value.empty{color:var(--text-subtle);font-style:italic}
.column-toggle{position:relative;display:inline-block}
.column-toggle-btn{padding:6px 12px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer}
.column-toggle-btn:hover{background:var(--surface-2);color:var(--text)}
.column-toggle-menu{position:absolute;top:100%;right:0;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px;min-width:240px;max-height:400px;overflow-y:auto;z-index:100;display:none}
.column-toggle-menu.open{display:block}
.column-option{display:flex;align-items:center;padding:6px 8px;cursor:pointer;border-radius:var(--radius-sm)}
.column-option:hover{background:var(--surface-2)}
.column-option input[type=checkbox]{margin-right:8px}
.column-option label{font-size:13px;cursor:pointer;user-select:none}
.table-header-controls{display:flex;justify-content:flex-end;margin-bottom:12px;gap:8px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;margin-bottom:24px}
.chart-card h3{font-size:14px;font-weight:600;margin-bottom:4px}
.chart-card .chart-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px}
.chart-legend{display:flex;gap:16px;font-size:12px;color:var(--text-muted);margin-bottom:12px;flex-wrap:wrap}
.chart-legend .legend-item{cursor:pointer;user-select:none;padding:2px 4px;border-radius:var(--radius-sm);transition:opacity 150ms ease}
.chart-legend .legend-item.disabled{opacity:.4;text-decoration:line-through}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chart-svg{width:100%;height:280px;display:block}
.radio-row{display:flex;gap:16px;margin-bottom:16px;align-items:center}
.radio-row label{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:var(--text)}
.radio-row input[type=radio]{margin:0;cursor:pointer}
.confirm-row{background:var(--accent-bg);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:12px 16px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.confirm-row .info{font-size:13px;color:var(--text)}
.confirm-row .actions{display:flex;gap:8px}
.summary-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px}
.summary-card .label{font-size:11px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.summary-card .val{font-size:20px;font-weight:600}
.view-toggle{display:inline-flex;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:16px}
.view-toggle button{background:transparent;border:none;padding:6px 14px;font-size:12px;font-weight:500;color:var(--text-muted);cursor:pointer;font-family:inherit}
.view-toggle button.active{background:var(--accent);color:#fff}
.tree-row{cursor:pointer}
.tree-row .chev{display:inline-block;width:14px;color:var(--text-muted);transition:transform 150ms ease;font-size:10px}
.tree-row.expanded .chev{transform:rotate(90deg)}
.tree-leaf .chev{visibility:hidden}
@media (max-width:640px){.side-panel{width:100vw}.tabs{overflow-x:auto;white-space:nowrap}}
</style>
</head>
<body>
<div id="toast-container" class="toast-container"></div>
<div id="loading-overlay" class="loading-overlay" style="display:none"><div class="loading-content"><div class="loading-spinner"></div><div class="loading-text" id="loading-text">Processing...</div><div class="loading-subtext" id="loading-subtext"></div></div></div>
<div id="modal-container"></div>
<div id="side-panel" class="side-panel"><div class="side-panel-header"><h3 id="side-panel-title">Details</h3><button class="side-panel-close" id="side-panel-close" aria-label="Close">&times;</button></div><div class="side-panel-content" id="side-panel-content"></div></div>
<div class="container">
<header><h1>Financial Intelligence Dashboard</h1><div class="header-right"><button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><span id="theme-icon">☀</span></button><div class="connection-status"><span class="status-dot" id="status-dot"></span><span id="status-text">Not connected</span></div></div></header>
<div class="tabs">
<button class="tab active" data-tab="dashboard">Dashboard</button>
<button class="tab" data-tab="ledger">Ledger Data</button>
<button class="tab" data-tab="income">Income Statement</button>
<button class="tab" data-tab="balance">Balance Sheet</button>
<button class="tab" data-tab="master-chart">Master Chart</button>
<button class="tab" data-tab="imports">Imports</button>
</div>
<div id="dashboard-tab" class="tab-content active">
<div class="config-section" id="config-section"><h3>Supabase Configuration Required</h3><p>Enter your Supabase credentials to enable persistent storage:</p><input type="text" class="input" id="supabaseUrl" placeholder="Supabase URL (e.g., https://xxxxx.supabase.co)"><input type="password" class="input" id="supabaseKey" placeholder="Supabase Anon Key"><button class="btn btn-primary" id="connectBtn">Connect to Database</button></div>
<div id="dashboard-filter-bar"></div>
<div class="kpi-strip" id="kpi-strip"></div>
<div id="ratio-strip-container"></div>
<div class="chart-card"><h3>Revenue · Operating Expenses · Net Income</h3><div class="chart-sub" id="chart-sub">Monthly trend</div><div class="chart-legend" id="chart-legend"></div><div id="chart-container"></div></div>
</div>
<div id="ledger-tab" class="tab-content"><div id="ledger-filter-bar"></div><div class="filter-bar" id="ledger-filters"><div class="filter-group"><label>Transaction Type</label><select id="filter-type" class="input" style="margin:0"><option value="">All Types</option></select></div><div class="filter-group" style="flex:1;min-width:240px"><label>Search</label><input type="text" id="filter-search" class="input" style="margin:0" placeholder="Search memo, name, account..."></div></div><div id="ledger-content"></div></div>
<div id="income-tab" class="tab-content"><div id="income-filter-bar"></div><div id="income-view-toggle-container"></div><div style="margin-bottom:24px;display:flex;gap:12px"><button class="btn btn-primary" id="export-income-excel">Export to Excel</button><button class="btn btn-secondary" id="export-income-pdf">Export to PDF</button></div><div id="income-content"></div></div>
<div id="balance-tab" class="tab-content"><div id="balance-filter-bar"></div><div id="balance-view-toggle-container"></div><div style="margin-bottom:24px;display:flex;gap:12px"><button class="btn btn-primary" id="export-balance-excel">Export to Excel</button><button class="btn btn-secondary" id="export-balance-pdf">Export to PDF</button></div><div id="balance-content"></div></div>
<div id="master-chart-tab" class="tab-content"><div id="master-chart-content"></div></div>
<div id="imports-tab" class="tab-content"><div id="imports-content"></div></div>
</div>
<script>
(function(){
let supabaseClient=null;
const globalFilters={period:'all',customFrom:'',customTo:'',companyId:''};
let hierarchyView='AFS'; // 'AFS' or 'GR'
let treeExpanded={}; // path -> bool
let chartHidden={revenue:false,opex:false,netIncome:false};
let appState={companies:[],imports:[],entries:[],accounts:[],masterAccounts:[],accountMappings:[],activityLog:[]};
const MASTER_COLUMNS=[{key:'company_name',label:'Company',default:true},{key:'name',label:'Account Name',default:true},{key:'dt_ct',label:'DT/CT',default:true},{key:'gr_level_1',label:'GR Level 1',default:true},{key:'gr_level_2',label:'GR Level 2',default:true},{key:'gr_level_3',label:'GR Level 3',default:false},{key:'gr_level_4',label:'GR Level 4',default:false},{key:'afs_level_1',label:'AFS Level 1',default:true},{key:'afs_level_2',label:'AFS Level 2',default:true},{key:'afs_level_3',label:'AFS Level 3',default:false},{key:'afs_level_4',label:'AFS Level 4',default:false}];

async function initSupabase(){const url=document.getElementById('supabaseUrl').value.trim();const key=document.getElementById('supabaseKey').value.trim();if(!url||!key){showToast('Missing Credentials','Please enter both Supabase URL and Key','error');return;}updateConnectionStatus('connecting','Connecting...');try{const t=window.supabase.createClient(url,key);const r=await t.from('companies').select('id').limit(1);if(r.error){showToast('Connection Failed',r.error.message,'error');updateConnectionStatus('disconnected','Connection failed');return;}supabaseClient=t;document.getElementById('config-section').style.display='none';updateConnectionStatus('connected','Connected to Supabase');showToast('Connected','Successfully connected to Supabase','success');await loadAllData();renderAllFilterBars();renderDashboard();}catch(err){showToast('Error',err.message,'error');updateConnectionStatus('disconnected','Connection failed');}}

async function loadPaged(table,opts){const all=[];const BATCH=1000;let from=0;while(true){let q=supabaseClient.from(table).select('*');if(opts&&opts.order){opts.order.forEach(o=>{q=q.order(o.col,{ascending:o.asc!==false,nullsFirst:!!o.nullsFirst});});}q=q.range(from,from+BATCH-1);const{data,error}=await q;if(error)throw error;if(!data||data.length===0)break;all.push(...data);if(data.length<BATCH)break;from+=BATCH;}return all;}

async function loadAllData(){if(!supabaseClient)return;showLoading('Loading data from database...','');try{const[companiesRes,importsRes,accountsRes,mappingsRes]=await Promise.all([supabaseClient.from('companies').select('*'),supabaseClient.from('imports').select('*').order('created_at',{ascending:false}),supabaseClient.from('accounts').select('*'),supabaseClient.from('account_mappings').select('*')]);showLoading('Loading GL entries...','');const entriesData=await loadPaged('gl_entries_active');showLoading('Loading master accounts...','');const masterData=await loadPaged('master_accounts',{order:[{col:'company_name'}]});if(companiesRes.error)throw companiesRes.error;if(importsRes.error)throw importsRes.error;if(accountsRes.error)throw accountsRes.error;if(mappingsRes.error)throw mappingsRes.error;appState.companies=companiesRes.data||[];appState.imports=importsRes.data||[];appState.accounts=accountsRes.data||[];appState.masterAccounts=masterData||[];const _companyNameById={};(companiesRes.data||[]).forEach(c=>{_companyNameById[c.id]=c.name;});appState.entries=entriesData.map(e=>{e.entry_date=new Date(e.entry_date);e.debit=parseFloat(e.debit)||0;e.credit=parseFloat(e.credit)||0;e.amount=parseFloat(e.amount)||0;e.fin_month=computeFinMonth(e.entry_date);enrichEntryWithMaster(e,_companyNameById[e.company_id]);return e;});appState.accountMappings=mappingsRes.data||[];try{const log=await supabaseClient.from('activity_log').select('*').order('created_at',{ascending:false}).limit(500);if(!log.error)appState.activityLog=log.data||[];}catch(_){appState.activityLog=[];}hideLoading();}catch(err){hideLoading();showToast('Error Loading Data',err.message,'error');}}

function computeFinMonth(d){if(!d)return null;const x=(d instanceof Date)?d:new Date(d);if(isNaN(x.getTime()))return null;return x.getFullYear()*100+(x.getMonth()+1);}
function findMasterForEntry(companyId,accountCodeOrName,companyName){if(!accountCodeOrName)return null;const lc=String(accountCodeOrName).toLowerCase();let m=appState.masterAccounts.find(ma=>ma.company_id===companyId&&((ma.name&&ma.name.toLowerCase()===lc)||(ma.code&&ma.code.toLowerCase()===lc)));if(m)return m;if(companyName){const cn=companyName.toLowerCase();m=appState.masterAccounts.find(ma=>ma.company_name&&ma.company_name.toLowerCase()===cn&&((ma.name&&ma.name.toLowerCase()===lc)||(ma.code&&ma.code.toLowerCase()===lc)));if(m)return m;}return null;}
function enrichEntryWithMaster(e,companyName){const m=findMasterForEntry(e.company_id,e.account_code,companyName);if(m){e.dt_ct=m.dt_ct||null;e.gr_level_1=m.gr_level_1||null;e.gr_level_2=m.gr_level_2||null;e.gr_level_3=m.gr_level_3||null;e.gr_level_4=m.gr_level_4||null;e.afs_level_1=m.afs_level_1||null;e.afs_level_2=m.afs_level_2||null;e.afs_level_3=m.afs_level_3||null;e.afs_level_4=m.afs_level_4||null;}return e;}
function formatDate(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function formatDateShort(d){const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear();}
function formatCurrency(a){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2}).format(a||0);}
function formatCurrencyShort(a){const v=Math.abs(a||0);const sign=(a||0)<0?'-':'';if(v>=1e9)return sign+'$'+(v/1e9).toFixed(1)+'B';if(v>=1e6)return sign+'$'+(v/1e6).toFixed(1)+'M';if(v>=1e3)return sign+'$'+(v/1e3).toFixed(1)+'K';return sign+'$'+v.toFixed(0);}
function formatBytes(b){if(!b)return'0 B';const k=1024,s=['B','KB','MB','GB'];const i=Math.floor(Math.log(b)/Math.log(k));return parseFloat((b/Math.pow(k,i)).toFixed(1))+' '+s[i];}
function classifyAccount(code){if(!code)return'unclassified';const cl=code.toLowerCase();if(code.startsWith('Rev/')||code.startsWith('Inc/')||code==='Interest received')return'revenue';if(code.startsWith('COS/'))return'cogs';if(code.startsWith('Exp/'))return'opex';if(code.startsWith('Tax/'))return'tax';if(code.startsWith('Ass/'))return'asset';if(code.startsWith('Lia/')||code.startsWith('Def Rev/')||code==='Deferred Revenue'||code==='Accounts Receivable (A/R)'||cl.indexOf('credit card')!==-1)return'liability';if(code.startsWith('Eq/')||code.startsWith('Equ/'))return'equity';return'unclassified';}
function balanceForCategory(debits,credits,cat){if(cat==='revenue'||cat==='liability'||cat==='equity')return credits-debits;return debits-credits;}
function computeAccountBalance(entries,code){const cat=classifyAccount(code);let d=0,c=0;entries.forEach(e=>{if(e.account_code===code){d+=e.debit;c+=e.credit;}});return balanceForCategory(d,c,cat);}

// Lookup master account by GL account code OR name (best-effort match)
function lookupMaster(code,companyId){if(!code)return null;// try mapping first
const map=appState.accountMappings.find(m=>m.account_code===code&&(!companyId||m.company_id===companyId));if(map&&map.master_account_id){const ma=appState.masterAccounts.find(m=>m.id===map.master_account_id);if(ma)return ma;}
// try direct match by code or name
let ma=appState.masterAccounts.find(m=>(m.code===code||m.name===code)&&(!companyId||m.company_id===companyId));if(ma)return ma;
ma=appState.masterAccounts.find(m=>m.code===code||m.name===code);if(ma)return ma;return null;}

function getFilteredEntries(){const r=computePeriodRange();return appState.entries.filter(e=>{if(globalFilters.companyId&&e.company_id!==globalFilters.companyId)return false;if(r.from&&e.entry_date<r.from)return false;if(r.to&&e.entry_date>r.to)return false;return true;});}
function computePeriodRange(){const now=new Date();if(globalFilters.period==='all')return{from:null,to:null};if(globalFilters.period==='custom'){const f=globalFilters.customFrom?new Date(globalFilters.customFrom+'T00:00:00'):null;const t=globalFilters.customTo?new Date(globalFilters.customTo+'T23:59:59'):null;return{from:f,to:t};}if(globalFilters.period==='ytd')return{from:new Date(now.getFullYear(),0,1),to:new Date(now.getFullYear(),11,31,23,59,59)};if(globalFilters.period==='quarter'){const q=Math.floor(now.getMonth()/3);return{from:new Date(now.getFullYear(),q*3,1),to:new Date(now.getFullYear(),q*3+3,0,23,59,59)};}if(globalFilters.period==='month')return{from:new Date(now.getFullYear(),now.getMonth(),1),to:new Date(now.getFullYear(),now.getMonth()+1,0,23,59,59)};return{from:null,to:null};}
function computePriorRange(){const cur=computePeriodRange();const now=new Date();if(globalFilters.period==='all')return null;if(globalFilters.period==='ytd')return{from:new Date(now.getFullYear()-1,0,1),to:new Date(now.getFullYear()-1,11,31,23,59,59)};if(globalFilters.period==='quarter'){const q=Math.floor(now.getMonth()/3);const py=q===0?now.getFullYear()-1:now.getFullYear();const pq=q===0?3:q-1;return{from:new Date(py,pq*3,1),to:new Date(py,pq*3+3,0,23,59,59)};}if(globalFilters.period==='month'){return{from:new Date(now.getFullYear(),now.getMonth()-1,1),to:new Date(now.getFullYear(),now.getMonth(),0,23,59,59)};}if(globalFilters.period==='custom'){if(!cur.from||!cur.to)return null;const ms=cur.to.getTime()-cur.from.getTime();return{from:new Date(cur.from.getTime()-ms-1),to:new Date(cur.from.getTime()-1)};}return null;}
function getEntriesForRange(range){return appState.entries.filter(e=>{if(globalFilters.companyId&&e.company_id!==globalFilters.companyId)return false;if(range.from&&e.entry_date<range.from)return false;if(range.to&&e.entry_date>range.to)return false;return true;});}
function getPeriodLabel(){const now=new Date();if(globalFilters.period==='all')return'All Time';if(globalFilters.period==='ytd')return'YTD '+now.getFullYear();if(globalFilters.period==='quarter')return'Q'+(Math.floor(now.getMonth()/3)+1)+' '+now.getFullYear();if(globalFilters.period==='month')return now.toLocaleDateString('en-US',{month:'long',year:'numeric'});if(globalFilters.period==='custom'){const r=computePeriodRange();if(r.from&&r.to)return formatDateShort(r.from)+' – '+formatDateShort(r.to);if(r.from)return'From '+formatDateShort(r.from);if(r.to)return'Until '+formatDateShort(r.to);return'Custom';}return'';}

s.dataset.period;if(globalFilters.period!=='custom'){globalFilters.customFrom='';globalFilters.customTo='';}onFiltersChanged();});});const fromI=document.getElementById(containerId+'-from'),toI=document.getElementById(containerId+'-to'),applyB=document.getElementById(containerId+'-apply');if(applyB)applyB.addEventListener('click',()=>{globalFilters.customFrom=fromI.value;globalFilters.customTo=toI.value;onFiltersChanged();});const cs=document.getElementById(containerId+'-company');if(cs)cs.addEventListener('change',function(){globalFilters.companyId=this.value||'';onFiltersChanged();});}

// ── KPI/RATIO COMPUTATION ──
function kpiSet(entriesCurrent){const codes=[...new Set(entriesCurrent.map(e=>e.account_code).filter(Boolean))];let rev=0,cogs=0,opex=0,tax=0,assets=0,liab=0;codes.forEach(c=>{const cat=classifyAccount(c);const b=computeAccountBalance(entriesCurrent,c);if(cat==='revenue')rev+=b;else if(cat==='cogs')cogs+=b;else if(cat==='opex')opex+=b;else if(cat==='tax')tax+=b;else if(cat==='asset')assets+=b;else if(cat==='liability')liab+=b;});return{revenue:rev,cogs:cogs,opexOnly:opex,opex:opex+cogs,tax:tax,ebitda:rev-(opex+cogs),netIncome:rev-(cogs+opex+tax),assets:assets,liabilities:liab};}
function kpiContributors(entriesCurrent,entriesPrior,kpiKey){const codes=[...new Set(entriesCurrent.map(e=>e.account_code).filter(Boolean).concat(entriesPrior.map(e=>e.account_code).filter(Boolean)))];const matchesKpi=code=>{const c=classifyAccount(code);if(kpiKey==='revenue')return c==='revenue';if(kpiKey==='opex')return c==='opex'||c==='cogs';if(kpiKey==='netIncome'||kpiKey==='ebitda')return c==='revenue'||c==='cogs'||c==='opex'||(kpiKey==='netIncome'&&c==='tax');if(kpiKey==='assets')return c==='asset';if(kpiKey==='liabilities')return c==='liability';return false;};const list=[];codes.forEach(code=>{if(!matchesKpi(code))return;const cur=computeAccountBalance(entriesCurrent,code);const prior=computeAccountBalance(entriesPrior,code);list.push({code:code,name:accountDisplayName(code),current:cur,prior:prior});});list.sort((a,b)=>Math.abs(b.current)-Math.abs(a.current));return list.slice(0,10);}
function accountDisplayName(code){const m=appState.masterAccounts.find(a=>a.code===code||a.name===code);return m?(m.name||code):code;}
function monthBuckets(entries){const map=new Map();entries.forEach(e=>{const d=e.entry_date;const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(!map.has(k))map.set(k,{key:k,year:d.getFullYear(),month:d.getMonth(),entries:[]});map.get(k).entries.push(e);});return Array.from(map.values()).sort((a,b)=>a.key.localeCompare(b.key));}
function sparklineSvg(values,color){if(!values||values.length<2)return'<svg class="sparkline" viewBox="0 0 100 28" preserveAspectRatio="none"><line x1="0" y1="14" x2="100" y2="14" stroke="'+color+'" stroke-width="1" opacity="0.3"/></svg>';const min=Math.min(...values),max=Math.max(...values);const range=(max-min)||1;const w=100,h=28;const pts=values.map((v,i)=>{const x=(i/(values.length-1))*w;const y=h-((v-min)/range)*(h-4)-2;return x.toFixed(1)+','+y.toFixed(1);}).join(' ');return'<svg class="sparkline" viewBox="0 0 100 28" preserveAspectRatio="none"><polyline fill="none" stroke="'+color+'" stroke-width="1.5" points="'+pts+'"/></svg>';}
function kpiHistoricalSeries(kpiKey){const now=new Date();let buckets=[];if(globalFilters.period==='month'||globalFilters.period==='all'||globalFilters.period==='ytd'){for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const e=new Date(now.getFullYear(),now.getMonth()-i+1,0,23,59,59);buckets.push({from:d,to:e});}}else if(globalFilters.period==='quarter'){const q=Math.floor(now.getMonth()/3);for(let i=5;i>=0;i--){const qy=now.getFullYear()+Math.floor((q-i)/4);const qm=((q-i)%4+4)%4;buckets.push({from:new Date(qy,qm*3,1),to:new Date(qy,qm*3+3,0,23,59,59)});}}else{const cur=computePeriodRange();if(!cur.from||!cur.to)return[];const ms=cur.to.getTime()-cur.from.getTime();for(let i=5;i>=0;i--){const f=new Date(cur.from.getTime()-i*(ms+1));const t=new Date(cur.to.getTime()-i*(ms+1));buckets.push({from:f,to:t});}}return buckets.map(b=>{const e=getEntriesForRange(b);const k=kpiSet(e);return k[kpiKey]||0;});}

function varianceClass(deltaPct,kpiKey){if(deltaPct===null||deltaPct===undefined||!isFinite(deltaPct))return'neutral';const upGood=(kpiKey==='revenue'||kpiKey==='ebitda'||kpiKey==='netIncome'||kpiKey==='assets');const upBad=(kpiKey==='opex'||kpiKey==='liabilities');if(deltaPct>0)return upGood?'up-good':(upBad?'up-bad':'neutral');if(deltaPct<0)return upGood?'down-bad':(upBad?'down-good':'neutral');return'neutral';}
function renderKpiStrip(){const strip=document.getElementById('kpi-strip');if(appState.entries.length===0){strip.innerHTML='<div class="empty-state" style="grid-column:1/-1"><h3>No financial data yet</h3><p>Go to the Imports tab to upload your first general ledger file.</p></div>';return;}const cur=getFilteredEntries();const priorRange=computePriorRange();const prior=priorRange?getEntriesForRange(priorRange):[];const k=kpiSet(cur);const kp=priorRange?kpiSet(prior):null;const items=[{key:'revenue',label:'Total Revenue'},{key:'opex',label:'Operating Expenses'},{key:'ebitda',label:'EBITDA (proxy)'},{key:'netIncome',label:'Net Income'},{key:'assets',label:'Total Assets'},{key:'liabilities',label:'Total Liabilities'}];let h='';items.forEach(it=>{const v=k[it.key];const pv=kp?kp[it.key]:null;let deltaPct=null;if(pv!==null&&pv!==0)deltaPct=((v-pv)/Math.abs(pv))*100;else if(pv===0&&v!==0)deltaPct=null;const vc=varianceClass(deltaPct,it.key);const arrow=deltaPct===null?'':(deltaPct>0?'▲':(deltaPct<0?'▼':'='));const dt=deltaPct===null?'—':(deltaPct>0?'+':'')+deltaPct.toFixed(1)+'%';const series=kpiHistoricalSeries(it.key);const spark=sparklineSvg(series,getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#5e6ad2');h+='<div class="kpi-card" data-kpi="'+it.key+'"><h3>'+it.label+'</h3><div class="value">'+formatCurrency(v)+'</div><div class="prior">vs prior: '+(pv===null?'—':formatCurrency(pv))+'</div><div class="variance '+vc+'">'+arrow+' '+dt+'</div>'+spark+'</div>';});strip.innerHTML=h;strip.querySelectorAll('.kpi-card').forEach(card=>{card.addEventListener('click',()=>openKpiDrillDown(card.dataset.kpi));});}

function renderRatioStrip(){const c=document.getElementById('ratio-strip-container');if(appState.entries.length===0){c.innerHTML='';return;}const cur=getFilteredEntries();const priorRange=computePriorRange();const prior=priorRange?getEntriesForRange(priorRange):[];const k=kpiSet(cur);const kp=priorRange?kpiSet(prior):null;function ratio(rev,num){if(!rev||rev===0)return null;return(num/rev)*100;}function buildRatios(set){if(!set)return null;const r=set.revenue;return{gm:r?((r-set.cogs)/r)*100:null,ebitdaM:r?(set.ebitda/r)*100:null,nm:r?(set.netIncome/r)*100:null,opexPct:r?(set.opexOnly/r)*100:null,etr:(r-set.opexOnly-set.cogs)?(set.tax/(r-set.opexOnly-set.cogs))*100:null};}const cR=buildRatios(k);const pR=kp?buildRatios(kp):null;const items=[{k:'gm',label:'Gross Margin',good:'up'},{k:'ebitdaM',label:'EBITDA Margin',good:'up'},{k:'nm',label:'Net Margin',good:'up'},{k:'opexPct',label:'OpEx % Revenue',good:'down'},{k:'etr',label:'Effective Tax Rate',good:'down'}];let h='<div style="font-size:11px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Operating Efficiency Ratios</div><div class="ratio-strip">';items.forEach(it=>{const v=cR?cR[it.k]:null;const pv=pR?pR[it.k]:null;const fmt=v===null?'—':v.toFixed(1)+'%';const psub=pv===null?'prior: —':'prior: '+pv.toFixed(1)+'%';let dCls='neu',dTxt='—';if(v!==null&&pv!==null){const d=v-pv;const isUp=d>0;const isGood=(it.good==='up'&&isUp)||(it.good==='down'&&!isUp&&d!==0);dCls=d===0?'neu':(isGood?'pos':'neg');dTxt=(d>0?'+':'')+d.toFixed(1)+' pp';}h+='<div class="ratio-card"><div class="label">'+it.label+'</div><div class="val">'+fmt+'</div><div class="sub">'+psub+'</div><div class="delta '+dCls+'">'+dTxt+'</div></div>';});h+='</div>';c.innerHTML=h;}

function openKpiDrillDown(kpiKey){const cur=getFilteredEntries();const priorRange=computePriorRange();const prior=priorRange?getEntriesForRange(priorRange):[];const labels={revenue:'Total Revenue',opex:'Operating Expenses',ebitda:'EBITDA (proxy)',netIncome:'Net Income',assets:'Total Assets',liabilities:'Total Liabilities'};const contrib=kpiContributors(cur,prior,kpiKey);let h='<p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">Top contributing accounts · '+escapeHtml(getPeriodLabel())+'</p>';if(contrib.length===0){h+='<div class="empty-state"><p>No contributing accounts in current filter.</p></div>';}else{h+='<div class="table-wrapper"><table><thead><tr><th>Account</th><th class="number-cell">Current</th><th class="number-cell">Prior</th><th class="number-cell">Δ%</th></tr></thead><tbody>';contrib.forEach(c=>{let dp=null;if(c.prior!==0)dp=((c.current-c.prior)/Math.abs(c.prior))*100;const dt=dp===null?'—':(dp>0?'+':'')+dp.toFixed(1)+'%';h+='<tr><td>'+escapeHtml(c.code)+(c.name!==c.code?'<br><span style="color:var(--text-subtle);font-size:11px">'+escapeHtml(c.name)+'</span>':'')+'</td><td class="number-cell">'+formatCurrency(c.current)+'</td><td class="number-cell">'+formatCurrency(c.prior)+'</td><td class="number-cell">'+dt+'</td></tr>';});h+='</tbody></table></div>';}openSidePanel(labels[kpiKey]+' — Drill-down',h);}

function renderDashboardChart(){const cont=document.getElementById('chart-container');const legend=document.getElementById('chart-legend');const cur=getFilteredEntries();// Render legend
const legItems=[{k:'revenue',label:'Revenue',color:'var(--chart-rev)'},{k:'opex',label:'Operating Expenses',color:'var(--chart-opex)'},{k:'netIncome',label:'Net Income',color:'var(--chart-net)'}];legend.innerHTML=legItems.map(it=>'<span class="legend-item'+(chartHidden[it.k]?' disabled':'')+'" data-series="'+it.k+'"><span class="legend-dot" style="background:'+it.color+'"></span>'+it.label+'</span>').join('');legend.querySelectorAll('.legend-item').forEach(el=>{el.addEventListener('click',function(){const k=this.dataset.series;chartHidden[k]=!chartHidden[k];renderDashboardChart();});});if(cur.length===0){cont.innerHTML='<div class="empty-state"><p>No data in current filter.</p></div>';document.getElementById('chart-sub').textContent='Monthly trend';return;}const buckets=monthBuckets(cur);if(buckets.length===0){cont.innerHTML='<div class="empty-state"><p>No data.</p></div>';return;}const data=buckets.map(b=>{const k=kpiSet(b.entries);return{key:b.key,year:b.year,month:b.month,revenue:k.revenue,opex:k.opex,netIncome:k.netIncome};});document.getElementById('chart-sub').textContent=data.length+' month'+(data.length===1?'':'s')+' · '+escapeHtml(getPeriodLabel());const W=900,H=280,P={t:20,r:20,b:40,l:60};const iw=W-P.l-P.r,ih=H-P.t-P.b;const visibleSeries=['revenue','opex','netIncome'].filter(k=>!chartHidden[k]);const allVals=data.flatMap(d=>visibleSeries.map(k=>d[k]));if(allVals.length===0){cont.innerHTML='<div class="empty-state"><p>All series hidden.</p></div>';return;}const minV=Math.min(0,...allVals);const maxV=Math.max(0,...allVals);const range=(maxV-minV)||1;const x=i=>data.length===1?P.l+iw/2:P.l+(i/(data.length-1))*iw;const y=v=>P.t+ih-((v-minV)/range)*ih;const path=key=>data.map((d,i)=>(i===0?'M':'L')+x(i).toFixed(1)+','+y(d[key]).toFixed(1)).join(' ');const ticks=5;let yticks='';for(let i=0;i<=ticks;i++){const v=minV+(range*i/ticks);const yy=y(v);yticks+='<line x1="'+P.l+'" y1="'+yy+'" x2="'+(W-P.r)+'" y2="'+yy+'" stroke="currentColor" stroke-opacity="0.08"/>';yticks+='<text x="'+(P.l-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="currentColor" opacity="0.6">'+formatCurrencyShort(v)+'</text>';}const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];let xlabels='';data.forEach((d,i)=>{const lab=monthNames[d.month]+' '+String(d.year).slice(2);xlabels+='<text x="'+x(i)+'" y="'+(H-P.b+18)+'" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.6">'+lab+'</text>';});const cs=getComputedStyle(document.documentElement);const cRev=cs.getPropertyValue('--chart-rev').trim()||'#5e6ad2';const cOpex=cs.getPropertyValue('--chart-opex').trim()||'#d97706';const cNet=cs.getPropertyValue('--chart-net').trim()||'#16a34a';let lines='';if(!chartHidden.revenue)lines+='<path d="'+path('revenue')+'" stroke="'+cRev+'" stroke-width="2" fill="none"/>';if(!chartHidden.opex)lines+='<path d="'+path('opex')+'" stroke="'+cOpex+'" stroke-width="2" fill="none"/>';if(!chartHidden.netIncome)lines+='<path d="'+path('netIncome')+'" stroke="'+cNet+'" stroke-width="2" fill="none"/>';let dots='';data.forEach((d,i)=>{if(!chartHidden.revenue)dots+='<circle cx="'+x(i)+'" cy="'+y(d.revenue)+'" r="3" fill="'+cRev+'"/>';if(!chartHidden.opex)dots+='<circle cx="'+x(i)+'" cy="'+y(d.opex)+'" r="3" fill="'+cOpex+'"/>';if(!chartHidden.netIncome)dots+='<circle cx="'+x(i)+'" cy="'+y(d.netIncome)+'" r="3" fill="'+cNet+'"/>';});let hovers='';data.forEach((d,i)=>{const cx=x(i);hovers+='<rect x="'+(cx-15)+'" y="'+P.t+'" width="30" height="'+ih+'" fill="transparent" data-idx="'+i+'" class="chart-hover"/>';});const svg='<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+yticks+xlabels+lines+dots+hovers+'</svg><div id="chart-tooltip" style="position:absolute;display:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;pointer-events:none;z-index:10"></div>';cont.innerHTML='<div style="position:relative">'+svg+'</div>';const tip=document.getElementById('chart-tooltip');cont.querySelectorAll('.chart-hover').forEach(rect=>{rect.addEventListener('mousemove',e=>{const i=parseInt(rect.dataset.idx);const d=data[i];const month=monthNames[d.month]+' '+d.year;let html='<div style="font-weight:600;margin-bottom:4px">'+month+'</div>';if(!chartHidden.revenue)html+='<div>Revenue: '+formatCurrency(d.revenue)+'</div>';if(!chartHidden.opex)html+='<div>OpEx: '+formatCurrency(d.opex)+'</div>';if(!chartHidden.netIncome)html+='<div>Net: '+formatCurrency(d.netIncome)+'</div>';tip.innerHTML=html;tip.style.display='block';const r=cont.getBoundingClientRect();tip.style.left=(e.clientX-r.left+12)+'px';tip.style.top=(e.clientY-r.top+12)+'px';});rect.addEventListener('mouseleave',()=>{tip.style.display='none';});});}

// ── HIERARCHY TREE BUILDER ──
function buildHierarchyTree(entries,sectionFilterFn){// returns array of root nodes
// Each entry's account is mapped to master and grouped by levels.
// sectionFilterFn(masterAcct, classifyResult) -> bool : decides which categories to include
const levelKeys=hierarchyView==='AFS'?['afs_level_1','afs_level_2','afs_level_3','afs_level_4']:['gr_level_1','gr_level_2','gr_level_3','gr_level_4'];
const codeMap=new Map();// account_code -> {balance, master, name, classified}
entries.forEach(e=>{const code=e.account_code;if(!code)return;if(!codeMap.has(code)){const m=lookupMaster(code,e.company_id);codeMap.set(code,{code:code,master:m,debit:0,credit:0,classified:classifyAccount(code)});}const r=codeMap.get(code);r.debit+=e.debit;r.credit+=e.credit;});
const roots={};const unmapped={children:{},leaves:[],total:0,name:'Unmapped accounts',isUnmapped:true};
codeMap.forEach(rec=>{const cat=rec.classified;rec.balance=balanceForCategory(rec.debit,rec.credit,cat);if(!sectionFilterFn(rec.master,cat))return;const m=rec.master;const path=[];if(m){for(const lk of levelKeys){const v=m[lk];if(v)path.push(v);else break;}}if(!m||path.length===0){const name=(m&&m.name)||rec.code;unmapped.leaves.push({name:name,code:rec.code,balance:rec.balance});unmapped.total+=rec.balance;return;}
// build path in roots
let cursor=roots;for(let i=0;i<path.length;i++){const seg=path[i];if(!cursor[seg])cursor[seg]={name:seg,children:{},leaves:[],total:0};cursor[seg].total+=rec.balance;if(i===path.length-1){cursor[seg].leaves.push({name:(m.name||rec.code),code:rec.code,balance:rec.balance});}else{cursor=cursor[seg].children;}}});
// convert object tree to array
function toArray(obj){return Object.keys(obj).sort().map(k=>{const n=obj[k];n.children=toArray(n.children);return n;});}
const rootList=toArray(roots);if(unmapped.leaves.length){unmapped.children=[];rootList.push(unmapped);}return rootList;}

function renderTree(nodes,depth,pathPrefix){let h='';nodes.forEach((node,idx)=>{const path=pathPrefix+'/'+idx;const hasChildren=(node.children&&node.children.length)||(node.leaves&&node.leaves.length);const defaultExpanded=depth<2;const isExpanded=treeExpanded[path]===undefined?defaultExpanded:treeExpanded[path];const indent=depth*16;const fontWt=depth===0?'600':(depth===1?'500':'400');const bg=depth===0?'background:var(--surface-2);':'';h+='<tr class="tree-row '+(isExpanded?'expanded':'')+'" data-path="'+escapeHtml(path)+'" style="'+bg+'"><td style="padding-left:'+(12+indent)+'px;font-weight:'+fontWt+'"><span class="chev">▶</span> '+escapeHtml(node.name)+'</td><td class="number-cell" style="font-weight:'+fontWt+'">'+formatCurrency(node.total)+'</td></tr>';if(isExpanded){if(node.children&&node.children.length){h+=renderTree(node.children,depth+1,path);}if(node.leaves&&node.leaves.length){node.leaves.sort((a,b)=>Math.abs(b.balance)-Math.abs(a.balance)).forEach((leaf,li)=>{h+='<tr class="tree-leaf"><td style="padding-left:'+(12+(depth+1)*16)+'px;color:var(--text-muted)"><span class="chev">▶</span> '+escapeHtml(leaf.name)+(leaf.code!==leaf.name?' <span style="color:var(--text-subtle);font-size:11px">'+escapeHtml(leaf.code)+'</span>':'')+'</td><td class="number-cell">'+formatCurrency(leaf.balance)+'</td></tr>';});}}});return h;}

function wireTreeToggle(containerEl){containerEl.querySelectorAll('.tree-row').forEach(r=>{r.addEventListener('click',function(){const p=this.dataset.path;treeExpanded[p]=!(treeExpanded[p]===undefined?true:treeExpanded[p]);// Default expansion logic
// For consistency, always toggle from current state. Determine current.
const isExp=this.classList.contains('expanded');treeExpanded[p]=!isExp;const tab=document.querySelector('.tab.active').dataset.tab;if(tab==='income')renderIncomeStatement();else if(tab==='balance')renderBalanceSheet();});});}

// ── INCOME STATEMENT ──
function renderIncomeStatement(){renderViewToggle('income-view-toggle-container');const c=document.getElementById('income-content');if(appState.entries.length===0){c.innerHTML='<div class="empty-state"><h3>No Data</h3><p>Upload ledger data via Imports tab.</p></div>';return;}const pd=getFilteredEntries();let scope=getPeriodLabel();if(globalFilters.companyId){const co=appState.companies.find(x=>x.id===globalFilters.companyId);if(co)scope+=' · '+co.name;}else scope='All Companies · '+scope;
// P&L category filter: Revenue + COGS + OpEx + Tax
const plFilter=(master,cls)=>{return cls==='revenue'||cls==='cogs'||cls==='opex'||cls==='tax';};
const tree=buildHierarchyTree(pd,plFilter);
// compute totals
let revTotal=0,cogsTotal=0,opexTotal=0,taxTotal=0;const codes=[...new Set(pd.map(e=>e.account_code).filter(Boolean))];codes.forEach(co=>{const cat=classifyAccount(co);const b=computeAccountBalance(pd,co);if(cat==='revenue')revTotal+=b;else if(cat==='cogs')cogsTotal+=b;else if(cat==='opex')opexTotal+=b;else if(cat==='tax')taxTotal+=b;});const grossProfit=revTotal-cogsTotal;const operatingIncome=grossProfit-opexTotal;const netIncome=operatingIncome-taxTotal;

function wireImportsTab(){document.querySelectorAll('input[name="upload-mode"]').forEach(r=>{r.addEventListener('change',function(){window._uploadMode=this.value;pendingUpload=null;renderImportsTab();});});const fi=document.getElementById('unifiedFileInput');if(fi)fi.addEventListener('change',handleUnifiedUpload);const tf=document.getElementById('imp-type-filter');if(tf)tf.addEventListener('change',function(){importsTableState.typeFilter=this.value;renderImportsTab();});const sf=document.getElementById('imp-status-filter');if(sf)sf.addEventListener('change',function(){importsTableState.statusFilter=this.value;renderImportsTab();});const sb=document.getElementById('imp-search');if(sb)sb.addEventListener('input',function(){importsTableState.search=this.value;renderImportsTab();});const ovBtn=document.getElementById('override-period-btn');if(ovBtn)ovBtn.addEventListener('click',()=>{pendingUpload.showOverrideUi=true;renderImportsTab();});const apBtn=document.getElementById('apply-override-btn');if(apBtn)apBtn.addEventListener('click',()=>{const f=document.getElementById('override-from').value;const t=document.getElementById('override-to').value;if(f&&t){pendingUpload.overrideFrom=new Date(f+'T00:00:00');pendingUpload.overrideTo=new Date(t+'T23:59:59');pendingUpload.showOverrideUi=false;renderImportsTab();showToast('Override applied','Period range updated','info');}});const cnt=document.getElementById('continue-import-btn');if(cnt)cnt.addEventListener('click',continuePendingImport);const cnc=document.getElementById('cancel-import-btn');if(cnc)cnc.addEventListener('click',()=>{pendingUpload=null;renderImportsTab();showToast('Cancelled','Upload cancelled','info');});}

function cellTrim(v){if(v===null||v===undefined)return null;const s=String(v).replace(/\uFEFF/g,'').trim();return s===''?null:s;}
async function resolveCompanyId(name,cache){const k=name.toLowerCase();if(cache.has(k))return cache.get(k);const ex=appState.companies.find(c=>c.name&&c.name.toLowerCase()===k);if(ex){cache.set(k,{id:ex.id,created:false});return cache.get(k);}const lk=await supabaseClient.from('companies').select('id').eq('name',name).maybeSingle();if(lk.error)throw lk.error;if(lk.data){cache.set(k,{id:lk.data.id,created:false});return cache.get(k);}const ins=await supabaseClient.from('companies').insert([{name:name,fiscal_year_start_month:1,default_currency:'USD'}]).select().single();if(ins.error)throw ins.error;appState.companies.push(ins.data);cache.set(k,{id:ins.data.id,created:true});return cache.get(k);}

async function handleMasterChartUpload(file){const reader=new FileReader();reader.onload=async function(e){let importId=null;let totalRows=0;try{showLoading('Reading master chart file...','');const data=new Uint8Array(e.target.result);const wb=XLSX.read(data,{type:'array'});const sh=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:null});if(!rows||rows.length<2){hideLoading();showToast('Error','File appears to have no data rows.','error');return;}const hm=buildHeaderMap(rows[0]);const req=['company_name','name'];const miss=req.filter(k=>hm[k]===undefined);if(miss.length){hideLoading();showToast('Header validation failed','Missing required header(s): '+miss.join(', '),'error');return;}
// Create imports row up front (status pending)
totalRows=rows.length-1;const impRec={company_id:null,filename:file.name,file_size_bytes:file.size,period_start:null,period_end:null,total_rows_in_file:totalRows,status:'pending',is_active:false,import_type:'COA'};try{const ir=await supabaseClient.from('imports').insert([impRec]).select().single();if(!ir.error)importId=ir.data.id;else{// retry without import_type column if schema lacks it
delete impRec.import_type;const ir2=await supabaseClient.from('imports').insert([impRec]).select().single();if(!ir2.error)importId=ir2.data.id;}}catch(_){}
const fk=['company_name','name','dt_ct','gr_level_1','gr_level_2','gr_level_3','gr_level_4','afs_level_1','afs_level_2','afs_level_3','afs_level_4'];const dataRows=[];const uniq=new Map();for(let r=1;r<rows.length;r++){const row=rows[r];if(!row)continue;const rec={};for(const f of fk){const idx=hm[f];rec[f]=idx!==undefined?cellTrim(row[idx]):null;}if(!fk.some(k=>rec[k]!==null))continue;dataRows.push(rec);if(rec.company_name)uniq.set(rec.company_name.toLowerCase(),rec.company_name);}const total=dataRows.length;if(total===0){hideLoading();if(importId)await supabaseClient.from('imports').update({status:'failed',is_active:false,completed_at:new Date().toISOString()}).eq('id',importId);showToast('Error','No data rows found.','error');return;}showLoading('Resolving companies...',uniq.size+' unique names');const cache=new Map();let cCreated=0,cExisted=0;for(const[,n]of uniq){try{const r=await resolveCompanyId(n,cache);if(r.created)cCreated++;else cExisted++;}catch(err){console.error(err);}}let skipEmpty=0;const records=[];for(let i=0;i<dataRows.length;i++){const r=dataRows[i];if(!r.company_name||!r.name){skipEmpty++;continue;}const c=cache.get(r.company_name.toLowerCase());if(!c){skipEmpty++;continue;}const cat=r.afs_level_1||r.gr_level_1;if(!cat){skipEmpty++;continue;}records.push({company_id:c.id,company_name:r.company_name,name:r.name,dt_ct:r.dt_ct,gr_level_1:r.gr_level_1,gr_level_2:r.gr_level_2,gr_level_3:r.gr_level_3,gr_level_4:r.gr_level_4,afs_level_1:r.afs_level_1,afs_level_2:r.afs_level_2,afs_level_3:r.afs_level_3,afs_level_4:r.afs_level_4,category:cat,code:null,description:null,is_active:true});}
const BATCH=100;let inserted=0,dup=0;for(let i=0;i<records.length;i+=BATCH){const sl=records.slice(i,i+BATCH);showLoading('Importing master account '+(i+1)+' of '+records.length+'...','');const ins=await supabaseClient.from('master_accounts').insert(sl).select();if(ins.error){if(ins.error.code==='23505'){for(let j=0;j<sl.length;j++){const s=await supabaseClient.from('master_accounts').insert([sl[j]]).select();if(s.error){if(s.error.code==='23505'){dup++;}else{dup++;}}else inserted++;}}else throw ins.error;}else inserted+=sl.length;}
if(importId){await supabaseClient.from('imports').update({status:'complete',is_active:true,rows_inserted:inserted,rows_skipped:skipEmpty,rows_failed:dup,completed_at:new Date().toISOString()}).eq('id',importId);}
await logActivity('coa_imported','Master COA "'+file.name+'" imported: '+inserted+' inserted, '+skipEmpty+' skipped, '+dup+' duplicates','coa_import');
hideLoading();showToast('Master Chart Imported','Inserted: '+inserted+'\nEmpty skipped: '+skipEmpty+'\nDuplicates skipped: '+dup+'\nCompanies created: '+cCreated+' (existed: '+cExisted+')','success');await loadAllData();renderAllFilterBars();renderImportsTab();}catch(err){hideLoading();console.error(err);if(importId){try{await supabaseClient.from('imports').update({status:'failed',is_active:false,completed_at:new Date().toISOString()}).eq('id',importId);}catch(_){}}showToast('Master Chart Import Failed',err.message||String(err),'error');}};reader.readAsArrayBuffer(file);}

function isValidDate(v){if(!v)return false;if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d&&d.y>1900&&d.y<2100;}if(typeof v==='string'){const d=new Date(v);return d instanceof Date&&!isNaN(d)&&d.getFullYear()>1900&&d.getFullYear()<2100;}return false;}
function parseDateCell(v){if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return new Date(d.y,d.m-1,d.d);}return new Date(v);}
function findFieldInHeaders(headers,names){for(const n of names){for(const k in headers){if(k.toLowerCase()===n.toLowerCase())return headers[k];}}return null;}
function handleGLUpload(file){const reader=new FileReader();reader.onload=async function(e){try{showLoading('Reading file...','');const data=new Uint8Array(e.target.result);const wb=XLSX.read(data,{type:'array'});const sh=wb.Sheets[wb.SheetNames[0]];const cellA1=sh['A1'];if(!cellA1||!cellA1.v){hideLoading();showToast('Error','Cell A1 does not contain a company identifier','error');return;}const companyName=String(cellA1.v).trim();showLoading('Parsing headers...','');const headers=[];let col=0;while(true){const a=XLSX.utils.encode_cell({r:3,c:col});const c=sh[a];if(!c||!c.v)break;headers.push(String(c.v).trim());col++;}if(headers.length===0){hideLoading();showToast('Error','Row 4 missing required headers','error');return;}const records=[];const accountCodes=new Set();let row=4;let minDate=null,maxDate=null;while(row<50000){const dc=sh[XLSX.utils.encode_cell({r:row,c:0})];if(!dc){if(row>100&&records.length===0)break;if(row-records.length>10&&records.length>0)break;row++;continue;}if(isValidDate(dc.v)){const rec={sourceRowIndex:records.length+1,headers:{}};for(let c=0;c<headers.length;c++){const ad=XLSX.utils.encode_cell({r:row,c:c});const cl=sh[ad];rec.headers[headers[c]]=cl?cl.v:null;}const ed=parseDateCell(dc.v);rec.entry_date=ed;if(!minDate||ed<minDate)minDate=ed;if(!maxDate||ed>maxDate)maxDate=ed;const acc=findFieldInHeaders(rec.headers,['Account']);const sp=findFieldInHeaders(rec.headers,['Split']);if(acc)accountCodes.add(acc);if(sp&&sp!=='-Split-')accountCodes.add(sp);rec.transaction_type=findFieldInHeaders(rec.headers,['Transaction Type','Type']);rec.reference_num=findFieldInHeaders(rec.headers,['Num','Number','Reference']);rec.account_code=acc;rec.split_account_code=(sp&&sp!=='-Split-')?sp:null;rec.name=findFieldInHeaders(rec.headers,['Name']);rec.customer=findFieldInHeaders(rec.headers,['Customer']);rec.vendor=findFieldInHeaders(rec.headers,['Vendor']);rec.employee=findFieldInHeaders(rec.headers,['Employee']);rec.class_name=findFieldInHeaders(rec.headers,['Class']);rec.memo=findFieldInHeaders(rec.headers,['Memo','Description']);rec.quantity=parseFloat(findFieldInHeaders(rec.headers,['Qty','Quantity']))||null;rec.rate=parseFloat(findFieldInHeaders(rec.headers,['Rate']))||null;rec.debit=parseFloat(findFieldInHeaders(rec.headers,['Debit']))||0;rec.credit=parseFloat(findFieldInHeaders(rec.headers,['Credit']))||0;rec.amount=parseFloat(findFieldInHeaders(rec.headers,['Amount']))||(rec.debit-rec.credit);rec.balance=parseFloat(findFieldInHeaders(rec.headers,['Balance']))||null;rec.open_balance=parseFloat(findFieldInHeaders(rec.headers,['Open Balance']))||null;rec.currency=findFieldInHeaders(rec.headers,['Currency']);rec.fin_month=computeFinMonth(ed);const _co=appState.companies.find(c=>c.name===companyName);const _cid=_co?_co.id:null;const _m=findMasterForEntry(_cid,rec.account_code,companyName);if(_m){rec.dt_ct=_m.dt_ct||null;rec.gr_level_1=_m.gr_level_1||null;rec.gr_level_2=_m.gr_level_2||null;rec.gr_level_3=_m.gr_level_3||null;rec.gr_level_4=_m.gr_level_4||null;rec.afs_level_1=_m.afs_level_1||null;rec.afs_level_2=_m.afs_level_2||null;rec.afs_level_3=_m.afs_level_3||null;rec.afs_level_4=_m.afs_level_4||null;}records.push(rec);}row++;}if(records.length===0){hideLoading();showToast('Error','No valid data rows found with dates in column A','error');return;}
pendingUpload={file:file,mode:'gl',companyName:companyName,headers:headers,records:records,accountCodes:accountCodes,detectedFrom:minDate,detectedTo:maxDate,overrideFrom:null,overrideTo:null,showOverrideUi:false};hideLoading();renderImportsTab();showToast('File parsed',companyName+' · '+records.length+' rows · period '+formatDate(minDate)+' to '+formatDate(maxDate)+'\nReview detected period and click Continue','info');}catch(err){hideLoading();console.error(err);showToast('Error',err.message||String(err),'error');}};reader.readAsArrayBuffer(file);}

async function continuePendingImport(){if(!pendingUpload||pendingUpload.mode!=='gl')return;const minDate=pendingUpload.overrideFrom||pendingUpload.detectedFrom;const maxDate=pendingUpload.overrideTo||pendingUpload.detectedTo;let records=pendingUpload.records;if(pendingUpload.overrideFrom||pendingUpload.overrideTo){const before=records.length;records=records.filter(r=>r.entry_date>=minDate&&r.entry_date<=maxDate);if(records.length<before)showToast('Filtered',(before-records.length)+' rows outside override range were excluded','info');}if(records.length===0){showToast('No rows','All rows were excluded by the override range','warning');return;}await processImport(pendingUpload.companyName,records,pendingUpload.file.name,pendingUpload.file.size,minDate,maxDate,pendingUpload.accountCodes);pendingUpload=null;}

async function processImport(companyName,records,filename,filesize,minDate,maxDate,accountCodes){showLoading('Resolving company...','');try{let company=appState.companies.find(c=>c.name===companyName);let companyId;if(!company){const r=await supabaseClient.from('companies').insert([{name:companyName}]).select().single();if(r.error)throw r.error;company=r.data;companyId=company.id;appState.companies.push(company);}else companyId=company.id;showLoading('Creating import record...','');const impRec={company_id:companyId,filename:filename,file_size_bytes:filesize,period_start:formatDate(minDate),period_end:formatDate(maxDate),total_rows_in_file:records.length,status:'pending',is_active:false};try{impRec.import_type='GL';}catch(_){}let ir=await supabaseClient.from('imports').insert([impRec]).select().single();if(ir.error){delete impRec.import_type;ir=await supabaseClient.from('imports').insert([impRec]).select().single();if(ir.error)throw ir.error;}const importId=ir.data.id;
showLoading('Checking for overlapping imports...','');const overlaps=appState.imports.filter(imp=>imp.company_id===companyId&&imp.is_active&&importType(imp)==='GL'&&imp.period_end>=formatDate(minDate)&&imp.period_start<=formatDate(maxDate));if(overlaps.length>0){if(overlaps.length===1&&overlaps[0].period_start===formatDate(minDate)&&overlaps[0].period_end===formatDate(maxDate)){await supersedePreviousImport(overlaps[0],ir.data);}else{let body;if(overlaps.length===1){const ov=overlaps[0];body='<p>This file ('+formatDate(minDate)+' – '+formatDate(maxDate)+', '+records.length.toLocaleString()+' rows) overlaps with an existing import:</p><ul class="overlap-list"><li>'+escapeHtml(ov.filename)+' ('+ov.period_start+' – '+ov.period_end+', '+(ov.rows_inserted||0).toLocaleString()+' rows)</li></ul><p>Replacing will supersede it.</p>';}else{body='<p>This file ('+formatDate(minDate)+' – '+formatDate(maxDate)+', '+records.length.toLocaleString()+' rows) overlaps with '+overlaps.length+' existing imports:</p><ul class="overlap-list">';overlaps.forEach(ov=>{body+='<li>'+escapeHtml(ov.filename)+' ('+ov.period_start+' – '+ov.period_end+', '+(ov.rows_inserted||0).toLocaleString()+' rows)</li>';});body+='</ul><p>Replacing will supersede all '+overlaps.length+'.</p>';}const action=await showModal({title:'Overlapping Import'+(overlaps.length>1?'s':'')+' Detected',bodyHtml:body,actions:[{label:'Cancel',value:'cancel'},{label:overlaps.length>1?'Replace All':'Replace',value:'replace',primary:true}]});if(action!=='replace'){await supabaseClient.from('imports').delete().eq('id',importId);hideLoading();showToast('Import Cancelled','The overlapping import was cancelled','info');return;}for(const ov of overlaps){await supersedePreviousImport(ov,ir.data);}}}
showLoading('Verifying no duplicates...','');const dupSamples=await checkForDuplicates(companyId,records);if(dupSamples.length>0){await supabaseClient.from('imports').delete().eq('id',importId);hideLoading();const sample=dupSamples.slice(0,5).map(d=>d.entry_date+' · '+d.account_code+' · '+formatCurrency(d.amount)).join('\n');showToast('Duplicate detection failed','Refusing to import: '+dupSamples.length+' duplicate row(s) detected.\n\nSample:\n'+sample,'error');return;}
showLoading('Resolving accounts...',accountCodes.size+' unique accounts');const accountMap={};for(const code of accountCodes){let acc=appState.accounts.find(a=>a.company_id===companyId&&a.code===code);if(!acc){const at=inferAccountType(code);const r=await supabaseClient.from('accounts').insert([{company_id:companyId,code:code,account_type:at}]).select().single();if(!r.error){acc=r.data;appState.accounts.push(acc);}}if(acc)accountMap[code]=acc.id;}showLoading('Inserting entries...','Preparing '+records.length);await bulkInsertEntries(importId,companyId,records,accountMap);showLoading('Finalizing...','');await supabaseClient.from('imports').update({status:'complete',is_active:true,rows_inserted:records.length,rows_skipped:0,rows_failed:0,completed_at:new Date().toISOString()}).eq('id',importId);await logActivity('gl_imported','GL "'+filename+'" imported for '+companyName+': '+records.length+' rows ('+formatDate(minDate)+' to '+formatDate(maxDate)+')','gl_import');hideLoading();showToast('Import Complete','Imported '+records.length+' entries from '+filename,'success');await loadAllData();renderAllFilterBars();renderImportsTab();}catch(err){hideLoading();console.error(err);showToast('Import Error',err.message||String(err),'error');}}

async function checkForDuplicates(companyId,records){const sample=records.slice(0,Math.min(50,records.length));const dups=[];for(const r of sample){try{const q=await supabaseClient.from('gl_entries_active').select('id,entry_date,account_code,amount').eq('company_id',companyId).eq('entry_date',formatDate(r.entry_date)).eq('account_code',r.account_code||'').limit(1);if(!q.error&&q.data&&q.data.length>0){const match=q.data.find(d=>Math.abs((parseFloat(d.amount)||0)-r.amount)<0.01);if(match)dups.push({entry_date:formatDate(r.entry_date),account_code:r.account_code,amount:r.amount});}}catch(_){}}return dups;}

async function supersedePreviousImport(oldImp,newImp){await supabaseClient.from('imports').update({is_active:false,superseded_by:newImp.id,superseded_at:new Date().toISOString()}).eq('id',oldImp.id);const idx=appState.imports.findIndex(i=>i.id===oldImp.id);if(idx!==-1){appState.imports[idx].is_active=false;appState.imports[idx].superseded_by=newImp.id;appState.imports[idx].superseded_at=new Date().toISOString();}const desc='Import "'+oldImp.filename+'" ('+oldImp.period_start+' to '+oldImp.period_end+', '+(oldImp.rows_inserted||0)+' rows) superseded by "'+newImp.filename+'" ('+newImp.period_start+' to '+newImp.period_end+', '+(newImp.total_rows_in_file||0)+' rows)';await logActivity('import_superseded',desc,'gl_import');}

function inferAccountType(code){if(!code)return null;const p=code.split('/')[0].toLowerCase();if(p==='ass'||p.startsWith('1'))return'Asset';if(p==='lia'||p.startsWith('2'))return'Liability';if(p==='equ'||p.startsWith('3'))return'Equity';if(p==='rev'||p.startsWith('4')||p.startsWith('5'))return'Revenue';if(p==='exp'||p.startsWith('6')||p.startsWith('7'))return'Expense';return null;}
async function bulkInsertEntries(importId,companyId,records,accountMap){const BATCH=500;const total=Math.ceil(records.length/BATCH);for(let i=0;i<total;i++){const start=i*BATCH;const end=Math.min(start+BATCH,records.length);const batch=records.slice(start,end);showLoading('Inserting batch '+(i+1)+' of '+total+'...','Rows '+start+'–'+end);const entries=batch.map(r=>({import_id:importId,company_id:companyId,source_row_index:r.sourceRowIndex,entry_date:formatDate(r.entry_date),transaction_type:r.transaction_type,reference_num:r.reference_num,account_code:r.account_code,account_id:accountMap[r.account_code]||null,split_account_code:r.split_account_code,split_account_id:r.split_account_code?accountMap[r.split_account_code]:null,name:r.name,customer:r.customer,vendor:r.vendor,employee:r.employee,class_name:r.class_name,memo:r.memo,quantity:r.quantity,rate:r.rate,debit:r.debit,credit:r.credit,amount:r.amount,balance:r.balance,open_balance:r.open_balance,currency:r.currency}));const r=await supabaseClient.from('gl_entries').insert(entries);if(r.error)throw r.error;}}

document.getElementById('export-income-excel').addEventListener('click',function(){const pd=getFilteredEntries();const codes=[...new Set(pd.map(e=>e.account_code).filter(Boolean))];const data=[['Consolidated Income Statement'],[getPeriodLabel()],[]];const b={revenue:[],cogs:[],opex:[],tax:[]};codes.forEach(c=>{const cat=classifyAccount(c);if(b[cat])b[cat].push({code:c,balance:computeAccountBalance(pd,c)});});data.push(['REVENUE']);b.revenue.forEach(a=>data.push([a.code,a.balance]));const tr=b.revenue.reduce((s,a)=>s+a.balance,0);data.push(['Total Revenue',tr]);data.push([]);data.push(['COGS']);b.cogs.forEach(a=>data.push([a.code,a.balance]));const tc=b.cogs.reduce((s,a)=>s+a.balance,0);data.push(['Total COGS',tc]);data.push(['Gross Profit',tr-tc]);data.push([]);data.push(['OPEX']);b.opex.forEach(a=>data.push([a.code,a.balance]));const to=b.opex.reduce((s,a)=>s+a.balance,0);data.push(['Total OpEx',to]);data.push([]);data.push(['TAX']);b.tax.forEach(a=>data.push([a.code,a.balance]));const tt=b.tax.reduce((s,a)=>s+a.balance,0);data.push(['Total Tax',tt]);data.push([]);data.push(['Net Income',tr-tc-to-tt]);const ws=XLSX.utils.aoa_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Income Statement');XLSX.writeFile(wb,'income_statement_'+getPeriodLabel().replace(/\s+/g,'_')+'_'+new Date().toISOString().split('T')[0]+'.xlsx');showToast('Export Complete','Income statement exported','success');});
document.getElementById('export-income-pdf').addEventListener('click',function(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFontSize(16);doc.text('Consolidated Income Statement',14,20);doc.setFontSize(10);doc.text(getPeriodLabel(),14,28);const pd=getFilteredEntries();const codes=[...new Set(pd.map(e=>e.account_code).filter(Boolean))];const b={revenue:[],cogs:[],opex:[],tax:[]};codes.forEach(c=>{const cat=classifyAccount(c);if(b[cat])b[cat].push({code:c,balance:computeAccountBalance(pd,c)});});const data=[];data.push([{content:'REVENUE',colSpan:2,styles:{fontStyle:'bold'}}]);b.revenue.forEach(a=>data.push([a.code,formatCurrency(a.balance)]));const tr=b.revenue.reduce((s,a)=>s+a.balance,0);data.push([{content:'Total Revenue',styles:{fontStyle:'bold'}},{content:formatCurrency(tr),styles:{fontStyle:'bold'}}]);data.push([{content:'COGS',colSpan:2,styles:{fontStyle:'bold'}}]);b.cogs.forEach(a=>data.push([a.code,formatCurrency(a.balance)]));data.push([{content:'OPEX',colSpan:2,styles:{fontStyle:'bold'}}]);b.opex.forEach(a=>data.push([a.code,formatCurrency(a.balance)]));const tc=b.cogs.reduce((s,a)=>s+a.balance,0);const to=b.opex.reduce((s,a)=>s+a.balance,0);const tt=b.tax.reduce((s,a)=>s+a.balance,0);data.push([{content:'Net Income',styles:{fontStyle:'bold'}},{content:formatCurrency(tr-tc-to-tt),styles:{fontStyle:'bold'}}]);doc.autoTable({startY:35,head:[['Account','Amount']],body:data,theme:'striped'});doc.save('income_statement_'+new Date().toISOString().split('T')[0]+'.pdf');showToast('Export Complete','Income statement exported','success');});
document.getElementById('export-balance-excel').addEventListener('click',function(){const pd=getFilteredEntries();const codes=[...new Set(pd.map(e=>e.account_code).filter(Boolean))];const data=[['Consolidated Balance Sheet'],[getPeriodLabel()],[]];const a=[],l=[],eq=[];codes.forEach(c=>{const cat=classifyAccount(c);const b=computeAccountBalance(pd,c);if(cat==='asset')a.push({code:c,balance:b});else if(cat==='liability')l.push({code:c,balance:b});else if(cat==='equity')eq.push({code:c,balance:b});});let re=0;codes.forEach(c=>{const cat=classifyAccount(c);const b=computeAccountBalance(pd,c);if(cat==='revenue')re+=b;else if(cat==='cogs'||cat==='opex'||cat==='tax')re-=b;});eq.push({code:'Retained Earnings (computed)',balance:re});data.push(['ASSETS']);a.forEach(x=>data.push([x.code,x.balance]));const ta=a.reduce((s,x)=>s+x.balance,0);data.push(['Total Assets',ta]);data.push([]);data.push(['LIABILITIES']);l.forEach(x=>data.push([x.code,x.balance]));const tl=l.reduce((s,x)=>s+x.balance,0);data.push(['Total Liabilities',tl]);data.push([]);data.push(['EQUITY']);eq.forEach(x=>data.push([x.code,x.balance]));const te=eq.reduce((s,x)=>s+x.balance,0);data.push(['Total Equity',te]);data.push([]);data.push(['Total Liab & Equity',tl+te]);const ws=XLSX.utils.aoa_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Balance Sheet');XLSX.writeFile(wb,'balance_sheet_'+getPeriodLabel().replace(/\s+/g,'_')+'_'+new Date().toISOString().split('T')[0]+'.xlsx');showToast('Export Complete','Balance sheet exported','success');});
