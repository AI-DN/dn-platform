    <div class="section"><div class="section-header"><div class="h1">OpenAI</div></div><div class="card"><div class="field"><label class="field-label">API key</label><div class="api-key-row"><input class="input" id="openaiKey" type="password" placeholder="sk-..." value="${escapeHtml(state.apiKeys.openai)}"><button class="btn-secondary" id="saveKeyBtn">Save</button>${state.apiKeys.openai ? '<button class="btn-ghost" id="clearKeyBtn">Clear</button>' : ''}</div><div class="field-hint">${state.apiKeys.openai ? '<span class="mono">' + escapeHtml(oai) + '</span>' : 'Not set.'}</div></div><div class="field"><label class="field-label">Org ID</label><div class="api-key-row"><input class="input" id="openaiOrg" type="text" placeholder="org-..." value="${escapeHtml(state.apiKeys.openai_org)}"><button class="btn-secondary" id="saveOrgBtn">Save</button></div></div></div></div>

    <div class="section"><div class="section-header"><div class="h1">Google Gemini</div></div><div class="card"><div class="field"><label class="field-label">API key</label><div class="api-key-row"><input class="input" id="geminiKey" type="password" placeholder="AIza..." value="${escapeHtml(state.apiKeys.gemini)}"><button class="btn-secondary" id="saveGemBtn">Save</button>${state.apiKeys.gemini ? '<button class="btn-ghost" id="clearGemBtn">Clear</button>' : ''}</div><div class="field-hint">${state.apiKeys.gemini ? '<span class="mono">' + escapeHtml(gem) + '</span>' : 'Not set.'}</div></div></div></div>

    <div class="section"><div class="section-header"><div class="h1">Runtime</div></div><div class="card"><dl class="kv"><dt>Version</dt><dd><span class="mono">2.6.3</span> (build #46 — skill preview visibility + theme filenames)</dd><dt>Owner</dt><dd><span class="mono">${escapeHtml(OWNER_ID)}</span></dd><dt>Admin</dt><dd>${state.adminMode ? '<span class="badge badge-success">On</span>' : '<span class="badge badge-neutral">Off</span>'}</dd></dl></div></div>

    <div class="section"><div class="section-header"><div class="h1" style="color:var(--text-muted)">Reset</div></div><div class="card"><div class="muted body-sm" style="margin-bottom:10px">Clears API keys, preferences, and logo locally AND from your synced account.</div><button class="btn-danger" id="resetAllBtn">Reset all settings</button></div></div>
  `;
  updateSyncPill();
  document.getElementById('adminChk').onchange = async e => { state.adminMode = e.target.checked; await persistSetting('dn_admin', String(state.adminMode)); updateAdminBadge(); renderSettings(); };
  const dms = document.getElementById('defaultModelSel'); if (dms) dms.onchange = async e => { state.defaultModel = e.target.value; await persistSetting('dn_default_model', state.defaultModel); toast({ type: 'info', message: 'Default updated' }); renderSettings(); };
  document.getElementById('qualitySel').onchange = async e => { state.imageQuality = e.target.value; await persistSetting('dn_image_quality', state.imageQuality); };
  document.getElementById('skipPickerChk').onchange = async e => { state.skipModelPicker = e.target.checked; await persistSetting('dn_skip_model_picker', String(state.skipModelPicker)); };
  const maxIll = document.getElementById('maxIllustInput'); if (maxIll) maxIll.onchange = async e => { let v = Math.max(0, Math.min(20, parseInt(e.target.value) || 0)); state.maxIllustrations = v; e.target.value = v; await persistSetting('dn_wp_max_illust', String(v)); toast({ type: 'info', message: `Max illustrations: ${v}` }); };
  // Build #43 — Brand library bindings
  const newCustLogoBtn = document.getElementById('newCustLogoBtn');
  if (newCustLogoBtn) newCustLogoBtn.onclick = () => document.getElementById('newCustLogoFile').click();
  const newCustLogoFile = document.getElementById('newCustLogoFile');
  if (newCustLogoFile) newCustLogoFile.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    if (!/png/i.test(file.type)) { toast({ type: 'error', message: 'PNG only' }); return; }
    const name = (document.getElementById('newCustLogoName').value || '').trim() || file.name.replace(/\.png$/i, '');
    const fr = new FileReader();
    fr.onload = async () => {
      const b64 = fr.result.split(',')[1];
      await addCustomerLogo(name, b64);
      toast({ type: 'success', message: 'Added "' + name + '" to customer logos' });
      renderSettings();
    };
    fr.readAsDataURL(file);
  };
  document.querySelectorAll('[data-rm-cust-logo]').forEach(b => { b.onclick = async () => { const id = b.getAttribute('data-rm-cust-logo'); await removeCustomerLogo(id); renderSettings(); }; });
  const newSubBtn = document.getElementById('newSubtextBtn');
  if (newSubBtn) newSubBtn.onclick = async () => {
    const inp = document.getElementById('newSubtextInput');
    const v = (inp.value || '').trim();
    if (!v) { toast({ type: 'error', message: 'Type some text first' }); return; }
    if (v.length > 80) { toast({ type: 'error', message: 'Keep subtexts under 80 chars' }); return; }
    await addSubtext(v);
    inp.value = '';
    toast({ type: 'success', message: 'Subtext added' });
    renderSettings();
  };
  document.querySelectorAll('[data-rm-subtext]').forEach(b => { b.onclick = async () => { const id = b.getAttribute('data-rm-subtext'); await removeSubtext(id); renderSettings(); }; });
  const lbChk = document.getElementById('logoBackingChk'); if (lbChk) lbChk.onchange = async e => { state.logoBacking = e.target.checked; await persistSetting('dn_logo_backing', String(state.logoBacking)); };
  document.getElementById('uploadLogoBtn').onclick = () => document.getElementById('logoFile').click();
  document.getElementById('logoFile').onchange = e => { const file = e.target.files[0]; if (!file) return; if (!/png/i.test(file.type)) { toast({ type: 'error', message: 'PNG only' }); return; } const fr = new FileReader(); fr.onload = async () => { state.logoB64 = fr.result.split(',')[1]; state.logoIsCustom = true; await persistSetting('dn_logo_b64', state.logoB64); toast({ type: 'success', message: 'Logo uploaded' }); renderSettings(); }; fr.readAsDataURL(file); };
  const clrLogo = document.getElementById('clearLogoBtn'); if (clrLogo) clrLogo.onclick = async () => { state.logoIsCustom = false; await persistSetting('dn_logo_b64', ''); state.logoB64 = await loadDefaultLogo(); renderSettings(); };
  document.getElementById('saveKeyBtn').onclick = async () => { const v = (document.getElementById('openaiKey').value || '').trim(); if (!v.startsWith('sk-')) { toast({ type: 'error', message: 'Must start with sk-' }); return; } state.apiKeys.openai = v; await persistSetting('dn_openai', v); toast({ type: 'success', message: 'Saved' }); renderSettings(); };
  const ck = document.getElementById('clearKeyBtn'); if (ck) ck.onclick = async () => { state.apiKeys.openai = ''; await persistSetting('dn_openai', ''); renderSettings(); };
  document.getElementById('saveAntBtn').onclick = async () => { const v = (document.getElementById('anthropicKey').value || '').trim(); if (!v.startsWith('sk-ant-')) { toast({ type: 'error', message: 'Must start with sk-ant-' }); return; } state.apiKeys.anthropic = v; await persistSetting('dn_anthropic', v); toast({ type: 'success', message: 'Saved' }); renderSettings(); };
  const ca = document.getElementById('clearAntBtn'); if (ca) ca.onclick = async () => { state.apiKeys.anthropic = ''; await persistSetting('dn_anthropic', ''); renderSettings(); };
  document.getElementById('saveGemBtn').onclick = async () => { const v = (document.getElementById('geminiKey').value || '').trim(); if (!v) { toast({ type: 'error', message: 'Enter a key' }); return; } state.apiKeys.gemini = v; await persistSetting('dn_gemini', v); toast({ type: 'success', message: 'Saved' }); renderSettings(); };
  const cg = document.getElementById('clearGemBtn'); if (cg) cg.onclick = async () => { state.apiKeys.gemini = ''; await persistSetting('dn_gemini', ''); renderSettings(); };
  document.getElementById('saveOrgBtn').onclick = async () => { const v = (document.getElementById('openaiOrg').value || '').trim(); state.apiKeys.openai_org = v; await persistSetting('dn_openai_org', v); toast({ type: 'success', message: 'Saved' }); renderSettings(); };
  document.getElementById('resetAllBtn').onclick = () => {
    openModal(`<div class="modal-header"><div><div class="h1">Reset all settings?</div></div></div><div class="danger-banner"><div>You will need to re-enter every API key.</div></div><div class="modal-footer"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-danger" id="confirmReset">Reset</button></div>`);
    document.getElementById('confirmReset').onclick = async () => {
      closeModal();
      await resetAllSettings();
      state.apiKeys = { openai: '', anthropic: '', gemini: '', openai_org: '' };
      state.imageQuality = 'high'; state.defaultModel = 'openai:gpt-image-2:high';
      state.skipModelPicker = false; state.logoBacking = false; state.adminMode = false;
      state.slideMin = 6; state.slideMax = 10; state.logoB64 = null; state.logoIsCustom = false;
      state.maxIllustrations = 3;
      favoriteSkillIds = new Set();
      const b = await loadDefaultLogo(); if (b) state.logoB64 = b;
      toast({ type: 'success', message: 'Settings cleared' });
      renderSettings(); updateAdminBadge();
    };
  };
}

// ===== Build #37 — saved_decks persistence =====
async function fetchSavedDecks() {
  const sb = getSupabaseClient();
  if (!sb) { state.savedDecksError = 'Supabase not initialised'; state.savedDecksLoaded = true; return; }
  try {
    const { data, error } = await sb.from('saved_decks').select('*').eq('owner', OWNER_ID).order('created_at', { ascending: false }).limit(50);
    if (error) { state.savedDecksError = error.message || String(error); state.savedDecksLoaded = true; state.savedDecks = []; return; }
    state.savedDecks = data || []; state.savedDecksError = null; state.savedDecksLoaded = true;
  } catch (e) { state.savedDecksError = e.message || String(e); state.savedDecksLoaded = true; state.savedDecks = []; }
}

async function saveCurrentDeckToSupabase() {
  const sb = getSupabaseClient();
  if (!sb) return null;
  if (!state.slides || state.slides.length === 0) return null;
  const skill = state.selectedSkillId ? skillById(state.selectedSkillId) : null;
  const title = (skill && skill.name) ? skill.name : (state.slides[0] && state.slides[0].title) || 'Untitled deck';
  const slidesPayload = state.slides.map(s => ({
    title: s.title || '',
    body: s.body || '',
    speakerNotes: s.speakerNotes || '',
    imagePrompt: s.imagePrompt || null,
    lastPrompt: s.lastPrompt || null
  }));
  const payload = {
    owner: OWNER_ID,
    title: title,
    skill_id: state.selectedSkillId || null,
    skill_name: skill ? skill.name : null,
    slide_min: state.slideMin || 6,
    slide_max: state.slideMax || 10,
    slide_count: state.slides.length,
    model_used: state.selectedModel || state.lastSelectedModel || state.defaultModel || null,
    customer_logo_enabled: !!state.customerLogoEnabled,
    slides: slidesPayload,
    updated_at: new Date().toISOString()
  };
  state.savingDeck = true;
  try {
    const { data, error } = await sb.from('saved_decks').insert(payload).select().single();
    if (error) { console.warn('saveCurrentDeckToSupabase failed:', error); state.savingDeck = false; return null; }
    state.lastSavedDeckId = data.id;
    state.savedDecks = [data].concat(state.savedDecks || []);
    state.savingDeck = false;
    return data;
  } catch (e) { console.warn('saveCurrentDeckToSupabase exception:', e); state.savingDeck = false; return null; }
}

function loadSavedDeckIntoState(deck) {
  if (!deck) return;
  deckCost.reset();
  state.whitePaper = { data: null, blob: null, status: 'idle', error: null, cost: 0, illustCost: 0, deckTitle: '', statusMsg: '', figuresTotal: 0, figuresDone: 0, illustTotal: 0, illustDone: 0, awaitingConfirm: false, includeIllustrations: true, targetPagesMin: 6, targetPagesMax: 10, targetPages: 8, awaitingPageCount: true };
  if (deck.skill_id && skillById(deck.skill_id)) state.selectedSkillId = deck.skill_id;
  if (typeof deck.slide_min === 'number') state.slideMin = deck.slide_min;
  if (typeof deck.slide_max === 'number') state.slideMax = deck.slide_max;
  state.customerLogoEnabled = !!deck.customer_logo_enabled;
  state.slides = (deck.slides || []).map(s => ({
    title: s.title || 'Untitled',
    body: s.body || '',
    speakerNotes: s.speakerNotes || '',
    prevSpeakerNotes: null,
    notesExpanded: false,
    rewritingNotes: false,
    imageB64: null,
    imagePrompt: s.imagePrompt || null,
    lastPrompt: s.lastPrompt || null,
    status: 'idle',
    error: null,
    regenCount: 0,
    costAccrued: 0,
    modelUsed: null
  }));
  if (deck.model_used) state.lastSelectedModel = deck.model_used;
  state.polishMode = null;
  state.composeStep = 3.5;
  state.view = 'compose';
  setActiveNav();
  renderCompose();
  toast({ type: 'success', message: 'Loaded "' + (deck.title || 'deck') + '" - pick model & generate images' });
}

async function deleteSavedDeck(id) {
  const sb = getSupabaseClient(); if (!sb) return;
  try {
    const { error } = await sb.from('saved_decks').delete().eq('id', id).eq('owner', OWNER_ID);
    if (error) { toast({ type: 'error', message: 'Delete failed: ' + (error.message || String(error)) }); return; }
    state.savedDecks = (state.savedDecks || []).filter(d => d.id !== id);
    toast({ type: 'success', message: 'Deck removed from history' });
    if (state.view === 'compose' && state.composeStep === 1) renderCompose();
  } catch (e) { toast({ type: 'error', message: 'Delete failed: ' + (e.message || String(e)) }); }
}

function renderPastDecksPanel() {
  if (!state.savedDecksLoaded) return '<div class="muted body-sm" style="margin-bottom:14px">Loading past decks…</div>';
  if (state.savedDecksError) return '<div class="card" style="margin-bottom:14px;border-color:var(--warning)"><div class="muted body-sm">Past decks unavailable: ' + escapeHtml(state.savedDecksError) + '</div></div>';
  // Build #39 — show empty state so the feature is discoverable
  if (!state.savedDecks.length) return '<div class="step-card" style="margin-bottom:12px;opacity:0.7"><div class="step-header"><div class="step-title">📁 Past decks</div><div class="step-desc">none yet</div></div><div class="step-body" style="padding:14px 18px"><div class="muted body-sm">Completed decks save automatically here. Once you finish a deck, you can reload it to skip Steps 1–3 and jump straight to the model picker.</div></div></div>';
  const rows = state.savedDecks.slice(0, 12).map(d => {
    let when = '';
    try { when = new Date(d.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); } catch (e) {}
    return '<div class="past-deck-card">' +
      '<div class="past-deck-title">' + escapeHtml(d.title || 'Untitled') + '</div>' +
      '<div class="past-deck-meta">' + (d.slide_count || 0) + ' slides' + (d.skill_name ? ' · ' + escapeHtml(d.skill_name) : '') + ' · ' + when + '</div>' +
      '<div class="past-deck-actions">' +
        '<button class="btn-secondary" data-load-deck="' + d.id + '">Load → pick model</button>' +
        '<button class="btn-ghost" data-del-deck="' + d.id + '" title="Remove">✕</button>' +
      '</div>' +
    '</div>';
  }).join('');
  return '<div class="step-card" style="margin-bottom:12px">' +
    '<div class="step-header"><div class="step-title">📁 Past decks</div><div class="step-desc">' + state.savedDecks.length + ' saved · loading skips Steps 1–3</div></div>' +
    '<div class="step-body" style="padding-top:10px">' + rows + '</div>' +
  '</div>';
}

function bindPastDecksPanel() {
  document.querySelectorAll('[data-load-deck]').forEach(b => { b.onclick = () => { const id = b.getAttribute('data-load-deck'); const deck = (state.savedDecks || []).find(d => d.id === id); if (deck) loadSavedDeckIntoState(deck); }; });
  document.querySelectorAll('[data-del-deck]').forEach(b => { b.onclick = () => { const id = b.getAttribute('data-del-deck'); openModal('<div class="modal-header"><div><div class="h1">Remove from history?</div></div></div><div class="muted body-sm" style="margin-bottom:14px">This deletes the saved deck record only. The .pptx you already downloaded is untouched.</div><div class="modal-footer"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-danger" id="confirmDelDeck">Remove</button></div>'); document.getElementById('confirmDelDeck').onclick = async () => { closeModal(); await deleteSavedDeck(id); }; }; });
}
// ===== end Build #37 =====

// ===== Build #43 — brand library helpers =====
async function persistBrandLib() {
  await persistSetting('dn_brand_lib', JSON.stringify(state.brandLib));
}
function brandLibLogoById(id) {
  return (state.brandLib.customerLogos || []).find(l => l.id === id) || null;
}
function brandLibSubtextById(id) {
  return (state.brandLib.subtexts || []).find(s => s.id === id) || null;
}
async function addOwnLogo(name, b64) {
  const id = 'ol_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  state.brandLib.ownLogos.push({ id: id, name: name || 'Untitled', b64: b64 });
  await persistBrandLib();
  return id;
}
async function removeOwnLogo(id) {
  state.brandLib.ownLogos = state.brandLib.ownLogos.filter(l => l.id !== id);
  if (state.deckOwnLogoId === id) state.deckOwnLogoId = null;
  await persistBrandLib();
}
function ownLogoById(id) {
  return (state.brandLib.ownLogos || []).find(l => l.id === id) || null;
}
async function addCustomerLogo(name, b64) {
  const id = 'cl_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  state.brandLib.customerLogos.push({ id: id, name: name || 'Untitled', b64: b64 });
  await persistBrandLib();
  return id;
}
async function removeCustomerLogo(id) {
  state.brandLib.customerLogos = state.brandLib.customerLogos.filter(l => l.id !== id);
  if (state.deckCustomerLogoId === id) state.deckCustomerLogoId = null;
  await persistBrandLib();
}
async function addSubtext(text) {
  const id = 'st_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  state.brandLib.subtexts.push({ id: id, text: String(text || '').trim() });
  await persistBrandLib();
  return id;
}
async function removeSubtext(id) {
  state.brandLib.subtexts = state.brandLib.subtexts.filter(s => s.id !== id);
  if (state.deckSubtextId === id) state.deckSubtextId = null;
  await persistBrandLib();
}
// ===== end Build #43 helpers =====

function updateAdminBadge() {
  const el = document.getElementById('adminBadge'); if (!el) return;
  el.innerHTML = state.adminMode ? '<span class="badge badge-accent" style="cursor:pointer" id="adminBadgeBtn">Admin</span>' : '<span class="badge badge-neutral" style="cursor:pointer" id="adminBadgeBtn">Read-only</span>';
  const btn = document.getElementById('adminBadgeBtn');
  if (btn) btn.onclick = async () => { state.adminMode = !state.adminMode; await persistSetting('dn_admin', String(state.adminMode)); updateAdminBadge(); if (state.view === 'skills') renderSkills(); else if (state.view === 'settings') renderSettings(); };
}
function renderCostBadge() {
  const el = document.getElementById('costBadge'); if (!el) return;
  const total = deckCost.total();
  if (total <= 0) { el.innerHTML = ''; return; }
  el.innerHTML = `<span class="cost-badge">Deck cost <strong>${fmtUsd4(total)}</strong></span>`;
}

document.getElementById('themeToggle').addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = state.theme; });
function setActiveNav() { document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === state.view)); }
document.querySelectorAll('.nav-btn').forEach(b => { b.addEventListener('click', () => { state.view = b.dataset.view; setActiveNav(); render(); }); });
function render() {
  if (state.view === 'compose') renderCompose();
  else if (state.view === 'skills') renderSkills();
  else if (state.view === 'brand') renderBrand();
  else renderSettings();
  renderCostBadge();
}

async function initApp() {
  await bootstrapSettings();
  await loadAllReferenceData();
  hydrateStateFromStorage();
  if (!state.selectedSkillId || !skillById(state.selectedSkillId)) state.selectedSkillId = defaultSkillId();
  updateAdminBadge();
  render();
  setInterval(updateSyncPill, 30000);
  if (!state.logoIsCustom) { const b = await loadDefaultLogo(); if (b) state.logoB64 = b; }
  // Build #37 — fetch saved decks in background, then re-render the panel
  fetchSavedDecks().then(() => { if (state.view === 'compose' && state.composeStep === 1) renderCompose(); }).catch(e => console.warn('fetchSavedDecks boot failed:', e));
}
initApp();
</script>
