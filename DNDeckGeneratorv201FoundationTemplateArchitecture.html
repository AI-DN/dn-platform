<style>

<script>
const initialTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
document.documentElement.dataset.theme = initialTheme;

// ─── FALLBACK MASTER PROMPT (used if Supabase unreachable or template missing) ──
const MASTER_PROMPT_FALLBACK = `Create a 16:9 widescreen enterprise presentation slide.

OVERALL STYLE:
Premium enterprise telecom / AI architecture presentation.
Boardroom-ready, executive consulting quality.
Dark navy and black gradient background.
Electric blue as primary accent.
Cyan, purple, green, and subtle gold as secondary accents.
Clean, structured, high-contrast, modern.
No cartoon style. No photorealistic people. No stock-photo look. No decorative clutter.

VISUAL CONSISTENCY:
All slides must feel like they belong to the same Digitata Networks executive deck.
Use the same visual language across slides:
- dark translucent panels
- glowing thin outlines
- rounded rectangles
- simple line icons
- clean directional arrows
- structured grid alignment
- generous margins
- strong hierarchy
- minimal but readable text

LAYOUT RULES:
Use a strict 16:9 widescreen slide format (1536 pixels wide x 864 pixels tall equivalent).
The slide must fill the entire canvas edge to edge — no letterboxing, no black bars, no borders.
Use a consistent title area at the top.

// ─── PARSE SLIDES ──────────────────────────────────────────────────────
function parseSlides(text) {
  if (!text || !text.trim()) return [];
  const hasH2 = /^##\s+/m.test(text);
  const hasHr = /^\s*---\s*$/m.test(text);
  let chunks = [];
  if (hasH2) {
    const lines = text.split(/\r?\n/);
    let current = null;
    for (const line of lines) {
      const m = line.match(/^##\s+(.+?)\s*$/);
      if (m) {
        if (current) chunks.push(current);
        current = { title: m[1].replace(/^Slide\s+\d+[:.]?\s*/i, '').trim() || 'Untitled', bodyLines: [] };
      } else if (current) {
        current.bodyLines.push(line);
      }
    }
    if (current) chunks.push(current);
  } else if (hasHr) {
    const segments = text.split(/^\s*---\s*$/m).map(s => s.trim()).filter(Boolean);
    chunks = segments.map((seg, i) => {
      const lines = seg.split(/\r?\n/);
      const firstNonEmpty = lines.findIndex(l => l.trim().length > 0);
      const title = firstNonEmpty >= 0 ? lines[firstNonEmpty].replace(/^#+\s*/, '').replace(/^Slide\s+\d+[:.]?\s*/i, '').trim() : `Slide ${i+1}`;
      const bodyLines = firstNonEmpty >= 0 ? lines.slice(firstNonEmpty + 1) : [];
      return { title: title || `Slide ${i+1}`, bodyLines };
    });
  } else {
    return null;
  }
  return chunks.map(c => ({
    title: c.title, body: c.bodyLines.join('\n').trim(),
    imageB64: null, imagePrompt: null, lastPrompt: null,
    status: 'idle', error: null, regenCount: 0
  }));
}

async function polishWithClaude(slides, mode) {
  const key = (state.apiKeys.anthropic || '').trim();
  if (!key) throw new Error('NO_ANTHROPIC_KEY: Set Anthropic API key in Settings.');

  const min = state.slideMin, max = state.slideMax;
  const target = Math.round((min + max) / 2);
  const rangeConstraint = `\n\nYou MUST produce exactly between ${min} and ${max} slides. Not fewer than ${min}. Not more than ${max}. This is a strict requirement — if the input has more or fewer slides, consolidate or expand to fit. Aim for ${target} slides as a default but stay within [${min}, ${max}].`;

  let systemPrompt = '';
  if (mode === 'shorten') {
    systemPrompt = 'You are a presentation editor for Digitata Networks. Take the slide content provided and shorten each slide\'s text to bullet points suitable for presentation. Keep the title intact. Aim for 3-5 short bullets per slide.' + rangeConstraint + ' Respond with valid JSON only: {"slides": [{"title": "...", "bullets": ["..."]}, ...]}.';
  } else if (mode === 'expand') {
    systemPrompt = 'You are a presentation editor for Digitata Networks. Take the brief notes provided and expand each slide into well-formed presentation content. Keep the title intact. Produce a sub-headline plus 3-5 supporting points per slide.' + rangeConstraint + ' Respond with valid JSON only: {"slides": [{"title": "...", "subheadline": "...", "bullets": ["..."]}, ...]}.';
  } else if (mode === 'split') {
    systemPrompt = 'You are a presentation editor for Digitata Networks. Take this raw block of text and split it into a logical slide deck. Each slide should have one clear idea.' + rangeConstraint + ' Respond with valid JSON only: {"slides": [{"title": "...", "bullets": ["..."]}, ...]}.';
  }

  const userContent = mode === 'split'
    ? `Produce between ${min} and ${max} slides — not fewer, not more. Split this text:\n\n${state.rawText}`
    : `Produce between ${min} and ${max} slides — not fewer, not more.\n\nSlides:\n${JSON.stringify(slides.map(s => ({ title: s.title, body: s.body })))}`;

  async function callClaude(sys, user) {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5-20250929',
        max_tokens: 4000,
        system: sys,
        messages: [{ role: 'user', content: user }]
      })
    });
    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(`Claude ${resp.status}: ${err.slice(0,300)}`);
    }
    const data = await resp.json();
    const raw = data.content[0].text;
    const clean = raw.replace(/```json|```/g, '').trim();
    return JSON.parse(clean).slides || [];
  }

  let result = await callClaude(systemPrompt, userContent);
  if (result.length < min || result.length > max) {
    const retrySys = systemPrompt + `\n\nPREVIOUS ATTEMPT RETURNED ${result.length} SLIDES, OUTSIDE THE REQUIRED RANGE OF [${min}, ${max}]. You must produce exactly between ${min} and ${max} slides this time. Adjust your output.`;
    try {
      const retry = await callClaude(retrySys, userContent);
      if (retry.length >= min && retry.length <= max) result = retry;
      else {
        toast({ type: 'warning', message: `AI couldn't hit the slide count range — proceeding with ${retry.length} slides. Edit manually or restart.` });
        result = retry;
      }
    } catch (e) {
      toast({ type: 'warning', message: `Retry failed; using initial ${result.length} slides` });
    }
  }
  return result;
}

function polishedToSlides(polished) {

    return {

      body: parts.join('\n'),
      imageB64: null, imagePrompt: null, lastPrompt: null,
      status: 'idle', error: null, regenCount: 0

  });
}

function buildImageParams(model, prompt, quality) {
  const base = { model, prompt, n: 1 };
  if (model === 'gpt-image-2') return { ...base, output_format: 'jpeg', size: '1536x1024', quality: quality === 'low' ? 'low' : quality === 'medium' ? 'medium' : 'high' };
  if (model === 'gpt-image-1') return { ...base, size: '1536x1024', quality: quality === 'low' ? 'low' : quality === 'medium' ? 'medium' : 'high' };
  return { ...base, size: '1024x1024' };
}

async function generateSlideImage(slide, customPromptOverride) {
  const openaiKey = (state.apiKeys.openai || '').trim();
  if (!openaiKey) throw new Error('NO_OPENAI_KEY: Set OpenAI API key in Settings.');
  if (!openaiKey.startsWith('sk-')) throw new Error('BAD_KEY_FORMAT: OpenAI key must start with sk-.');

  const bundle = state.selectedBundleId ? joinBundle(bundleById(state.selectedBundleId)) : null;
  const prompt = customPromptOverride || composeBundlePrompt(bundle, slide, state.customerLogoEnabled);

  const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${openaiKey}` };
  const org = (state.apiKeys.openai_org || '').trim();
  if (org) headers['OpenAI-Organization'] = org;

  let model = state.imageModel;
  let body = buildImageParams(model, prompt, 'high');
  let resp = await fetch('https://api.openai.com/v1/images/generations', { method: 'POST', headers, body: JSON.stringify(body) });

  if ((resp.status === 404 || resp.status === 400) && model === 'gpt-image-2') {
    const errText = await resp.text();
    if (/model/i.test(errText)) {
      if (!state.imageModelFellBack) {
        state.imageModelFellBack = true;
        toast({ type: 'info', message: 'gpt-image-2 not available — falling back to gpt-image-1', duration: 6000 });
      }
      state.imageModel = 'gpt-image-1';
      model = 'gpt-image-1';
      body = buildImageParams(model, prompt, 'high');
      resp = await fetch('https://api.openai.com/v1/images/generations', { method: 'POST', headers, body: JSON.stringify(body) });
    } else {
      throw new Error(`OpenAI ${resp.status}: ${errText.slice(0,300)}`);
    }
  }
  if (!resp.ok) {
    const t = await resp.text().catch(() => '');
    throw new Error(`OpenAI ${resp.status}: ${t.slice(0,300)}`);
  }
  const data = await resp.json();
  const item = data.data[0];
  if (item.b64_json) return { b64: item.b64_json, prompt };
  if (item.url) {
    const imgResp = await fetch(item.url);
    const blob = await imgResp.blob();
    const b64 = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(',')[1]); fr.readAsDataURL(blob); });
    return { b64, prompt };
  }
  throw new Error('OpenAI response had neither b64_json nor url');
}

async function generateAllImages() {
  const max = 3;
  let idx = 0;
  const total = state.slides.length;
  const workers = [];
  for (let w = 0; w < Math.min(max, total); w++) {
    workers.push((async () => {
      while (idx < total) {
        const myIdx = idx++;
        const slide = state.slides[myIdx];
        if (slide.status === 'done') continue;
        slide.status = 'generating'; slide.error = null;
        renderStep4Slides();
        try {
          const { b64, prompt } = await generateSlideImage(slide);
          slide.imageB64 = b64; slide.imagePrompt = prompt; slide.lastPrompt = prompt;
          slide.status = 'done';
        } catch (err) { slide.status = 'error'; slide.error = err.message || String(err); }
        renderStep4Slides();
      }
    })());
  }
  await Promise.all(workers);
}

async function regenerateOne(idx, newPrompt) {
  const slide = state.slides[idx];
  slide.status = 'generating'; slide.error = null;

}

    return;
  }
  const prs = new PptxGenJS();
  prs.layout = 'LAYOUT_WIDE'; // 13.3" x 7.5"
  const b = state.selectedBundleId ? bundleById(state.selectedBundleId) : null;
  const deckTitle = b ? b.name : 'DN Deck';
  prs.title = deckTitle;
  prs.subject = 'Digitata Networks Presentation';
  prs.author = 'DN Deck Generator';

  const dnLogoB64 = state.logoB64;
  const customerLogoB64 = state.customerLogoEnabled ? state.customerLogoB64 : null;
  const showLogoBacking = !!state.logoBacking;

  // Logo placement constants (inches, calibrated for 13.3" wide slide)
  const LOGO_X_LEFT = 0.19;
  const LOGO_Y = 0.17;
  const LOGO_W = 1.69;
  const LOGO_H = 0.55;
  const LOGO_X_RIGHT = 13.3 - LOGO_X_LEFT - LOGO_W;

  for (let i = 0; i < state.slides.length; i++) {
    const slide = state.slides[i];
    if (!slide.imageB64) continue;
    const s = prs.addSlide();

    // Background image — full bleed, raw, no logo baked in
    s.addImage({
      data: `data:image/jpeg;base64,${slide.imageB64}`,
      x: 0, y: 0, w: 13.3, h: 7.5
    });

    // Optional dark backing panels (native PPT shapes)
    if (showLogoBacking) {
      if (dnLogoB64) {
        s.addShape(prs.ShapeType.roundRect, {
          x: LOGO_X_LEFT - 0.08, y: LOGO_Y - 0.06,
          w: LOGO_W + 0.16, h: LOGO_H + 0.12,
          fill: { color: '080C1A' },
          line: { color: '080C1A', width: 0 },
          rectRadius: 0.05
        });
      }
      if (customerLogoB64) {
        s.addShape(prs.ShapeType.roundRect, {
          x: LOGO_X_RIGHT - 0.08, y: LOGO_Y - 0.06,
          w: LOGO_W + 0.16, h: LOGO_H + 0.12,
          fill: { color: '080C1A' },
          line: { color: '080C1A', width: 0 },
          rectRadius: 0.05
        });
      }
    }

    // DN logo top-left as native PPT image
    if (dnLogoB64) {
      s.addImage({
        data: `data:image/png;base64,${dnLogoB64}`,
        x: LOGO_X_LEFT, y: LOGO_Y, w: LOGO_W, h: LOGO_H
      });
    }

    // Customer logo top-right as native PPT image
    if (customerLogoB64) {
      s.addImage({
        data: `data:image/png;base64,${customerLogoB64}`,
        x: LOGO_X_RIGHT, y: LOGO_Y, w: LOGO_W, h: LOGO_H
      });
    }

    s.addNotes(`${slide.title}\n\n${slide.body || ''}`);
  }

  const fileName = `${slugify(deckTitle)}-${dateStr()}.pptx`;
  const blob = await prs.write({ outputType: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast({ type: 'success', html: `Downloaded <strong>${escapeHtml(fileName)}</strong> · ${(blob.size/1024).toFixed(0)} KB` });

  // After successful write, clear customer logo so it doesn't bleed into next deck
  if (state.customerLogoB64) {
    state.customerLogoB64 = null;
    state.customerLogoEnabled = false;
    toast({ type: 'info', message: 'Customer logo cleared for next deck' });
  }
}

// ═══════════════════════════════════════════════════════════════════════
// COMPOSE VIEW
// ═══════════════════════════════════════════════════════════════════════
function renderCompose() {
  const cont = document.getElementById('content');
  cont.innerHTML = `
    <div style="margin-bottom:24px">
      <div class="eyebrow" style="margin-bottom:8px">New deck</div>
      <div class="display">Compose a deck</div>
      <div class="muted body-sm" style="margin-top:8px;max-width:680px">Paste your slide content, polish if you want, edit each slide, then generate images. The bundle you pick drives the visual prompt.</div>
    </div>
    <div id="step1"></div>
    <div id="step2"></div>
    <div id="step3"></div>
    <div id="step4"></div>
  `;
  renderStep1(); renderStep2(); renderStep3(); renderStep4();
}

function renderStep1() {
  const el = document.getElementById('step1');
  if (!el) return;
  const isActive = state.composeStep === 1;
  const isDone = state.composeStep > 1;

  if (!isActive && isDone) {
    const b = state.selectedBundleId ? bundleById(state.selectedBundleId) : null;
    el.innerHTML = `
      <div class="step-card collapsed">
        <div class="step-header" id="step1Edit">
          <div class="step-num done">✓</div>
          <div class="step-title">Input</div>
          <div class="step-desc">${b ? escapeHtml(b.name) + ' · ' : ''}${state.slides.length} slides · ${state.slideMin}–${state.slideMax} target</div>
          <button class="btn-ghost" style="margin-left:8px">Edit</button>
        </div>
      </div>`;
    document.getElementById('step1Edit').onclick = () => { state.composeStep = 1; renderCompose(); };
    return;
  }

  const placeholder = `Paste your slide content. Separate slides with either:
  - a line containing only ---
  - or a heading line starting with ## (markdown H2)

Example:
## Slide 1: Telecom Operations Are Reaching a Scaling Limit
Operators face increasing network complexity and rising operational costs.
---
## Slide 2: The Industry Shift
AI is rapidly improving but operators still struggle with governed execution.`;

  el.innerHTML = `
    <div class="step-card">
      <div class="step-header">
        <div class="step-num">1</div>
        <div class="step-title">Paste your deck wording</div>
        <div class="step-desc">Markdown ## headers or --- separators</div>
      </div>
      <div class="step-body">
        <div class="field">
          <label class="field-label">Bundle <span class="subtle">drives the visual prompt</span></label>
          <div class="template-select">
            <select class="select" id="bundleSel">
              <option value="">— optional (uses fallback prompt) —</option>
              ${db.bundles.map(b => `<option value="${b.id}" ${state.selectedBundleId === b.id ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Slide count range <span class="subtle">enforced through the flow</span></label>
          <div class="range-row">
            <div>
              <input class="input" type="number" id="slideMin" min="1" max="30" value="${state.slideMin}">
              <div class="field-hint" style="margin-top:4px">Minimum</div>
            </div>
            <div>
              <input class="input" type="number" id="slideMax" min="1" max="30" value="${state.slideMax}">
              <div class="field-hint" style="margin-top:4px">Maximum</div>
            </div>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Slide deck text <span class="subtle" id="rawCount">${state.rawText.length} chars</span></label>
          <textarea class="textarea" id="rawText" rows="12" placeholder="${escapeHtml(placeholder)}">${escapeHtml(state.rawText)}</textarea>
        </div>
        <div class="field">
          <label class="field-label" style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="custLogoChk" ${state.customerLogoEnabled ? 'checked' : ''} style="margin:0">
            <span>Add customer logo (top-right of every slide)</span>
          </label>
          <div id="custLogoBlock" style="display:${state.customerLogoEnabled ? 'block' : 'none'};margin-top:8px">
            <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
              <div class="logo-preview">${state.customerLogoB64 ? `<img src="data:image/png;base64,${state.customerLogoB64}" alt="customer logo">` : '<span class="subtle" style="color:#71717a;font-size:11px;font-family:var(--mono)">no logo</span>'}</div>
              <div style="display:flex;gap:6px">
                <input type="file" id="custLogoFile" accept=".png,image/png" style="display:none">
                <button class="btn-secondary" id="custUploadBtn" type="button">Upload PNG</button>
                ${state.customerLogoB64 ? '<button class="btn-ghost" id="custClearBtn" type="button">Clear</button>' : ''}
              </div>
            </div>
            <div class="field-hint" style="margin-top:8px">Transparent PNG recommended. Placed as a native PowerPoint image in the top-right corner — selectable / movable in PowerPoint. Cleared automatically after .pptx download.</div>
          </div>
        </div>
        <div id="step1Error"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
          <button class="btn-secondary" id="polishBtn">Polish with AI →</button>
          <button class="btn-primary" id="continueAsIsBtn">Continue with text as-is →</button>
        </div>
      </div>
    </div>`;

  const bundleSel = document.getElementById('bundleSel');
  bundleSel.onchange = e => { state.selectedBundleId = e.target.value || null; };
  document.getElementById('slideMin').onchange = e => {
    let v = Math.max(1, Math.min(30, parseInt(e.target.value) || 1));
    state.slideMin = v;
    if (state.slideMin > state.slideMax) { const swap = state.slideMin; state.slideMin = state.slideMax; state.slideMax = swap; }
    renderStep1();
  };
  document.getElementById('slideMax').onchange = e => {
    let v = Math.max(1, Math.min(30, parseInt(e.target.value) || 1));
    state.slideMax = v;
    if (state.slideMin > state.slideMax) { const swap = state.slideMin; state.slideMin = state.slideMax; state.slideMax = swap; }
    renderStep1();
  };

  const custChk = document.getElementById('custLogoChk');
  custChk.onchange = e => {
    state.customerLogoEnabled = e.target.checked;
    document.getElementById('custLogoBlock').style.display = e.target.checked ? 'block' : 'none';
    if (!e.target.checked) state.customerLogoB64 = null;
    renderStep1();
  };
  const custUpload = document.getElementById('custUploadBtn');
  if (custUpload) custUpload.onclick = () => document.getElementById('custLogoFile').click();
  const custFile = document.getElementById('custLogoFile');
  if (custFile) custFile.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    if (!/png/i.test(file.type)) { toast({ type: 'error', message: 'PNG only' }); return; }
    const fr = new FileReader();
    fr.onload = () => { state.customerLogoB64 = fr.result.split(',')[1]; toast({ type: 'success', message: 'Customer logo uploaded' }); renderStep1(); };
    fr.readAsDataURL(file);
  };
  const custClear = document.getElementById('custClearBtn');
  if (custClear) custClear.onclick = () => { state.customerLogoB64 = null; renderStep1(); };

  const raw = document.getElementById('rawText');
  raw.oninput = e => { state.rawText = e.target.value; document.getElementById('rawCount').textContent = e.target.value.length + ' chars'; };

  document.getElementById('continueAsIsBtn').onclick = () => {
    const parsed = parseSlides(state.rawText);
    if (parsed === null) {
      document.getElementById('step1Error').innerHTML = '<div class="warning-banner" style="margin-top:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div>Please add slide breaks (<span class="mono">---</span> or <span class="mono">## headings</span>) before continuing, or use Polish with AI to auto-split.</div></div>';
      return;
    }
    if (parsed.length === 0) { toast({ type: 'error', message: 'No slides found in text' }); return; }
    if (parsed.length < state.slideMin) {
      document.getElementById('step1Error').innerHTML = `<div class="warning-banner" style="margin-top:12px"><div>Your pasted text produced <strong>${parsed.length}</strong> slides, below your minimum of <strong>${state.slideMin}</strong>. Add slide breaks or use AI Polish to expand.</div></div>`;
      return;
    }
    if (parsed.length > state.slideMax) {
      document.getElementById('step1Error').innerHTML = `<div class="warning-banner" style="margin-top:12px"><div>Your pasted text produced <strong>${parsed.length}</strong> slides, above your maximum of <strong>${state.slideMax}</strong>. Remove some slides or use AI Polish to shorten.</div></div>`;
      return;
    }
    state.slides = parsed;
    state.composeStep = 3;
    renderCompose();
  };
  document.getElementById('polishBtn').onclick = () => {
    if (!state.apiKeys.anthropic) {
      document.getElementById('step1Error').innerHTML = '<div class="info-banner" style="margin-top:12px"><div>Paste your Anthropic API key in <strong>Settings → Anthropic</strong> to use AI polish, or click <strong>Continue with text as-is</strong>.</div></div>';
      return;
    }
    if (!state.rawText.trim()) { toast({ type: 'error', message: 'Paste some text first' }); return; }
    const parsed = parseSlides(state.rawText);
    state.slides = parsed || [];
    state.composeStep = 2;
    renderCompose();
  };
}

function renderStep2() {
  const el = document.getElementById('step2');
  if (!el) return;
  const isActive = state.composeStep === 2;
  const isDone = state.composeStep > 2;
  const isFuture = state.composeStep < 2;

  if (isFuture) { el.innerHTML = `<div class="step-card future"><div class="step-header"><div class="step-num">2</div><div class="step-title">Polish with AI (optional)</div><div class="step-desc">shorten / expand / split</div></div></div>`; return; }
  if (isDone) { el.innerHTML = `<div class="step-card collapsed"><div class="step-header"><div class="step-num done">✓</div><div class="step-title">Polish</div><div class="step-desc">${state.polishMode ? state.polishMode + ' applied' : 'skipped'}</div></div></div>`; return; }

  const hasMarkers = state.slides.length > 0;
  el.innerHTML = `
    <div class="step-card">
      <div class="step-header">
        <div class="step-num">2</div>
        <div class="step-title">Polish with AI</div>
        <div class="step-desc">${hasMarkers ? state.slides.length + ' slides detected · target ' + state.slideMin + '–' + state.slideMax : 'no markers — will auto-split to ' + state.slideMin + '–' + state.slideMax}</div>
      </div>
      <div class="step-body">
        <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
          ${!hasMarkers ? `<button class="btn-secondary" id="splitBtn" ${state.polishing ? 'disabled' : ''}>${state.polishing && state.polishMode==='split' ? '<span class="spinner"></span> Splitting…' : 'Auto-split into slides'}</button>` : ''}
          ${hasMarkers ? `<button class="btn-secondary" id="shortenBtn" ${state.polishing ? 'disabled' : ''}>${state.polishing && state.polishMode==='shorten' ? '<span class="spinner"></span> Shortening…' : 'Shorten'}</button>
          <button class="btn-secondary" id="expandBtn" ${state.polishing ? 'disabled' : ''}>${state.polishing && state.polishMode==='expand' ? '<span class="spinner"></span> Expanding…' : 'Expand'}</button>
          <button class="btn-secondary" id="preserveBtn">Preserve text</button>` : ''}
        </div>
        ${state.slides.length > 0 ? `<div class="caption" style="margin-bottom:8px">${state.slides.length} slides</div>
        <div style="max-height:340px;overflow-y:auto">${state.slides.map((s, i) => `
          <div class="slide-edit-card" style="margin-bottom:6px">
            <div style="font-size:13px;font-weight:600;margin-bottom:4px">${i+1}. ${escapeHtml(s.title)}</div>
            <div style="font-size:12px;color:var(--text-muted);white-space:pre-wrap;line-height:1.5">${escapeHtml(s.body.slice(0, 200))}${s.body.length > 200 ? '…' : ''}</div>
          </div>`).join('')}</div>` : '<div class="empty" style="padding:24px"><div class="empty-desc">Click <strong>Auto-split</strong> to let Claude split your text into slides.</div></div>'}
        <div style="display:flex;gap:8px;justify-content:space-between;margin-top:14px">
          <button class="btn-ghost" id="backTo1">← Back</button>
          <button class="btn-primary" id="toStep3" ${state.slides.length === 0 ? 'disabled' : ''}>Continue to slide edit →</button>
        </div>
      </div>
    </div>`;

  const shortenBtn = document.getElementById('shortenBtn'); if (shortenBtn) shortenBtn.onclick = () => runPolish('shorten');
  const expandBtn = document.getElementById('expandBtn'); if (expandBtn) expandBtn.onclick = () => runPolish('expand');
  const splitBtn = document.getElementById('splitBtn'); if (splitBtn) splitBtn.onclick = () => runPolish('split');
  const preserveBtn = document.getElementById('preserveBtn'); if (preserveBtn) preserveBtn.onclick = () => { state.polishMode = 'preserve'; toast({ type: 'success', message: 'Text preserved' }); };
  document.getElementById('backTo1').onclick = () => { state.composeStep = 1; renderCompose(); };
  document.getElementById('toStep3').onclick = () => { state.composeStep = 3; renderCompose(); };
}

async function runPolish(mode) {
  state.polishing = true; state.polishMode = mode; renderStep2();
  try {
    const polished = await polishWithClaude(state.slides, mode);
    state.slides = polishedToSlides(polished);
    toast({ type: 'success', message: `${mode === 'split' ? 'Split' : mode === 'shorten' ? 'Shortened' : 'Expanded'} — ${state.slides.length} slides` });
  } catch (e) { toast({ type: 'error', message: e.message }); }
  state.polishing = false;
  renderStep2();
}

function renderStep3() {
  const el = document.getElementById('step3');
  if (!el) return;
  const isActive = state.composeStep === 3;
  const isDone = state.composeStep > 3;
  const isFuture = state.composeStep < 3;
  if (isFuture) { el.innerHTML = `<div class="step-card future"><div class="step-header"><div class="step-num">3</div><div class="step-title">Slide text preview &amp; edit</div><div class="step-desc">edit titles and body</div></div></div>`; return; }
  if (isDone) { el.innerHTML = `<div class="step-card collapsed"><div class="step-header" id="step3Edit"><div class="step-num done">✓</div><div class="step-title">Slide text</div><div class="step-desc">${state.slides.length} slides</div><button class="btn-ghost" style="margin-left:8px" id="step3EditBtn">Edit</button></div></div>`;
    document.getElementById('step3EditBtn').onclick = () => { state.composeStep = 3; renderCompose(); }; return; }

  const n = state.slides.length;
  const inRange = n >= state.slideMin && n <= state.slideMax;
  el.innerHTML = `
    <div class="step-card">
      <div class="step-header">
        <div class="step-num">3</div>
        <div class="step-title">Edit slide text</div>
        <div class="step-desc"><span class="slide-counter ${inRange ? 'in-range' : 'out-of-range'}">${n} of ${state.slideMin}–${state.slideMax} slides</span></div>
      </div>
      <div class="step-body">
        <div id="slideEditList">${state.slides.map((s, i) => renderSlideEditCard(s, i)).join('')}</div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn-secondary" id="addSlideBtn" ${n >= state.slideMax ? 'disabled title="Maximum slide count reached"' : ''}>+ Add slide</button>
        </div>
        <div style="display:flex;gap:8px;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)">
          <button class="btn-ghost" id="backTo2or1">← Back</button>
          <button class="btn-primary lg" id="toStep4" ${!inRange ? 'disabled title="Slide count must be within range"' : ''}>Generate images →</button>
        </div>
      </div>
    </div>`;

  state.slides.forEach((s, i) => bindSlideEditCard(i));
  document.getElementById('addSlideBtn').onclick = () => {
    if (state.slides.length >= state.slideMax) return;
    state.slides.push({ title: 'New slide', body: '', imageB64: null, imagePrompt: null, lastPrompt: null, status: 'idle', error: null, regenCount: 0 });
    renderStep3();
  };
  document.getElementById('backTo2or1').onclick = () => { state.composeStep = state.polishMode ? 2 : 1; renderCompose(); };
  document.getElementById('toStep4').onclick = () => {
    if (!state.apiKeys.openai) { toast({ type: 'error', message: 'Add OpenAI API key in Settings first' }); return; }
    state.composeStep = 4; renderCompose(); generateAllImages();
  };
}

function renderSlideEditCard(s, i) {
  const atMin = state.slides.length <= state.slideMin;
  return `
    <div class="slide-edit-card" data-idx="${i}">
      <div class="slide-edit-head">
        <span class="slide-edit-num">Slide ${i+1}</span>
        <div class="slide-edit-actions">
          <button class="icon-btn-sm" data-act="del" ${atMin ? 'disabled title="Minimum slide count reached"' : 'title="Delete slide"'} aria-label="Delete slide">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>
      <div class="field"><label class="field-label">Title</label><input class="input" data-act="title" value="${escapeHtml(s.title)}"></div>
      <div class="field" style="margin-bottom:0"><label class="field-label">Body</label><textarea class="textarea prose" data-act="body" rows="4">${escapeHtml(s.body)}</textarea></div>
    </div>`;
}

function bindSlideEditCard(i) {
  const card = document.querySelector(`.slide-edit-card[data-idx="${i}"]`);
  if (!card) return;
  const titleInp = card.querySelector('[data-act="title"]');
  const bodyInp = card.querySelector('[data-act="body"]');
  const delBtn = card.querySelector('[data-act="del"]');
  titleInp.oninput = e => { state.slides[i].title = e.target.value; };
  bodyInp.oninput = e => { state.slides[i].body = e.target.value; };
  delBtn.onclick = () => {
    if (state.slides.length <= state.slideMin) return;
    state.slides.splice(i, 1);
    renderStep3();
  };
}

function renderStep4() {
  const el = document.getElementById('step4');
  if (!el) return;
  const isFuture = state.composeStep < 4;
  if (isFuture) { el.innerHTML = `<div class="step-card future"><div class="step-header"><div class="step-num">4</div><div class="step-title">Generate images &amp; assemble</div><div class="step-desc">${state.imageModel}</div></div></div>`; return; }
  const allDone = state.slides.every(s => s.status === 'done');
  el.innerHTML = `
    <div class="step-card">
      <div class="step-header">
        <div class="step-num">4</div>
        <div class="step-title">Generate &amp; refine images</div>
        <div class="step-desc">${state.imageModel} · ${state.slides.filter(s => s.status === 'done').length}/${state.slides.length} done</div>
      </div>
      <div class="step-body">
        <div id="step4Slides">${state.slides.map((s, i) => renderImgCard(s, i)).join('')}</div>
        <div style="display:flex;gap:8px;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)">
          <button class="btn-ghost" id="backTo3">← Back to text edit</button>
          <button class="btn-primary lg" id="assembleBtn" ${allDone ? '' : 'disabled'}>Assemble .pptx</button>
        </div>
      </div>
    </div>`;
  state.slides.forEach((s, i) => bindImgCard(i));
  document.getElementById('backTo3').onclick = () => { state.composeStep = 3; renderCompose(); };
  document.getElementById('assembleBtn').onclick = () => assemblePptx();
}

function renderStep4Slides() {
  const list = document.getElementById('step4Slides');
  if (!list) return;
  list.innerHTML = state.slides.map((s, i) => renderImgCard(s, i)).join('');
  state.slides.forEach((s, i) => bindImgCard(i));
  const head = document.querySelector('#step4 .step-desc');
  if (head) head.textContent = `${state.imageModel} · ${state.slides.filter(s => s.status === 'done').length}/${state.slides.length} done`;
  const allDone = state.slides.every(s => s.status === 'done');
  const ab = document.getElementById('assembleBtn');
  if (ab) ab.disabled = !allDone;
}

function renderImgCard(s, i) {
  let thumbContent = '';
  if (s.status === 'generating') thumbContent = `<div class="placeholder"><span class="spinner-lg spinner"></span><div style="margin-top:10px">Generating…</div></div>`;
  else if (s.status === 'error') thumbContent = `<div class="err">${escapeHtml(s.error || 'Failed')}</div>`;
  else if (s.imageB64) thumbContent = `<img src="data:image/jpeg;base64,${s.imageB64}" alt="Slide ${i+1}">`;
  else thumbContent = `<div class="placeholder">Queued</div>`;
  const expanded = !!state.expandedRefine[i];
  const regenCost = (s.regenCount * COST_PER_IMAGE_GEN).toFixed(2);
  return `
    <div class="slide-img-card" data-idx="${i}">
      <div class="slide-img-head">
        <span class="slide-edit-num">Slide ${i+1}</span>
        <div class="slide-img-title">${escapeHtml(s.title)}</div>
        ${s.status === 'done' && s.regenCount === 0 ? `<span class="badge badge-neutral">Generated · $${COST_PER_IMAGE_GEN.toFixed(2)}</span>` : ''}
        ${s.regenCount > 0 ? `<span class="badge badge-neutral">Regenerated ${s.regenCount}× · $${regenCost}</span>` : ''}
        ${s.status === 'done' ? '<span class="badge badge-success">✓</span>' : ''}
        ${s.status === 'error' ? '<span class="badge badge-danger">Error</span>' : ''}
      </div>
      <div class="slide-img-body">
        <div class="slide-img-thumb ${s.status === 'generating' ? 'loading' : ''}" data-act="open">${thumbContent}</div>
        <div class="slide-img-controls">
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${s.status === 'error' ? `<button class="btn-secondary" data-act="retry">Retry</button>` : ''}
            ${s.status === 'done' ? `<button class="btn-secondary" data-act="enlarge">View full size</button>` : ''}
          </div>
          <div class="refine-section">
            <button class="refine-toggle" data-act="toggleRefine">${expanded ? '−' : '+'} Refine this image</button>
            ${expanded ? `
              <div style="margin-top:10px">
                <label class="field-label" style="margin-bottom:4px">Edit prompt</label>
                <textarea class="textarea" data-act="refinePrompt" rows="8" style="font-size:11px">${escapeHtml(s.lastPrompt || composeBundlePrompt(state.selectedBundleId ? joinBundle(bundleById(state.selectedBundleId)) : null, s, state.customerLogoEnabled))}</textarea>
                <div style="display:flex;gap:6px;margin-top:8px">
                  <button class="btn-primary" data-act="regen" ${s.status === 'generating' ? 'disabled' : ''}>${s.status === 'generating' ? '<span class="spinner"></span> Regenerating…' : 'Regenerate'}</button>
                  <button class="btn-ghost" data-act="resetPrompt">Reset to default</button>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      </div>
    </div>`;
}

function bindImgCard(i) {
  const card = document.querySelector(`.slide-img-card[data-idx="${i}"]`);
  if (!card) return;
  const s = state.slides[i];
  const thumb = card.querySelector('[data-act="open"]');
  if (thumb && s.imageB64) thumb.onclick = () => openLightbox(i);
  const enlarge = card.querySelector('[data-act="enlarge"]'); if (enlarge) enlarge.onclick = () => openLightbox(i);
  const retry = card.querySelector('[data-act="retry"]'); if (retry) retry.onclick = () => regenerateOne(i);
  const toggle = card.querySelector('[data-act="toggleRefine"]'); if (toggle) toggle.onclick = () => { state.expandedRefine[i] = !state.expandedRefine[i]; renderStep4Slides(); };
  const regen = card.querySelector('[data-act="regen"]'); if (regen) regen.onclick = () => { const ta = card.querySelector('[data-act="refinePrompt"]'); regenerateOne(i, ta ? ta.value : null); };
  const reset = card.querySelector('[data-act="resetPrompt"]'); if (reset) reset.onclick = () => {
    const ta = card.querySelector('[data-act="refinePrompt"]');
    if (ta) ta.value = composeBundlePrompt(state.selectedBundleId ? joinBundle(bundleById(state.selectedBundleId)) : null, s, state.customerLogoEnabled);
  };
}

function openLightbox(i) {
  const s = state.slides[i];
  if (!s.imageB64) return;
  const html = `
    <div class="modal-header">
      <div>
        <div class="h1">Slide ${i+1}: ${escapeHtml(s.title)}</div>
        <div class="muted body-sm" style="margin-top:4px">${state.imageModel} · 1536×1024 · regenerated ${s.regenCount}×</div>
      </div>
      <button class="btn-ghost" onclick="closeModal()" aria-label="Close">×</button>
    </div>
    <img class="lightbox-img" src="data:image/jpeg;base64,${s.imageB64}" alt="Slide ${i+1}">
    <div style="margin-top:16px">
      <button class="refine-toggle" id="showPromptBtn">+ Show composed prompt</button>
      <div id="promptBlock" style="display:none;margin-top:10px">
        <textarea class="textarea" readonly rows="10" style="font-size:11px">${escapeHtml(s.lastPrompt || '')}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="saveImgBtn">Save as JPG</button>
      <button class="btn-primary" onclick="closeModal()">Close</button>
    </div>`;
  openModal(html, { xl: true });
  document.getElementById('showPromptBtn').onclick = () => { const pb = document.getElementById('promptBlock'); pb.style.display = pb.style.display === 'none' ? 'block' : 'none'; };
  document.getElementById('saveImgBtn').onclick = () => {
    const a = document.createElement('a');
    a.href = 'data:image/jpeg;base64,' + s.imageB64;
    a.download = `slide-${i+1}-${slugify(s.title)}.jpg`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
}

      <div class="eyebrow" style="margin-bottom:8px">Library</div>
      <div class="display">Bundles</div>
      <div class="muted body-sm" style="margin-top:8px;max-width:680px">Bundles wire one House Style + one Domain Pack + one Deck Type. Selecting a bundle in Compose composes the three prompts into the request to gpt-image-2.</div>
    </div>
    <div class="section-header">
      <input class="input" id="bundleSearch" placeholder="Search bundles…" value="${escapeHtml(state.bundlesSearch)}" style="max-width:320px">

    : `<div class="template-grid">${filtered.map(b => {

      const dp = templateById(b.domain_pack_template_id);
      const dt = templateById(b.deck_type_template_id);
      return `
        <div class="template-card">
          <div class="template-card-header">
            <div class="template-card-name"><span class="swatch-dot" style="background:${escapeHtml(b.swatch_color)}"></span>${escapeHtml(b.name)}</div>
          </div>
          <div class="template-card-desc">${escapeHtml(b.description || '')}</div>
          <div style="font-size:11px;color:var(--text-muted);line-height:1.7;margin-bottom:10px">
            <div><span class="layer-badge layer-house_style">HS</span> ${escapeHtml(hs ? hs.name : '— missing —')}</div>
            <div style="margin-top:2px"><span class="layer-badge layer-domain_pack">DP</span> ${escapeHtml(dp ? dp.name : '— missing —')}</div>
            <div style="margin-top:2px"><span class="layer-badge layer-deck_type">DT</span> ${escapeHtml(dt ? dt.name : '— missing —')}</div>
          </div>
          <div class="template-card-footer">
            <span>${escapeHtml((b.updated_at || '').slice(0,10))}</span>
            <div style="display:flex;gap:4px">
              <button class="btn-ghost" data-act="viewBundle" data-id="${b.id}">View</button>
              ${state.adminMode ? `<button class="btn-ghost" data-act="editBundle" data-id="${b.id}">Edit</button><button class="btn-ghost" data-act="delBundle" data-id="${b.id}" style="color:var(--danger)">Delete</button>` : ''}
            </div>

    }).join('')}</div>`}

  }
  document.querySelectorAll('[data-act="viewBundle"]').forEach(el => el.onclick = () => openBundleEditor(el.dataset.id, true));
  document.querySelectorAll('[data-act="editBundle"]').forEach(el => el.onclick = () => openBundleEditor(el.dataset.id));

function openBundleEditor(id, readOnlyView) {
  const editing = id ? bundleById(id) : null;
  const draft = editing ? { ...editing } : {
    id: null, name: '', description: '', swatch_color: '#47D1FF',
    house_style_template_id: templatesByLayer('house_style')[0]?.id || '',
    domain_pack_template_id: templatesByLayer('domain_pack')[0]?.id || '',
    deck_type_template_id: templatesByLayer('deck_type')[0]?.id || ''
  };
  const ro = readOnlyView || !state.adminMode;

  function buildHtml() {
    const joined = {
      ...draft,
      house_style: templateById(draft.house_style_template_id),
      domain_pack: templateById(draft.domain_pack_template_id),
      deck_type: templateById(draft.deck_type_template_id),
      name: draft.name || 'preview'
    };
    const preview = composeBundlePromptPreview(joined);
    return `
      <div class="modal-header">
        <div>
          <div class="h1">${editing ? (ro ? 'View' : 'Edit') + ' bundle' : 'New bundle'}</div>
          <div class="muted body-sm" style="margin-top:4px">${ro ? 'Read-only view of composed prompt.' : 'Three layers compose live below.'}</div>
        </div>
        <button class="btn-ghost" onclick="closeModal()" aria-label="Close">×</button>
      </div>
      <div class="field"><label class="field-label">Name</label><input class="input" id="bName" value="${escapeHtml(draft.name)}" ${ro ? 'disabled' : ''}></div>
      <div class="field"><label class="field-label">Description</label><textarea class="textarea prose" id="bDesc" rows="2" ${ro ? 'disabled' : ''}>${escapeHtml(draft.description || '')}</textarea></div>
      <div class="field"><label class="field-label">Swatch colour</label><input class="input" type="color" id="bColor" value="${escapeHtml(draft.swatch_color)}" ${ro ? 'disabled' : ''} style="width:80px;height:32px;padding:2px"></div>
      <div class="range-row" style="grid-template-columns:1fr 1fr 1fr;gap:8px">
        <div class="field"><label class="field-label"><span class="layer-badge layer-house_style">House Style</span></label>
          <select class="select" id="bHS" ${ro ? 'disabled' : ''}>${templatesByLayer('house_style').map(t => `<option value="${t.id}" ${draft.house_style_template_id === t.id ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label class="field-label"><span class="layer-badge layer-domain_pack">Domain Pack</span></label>
          <select class="select" id="bDP" ${ro ? 'disabled' : ''}>${templatesByLayer('domain_pack').map(t => `<option value="${t.id}" ${draft.domain_pack_template_id === t.id ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label class="field-label"><span class="layer-badge layer-deck_type">Deck Type</span></label>
          <select class="select" id="bDT" ${ro ? 'disabled' : ''}>${templatesByLayer('deck_type').map(t => `<option value="${t.id}" ${draft.deck_type_template_id === t.id ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Composed prompt preview <span class="subtle" id="composedCount">${preview.length} chars</span></label>
        <div class="composed-preview" id="composedPreview">${escapeHtml(preview)}</div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" onclick="closeModal()">${ro ? 'Close' : 'Cancel'}</button>
        ${!ro ? '<button class="btn-primary" id="bSaveBtn">' + (editing ? 'Save' : 'Create') + '</button>' : ''}
      </div>`;
  }
  openModal(buildHtml(), { lg: true });

  function refreshPreview() {
    const joined = {
      ...draft,
      house_style: templateById(draft.house_style_template_id),
      domain_pack: templateById(draft.domain_pack_template_id),
      deck_type: templateById(draft.deck_type_template_id),
      name: draft.name || 'preview'
    };
    const preview = composeBundlePromptPreview(joined);
    const cp = document.getElementById('composedPreview');
    const cc = document.getElementById('composedCount');
    if (cp) cp.textContent = preview;
    if (cc) cc.textContent = preview.length + ' chars';
  }

  if (!ro) {
    document.getElementById('bName').oninput = e => { draft.name = e.target.value; };
    document.getElementById('bDesc').oninput = e => { draft.description = e.target.value; };
    document.getElementById('bColor').oninput = e => { draft.swatch_color = e.target.value; };
    document.getElementById('bHS').onchange = e => { draft.house_style_template_id = e.target.value; refreshPreview(); };
    document.getElementById('bDP').onchange = e => { draft.domain_pack_template_id = e.target.value; refreshPreview(); };
    document.getElementById('bDT').onchange = e => { draft.deck_type_template_id = e.target.value; refreshPreview(); };
    document.getElementById('bSaveBtn').onclick = () => {
      if (!draft.name.trim()) { toast({ type: 'error', message: 'Name is required' }); return; }
      const now = nowIso();
      if (editing) {
        Object.assign(editing, draft, { updated_at: now, updated_by: 'admin' });
        toast({ type: 'success', message: 'Bundle saved' });
      } else {
        db.bundles.push({ ...draft, id: uuid(), is_active: true, created_at: now, updated_at: now, updated_by: 'admin' });
        toast({ type: 'success', message: 'Bundle created' });
      }
      closeModal(); renderBundles();
    };
  }
}

function deleteBundle(id) {
  const b = bundleById(id); if (!b) return;
  const html = `
    <div class="modal-header"><div><div class="h1">Delete bundle?</div><div class="muted body-sm" style="margin-top:4px">This cannot be undone.</div></div></div>
    <div class="danger-banner"><div><strong>${escapeHtml(b.name)}</strong> will be permanently removed.</div></div>
    <div class="modal-footer"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-danger" id="confirmDelBundle">Delete</button></div>`;
  openModal(html);
  document.getElementById('confirmDelBundle').onclick = () => {
    db.bundles = db.bundles.filter(x => x.id !== id);
    toast({ type: 'success', message: 'Bundle deleted' });
    closeModal(); renderBundles();
  };
}

          <button class="pill ${filter === 'domain_pack' ? 'active' : ''}" data-filter="domain_pack">Domain Pack <span class="subtle mono" style="margin-left:4px">${counts.domain_pack}</span></button>

      <textarea class="textarea" id="tPrompt" rows="14" ${ro ? 'disabled' : ''}>${escapeHtml(draft.prompt || '')}</textarea>
    </div>
    ${!ro && editing ? `<div class="field"><label class="field-label">Change note <span class="subtle">optional</span></label><input class="input" id="tChangeNote" placeholder="e.g. tightened brand discipline language"></div>` : ''}
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeModal()">${ro ? 'Close' : 'Cancel'}</button>
      ${!ro ? '<button class="btn-secondary" id="tSaveAsNew">Save as new</button><button class="btn-primary" id="tSaveBtn">Save</button>' : ''}
    </div>`;
  openModal(html, { lg: true });

  if (!ro) {
    document.getElementById('tName').oninput = e => { draft.name = e.target.value; };
    document.getElementById('tLayer').onchange = e => { draft.layer = e.target.value; };
    document.getElementById('tDesc').oninput = e => { draft.description = e.target.value; };
    document.getElementById('tPrompt').oninput = e => { draft.prompt = e.target.value; document.getElementById('promptCount').textContent = e.target.value.length + ' chars'; };
    document.getElementById('tSaveBtn').onclick = () => {
      if (!draft.name.trim() || !draft.prompt.trim()) { toast({ type: 'error', message: 'Name and prompt are required' }); return; }
      const now = nowIso();
      if (editing) {
        Object.assign(editing, draft, { updated_at: now, updated_by: 'admin' });
        const note = (document.getElementById('tChangeNote')?.value || '').trim() || 'Edit';
        db.versions.push({ id: uuid(), template_id: editing.id, version_num: nextVersionNum(editing.id), prompt: draft.prompt, change_note: note, updated_by: 'admin', created_at: now });
        toast({ type: 'success', message: 'Saved · new version recorded' });
      } else {
        const newId = uuid();
        db.templates.push({ ...draft, id: newId, is_active: true, created_at: now, updated_at: now, updated_by: 'admin' });
        db.versions.push({ id: uuid(), template_id: newId, version_num: 1, prompt: draft.prompt, change_note: 'Created', updated_by: 'admin', created_at: now });
        toast({ type: 'success', message: 'Template created' });
      }
      closeModal(); renderTemplates();
    };
    document.getElementById('tSaveAsNew').onclick = () => {
      if (!draft.name.trim() || !draft.prompt.trim()) { toast({ type: 'error', message: 'Name and prompt are required' }); return; }
      const now = nowIso();
      const newId = uuid();
      const copy = { ...draft, id: newId, name: draft.name + ' (copy)', is_active: true, created_at: now, updated_at: now, updated_by: 'admin' };
      db.templates.push(copy);
      db.versions.push({ id: uuid(), template_id: newId, version_num: 1, prompt: copy.prompt, change_note: 'Copied from "' + (editing ? editing.name : 'new') + '"', updated_by: 'admin', created_at: now });
      toast({ type: 'success', message: 'Saved as new template' });
      closeModal(); renderTemplates();
    };
  }
}

function deleteTemplate(id) {
  const t = templateById(id); if (!t) return;
  const used = bundlesUsingTemplate(id);
  if (used.length > 0) {
    const html = `
      <div class="modal-header"><div><div class="h1">Cannot delete</div><div class="muted body-sm" style="margin-top:4px">Template is referenced by ${used.length} bundle${used.length===1?'':'s'}.</div></div></div>
      <div class="warning-banner"><div><strong>${escapeHtml(t.name)}</strong> is in use by:<ul style="margin:6px 0 0 18px">${used.map(b => '<li>' + escapeHtml(b.name) + '</li>').join('')}</ul>Remove from those bundles first.</div></div>
      <div class="modal-footer"><button class="btn-primary" onclick="closeModal()">OK</button></div>`;
    openModal(html);
    return;
  }
  const html = `
    <div class="modal-header"><div><div class="h1">Delete template?</div><div class="muted body-sm" style="margin-top:4px">This cannot be undone. Version history will also be deleted.</div></div></div>
    <div class="danger-banner"><div><strong>${escapeHtml(t.name)}</strong> will be permanently removed.</div></div>
    <div class="modal-footer"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-danger" id="confirmDelT">Delete</button></div>`;
  openModal(html);
  document.getElementById('confirmDelT').onclick = () => {
    db.templates = db.templates.filter(x => x.id !== id);
    db.versions = db.versions.filter(v => v.template_id !== id);
    toast({ type: 'success', message: 'Template deleted' });
    closeModal(); renderTemplates();
  };
}

function openVersions(id) {
  const t = templateById(id); if (!t) return;
  const versions = db.versions.filter(v => v.template_id === id).sort((a, b) => b.version_num - a.version_num);
  const html = `
    <div class="modal-header">
      <div><div class="h1">Version history</div><div class="muted body-sm" style="margin-top:4px">${escapeHtml(t.name)} · ${versions.length} version${versions.length===1?'':'s'}</div></div>
      <button class="btn-ghost" onclick="closeModal()" aria-label="Close">×</button>
    </div>
    <div style="max-height:520px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm)">
      ${versions.map(v => `
        <div class="version-row">
          <div class="version-head">
            <span class="version-num">v${v.version_num}</span>
            <span class="muted" style="font-size:12px">${escapeHtml((v.created_at||'').slice(0,16).replace('T',' '))}</span>
            <span class="muted" style="font-size:12px">· ${escapeHtml(v.updated_by || 'unknown')}</span>
            <span class="muted" style="font-size:12px">· ${escapeHtml(v.change_note || '')}</span>
            <div style="margin-left:auto;display:flex;gap:4px">
              <button class="btn-ghost" data-act="vExpand" data-id="${v.id}">Expand</button>
              ${state.adminMode ? `<button class="btn-secondary" data-act="vRestore" data-id="${v.id}">Restore</button>` : ''}
            </div>
          </div>
          <div id="vBody_${v.id}" style="display:none;margin-top:8px"><textarea class="textarea" readonly rows="10" style="font-size:11px">${escapeHtml(v.prompt)}</textarea></div>
          <div id="vPreview_${v.id}" class="muted" style="font-size:12px;font-family:var(--mono);margin-top:4px">${escapeHtml(v.prompt.slice(0, 200))}${v.prompt.length>200?'…':''}</div>
        </div>`).join('')}
    </div>
    <div class="modal-footer"><button class="btn-primary" onclick="closeModal()">Close</button></div>`;
  openModal(html, { lg: true });
  document.querySelectorAll('[data-act="vExpand"]').forEach(el => el.onclick = () => {
    const vid = el.dataset.id;
    const body = document.getElementById('vBody_' + vid);
    const prev = document.getElementById('vPreview_' + vid);
    const showing = body.style.display !== 'none';
    body.style.display = showing ? 'none' : 'block';
    prev.style.display = showing ? 'block' : 'none';
    el.textContent = showing ? 'Expand' : 'Collapse';
  });
  document.querySelectorAll('[data-act="vRestore"]').forEach(el => el.onclick = () => {
    const vid = el.dataset.id;
    const v = db.versions.find(x => x.id === vid); if (!v) return;
    const tpl = templateById(v.template_id); if (!tpl) return;
    const now = nowIso();
    tpl.prompt = v.prompt; tpl.updated_at = now; tpl.updated_by = 'admin';
    db.versions.push({ id: uuid(), template_id: tpl.id, version_num: nextVersionNum(tpl.id), prompt: v.prompt, change_note: 'Restored from version ' + v.version_num, updated_by: 'admin', created_at: now });
    toast({ type: 'success', message: 'Restored to v' + v.version_num + ' · new version recorded' });
    closeModal(); renderTemplates();
  });
}

// ═══════════════════════════════════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════════════════════════════════
function renderSettings() {
  const cont = document.getElementById('content');
  const oai = state.apiKeys.openai ? (state.apiKeys.openai.slice(0,7) + '…' + state.apiKeys.openai.slice(-4)) : '';
  const ant = state.apiKeys.anthropic ? (state.apiKeys.anthropic.slice(0,10) + '…' + state.apiKeys.anthropic.slice(-4)) : '';
  cont.innerHTML = `
    <div style="margin-bottom:24px">
      <div class="eyebrow" style="margin-bottom:8px">Configuration</div>
      <div class="display">Settings</div>
      <div class="muted body-sm" style="margin-top:8px">API keys, logo, admin mode, runtime configuration. Settings live in memory only.</div>
    </div>

    <div class="section">
      <div class="section-header"><div class="h1">Admin mode</div></div>
      <div class="card">
        <div class="field">
          <label class="field-label" style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="adminChk" ${state.adminMode ? 'checked' : ''} style="margin:0">
            <span>Enable admin mode</span>
          </label>
          <div class="field-hint" style="margin-top:6px">Interim toggle. Real auth via Entra/Supabase comes in a later build. When enabled: New / Edit / Delete on Templates and Bundles tabs.</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header"><div class="h1">Brand logo</div></div>
      <div class="card">
        <div class="field">
          <label class="field-label">Logo image <span class="subtle">PNG with transparent background recommended</span></label>
          <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
            <div class="logo-preview">${state.logoB64 ? `<img src="data:image/png;base64,${state.logoB64}" alt="logo preview">` : '<span class="subtle" style="color:#71717a;font-size:11px;font-family:var(--mono)">no logo</span>'}</div>
            <div style="display:flex;gap:6px">
              <input type="file" id="logoFile" accept=".png,image/png" style="display:none">
              <button class="btn-secondary" id="uploadLogoBtn">Upload PNG</button>
              ${state.logoIsCustom ? '<button class="btn-ghost" id="clearLogoBtn">Reset to default</button>' : ''}
            </div>
          </div>
          <div class="field-hint" style="margin-top:10px">Placed as a native PowerPoint image element on each slide at assembly time — selectable / movable / deletable in PowerPoint. ${state.logoB64 ? '<span class="badge badge-success" style="margin-left:6px">' + (state.logoIsCustom ? 'Custom logo' : 'Default DN logo') + '</span>' : '<span class="badge badge-warning" style="margin-left:6px">No logo loaded</span>'}</div>
        </div>
        <div class="field" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
          <label class="field-label" style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="logoBackingChk" ${state.logoBacking ? 'checked' : ''} style="margin:0">
            <span>Add dark backing panel behind logos in .pptx</span>
          </label>
          <div class="field-hint" style="margin-top:6px">For logos with light or coloured backgrounds. Defaults off — use a transparent PNG when possible for the cleanest look.</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header"><div class="h1">Anthropic</div></div>
      <div class="card">
        <div class="field">
          <label class="field-label">API key <span class="subtle">required for AI polish</span></label>
          <div class="api-key-row">
            <input class="input" id="anthropicKey" type="password" placeholder="sk-ant-..." value="${escapeHtml(state.apiKeys.anthropic)}" autocomplete="off">
            <button class="btn-secondary" id="saveAntBtn">Save</button>
            ${state.apiKeys.anthropic ? '<button class="btn-ghost" id="clearAntBtn">Clear</button>' : ''}
          </div>
          <div class="field-hint"><span class="mono">claude-sonnet-4-5</span> · used for shorten / expand / auto-split. ${state.apiKeys.anthropic ? 'Current: <span class="mono">' + escapeHtml(ant) + '</span>' : 'Not set.'}</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header"><div class="h1">OpenAI</div></div>
      <div class="card">
        <div class="field">
          <label class="field-label">API key <span class="subtle">required for image generation</span></label>
          <div class="api-key-row">
            <input class="input" id="openaiKey" type="password" placeholder="sk-..." value="${escapeHtml(state.apiKeys.openai)}" autocomplete="off">
            <button class="btn-secondary" id="saveKeyBtn">Save</button>
            ${state.apiKeys.openai ? '<button class="btn-ghost" id="clearKeyBtn">Clear</button>' : ''}
          </div>
          <div class="field-hint">Default model: <span class="mono">gpt-image-2</span> with auto-fallback to <span class="mono">gpt-image-1</span>. ${state.apiKeys.openai ? 'Current: <span class="mono">' + escapeHtml(oai) + '</span>' : 'Not set.'}</div>
        </div>
        <div class="field">
          <label class="field-label">Organization ID <span class="subtle">optional</span></label>
          <div class="api-key-row">
            <input class="input" id="openaiOrg" type="text" placeholder="org-..." value="${escapeHtml(state.apiKeys.openai_org)}" autocomplete="off">
            <button class="btn-secondary" id="saveOrgBtn">Save</button>
            ${state.apiKeys.openai_org ? '<button class="btn-ghost" id="clearOrgBtn">Clear</button>' : ''}
          </div>
        </div>
        <div class="field">
          <label class="field-label">Image model</label>
          <select class="select" id="imgModelSel">
            <option value="gpt-image-2" ${state.imageModel === 'gpt-image-2' ? 'selected' : ''}>gpt-image-2 (default)</option>
            <option value="gpt-image-1" ${state.imageModel === 'gpt-image-1' ? 'selected' : ''}>gpt-image-1 (fallback)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header"><div class="h1">Runtime</div></div>
      <div class="card">
        <dl class="kv">
          <dt>Version</dt><dd><span class="mono">2.0.7</span> (build #14 — PowerPoint-native logo placement, corner quiet zones)</dd>
          <dt>Polish model</dt><dd><span class="mono">claude-sonnet-4-5-20250929</span></dd>
          <dt>Image model</dt><dd><span class="mono">${state.imageModel}</span> · 1536×1024</dd>
          <dt>PPTX engine</dt><dd>PptxGenJS 3.12 (in-browser)</dd>
          <dt>Templates</dt><dd>${db.templates.length} (${db.templates.filter(t=>t.layer==='house_style').length} HS · ${db.templates.filter(t=>t.layer==='domain_pack').length} DP · ${db.templates.filter(t=>t.layer==='deck_type').length} DT)</dd>
          <dt>Bundles</dt><dd>${db.bundles.length}</dd>
          <dt>Admin mode</dt><dd>${state.adminMode ? '<span class="badge badge-success">Enabled</span>' : '<span class="badge badge-neutral">Read-only</span>'}</dd>
        </dl>
      </div>
    </div>`;

  document.getElementById('adminChk').onchange = e => { state.adminMode = e.target.checked; updateAdminBadge(); renderSettings(); };
  const lbChk = document.getElementById('logoBackingChk');
  if (lbChk) lbChk.onchange = e => { state.logoBacking = e.target.checked; toast({ type: 'info', message: e.target.checked ? 'Logo backing panel enabled' : 'Logo backing panel disabled' }); };
  document.getElementById('uploadLogoBtn').onclick = () => document.getElementById('logoFile').click();
  document.getElementById('logoFile').onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    if (!/png/i.test(file.type)) { toast({ type: 'error', message: 'PNG only' }); return; }
    const fr = new FileReader();
    fr.onload = () => { state.logoB64 = fr.result.split(',')[1]; state.logoIsCustom = true; toast({ type: 'success', message: 'Logo uploaded' }); renderSettings(); };
    fr.readAsDataURL(file);
  };
  const clrLogo = document.getElementById('clearLogoBtn');
  if (clrLogo) clrLogo.onclick = async () => { state.logoIsCustom = false; state.logoB64 = await loadDefaultLogo(); toast({ type: 'info', message: 'Reset to default DN logo' }); renderSettings(); };

  document.getElementById('saveKeyBtn').onclick = () => {
    const v = (document.getElementById('openaiKey').value || '').trim();
    if (!v) { toast({ type: 'error', message: 'Enter a key' }); return; }
    if (!v.startsWith('sk-')) { toast({ type: 'error', message: 'OpenAI key must start with sk-' }); return; }
    state.apiKeys.openai = v; toast({ type: 'success', message: `Saved · ends …${v.slice(-4)}` }); renderSettings();
  };
  const ck = document.getElementById('clearKeyBtn'); if (ck) ck.onclick = () => { state.apiKeys.openai = ''; renderSettings(); toast({ type: 'info', message: 'Cleared' }); };
  document.getElementById('saveAntBtn').onclick = () => {
    const v = (document.getElementById('anthropicKey').value || '').trim();
    if (!v) { toast({ type: 'error', message: 'Enter a key' }); return; }
    if (!v.startsWith('sk-ant-')) { toast({ type: 'error', message: 'Anthropic key must start with sk-ant-' }); return; }
    state.apiKeys.anthropic = v; toast({ type: 'success', message: `Saved · ends …${v.slice(-4)}` }); renderSettings();
  };
  const ca = document.getElementById('clearAntBtn'); if (ca) ca.onclick = () => { state.apiKeys.anthropic = ''; renderSettings(); toast({ type: 'info', message: 'Cleared' }); };
  document.getElementById('saveOrgBtn').onclick = () => { state.apiKeys.openai_org = (document.getElementById('openaiOrg').value || '').trim(); toast({ type: 'success', message: 'Org saved' }); renderSettings(); };
  const co = document.getElementById('clearOrgBtn'); if (co) co.onclick = () => { state.apiKeys.openai_org = ''; renderSettings(); toast({ type: 'info', message: 'Cleared' }); };
  document.getElementById('imgModelSel').onchange = e => { state.imageModel = e.target.value; state.imageModelFellBack = false; toast({ type: 'info', message: `Image model set to ${state.imageModel}` }); renderSettings(); };
}

// ═══════════════════════════════════════════════════════════════════════
// ADMIN BADGE / ROUTING
// ═══════════════════════════════════════════════════════════════════════
function updateAdminBadge() {
  const el = document.getElementById('adminBadge');
  if (!el) return;
  el.innerHTML = state.adminMode
    ? '<span class="badge badge-accent" style="cursor:pointer" id="adminBadgeBtn" title="Click to disable admin mode">Admin</span>'
    : '<span class="badge badge-neutral" style="cursor:pointer" id="adminBadgeBtn" title="Click to enable admin mode">Read-only</span>';
  const btn = document.getElementById('adminBadgeBtn');
  if (btn) btn.onclick = () => {
    state.adminMode = !state.adminMode;
    updateAdminBadge();
    toast({ type: 'info', message: state.adminMode ? 'Admin mode enabled' : 'Admin mode disabled' });
    if (state.view === 'templates') renderTemplates();
    else if (state.view === 'bundles') renderBundles();
    else if (state.view === 'settings') renderSettings();
  };
}

document.getElementById('themeToggle').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = state.theme;
});
function setActiveNav() { document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === state.view)); }
document.querySelectorAll('.nav-btn').forEach(b => { b.addEventListener('click', () => { state.view = b.dataset.view; setActiveNav(); render(); }); });
function render() {
  if (state.view === 'compose') renderCompose();
  else if (state.view === 'bundles') renderBundles();
  else if (state.view === 'templates') renderTemplates();
  else renderSettings();
}

seedIfEmpty();
updateAdminBadge();
render();
loadDefaultLogo().then(b => {
  if (b && !state.logoIsCustom) { state.logoB64 = b; console.log('Default DN logo loaded'); }
  else if (!b) { console.warn('Default logo unavailable — upload one in Settings'); }
});
</script>
</body>
