// ─── PARSE SLIDES ──────────────────────────────────────────────────────
function parseSlidesDetected(text) {
  if (!text || !text.trim()) return { slides: [], pattern: null };
  const lines = text.split(/\r?\n/);
  function buildChunks(markers) {
    const chunks = [];
    for (let i = 0; i < markers.length; i++) {
      const cur = markers[i]; const next = markers[i+1];
      const bodyLines = lines.slice(cur.idx + 1, next ? next.idx : lines.length);
      let title = (cur.title || '').replace(/^Slide\s+\d+\s*[—–:\-\.]?\s*/i, '').trim();
      if (!title) {
        for (let j = 0; j < bodyLines.length; j++) {
          const l = bodyLines[j].trim();
          if (!l) continue;
          if (/^title$/i.test(l)) continue;
          title = l.replace(/^#+\s*/, '');
          bodyLines.splice(j, 1); break;
        }
      }
      while (bodyLines.length && /^\s*title\s*$/i.test(bodyLines[0])) bodyLines.shift();
      chunks.push({ title: title || ('Slide ' + (i+1)), bodyLines });
    }
    return chunks;
  }
  let chunks = []; let pattern = null;
  const h1Re = /^#\s+(.+?)\s*$/;
  const h1Markers = [];
  lines.forEach((line, idx) => { const m = line.match(h1Re); if (m) h1Markers.push({ idx, title: (m[1] || '').trim() }); });
  if (h1Markers.length >= 2) { pattern = 'h1'; chunks = buildChunks(h1Markers); }
  else {
    const slideNRe = /^\s*Slide\s+\d+\s*[—–:\-\.]?\s*(.*)$/i;
    const slideNMarkers = [];
    lines.forEach((line, idx) => { const m = line.match(slideNRe); if (m) slideNMarkers.push({ idx, title: (m[1] || '').trim() }); });
    if (slideNMarkers.length >= 2) { pattern = 'slide_n'; chunks = buildChunks(slideNMarkers); }
    else {
      const h2Re = /^##\s+(.+?)\s*$/;
      const h2Markers = [];
      lines.forEach((line, idx) => { const m = line.match(h2Re); if (m) h2Markers.push({ idx, title: (m[1] || '').trim() }); });
      if (h2Markers.length >= 2) { pattern = 'h2'; chunks = buildChunks(h2Markers); }
      else if (/^\s*---\s*$/m.test(text)) {
        pattern = 'hr';
        const segments = text.split(/^\s*---\s*$/m).map(s => s.trim()).filter(Boolean);
        chunks = segments.map((seg, i) => {
          const segLines = seg.split(/\r?\n/);
          const firstNonEmpty = segLines.findIndex(l => l.trim().length > 0);
          const title = firstNonEmpty >= 0 ? segLines[firstNonEmpty].replace(/^#+\s*/, '').replace(/^Slide\s+\d+[:.]?\s*/i, '').trim() : `Slide ${i+1}`;
          const bodyLines = firstNonEmpty >= 0 ? segLines.slice(firstNonEmpty + 1) : [];
          return { title: title || `Slide ${i+1}`, bodyLines };
        });
      } else return { slides: null, pattern: null };
    }
  }
  const slides = chunks.map(c => ({ title: c.title, body: c.bodyLines.join('\n').trim(), imageB64: null, imagePrompt: null, lastPrompt: null, status: 'idle', error: null, regenCount: 0, costAccrued: 0, modelUsed: null }));
  return { slides, pattern };
}

// ─── ANTHROPIC POLISH (with token cost capture) ────────────────────────
async function polishWithClaude(_unused, mode) {
  const key = (state.apiKeys.anthropic || '').trim();
  if (!key) throw new Error('NO_ANTHROPIC_KEY: Set Anthropic API key in Settings.');
  const rawText = state.rawText || '';
  const min = state.slideMin, max = state.slideMax;
  const target = Math.round((min + max) / 2);
  const modeInstruction = {
    shorten: 'Aggressively shorten each slide to brief bullet points. Consolidate adjacent slides if needed to fit within the slide count range.',
    expand:  'Expand each slide with supporting bullets and sub-headlines. If the input has very few slides, split into more — but stay within the range.',
    preserve:'Preserve the wording where reasonable. Only split or consolidate slides if necessary to fit the slide count range.',
    split:   'Split this raw text into a logical slide deck. Each slide should carry one clear idea. Consolidate or expand as needed to fit the range.'
  }[mode] || 'Reshape the input into a clean slide deck within the slide count range.';
  const baseSystem = `You are a presentation editor for Digitata Networks, a premium telecom AI company.\n\nCRITICAL CONSTRAINT — non-negotiable:\nYou MUST return exactly between ${min} and ${max} slides. Not fewer than ${min}. Not more than ${max}. Aim for ${target} as the default.\nIf the input text has more sections than ${max}, you must consolidate.\nIf the input text has fewer sections than ${min}, you must split or expand.\nThis constraint overrides any other interpretation of the input structure.\n\nMode: ${mode}\nMode-specific instruction: ${modeInstruction}\n\nReturn ONLY valid JSON, no markdown fences, no preamble:\n{\n  "slides": [\n    { "title": "Slide title — short, decisive", "body": "Slide body. Use \\n for line breaks, * for bullet points." }\n  ]\n}`;
  const userPrompt = `Here is the raw deck wording. Produce between ${min} and ${max} slides — not fewer, not more.\n\nRAW DECK TEXT:\n${rawText}`;
  const modelName = 'claude-sonnet-4-5-20250929';

  async function callClaude(sys) {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: modelName, max_tokens: 4000, system: sys, messages: [{ role: 'user', content: userPrompt }] })
    });
    if (!resp.ok) { const err = await resp.text(); throw new Error(`Claude ${resp.status}: ${err.slice(0,300)}`); }
    const data = await resp.json();
    if (data.usage) {
      const inTok = data.usage.input_tokens || 0;
      const outTok = data.usage.output_tokens || 0;
      const cost = getAnthropicCost(modelName, inTok, outTok);
      deckCost.polish += cost;
      renderCostBadge();
    }
    const raw = data.content[0].text;
    const clean = raw.replace(/```json|```/g, '').trim();
    return JSON.parse(clean).slides || [];
  }

  let attempt = 0; let lastSlides = null;
  while (attempt < 3) {
    attempt++;
    const sys = attempt === 1 ? baseSystem : `${baseSystem}\n\nPREVIOUS ATTEMPT RETURNED ${lastSlides ? lastSlides.length : '?'} SLIDES, OUTSIDE THE REQUIRED RANGE OF [${min}, ${max}]. You MUST produce between ${min} and ${max} slides this time.`;
    let result;
    try { result = await callClaude(sys); } catch (e) { if (attempt >= 3) throw e; continue; }
    lastSlides = result;
    const n = result.length;
    if (n >= min && n <= max) return result;
    if (attempt >= 3) { toast({ type: 'warning', message: `AI couldn't hit the slide range — returned ${n} slides (target was ${min}–${max}). Adjust manually.` }); return result; }
  }
  throw new Error('Polish failed after 3 attempts');
}

function polishedToSlides(polished) {
  return polished.map(p => {
    let body = '';
    if (typeof p.body === 'string' && p.body.trim()) { body = p.body.replace(/^\s*\*\s+/gm, '• '); }
    else { const parts = []; if (p.subheadline) parts.push(p.subheadline); if (Array.isArray(p.bullets) && p.bullets.length) parts.push(...p.bullets.map(b => '• ' + b)); body = parts.join('\n'); }
    return { title: p.title || 'Untitled', body, imageB64: null, imagePrompt: null, lastPrompt: null, status: 'idle', error: null, regenCount: 0, costAccrued: 0, modelUsed: null };
  });
}

// ─── COMPOSED PROMPT (3-layer) ────────────────────────────────────────
function composeBundlePrompt(bundleJoined, slide) {
  const layers = [];
  if (bundleJoined && bundleJoined.house_style && bundleJoined.house_style.prompt) layers.push(bundleJoined.house_style.prompt);
  else { layers.push(MASTER_PROMPT_FALLBACK); toastOnce('missing_hs_' + (bundleJoined ? bundleJoined.id : 'none'), { type: 'warning', message: `Bundle is missing a House Style template — using fallback.` }); }
  if (bundleJoined && bundleJoined.domain_pack && bundleJoined.domain_pack.prompt) layers.push(bundleJoined.domain_pack.prompt);
  if (bundleJoined && bundleJoined.deck_type && bundleJoined.deck_type.prompt) layers.push(bundleJoined.deck_type.prompt);
  if (slide) layers.push(`SLIDE-SPECIFIC CONTENT:\nTitle: ${slide.title}\n\nBody content / talking points:\n${slide.body || '(no body content provided)'}\n\nRender this slide visually with the title prominent and the body content represented as clear structured visual elements (panels, bullets, diagrams) — NOT as direct text overlays unless short labels.`);
  return layers.join('\n\n');
}
function composeBundlePromptPreview(bundleJoined) { return composeBundlePrompt(bundleJoined, null); }

// ─── PROVIDER ABSTRACTION ─────────────────────────────────────────────
function blobToBase64(blob) { return new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(',')[1]); fr.readAsDataURL(blob); }); }

async function generateImageWithProvider(providerKey, modelKey, qualityKey, fullPrompt) {
  switch (providerKey) {
    case 'openai': return await generateOpenAIImage(modelKey, qualityKey, fullPrompt);
    case 'google': return await generateGoogleImage(modelKey, fullPrompt);
    default: throw new Error(`Unknown provider: ${providerKey}`);
  }
}

async function generateOpenAIImage(model, quality, prompt) {
  const apiKey = (state.apiKeys.openai || '').trim();
  if (!apiKey) throw new Error('NO_OPENAI_KEY: Set OpenAI API key in Settings.');
  if (!apiKey.startsWith('sk-')) throw new Error('BAD_OPENAI_KEY: must start with sk-');
  const q = quality || state.imageQuality || 'high';
  const body = (model === 'gpt-image-2')
    ? { model, prompt, size: '1536x1024', quality: q, n: 1, output_format: 'jpeg' }
    : { model, prompt, size: '1536x1024', quality: q, n: 1 };
  const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
  const org = (state.apiKeys.openai_org || '').trim();
  if (org) headers['OpenAI-Organization'] = org;
  const resp = await fetch('https://api.openai.com/v1/images/generations', { method: 'POST', headers, body: JSON.stringify(body) });
  if (!resp.ok) { const t = await resp.text(); throw new Error(`OpenAI ${model} ${resp.status}: ${t.slice(0,300)}`); }
  const data = await resp.json();
  const item = data.data[0];
  if (item.b64_json) return item.b64_json;
  if (item.url) { const r2 = await fetch(item.url); const blob = await r2.blob(); return await blobToBase64(blob); }
  throw new Error('OpenAI response missing b64_json/url');
}

async function generateGoogleImage(model, prompt) {
  const apiKey = (state.apiKeys.gemini || '').trim();
  if (!apiKey) throw new Error('NO_GEMINI_KEY: Set Google Gemini API key in Settings.');
  if (model === 'imagen-3' || model === 'imagen-4') {
    const modelPath = model === 'imagen-3' ? 'imagen-3.0-generate-002' : 'imagen-4.0-generate-001';
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelPath}:predict?key=${encodeURIComponent(apiKey)}`;
    const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instances: [{ prompt }], parameters: { sampleCount: 1, aspectRatio: '16:9' } }) });
    if (!resp.ok) { const t = await resp.text(); throw new Error(`Google ${model} ${resp.status}: ${t.slice(0,300)}`); }
    const data = await resp.json();
    const pred = data.predictions && data.predictions[0];
    if (!pred || !pred.bytesBase64Encoded) throw new Error('Imagen response missing bytesBase64Encoded');
    return pred.bytesBase64Encoded;
  }
  if (model === 'gemini-2-flash') {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${encodeURIComponent(apiKey)}`;
    const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseModalities: ['TEXT', 'IMAGE'] } }) });
    if (!resp.ok) { const t = await resp.text(); throw new Error(`Gemini 2.0 Flash ${resp.status}: ${t.slice(0,300)}`); }
    const data = await resp.json();
    const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
    const imgPart = parts.find(p => p.inlineData && p.inlineData.data);
    if (!imgPart) throw new Error('Gemini 2.0 Flash returned no image');
    return imgPart.inlineData.data;
  }
  throw new Error(`Unknown Google model: ${model}`);
}

function modelLabel(provider, model, quality) {
  const row = imageCosts.find(c => c.provider === provider && c.model === model && (!quality || c.quality === quality));
  if (row && row.label) return row.label;
  return `${provider} / ${model}${quality ? ' (' + quality + ')' : ''}`;
}
function parseModelSpec(spec) {
  if (!spec) return null;
  const parts = spec.split(':');
  return { provider: parts[0], model: parts[1], quality: parts[2] || null };
}
function currentEffectiveModel() {
  return parseModelSpec(state.selectedModel || state.defaultModel) || { provider: 'openai', model: 'gpt-image-2', quality: 'high' };
}

// ─── SLIDE IMAGE GEN (uses currentEffectiveModel) ─────────────────────
async function generateSlideImage(slide, customPromptOverride, overrideSpec) {
  const bundle = state.selectedBundleId ? joinBundle(bundleById(state.selectedBundleId)) : null;
  const prompt = customPromptOverride || composeBundlePrompt(bundle, slide);
  const spec = overrideSpec || currentEffectiveModel();
  const b64 = await generateImageWithProvider(spec.provider, spec.model, spec.quality, prompt);
  const cost = getImageCost(spec.provider, spec.model, '1536x1024', spec.quality);
  return { b64, prompt, cost, spec };
}

async function generateAllImages() {
  const max = 3;
  let idx = 0;
  const total = state.slides.length;
  const workers = [];
  for (let w = 0; w < Math.min(max, total); w++) {
    workers.push((async () => {
      while (idx < total) {
        const myIdx = idx++;
        const slide = state.slides[myIdx];
        if (slide.status === 'done') continue;
        slide.status = 'generating'; slide.error = null;
        renderStep5Slides();
        try {
          const { b64, prompt, cost, spec } = await generateSlideImage(slide);
          slide.imageB64 = b64; slide.imagePrompt = prompt; slide.lastPrompt = prompt;
          slide.status = 'done'; slide.costAccrued = (slide.costAccrued || 0) + cost;
          slide.modelUsed = spec;
          deckCost.image += cost;
          deckCost.imageDetails.push({ ...spec, cost, kind: 'slide' });
          renderCostBadge();
        } catch (err) { slide.status = 'error'; slide.error = err.message || String(err); }
        renderStep5Slides();
      }
    })());
  }
  await Promise.all(workers);
}

async function regenerateOne(idx, newPrompt) {
  const slide = state.slides[idx];
  slide.status = 'generating'; slide.error = null;
  renderStep5Slides();
  try {
    const { b64, prompt, cost, spec } = await generateSlideImage(slide, newPrompt);
    slide.imageB64 = b64; slide.imagePrompt = prompt; slide.lastPrompt = prompt;
    slide.status = 'done'; slide.regenCount++;
    slide.costAccrued = (slide.costAccrued || 0) + cost;
    slide.modelUsed = spec;
    deckCost.image += cost;
    deckCost.imageDetails.push({ ...spec, cost, kind: 'regen' });
    renderCostBadge();
    toast({ type: 'success', message: `Slide ${idx+1} regenerated · ${fmtUsd(cost)}` });
  } catch (err) {
    slide.status = 'error'; slide.error = err.message || String(err);
    toast({ type: 'error', message: err.message });
  }
  renderStep5Slides();
}

async function loadDefaultLogo() {
  try {
    const r = await fetch(DEFAULT_LOGO_URL);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    return await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(',')[1]); fr.onerror = () => rej(new Error('FileReader failed')); fr.readAsDataURL(blob); });

// ─── PPTX ASSEMBLY ─────────────────────────────────────────────────────
async function assemblePptx() {
  if (!window.__pptxReady || typeof PptxGenJS === 'undefined') { toast({ type: 'error', message: 'PptxGenJS still loading — try again in a moment' }); return; }
  const prs = new PptxGenJS();
  prs.layout = 'LAYOUT_WIDE';
  const b = state.selectedBundleId ? bundleById(state.selectedBundleId) : null;
  const deckTitle = b ? b.name : 'DN Deck';
  prs.title = deckTitle; prs.subject = 'Digitata Networks Presentation'; prs.author = 'DN Deck Generator';
  const dnLogoB64 = state.logoB64;
  const customerLogoB64 = state.customerLogoEnabled ? state.customerLogoB64 : null;
  const showLogoBacking = !!state.logoBacking;
  const dnDims = dnLogoB64 ? await getImageDimensions(dnLogoB64) : null;
  const custDims = customerLogoB64 ? await getImageDimensions(customerLogoB64) : null;
  const LOGO_X_LEFT = 0.19, LOGO_Y = 0.17, LOGO_W = 1.69, LOGO_H_MAX = 0.75;
  const dnW = LOGO_W;
  const dnH = dnDims ? Math.min(LOGO_W * dnDims.aspect, LOGO_H_MAX) : 0.55;
  const custW = LOGO_W;
  const custH = custDims ? Math.min(LOGO_W * custDims.aspect, LOGO_H_MAX) : 0.55;
  const LOGO_X_RIGHT = 13.3 - LOGO_X_LEFT - custW;
  for (let i = 0; i < state.slides.length; i++) {
    const slide = state.slides[i];
    if (!slide.imageB64) continue;
    const s = prs.addSlide();
    s.addImage({ data: `data:image/jpeg;base64,${slide.imageB64}`, x: 0, y: 0, w: 13.3, h: 7.5 });
    if (showLogoBacking) {
      if (dnLogoB64) s.addShape(prs.ShapeType.roundRect, { x: LOGO_X_LEFT - 0.08, y: LOGO_Y - 0.06, w: dnW + 0.16, h: dnH + 0.12, fill: { color: '080C1A' }, line: { color: '080C1A', width: 0 }, rectRadius: 0.05 });
      if (customerLogoB64) s.addShape(prs.ShapeType.roundRect, { x: LOGO_X_RIGHT - 0.08, y: LOGO_Y - 0.06, w: custW + 0.16, h: custH + 0.12, fill: { color: '080C1A' }, line: { color: '080C1A', width: 0 }, rectRadius: 0.05 });
    }
    if (dnLogoB64) s.addImage({ data: `data:image/png;base64,${dnLogoB64}`, x: LOGO_X_LEFT, y: LOGO_Y, w: dnW, h: dnH });
    if (customerLogoB64) s.addImage({ data: `data:image/png;base64,${customerLogoB64}`, x: LOGO_X_RIGHT, y: LOGO_Y, w: custW, h: custH });
    s.addNotes(`${slide.title}\n\n${slide.body || ''}`);
  }
  const fileName = `${slugify(deckTitle)}-${dateStr()}.pptx`;
  const blob = await prs.write({ outputType: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showDeckReadyModal(fileName, blob.size);
  if (state.customerLogoB64) { state.customerLogoB64 = null; state.customerLogoEnabled = false; }
}

      if (!draft.name.trim() || !draft.prompt.trim()) { toast({ type: 'error', message: 'Name and prompt are required' }); return; }
      const now = nowIso(); const newId = uuid();
      const copy = { ...draft, id: newId, name: draft.name + ' (copy)', is_active: true, created_at: now, updated_at: now, updated_by: 'admin' };
      db.templates.push(copy); db.versions.push({ id: uuid(), template_id: newId, version_num: 1, prompt: copy.prompt, change_note: 'Copied from "' + (editing ? editing.name : 'new') + '"', updated_by: 'admin', created_at: now });
      toast({ type: 'success', message: 'Saved as new template' }); closeModal(); renderTemplates();
    };
  }
}
function deleteTemplate(id) {
  const t = templateById(id); if (!t) return;
  const used = bundlesUsingTemplate(id);
  if (used.length > 0) { openModal(`<div class="modal-header"><div><div class="h1">Cannot delete</div><div class="muted body-sm" style="margin-top:4px">Template is referenced by ${used.length} bundle${used.length===1?'':'s'}.</div></div></div><div class="warning-banner"><div><strong>${escapeHtml(t.name)}</strong> is in use by:<ul style="margin:6px 0 0 18px">${used.map(b => '<li>' + escapeHtml(b.name) + '</li>').join('')}</ul></div></div><div class="modal-footer"><button class="btn-primary" onclick="closeModal()">OK</button></div>`); return; }
  openModal(`<div class="modal-header"><div><div class="h1">Delete template?</div><div class="muted body-sm" style="margin-top:4px">Version history will also be deleted.</div></div></div><div class="danger-banner"><div><strong>${escapeHtml(t.name)}</strong> will be permanently removed.</div></div><div class="modal-footer"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-danger" id="confirmDelT">Delete</button></div>`);
  document.getElementById('confirmDelT').onclick = () => { db.templates = db.templates.filter(x => x.id !== id); db.versions = db.versions.filter(v => v.template_id !== id); toast({ type: 'success', message: 'Template deleted' }); closeModal(); renderTemplates(); };
}
function openVersions(id) {
  const t = templateById(id); if (!t) return;
  const versions = db.versions.filter(v => v.template_id === id).sort((a, b) => b.version_num - a.version_num);
  openModal(`<div class="modal-header"><div><div class="h1">Version history</div><div class="muted body-sm" style="margin-top:4px">${escapeHtml(t.name)} · ${versions.length} version${versions.length===1?'':'s'}</div></div><button class="btn-ghost" onclick="closeModal()" aria-label="Close">×</button></div><div style="max-height:520px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm)">${versions.map(v => `<div class="version-row"><div class="version-head"><span class="version-num">v${v.version_num}</span><span class="muted" style="font-size:12px">${escapeHtml((v.created_at||'').slice(0,16).replace('T',' '))}</span><span class="muted" style="font-size:12px">· ${escapeHtml(v.updated_by || 'unknown')}</span><span class="muted" style="font-size:12px">· ${escapeHtml(v.change_note || '')}</span><div style="margin-left:auto;display:flex;gap:4px"><button class="btn-ghost" data-act="vExpand" data-id="${v.id}">Expand</button>${state.adminMode ? `<button class="btn-secondary" data-act="vRestore" data-id="${v.id}">Restore</button>` : ''}</div></div><div id="vBody_${v.id}" style="display:none;margin-top:8px"><textarea class="textarea" readonly rows="10" style="font-size:11px">${escapeHtml(v.prompt)}</textarea></div><div id="vPreview_${v.id}" class="muted" style="font-size:12px;font-family:var(--mono);margin-top:4px">${escapeHtml(v.prompt.slice(0, 200))}${v.prompt.length>200?'…':''}</div></div>`).join('')}</div><div class="modal-footer"><button class="btn-primary" onclick="closeModal()">Close</button></div>`, { lg: true });
  document.querySelectorAll('[data-act="vExpand"]').forEach(el => el.onclick = () => { const vid = el.dataset.id; const body = document.getElementById('vBody_' + vid); const prev = document.getElementById('vPreview_' + vid); const showing = body.style.display !== 'none'; body.style.display = showing ? 'none' : 'block'; prev.style.display = showing ? 'block' : 'none'; el.textContent = showing ? 'Expand' : 'Collapse'; });
  document.querySelectorAll('[data-act="vRestore"]').forEach(el => el.onclick = () => { const vid = el.dataset.id; const v = db.versions.find(x => x.id === vid); if (!v) return; const tpl = templateById(v.template_id); if (!tpl) return; const now = nowIso(); tpl.prompt = v.prompt; tpl.updated_at = now; tpl.updated_by = 'admin'; db.versions.push({ id: uuid(), template_id: tpl.id, version_num: nextVersionNum(tpl.id), prompt: v.prompt, change_note: 'Restored from version ' + v.version_num, updated_by: 'admin', created_at: now }); toast({ type: 'success', message: 'Restored to v' + v.version_num }); closeModal(); renderTemplates(); });
}

// ═══════════════════════════════════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════════════════════════════════
function renderSettings() {
  const cont = document.getElementById('content');
  const oai = state.apiKeys.openai ? (state.apiKeys.openai.slice(0,7) + '…' + state.apiKeys.openai.slice(-4)) : '';
  const ant = state.apiKeys.anthropic ? (state.apiKeys.anthropic.slice(0,10) + '…' + state.apiKeys.anthropic.slice(-4)) : '';
  const gem = state.apiKeys.gemini ? (state.apiKeys.gemini.slice(0,6) + '…' + state.apiKeys.gemini.slice(-4)) : '';
  const defaultSpec = parseModelSpec(state.defaultModel) || { provider: 'openai', model: 'gpt-image-2', quality: 'high' };
  const defaultCost = getImageCost(defaultSpec.provider, defaultSpec.model, '1536x1024', defaultSpec.quality);
  cont.innerHTML = `
    <div style="margin-bottom:24px"><div class="eyebrow" style="margin-bottom:8px">Configuration</div><div class="display">Settings</div><div class="muted body-sm" style="margin-top:8px">API keys, models, costs, logos, admin mode. Settings live in memory only.</div></div>

    <div class="section"><div class="section-header"><div class="h1">Admin mode</div></div><div class="card"><div class="field"><label class="field-label" style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="adminChk" ${state.adminMode ? 'checked' : ''} style="margin:0"><span>Enable admin mode</span></label><div class="field-hint" style="margin-top:6px">When enabled: New / Edit / Delete on Templates and Bundles tabs.</div></div></div></div>

    <div class="section"><div class="section-header"><div class="h1">Image models &amp; cost</div></div><div class="card">
      <div class="field">
        <label class="field-label">Default image model <span class="subtle">used when skipping the comparison step</span></label>
        <select class="select" id="defaultModelSel">${imageCosts.filter(c => c.is_active).map(c => { const val = `${c.provider}:${c.model}:${c.quality}`; const label = `${c.label}  —  ${fmtUsd(c.cost_per_image)}/image`; return `<option value="${val}" ${state.defaultModel === val ? 'selected' : ''}>${escapeHtml(label)}</option>`; }).join('')}</select>
        <div class="field-hint" style="margin-top:6px">Cost at current selection: <strong>${fmtUsd(defaultCost)}</strong> per image · projected <strong>${fmtUsd(defaultCost * (state.slides.length || state.slideMax))}</strong> for a ${state.slides.length || state.slideMax}-slide deck.</div>
      </div>
      <div class="field">
        <label class="field-label">OpenAI image quality <span class="subtle">applies to gpt-image-* models only</span></label>
        <select class="select" id="qualitySel"><option value="low" ${state.imageQuality === 'low' ? 'selected' : ''}>Low</option><option value="medium" ${state.imageQuality === 'medium' ? 'selected' : ''}>Medium</option><option value="high" ${state.imageQuality === 'high' ? 'selected' : ''}>High</option></select>
      </div>
      <div class="field" style="margin-bottom:0">
        <label class="field-label" style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="skipPickerChk" ${state.skipModelPicker ? 'checked' : ''} style="margin:0"><span>Skip the model comparison step</span></label>
        <div class="field-hint" style="margin-top:6px">If checked, Compose goes straight from Edit → Generate using the default model above.</div>
      </div>
    </div></div>

    <div class="section"><div class="section-header"><div class="h1">Brand logo</div></div><div class="card">
      <div class="field">
        <label class="field-label">Logo image <span class="subtle">PNG with transparent background recommended</span></label>
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="logo-preview">${state.logoB64 ? `<img src="data:image/png;base64,${state.logoB64}" alt="logo preview">` : '<span class="subtle" style="color:#71717a;font-size:11px;font-family:var(--mono)">no logo</span>'}</div><div style="display:flex;gap:6px"><input type="file" id="logoFile" accept=".png,image/png" style="display:none"><button class="btn-secondary" id="uploadLogoBtn">Upload PNG</button>${state.logoIsCustom ? '<button class="btn-ghost" id="clearLogoBtn">Reset to default</button>' : ''}</div></div>
        <div class="field-hint" style="margin-top:10px">${state.logoB64 ? '<span class="badge badge-success" style="margin-left:0">' + (state.logoIsCustom ? 'Custom logo' : 'Default DN logo') + '</span>' : '<span class="badge badge-warning" style="margin-left:0">No logo loaded</span>'}</div>
      </div>
      <div class="field" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)"><label class="field-label" style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="logoBackingChk" ${state.logoBacking ? 'checked' : ''} style="margin:0"><span>Add dark backing panel behind logos in .pptx</span></label></div>
    </div></div>

    <div class="section"><div class="section-header"><div class="h1">Anthropic</div></div><div class="card"><div class="field"><label class="field-label">API key <span class="subtle">for AI polish</span></label><div class="api-key-row"><input class="input" id="anthropicKey" type="password" placeholder="sk-ant-..." value="${escapeHtml(state.apiKeys.anthropic)}" autocomplete="off"><button class="btn-secondary" id="saveAntBtn">Save</button>${state.apiKeys.anthropic ? '<button class="btn-ghost" id="clearAntBtn">Clear</button>' : ''}</div><div class="field-hint"><span class="mono">claude-sonnet-4-5</span> · ${state.apiKeys.anthropic ? 'Current: <span class="mono">' + escapeHtml(ant) + '</span>' : 'Not set.'}</div></div></div></div>

    <div class="section"><div class="section-header"><div class="h1">OpenAI</div></div><div class="card"><div class="field"><label class="field-label">API key <span class="subtle">for gpt-image-* models</span></label><div class="api-key-row"><input class="input" id="openaiKey" type="password" placeholder="sk-..." value="${escapeHtml(state.apiKeys.openai)}" autocomplete="off"><button class="btn-secondary" id="saveKeyBtn">Save</button>${state.apiKeys.openai ? '<button class="btn-ghost" id="clearKeyBtn">Clear</button>' : ''}</div><div class="field-hint">${state.apiKeys.openai ? 'Current: <span class="mono">' + escapeHtml(oai) + '</span>' : 'Not set.'}</div></div><div class="field"><label class="field-label">Organization ID <span class="subtle">optional</span></label><div class="api-key-row"><input class="input" id="openaiOrg" type="text" placeholder="org-..." value="${escapeHtml(state.apiKeys.openai_org)}" autocomplete="off"><button class="btn-secondary" id="saveOrgBtn">Save</button>${state.apiKeys.openai_org ? '<button class="btn-ghost" id="clearOrgBtn">Clear</button>' : ''}</div></div></div></div>

    <div class="section"><div class="section-header"><div class="h1">Google Gemini</div></div><div class="card"><div class="field"><label class="field-label">API key <span class="subtle">for Imagen 3, Imagen 4, Gemini 2.0 Flash</span></label><div class="api-key-row"><input class="input" id="geminiKey" type="password" placeholder="AIza..." value="${escapeHtml(state.apiKeys.gemini)}" autocomplete="off"><button class="btn-secondary" id="saveGemBtn">Save</button>${state.apiKeys.gemini ? '<button class="btn-ghost" id="clearGemBtn">Clear</button>' : ''}</div><div class="field-hint">Get a key at <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" style="color:var(--accent)">aistudio.google.com/app/apikey</a>. ${state.apiKeys.gemini ? 'Current: <span class="mono">' + escapeHtml(gem) + '</span>' : 'Not set.'}</div></div></div></div>

    <div class="section"><div class="section-header"><div class="h1">Cost table</div></div><div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Provider</th><th>Model</th><th>Size</th><th>Quality</th><th style="text-align:right">Per image</th></tr></thead><tbody>${imageCosts.filter(c => c.is_active).map(c => `<tr><td>${escapeHtml(c.provider)}</td><td class="mono">${escapeHtml(c.model)}</td><td class="mono muted">${escapeHtml(c.size)}</td><td>${escapeHtml(c.quality)}</td><td class="mono" style="text-align:right">${fmtUsd(c.cost_per_image)}</td></tr>`).join('')}</tbody></table></div><div class="field-hint" style="margin-top:8px">Editing cost rows in-UI is out of scope for #18 — admins update Supabase directly. Costs are seeded from <span class="mono">image_model_costs</span> + <span class="mono">anthropic_token_costs</span> tables.</div></div>

    <div class="section"><div class="section-header"><div class="h1">Runtime</div></div><div class="card"><dl class="kv"><dt>Version</dt><dd><span class="mono">2.1.0</span> (build #18 — real cost + Gemini + model comparison)</dd><dt>Polish model</dt><dd><span class="mono">claude-sonnet-4-5-20250929</span></dd><dt>Default image model</dt><dd><span class="mono">${escapeHtml(state.defaultModel)}</span></dd><dt>PPTX engine</dt><dd>PptxGenJS 3.12 (in-browser)</dd><dt>Templates</dt><dd>${db.templates.length} (${db.templates.filter(t=>t.layer==='house_style').length} HS · ${db.templates.filter(t=>t.layer==='domain_pack').length} DP · ${db.templates.filter(t=>t.layer==='deck_type').length} DT)</dd><dt>Bundles</dt><dd>${db.bundles.length}</dd><dt>Admin mode</dt><dd>${state.adminMode ? '<span class="badge badge-success">Enabled</span>' : '<span class="badge badge-neutral">Read-only</span>'}</dd></dl></div></div>`;
  document.getElementById('adminChk').onchange = e => { state.adminMode = e.target.checked; updateAdminBadge(); renderSettings(); };
  document.getElementById('defaultModelSel').onchange = e => { state.defaultModel = e.target.value; toast({ type: 'info', message: 'Default model updated' }); renderSettings(); };
  document.getElementById('qualitySel').onchange = e => { state.imageQuality = e.target.value; toast({ type: 'info', message: 'OpenAI quality: ' + state.imageQuality }); renderSettings(); };
  document.getElementById('skipPickerChk').onchange = e => { state.skipModelPicker = e.target.checked; toast({ type: 'info', message: e.target.checked ? 'Will skip model picker' : 'Will show model picker' }); };
  const lbChk = document.getElementById('logoBackingChk'); if (lbChk) lbChk.onchange = e => { state.logoBacking = e.target.checked; toast({ type: 'info', message: e.target.checked ? 'Logo backing enabled' : 'Logo backing disabled' }); };
  document.getElementById('uploadLogoBtn').onclick = () => document.getElementById('logoFile').click();
  document.getElementById('logoFile').onchange = e => { const file = e.target.files[0]; if (!file) return; if (!/png/i.test(file.type)) { toast({ type: 'error', message: 'PNG only' }); return; } const fr = new FileReader(); fr.onload = () => { state.logoB64 = fr.result.split(',')[1]; state.logoIsCustom = true; toast({ type: 'success', message: 'Logo uploaded' }); renderSettings(); }; fr.readAsDataURL(file); };
  const clrLogo = document.getElementById('clearLogoBtn'); if (clrLogo) clrLogo.onclick = async () => { state.logoIsCustom = false; state.logoB64 = await loadDefaultLogo(); toast({ type: 'info', message: 'Reset to default DN logo' }); renderSettings(); };
  document.getElementById('saveKeyBtn').onclick = () => { const v = (document.getElementById('openaiKey').value || '').trim(); if (!v) { toast({ type: 'error', message: 'Enter a key' }); return; } if (!v.startsWith('sk-')) { toast({ type: 'error', message: 'OpenAI key must start with sk-' }); return; } state.apiKeys.openai = v; toast({ type: 'success', message: `Saved · ends …${v.slice(-4)}` }); renderSettings(); };
  const ck = document.getElementById('clearKeyBtn'); if (ck) ck.onclick = () => { state.apiKeys.openai = ''; renderSettings(); toast({ type: 'info', message: 'Cleared' }); };
  document.getElementById('saveAntBtn').onclick = () => { const v = (document.getElementById('anthropicKey').value || '').trim(); if (!v) { toast({ type: 'error', message: 'Enter a key' }); return; } if (!v.startsWith('sk-ant-')) { toast({ type: 'error', message: 'Anthropic key must start with sk-ant-' }); return; } state.apiKeys.anthropic = v; toast({ type: 'success', message: `Saved · ends …${v.slice(-4)}` }); renderSettings(); };
  const ca = document.getElementById('clearAntBtn'); if (ca) ca.onclick = () => { state.apiKeys.anthropic = ''; renderSettings(); toast({ type: 'info', message: 'Cleared' }); };
  document.getElementById('saveGemBtn').onclick = () => { const v = (document.getElementById('geminiKey').value || '').trim(); if (!v) { toast({ type: 'error', message: 'Enter a key' }); return; } state.apiKeys.gemini = v; toast({ type: 'success', message: `Saved · ends …${v.slice(-4)}` }); renderSettings(); };
  const cg = document.getElementById('clearGemBtn'); if (cg) cg.onclick = () => { state.apiKeys.gemini = ''; renderSettings(); toast({ type: 'info', message: 'Cleared' }); };
  document.getElementById('saveOrgBtn').onclick = () => { state.apiKeys.openai_org = (document.getElementById('openaiOrg').value || '').trim(); toast({ type: 'success', message: 'Org saved' }); renderSettings(); };
  const co = document.getElementById('clearOrgBtn'); if (co) co.onclick = () => { state.apiKeys.openai_org = ''; renderSettings(); toast({ type: 'info', message: 'Cleared' }); };
}

// ═══════════════════════════════════════════════════════════════════════
// HEADER / ROUTING
// ═══════════════════════════════════════════════════════════════════════
function updateAdminBadge() {
  const el = document.getElementById('adminBadge'); if (!el) return;
  el.innerHTML = state.adminMode
    ? '<span class="badge badge-accent" style="cursor:pointer" id="adminBadgeBtn" title="Click to disable admin mode">Admin</span>'
    : '<span class="badge badge-neutral" style="cursor:pointer" id="adminBadgeBtn" title="Click to enable admin mode">Read-only</span>';
  const btn = document.getElementById('adminBadgeBtn');
  if (btn) btn.onclick = () => { state.adminMode = !state.adminMode; updateAdminBadge(); toast({ type: 'info', message: state.adminMode ? 'Admin mode enabled' : 'Admin mode disabled' }); if (state.view === 'templates') renderTemplates(); else if (state.view === 'bundles') renderBundles(); else if (state.view === 'settings') renderSettings(); };
}
function renderCostBadge() {
  const el = document.getElementById('costBadge'); if (!el) return;
  const total = deckCost.total();
  if (total <= 0) { el.innerHTML = ''; return; }
  el.innerHTML = `<span class="cost-badge" title="Polish ${fmtUsd4(deckCost.polish)} · Test images ${fmtUsd4(deckCost.testImage)} · Images ${fmtUsd4(deckCost.image)}">Deck cost <strong>${fmtUsd4(total)}</strong></span>`;
}

document.getElementById('themeToggle').addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = state.theme; });
function setActiveNav() { document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === state.view)); }
document.querySelectorAll('.nav-btn').forEach(b => { b.addEventListener('click', () => { state.view = b.dataset.view; setActiveNav(); render(); }); });
function render() {
  if (state.view === 'compose') renderCompose();
  else if (state.view === 'bundles') renderBundles();
  else if (state.view === 'templates') renderTemplates();
  else renderSettings();
  renderCostBadge();
}

seedIfEmpty();
updateAdminBadge();
render();
loadDefaultLogo().then(b => { if (b && !state.logoIsCustom) { state.logoB64 = b; console.log('Default DN logo loaded'); } else if (!b) { console.warn('Default logo unavailable — upload one in Settings'); } });
</script>
