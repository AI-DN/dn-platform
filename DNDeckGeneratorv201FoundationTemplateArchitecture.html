/* ===== Build #40 — premium UX refresh =====
   - Warm off-white surfaces, refined teal accent
   - Tighter type scale, sentence-case headings
   - Subtle elevation, focus rings, smoother transitions
   - All class names preserved for rendering-function compatibility */
:root {
  --bg: #fbfaf7;
  --surface: #ffffff;
  --surface-2: #f5f3ee;
  --surface-3: #ebe8e1;
  --text: #0f172a;
  --text-muted: #475569;
  --text-subtle: #94a3b8;
  --border: rgba(15,23,42,0.07);
  --border-strong: rgba(15,23,42,0.13);
  --accent: #0d9488;
  --accent-hover: #0f766e;
  --accent-strong: #134e4a;
  --accent-bg: rgba(13,148,136,0.09);
  --success: #047857; --success-bg: rgba(4,120,87,0.09);
  --warning: #b45309; --warning-bg: rgba(180,83,9,0.09);
  --danger:  #b91c1c; --danger-bg:  rgba(185,28,28,0.08);
  --info:    #1d4ed8; --info-bg:    rgba(29,78,216,0.07);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-1: 0 1px 2px rgba(15,23,42,0.04), 0 1px 1px rgba(15,23,42,0.03);
  --shadow-2: 0 4px 12px rgba(15,23,42,0.06), 0 2px 4px rgba(15,23,42,0.04);
  --ring: 0 0 0 3px rgba(13,148,136,0.18);
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
[data-theme="dark"] {
  --bg: #0a0e13;
  --surface: #131820;
  --surface-2: #1a2029;
  --surface-3: #232b36;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --text-subtle: #64748b;
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.13);
  --accent: #2dd4bf;
  --accent-hover: #5eead4;
  --accent-strong: #99f6e4;
  --accent-bg: rgba(45,212,191,0.12);
  --success: #34d399; --success-bg: rgba(52,211,153,0.12);
  --warning: #fbbf24; --warning-bg: rgba(251,191,36,0.10);
  --danger:  #f87171; --danger-bg:  rgba(248,113,113,0.10);
  --info:    #60a5fa; --info-bg:    rgba(96,165,250,0.10);
  --shadow-1: 0 1px 2px rgba(0,0,0,0.30), 0 1px 1px rgba(0,0,0,0.18);
  --shadow-2: 0 6px 18px rgba(0,0,0,0.40), 0 2px 4px rgba(0,0,0,0.22);
  --ring: 0 0 0 3px rgba(45,212,191,0.22);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px; line-height: 1.55; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font-variant-numeric: tabular-nums; font-feature-settings: 'ss01', 'cv11';
}
button, input, select, textarea { font-family: inherit; }
.app { display: flex; flex-direction: column; min-height: 100vh; }

/* ----- Header ----- */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px; border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.78); -webkit-backdrop-filter: saturate(140%) blur(8px); backdrop-filter: saturate(140%) blur(8px);
  position: sticky; top: 0; z-index: 50; gap: 16px;
}
[data-theme="dark"] .header { background: rgba(10,14,19,0.72); }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: var(--radius-md);
  background: var(--text); color: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-weight: 500; font-size: 11px; font-family: var(--mono); letter-spacing: 0.4px;
}
.brand-name { font-size: 14px; font-weight: 500; color: var(--text); letter-spacing: -0.005em; }
.brand-version { font-size: 10px; color: var(--text-muted); font-family: var(--mono); padding: 2px 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; letter-spacing: 0.02em; }
.nav { display: flex; gap: 4px; padding: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; }
.nav-btn { background: transparent; color: var(--text-muted); border: none; padding: 6px 14px; font-size: 13px; cursor: pointer; font-weight: 500; border-radius: 999px; transition: all 180ms cubic-bezier(.4,0,.2,1); font-family: inherit; }
.nav-btn:hover { color: var(--text); }
.nav-btn.active { color: var(--text); background: var(--surface); box-shadow: var(--shadow-1); }
.header-right { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  background: transparent; border: 1px solid transparent; color: var(--text-muted);
  width: 34px; height: 34px; border-radius: var(--radius-md);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 180ms cubic-bezier(.4,0,.2,1);
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.cost-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 12px; font-family: var(--mono); color: var(--text-muted);
}
.cost-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg);
}
.cost-badge strong { color: var(--text); font-weight: 500; }

/* ----- Layout ----- */
.main { flex: 1; display: flex; position: relative; }
.content { flex: 1; padding: 32px 36px 80px; max-width: none; margin: 0; width: 100%; }
.content.narrow { max-width: 1100px; margin: 0 auto; } /* Settings/Skills stay readable */

/* ----- Typography ----- */
.eyebrow, .caption {
  font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-muted);
}
.display { font-size: 32px; font-weight: 500; line-height: 1.15; color: var(--text); letter-spacing: -0.022em; }
.h1 { font-size: 20px; font-weight: 500; color: var(--text); letter-spacing: -0.012em; }
.h2 { font-size: 15px; font-weight: 500; color: var(--text); letter-spacing: -0.005em; }
.body-sm { font-size: 13px; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--text-muted); }
.subtle { color: var(--text-subtle); }

/* ----- Buttons ----- */
.btn-primary {
  background: var(--text); color: var(--bg); border: 1px solid var(--text);
  padding: 8px 14px; border-radius: var(--radius-md);
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: transform 120ms ease, opacity 120ms ease, background 180ms ease, border-color 180ms ease;
  font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary:hover { background: var(--text-muted); border-color: var(--text-muted); }
.btn-primary:active { transform: scale(0.985); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary.lg { padding: 10px 18px; font-size: 14px; }
.btn-primary.accent { background: var(--accent); border-color: var(--accent); color: white; }
.btn-primary.accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-secondary {
  background: var(--surface); color: var(--text); border: 1px solid var(--border-strong);
  padding: 8px 14px; border-radius: var(--radius-md);
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all 180ms cubic-bezier(.4,0,.2,1); font-family: inherit;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-secondary:hover { background: var(--surface-2); border-color: var(--text-subtle); box-shadow: var(--shadow-1); }
.btn-secondary:active { transform: scale(0.985); }
.btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-ghost {
  background: transparent; color: var(--text-muted); border: 1px solid transparent;
  padding: 7px 12px; border-radius: var(--radius-md);
  font-size: 13px; cursor: pointer; font-weight: 500;
  transition: all 160ms ease; font-family: inherit;
}
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-danger {
  background: transparent; color: var(--danger); border: 1px solid var(--border-strong);
  padding: 8px 14px; border-radius: var(--radius-md);
  font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
  transition: all 180ms ease;
}
.btn-danger:hover { background: var(--danger-bg); border-color: var(--danger); }

/* ----- Inputs ----- */
.input, .select, .textarea {
  background: var(--surface); border: 1px solid var(--border-strong); color: var(--text);
  padding: 9px 12px; border-radius: var(--radius-md);
  font-size: 13px; font-family: inherit; width: 100%;
  transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
}
.input:hover, .select:hover, .textarea:hover { border-color: var(--text-subtle); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
.input::placeholder, .textarea::placeholder { color: var(--text-subtle); }
.textarea { resize: vertical; min-height: 96px; line-height: 1.55; font-family: var(--mono); font-size: 12px; }
.textarea.prose { font-family: inherit; font-size: 13px; line-height: 1.6; }
.select { cursor: pointer; }

/* ----- Cards ----- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-1); }
.step-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  margin-bottom: 14px; box-shadow: var(--shadow-1);
  transition: box-shadow 200ms ease, border-color 200ms ease;
}
.step-card:hover { box-shadow: var(--shadow-2); }
.step-card.collapsed { background: var(--surface-2); box-shadow: none; }
.step-card.collapsed:hover { background: var(--surface); border-color: var(--border-strong); }
.step-card.future { opacity: 0.45; box-shadow: none; }
.step-header { padding: 16px 22px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); }
.step-card.collapsed .step-header { border-bottom: none; cursor: pointer; padding: 14px 22px; }
.step-num {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent-bg); display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500; color: var(--accent); font-family: var(--mono); flex-shrink: 0;
  letter-spacing: 0;
}
.step-num.done { background: var(--success-bg); color: var(--success); }
.step-title { font-size: 14px; font-weight: 500; color: var(--text); letter-spacing: -0.005em; }
.step-desc { font-size: 12px; color: var(--text-muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.step-body { padding: 22px; }

/* ----- Fields ----- */
.field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
.field-label { font-size: 12px; font-weight: 500; color: var(--text); display: flex; align-items: center; justify-content: space-between; letter-spacing: 0; }
.field-hint { font-size: 12px; color: var(--text-subtle); line-height: 1.5; }
.template-select { position: relative; }
.template-select .select { cursor: pointer; padding-right: 34px; appearance: none; -webkit-appearance: none; }
.template-select::after { content: ''; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--text-muted); border-bottom: 1.5px solid var(--text-muted); transform: translateY(-75%) rotate(45deg); pointer-events: none; }

/* ----- Badges ----- */
.badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; gap: 5px; letter-spacing: 0.005em; }
.badge-success  { background: var(--success-bg); color: var(--success); }
.badge-warning  { background: var(--warning-bg); color: var(--warning); }
.badge-danger   { background: var(--danger-bg);  color: var(--danger); }
.badge-info     { background: var(--info-bg);    color: var(--info); }
.badge-accent   { background: var(--accent-bg);  color: var(--accent-strong); }
[data-theme="dark"] .badge-accent { color: var(--accent); }
.badge-neutral  { background: var(--surface-2);  color: var(--text-muted); border: 1px solid var(--border); }

/* ----- Sync pill ----- */
.sync-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted); }
.sync-pill.ok   { background: var(--success-bg); color: var(--success); border-color: var(--success); }
.sync-pill.warn { background: var(--warning-bg); color: var(--warning); border-color: var(--warning); }
.sync-pill.err  { background: var(--danger-bg);  color: var(--danger);  border-color: var(--danger); }

/* ----- Toasts ----- */
.toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 200; pointer-events: none; }
.toast {
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md);
  padding: 12px 16px; font-size: 13px; display: flex; align-items: center; gap: 12px;
  min-width: 300px; max-width: 460px; pointer-events: auto; box-shadow: var(--shadow-2);
  animation: toast-in 240ms cubic-bezier(.4,0,.2,1);
}
.toast-icon { width: 16px; height: 16px; flex-shrink: 0; }
.toast-success { border-left: 3px solid var(--success); }
.toast-success .toast-icon { color: var(--success); }
.toast-error { border-left: 3px solid var(--danger); }
.toast-error .toast-icon { color: var(--danger); }
.toast-info { border-left: 3px solid var(--info); }
.toast-info .toast-icon { color: var(--info); }
.toast-body { flex: 1; color: var(--text); line-height: 1.4; }
.toast-close { background: transparent; border: none; cursor: pointer; color: var(--text-subtle); padding: 0; font-size: 18px; line-height: 1; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ----- Modals ----- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; animation: fade-in 180ms ease; }
.modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 24px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(15,23,42,0.18); animation: modal-in 220ms cubic-bezier(.4,0,.2,1); }
.modal-lg { max-width: 960px; }
.modal-xl { max-width: 1440px; }
.modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; gap: 16px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
@keyframes fade-in  { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

/* ----- Empty states ----- */
.empty { padding: 56px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty-icon { opacity: 0.18; width: 48px; height: 48px; color: var(--text); }
.empty-title { font-size: 15px; font-weight: 500; color: var(--text); }
.empty-desc { font-size: 13px; color: var(--text-muted); max-width: 320px; line-height: 1.6; }

/* ----- Spinner ----- */
.spinner { width: 13px; height: 13px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin 720ms linear infinite; display: inline-block; vertical-align: -2px; }
.spinner-lg { width: 24px; height: 24px; border-width: 2.5px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ----- Banners ----- */
.warning-banner { padding: 12px 16px; background: var(--warning-bg); border: 1px solid var(--warning); border-radius: var(--radius-md); color: var(--warning); font-size: 13px; margin-bottom: 16px; display: flex; gap: 12px; align-items: flex-start; line-height: 1.55; }
.info-banner    { padding: 12px 16px; background: var(--info-bg);    border: 1px solid var(--info);    border-radius: var(--radius-md); color: var(--info);    font-size: 13px; margin-bottom: 16px; display: flex; gap: 12px; align-items: flex-start; line-height: 1.55; }
.danger-banner  { padding: 12px 16px; background: var(--danger-bg);  border: 1px solid var(--danger);  border-radius: var(--radius-md); color: var(--danger);  font-size: 13px; margin-bottom: 16px; display: flex; gap: 12px; align-items: flex-start; line-height: 1.55; }

/* ----- Misc ----- */
.api-key-row { display: flex; gap: 8px; align-items: center; }
.api-key-row .input { flex: 1; font-family: var(--mono); font-size: 12px; }
.section { margin-bottom: 32px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
.kv { display: grid; grid-template-columns: 180px 1fr; gap: 10px 16px; font-size: 13px; }
.kv dt { color: var(--text-muted); font-size: 12px; font-weight: 500; }
.kv dd { color: var(--text); word-break: break-word; }

/* ----- Slide edit card ----- */
.slide-edit-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow-1);
  transition: box-shadow 180ms ease, border-color 180ms ease;
}
.slide-edit-card:hover { box-shadow: var(--shadow-2); }
.slide-edit-card.dragging { opacity: 0.5; cursor: grabbing; }
.slide-edit-card.drag-over { border: 1.5px dashed var(--accent); background: var(--accent-bg); }
.drag-handle { cursor: grab; opacity: 0.4; transition: opacity 160ms ease; display: inline-flex; align-items: center; color: var(--text-muted); padding: 2px 4px; user-select: none; }
.drag-handle:hover { opacity: 1; }
.drag-handle:active { cursor: grabbing; }
.slide-edit-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.slide-edit-num { font-family: var(--mono); font-size: 11px; color: var(--text-muted); background: var(--surface-2); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); letter-spacing: 0.02em; }
.slide-edit-actions { margin-left: auto; display: flex; gap: 4px; }
.icon-btn-sm { background: transparent; border: 1px solid transparent; color: var(--text-muted); width: 26px; height: 26px; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 160ms ease; }
.icon-btn-sm:hover { background: var(--surface-2); color: var(--text); }
.icon-btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }

/* ----- Slide image card ----- */
.slide-img-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 14px; box-shadow: var(--shadow-1); }
.slide-img-head { padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.slide-img-title { font-size: 13px; font-weight: 500; color: var(--text); flex: 1; letter-spacing: -0.005em; }
.slide-img-body { display: grid; grid-template-columns: 420px 1fr; gap: 0; }
@media (max-width: 800px) { .slide-img-body { grid-template-columns: 1fr; } }
.slide-img-thumb { aspect-ratio: 16/10.67; background: var(--surface-2); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; border-right: 1px solid var(--border); }
.slide-img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slide-img-thumb.loading { cursor: default; }
.slide-img-thumb .placeholder { color: var(--text-subtle); font-size: 12px; font-family: var(--mono); text-align: center; padding: 16px; }
.slide-img-thumb .err { color: var(--danger); font-size: 12px; font-family: var(--mono); text-align: center; padding: 16px; }
.slide-img-controls { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.refine-section { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 6px; }
.refine-toggle { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; font-weight: 500; padding: 0; display: flex; align-items: center; gap: 4px; font-family: inherit; }
.refine-toggle:hover { color: var(--text); }
.lightbox-img { max-width: 100%; max-height: 72vh; display: block; margin: 0 auto; border-radius: var(--radius-md); }

/* ----- Logo ----- */
.logo-preview { width: 220px; min-height: 54px; max-height: 110px; background: #0a0e1a; border: 1px solid var(--border); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: flex-start; padding: 10px 14px; overflow: hidden; }
.logo-preview img { max-width: 100%; max-height: 90px; width: auto; height: auto; object-fit: contain; object-position: left center; display: block; }

/* ----- Tables ----- */
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
thead th { text-align: left; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); padding: 10px 14px; border-bottom: 1px solid var(--border); }
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }

.composed-preview { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; font-family: var(--mono); font-size: 11px; line-height: 1.6; color: var(--text-muted); max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
.range-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ----- Model cards ----- */

.model-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow-2); }
.model-card.disabled { opacity: 0.55; }
.model-card-head { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.model-card-title { font-size: 13px; font-weight: 500; color: var(--text); flex: 1; }

.model-card-thumb img { width: 100%; height: 100%; object-fit: cover; }
.model-card-thumb .placeholder { color: var(--text-subtle); font-size: 11px; font-family: var(--mono); text-align: center; padding: 12px; }

.model-card-cost strong { color: var(--text); font-weight: 500; }

/* ----- Skills ----- */
.skill-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); margin-bottom: 8px; transition: all 160ms ease; }
.skill-row:hover { background: var(--surface-2); border-color: var(--border-strong); box-shadow: var(--shadow-1); }

/* ----- Subtle scrollbar ----- */

::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; border: 3px solid var(--bg); }

  setItem(k, v) {

async function bootstrapSettings() {
  try {
    const sb = getSupabaseClient();
    if (!sb) return;
    syncState.status = 'syncing';
    const { data, error } = await sb.from('user_settings').select('setting_key, setting_value').eq('owner', OWNER_ID);

function parseSlidesDetected(text) {
  if (!text || !text.trim()) return { slides: [], pattern: null };
  const lines = text.split(/\r?\n/);
  function buildChunks(markers) {
    const chunks = [];
    for (let i = 0; i < markers.length; i++) {
      const cur = markers[i]; const next = markers[i+1];
      const bodyLines = lines.slice(cur.idx + 1, next ? next.idx : lines.length);
      let title = (cur.title || '').replace(/^Slide\s+\d+\s*[—–:\-\.]?\s*/i, '').trim();
      if (!title) {
        for (let j = 0; j < bodyLines.length; j++) {
          const l = bodyLines[j].trim();
          if (!l) continue;
          if (/^title$/i.test(l)) continue;
          title = l.replace(/^#+\s*/, ''); bodyLines.splice(j, 1); break;
        }
      }
      while (bodyLines.length && /^\s*title\s*$/i.test(bodyLines[0])) bodyLines.shift();
      chunks.push({ title: title || ('Slide ' + (i+1)), bodyLines });
    }
    return chunks;
  }
  let chunks = []; let pattern = null;
  const h1Re = /^#\s+(.+?)\s*$/;
  const h1Markers = [];
  lines.forEach((line, idx) => { const m = line.match(h1Re); if (m) h1Markers.push({ idx, title: (m[1] || '').trim() }); });
  if (h1Markers.length >= 2) { pattern = 'h1'; chunks = buildChunks(h1Markers); }
  else {
    const slideNRe = /^\s*Slide\s+\d+\s*[—–:\-\.]?\s*(.*)$/i;
    const slideNMarkers = [];
    lines.forEach((line, idx) => { const m = line.match(slideNRe); if (m) slideNMarkers.push({ idx, title: (m[1] || '').trim() }); });
    if (slideNMarkers.length >= 2) { pattern = 'slide_n'; chunks = buildChunks(slideNMarkers); }
    else {
      const h2Re = /^##\s+(.+?)\s*$/;
      const h2Markers = [];
      lines.forEach((line, idx) => { const m = line.match(h2Re); if (m) h2Markers.push({ idx, title: (m[1] || '').trim() }); });
      if (h2Markers.length >= 2) { pattern = 'h2'; chunks = buildChunks(h2Markers); }
      else if (/^\s*---\s*$/m.test(text)) {
        pattern = 'hr';
        const segments = text.split(/^\s*---\s*$/m).map(s => s.trim()).filter(Boolean);
        chunks = segments.map((seg, i) => {
          const segLines = seg.split(/\r?\n/);
          const firstNonEmpty = segLines.findIndex(l => l.trim().length > 0);
          const title = firstNonEmpty >= 0 ? segLines[firstNonEmpty].replace(/^#+\s*/, '').replace(/^Slide\s+\d+[:.]?\s*/i, '').trim() : `Slide ${i+1}`;
          const bodyLines = firstNonEmpty >= 0 ? segLines.slice(firstNonEmpty + 1) : [];
          return { title: title || `Slide ${i+1}`, bodyLines };
        });
      } else return { slides: null, pattern: null };
    }
  }
  const slides = chunks.map(c => ({ title: c.title, body: c.bodyLines.join('\n').trim(), speakerNotes: '', prevSpeakerNotes: null, notesExpanded: false, rewritingNotes: false, imageB64: null, imagePrompt: null, lastPrompt: null, status: 'idle', error: null, regenCount: 0, costAccrued: 0, modelUsed: null }));
  return { slides, pattern };
}

async function polishWithClaude(_unused, mode) {
  const key = (state.apiKeys.anthropic || '').trim();
  if (!key) throw new Error('NO_ANTHROPIC_KEY: Set Anthropic API key in Settings.');
  const rawText = state.rawText || '';
  const min = state.slideMin, max = state.slideMax;
  const target = Math.round((min + max) / 2);
  const modeInstruction = {
    shorten: 'Aggressively shorten each slide.',
    expand:  'Expand each slide with supporting bullets.',
    preserve:'Preserve the wording where reasonable.',
    split:   'Split this raw text into a logical slide deck.'
  }[mode] || 'Reshape the input into a clean slide deck.';
  // Build #35 — detect volume mismatch so the LLM gets explicit guidance
  const rawDetectedCount = (() => { try { const r = parseSlidesDetected(rawText); return r && r.slides ? r.slides.length : null; } catch (e) { return null; } })();
  const volumeNote = rawDetectedCount === null ? '' : (rawDetectedCount > max ? `The raw input contains roughly ${rawDetectedCount} slide-units of content - that is MORE than fits in ${max} slides. You MUST aggressively consolidate: merge related points, drop secondary detail, keep only the highest-signal ideas.` : rawDetectedCount < min ? `The raw input contains roughly ${rawDetectedCount} slide-units of content - that is LESS than fits in ${min} slides. You MUST expand thoughtfully: add reasoning, examples, implications. Do not invent unrelated claims.` : `The raw input naturally fits the ${min}-${max} range - shape it cleanly without distorting count.`);
  const baseSystem = `You are a presentation editor for Digitata Networks.\n\nHARD CONSTRAINT - slide count: You MUST return between ${min} and ${max} slides. Aim for ${target}. This is non-negotiable. If you return outside this range, the output will be rejected and retried.\n\n${volumeNote}\n\nHOW TO HIT THE COUNT regardless of source volume:\n- If the source has MORE content than fits in ${max} slides: AGGRESSIVELY CONSOLIDATE. Merge, drop secondary detail, keep only the strongest ideas.\n- If the source has LESS than ${min} slides need: EXPAND thoughtfully. Add reasoning, examples, implications. Do not invent unrelated claims.\n- If it fits naturally: shape it cleanly.\n\nMode: ${mode}\nInstruction: ${modeInstruction}\n\nReturn ONLY valid JSON, no markdown fences:\n{"slides":[{"title":"...","body":"..."}]}`;
  const userPrompt = `Produce between ${min} and ${max} slides (target ${target}). Slide count compliance is mandatory - consolidate or expand as instructed.\n\nRAW:\n${rawText}`;
  const modelName = 'claude-sonnet-4-5-20250929';
  async function callClaude(sys) {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: modelName, max_tokens: 4000, system: sys, messages: [{ role: 'user', content: userPrompt }] })
    });
    if (!resp.ok) { const err = await resp.text(); throw new Error(`Claude ${resp.status}: ${err.slice(0,300)}`); }
    const data = await resp.json();
    if (data.usage) { const cost = getAnthropicCost(modelName, data.usage.input_tokens || 0, data.usage.output_tokens || 0); deckCost.polish += cost; renderCostBadge(); }
    const raw = data.content[0].text;
    return JSON.parse(raw.replace(/```json|```/g, '').trim()).slides || [];
  }
  let attempt = 0; let lastSlides = null;
  while (attempt < 3) {
    attempt++;
    const sys = attempt === 1 ? baseSystem : `${baseSystem}\n\nPREVIOUS ATTEMPT RETURNED ${lastSlides ? lastSlides.length : '?'} SLIDES. Must be ${min}–${max}.`;
    let result;
    try { result = await callClaude(sys); } catch (e) { if (attempt >= 3) throw e; continue; }
    lastSlides = result;
    const n = result.length;
    if (n >= min && n <= max) return result;
    if (attempt >= 3) { toast({ type: 'warning', message: `AI returned ${n} slides (target ${min}–${max}).` }); return result; }
  }
  throw new Error('Polish failed');
}

  }
}

async function generateOpenAIImage(model, quality, prompt) {
  const apiKey = (state.apiKeys.openai || '').trim();
  if (!apiKey) throw new Error('NO_OPENAI_KEY: Set OpenAI API key in Settings.');
  if (!apiKey.startsWith('sk-')) throw new Error('BAD_OPENAI_KEY: must start with sk-');
  const q = quality || state.imageQuality || 'high';
  const body = (model === 'gpt-image-2')
    ? { model, prompt, size: '1536x1024', quality: q, n: 1, output_format: 'jpeg' }
    : { model, prompt, size: '1536x1024', quality: q, n: 1 };
  const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
  const org = (state.apiKeys.openai_org || '').trim();
  if (org) headers['OpenAI-Organization'] = org;
  const resp = await fetch('https://api.openai.com/v1/images/generations', { method: 'POST', headers, body: JSON.stringify(body) });
  if (!resp.ok) { const t = await resp.text(); throw new Error(`OpenAI ${model} ${resp.status}: ${t.slice(0,300)}`); }
  const data = await resp.json();
  const item = data.data[0];
  if (item.b64_json) return item.b64_json;
  if (item.url) { const r2 = await fetch(item.url); const blob = await r2.blob(); return await blobToBase64(blob); }
  throw new Error('OpenAI response missing b64_json/url');
}

async function generateGoogleImage(model, prompt) {
  const apiKey = (state.apiKeys.gemini || '').trim();
  if (!apiKey) throw new Error('NO_GEMINI_KEY: Set Gemini API key in Settings.');
  const MODEL_ROUTE = {
    'imagen-4-fast':           { id: 'imagen-4.0-fast-generate-001',       kind: 'imagen' },
    'imagen-4':                { id: 'imagen-4.0-generate-001',            kind: 'imagen' },
    'imagen-4-ultra':          { id: 'imagen-4.0-ultra-generate-001',      kind: 'imagen' },
    'gemini-2.5-flash-image':  { id: 'gemini-2.5-flash-image',             kind: 'gemini' },
    'gemini-3-flash-image':    { id: 'gemini-3.1-flash-image-preview',     kind: 'gemini' },
    'gemini-3-pro-image':      { id: 'gemini-3-pro-image-preview',         kind: 'gemini' }
  };
  const route = MODEL_ROUTE[model];
  if (!route) throw new Error(`Unknown Google model: ${model}`);
  if (route.kind === 'imagen') {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${route.id}:predict?key=${encodeURIComponent(apiKey)}`;
    const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instances: [{ prompt }], parameters: { sampleCount: 1, aspectRatio: '16:9' } }) });
    if (!resp.ok) { const errText = await resp.text(); throw new Error(`Google ${route.id} ${resp.status}: ${errText.slice(0,500)}`); }
    const data = await resp.json();
    const pred = data.predictions && data.predictions[0];
    if (!pred || !pred.bytesBase64Encoded) throw new Error(`${route.id} response missing bytesBase64Encoded`);
    return pred.bytesBase64Encoded;
  }
  if (route.kind === 'gemini') {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${route.id}:generateContent?key=${encodeURIComponent(apiKey)}`;
    const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseModalities: ['TEXT', 'IMAGE'] } }) });
    if (!resp.ok) { const errText = await resp.text(); throw new Error(`Google ${route.id} ${resp.status}: ${errText.slice(0,500)}`); }
    const data = await resp.json();
    const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
    const imgPart = parts.find(p => p.inlineData && p.inlineData.data);
    if (!imgPart) throw new Error(`${route.id} returned no image`);
    return imgPart.inlineData.data;
  }
  throw new Error(`Unhandled route kind: ${route.kind}`);
}

function modelLabel(provider, model, quality) {
  const row = allImageModels.find(c => c.provider === provider && c.model === model && (!quality || c.quality === quality));
  if (row && (row.label || row.display_name)) return row.label || row.display_name;
  return `${provider} / ${model}${quality ? ' (' + quality + ')' : ''}`;
}
function parseModelSpec(spec) { if (!spec) return null; const parts = spec.split(':'); return { provider: parts[0], model: parts[1], quality: parts[2] || null }; }
function currentEffectiveModel() { return parseModelSpec(state.selectedModel || state.defaultModel) || { provider: 'openai', model: 'gpt-image-2', quality: 'high' }; }

async function generateSlideImage(slide, customPromptOverride, overrideSpec) {
  const skill = state.selectedSkillId ? skillById(state.selectedSkillId) : null;

  const spec = overrideSpec || currentEffectiveModel();
  const b64 = await generateImageWithProvider(spec.provider, spec.model, spec.quality, prompt);
  const cost = getImageCost(spec.provider, spec.model, '1536x1024', spec.quality);
  return { b64, prompt, cost, spec };
}

async function generateAllImages() {
  const max = 3;
  let idx = 0;
  const total = state.slides.length;
  const workers = [];
  for (let w = 0; w < Math.min(max, total); w++) {
    workers.push((async () => {
      while (idx < total) {
        const myIdx = idx++;
        const slide = state.slides[myIdx];
        if (slide.status === 'done') continue;
        slide.status = 'generating'; slide.error = null;
        renderStep5Slides();
        try {
          const { b64, prompt, cost, spec } = await generateSlideImage(slide);
          slide.imageB64 = b64; slide.imagePrompt = prompt; slide.lastPrompt = prompt;
          slide.status = 'done'; slide.costAccrued = (slide.costAccrued || 0) + cost; slide.modelUsed = spec;
          deckCost.image += cost;
          deckCost.imageDetails.push({ ...spec, cost, kind: 'slide' });
          renderCostBadge();
        } catch (err) { slide.status = 'error'; slide.error = err.message || String(err); }
        renderStep5Slides();
      }
    })());
  }
  await Promise.all(workers);
}

async function regenerateOne(idx, newPrompt) {
  const slide = state.slides[idx];
  slide.status = 'generating'; slide.error = null;
  renderStep5Slides();
  try {
    const { b64, prompt, cost, spec } = await generateSlideImage(slide, newPrompt);
    slide.imageB64 = b64; slide.imagePrompt = prompt; slide.lastPrompt = prompt;
    slide.status = 'done'; slide.regenCount++;
    slide.costAccrued = (slide.costAccrued || 0) + cost; slide.modelUsed = spec;

  } catch (err) { slide.status = 'error'; slide.error = err.message || String(err); toast({ type: 'error', message: err.message }); }
  renderStep5Slides();
}

async function assemblePptx() {
  if (!window.__pptxReady || typeof PptxGenJS === 'undefined') { toast({ type: 'error', message: 'PptxGenJS still loading' }); return; }
  const prs = new PptxGenJS();
  prs.layout = 'LAYOUT_WIDE';
  const skill = state.selectedSkillId ? skillById(state.selectedSkillId) : null;
  // Build #46 — file name from the deck\'s actual theme (first slide title), not the skill
  const firstSlideTitle = (state.slides[0] && state.slides[0].title || '').trim();
  const deckThemeTitle = firstSlideTitle && firstSlideTitle.toLowerCase() !== 'title' && firstSlideTitle.toLowerCase() !== 'untitled'
    ? firstSlideTitle
    : (skill ? skill.name : 'DN Deck');
  const deckTitle = deckThemeTitle;
  prs.title = deckTitle; prs.subject = 'Digitata Networks'; prs.author = 'DN Deck Generator';
  const dnLogoB64 = state.logoB64;
  // Build #43 — resolve selected customer logo from brand library
  if (state.deckCustomerLogoId) {
    const sel = brandLibLogoById(state.deckCustomerLogoId);
    if (sel) { state.customerLogoB64 = sel.b64; state.customerLogoEnabled = true; }
  }
  const customerLogoB64 = state.customerLogoEnabled ? state.customerLogoB64 : null;
  const showLogoBacking = !!state.logoBacking;
  const dnDims = dnLogoB64 ? await getImageDimensions(dnLogoB64) : null;
  const custDims = customerLogoB64 ? await getImageDimensions(customerLogoB64) : null;
  const LOGO_X_LEFT = 0.19, LOGO_Y = 0.17, LOGO_W = 1.69, LOGO_H_MAX = 0.75;
  const dnW = LOGO_W;
  const dnH = dnDims ? Math.min(LOGO_W * dnDims.aspect, LOGO_H_MAX) : 0.55;
  const custW = LOGO_W;
  const custH = custDims ? Math.min(LOGO_W * custDims.aspect, LOGO_H_MAX) : 0.55;
  const LOGO_X_RIGHT = 13.3 - LOGO_X_LEFT - custW;
  for (let i = 0; i < state.slides.length; i++) {
    const slide = state.slides[i];
    if (!slide.imageB64) continue;
    const s = prs.addSlide();
    s.addImage({ data: `data:image/jpeg;base64,${slide.imageB64}`, x: 0, y: 0, w: 13.3, h: 7.5 });
    if (showLogoBacking) {
      if (dnLogoB64) s.addShape(prs.ShapeType.roundRect, { x: LOGO_X_LEFT - 0.08, y: LOGO_Y - 0.06, w: dnW + 0.16, h: dnH + 0.12, fill: { color: '080C1A' }, line: { color: '080C1A', width: 0 }, rectRadius: 0.05 });
      if (customerLogoB64) s.addShape(prs.ShapeType.roundRect, { x: LOGO_X_RIGHT - 0.08, y: LOGO_Y - 0.06, w: custW + 0.16, h: custH + 0.12, fill: { color: '080C1A' }, line: { color: '080C1A', width: 0 }, rectRadius: 0.05 });
    }
    if (dnLogoB64) s.addImage({ data: `data:image/png;base64,${dnLogoB64}`, x: LOGO_X_LEFT, y: LOGO_Y, w: dnW, h: dnH });
    if (customerLogoB64) s.addImage({ data: `data:image/png;base64,${customerLogoB64}`, x: LOGO_X_RIGHT, y: LOGO_Y, w: custW, h: custH });
    const footerColor = getFooterColor(skill);
    // Build #43 — append selected footer subtext if set
    let footerText = getFooterText();
    if (state.deckSubtextId) {
      const sub = brandLibSubtextById(state.deckSubtextId);
      if (sub && sub.text) footerText = sub.text + '  ·  ' + footerText;
    }
    s.addText(footerText, { x: 0.5, y: 7.15, w: 12.3, h: 0.3, fontSize: 9, fontFace: 'Arial', color: footerColor, align: 'center', bold: false });
    const notesText = (slide.speakerNotes && slide.speakerNotes.trim()) ? slide.speakerNotes : (slide.body || '');
    if (notesText && notesText.trim()) s.addNotes(notesText);
  }
  const fileName = `${slugify(deckTitle)}-${dateStr()}.pptx`;
  const blob = await prs.write({ outputType: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  if (state.whitePaper.deckTitle !== deckTitle) {
    state.whitePaper.deckTitle = deckTitle;
    state.whitePaper.data = null;
    state.whitePaper.blob = null;
    state.whitePaper.status = 'idle';
    state.whitePaper.error = null;
    state.whitePaper.cost = 0;
    state.whitePaper.illustCost = 0;
    state.whitePaper.statusMsg = '';
    state.whitePaper.figuresTotal = 0;
    state.whitePaper.figuresDone = 0;
    state.whitePaper.illustTotal = 0;
    state.whitePaper.illustDone = 0;
    state.whitePaper.awaitingConfirm = false;
    state.whitePaper.includeIllustrations = true;
    state.whitePaper.awaitingPageCount = true;
  }
  // Build #37 — persist completed deck so the user can reload later (skips Steps 1-3)
  try { await saveCurrentDeckToSupabase(); } catch (e) { console.warn('Deck auto-save failed (non-fatal):', e); }
  showDeckReadyModal(fileName, blob.size);
  if (state.customerLogoB64) { state.customerLogoB64 = null; state.customerLogoEnabled = false; }
}

  // Build #42 — range inputs: live update + smart consolidation preview
  function recomputeWpPreview() {
    const pMin = state.whitePaper.targetPagesMin || 6;

    state.whitePaper.targetPages = pMid;

    const numSlides = state.slides.length || 1;
    const perSlideBudgetIfAll = Math.round((wordTotalMid * 0.65) / numSlides);
    const idealBodyWords = 180;
    const numBodySections = perSlideBudgetIfAll < idealBodyWords
      ? Math.max(2, Math.min(numSlides, Math.floor((wordTotalMid * 0.65) / idealBodyWords)))
      : numSlides;
    const consolidationNote = numBodySections < numSlides
      ? 'Your ' + numSlides + ' slides will be grouped into <strong>' + numBodySections + ' themed sections</strong> (each ~' + Math.round((wordTotalMid * 0.65) / numBodySections) + ' words) to fit the page budget.'
      : 'One section per slide — <strong>' + numSlides + ' body sections</strong> (each ~' + Math.round((wordTotalMid * 0.65) / numSlides) + ' words).';
    let depthLabel;
    if (pMax <= 5) depthLabel = 'Short brief';
    else if (pMax <= 12) depthLabel = 'Standard white paper';
    else if (pMax <= 25) depthLabel = 'Long-form analysis';
    else depthLabel = 'Comprehensive treatise';
    const badge = document.getElementById('wpDepthBadge'); if (badge) badge.textContent = depthLabel;
    const sum = document.getElementById('wpRangeSummary'); if (sum) sum.textContent = 'target ' + pMin + '–' + pMax + ' pages · ' + wordTotalMid.toLocaleString() + ' words mid';
    const note = document.getElementById('wpConsolidationNote'); if (note) note.innerHTML = consolidationNote;
  }
  const pMinInput = document.getElementById('wpPagesMin');
  if (pMinInput) pMinInput.oninput = e => {
    let v = parseInt(e.target.value); if (isNaN(v)) return;
    v = Math.max(1, Math.min(50, v));

    if (v > state.whitePaper.targetPagesMax) { state.whitePaper.targetPagesMax = v; const mx = document.getElementById('wpPagesMax'); if (mx) mx.value = v; }

  };
  const pMaxInput = document.getElementById('wpPagesMax');
  if (pMaxInput) pMaxInput.oninput = e => {
    let v = parseInt(e.target.value); if (isNaN(v)) return;
    v = Math.max(1, Math.min(50, v));
    state.whitePaper.targetPagesMax = v;
    if (v < state.whitePaper.targetPagesMin) { state.whitePaper.targetPagesMin = v; const mn = document.getElementById('wpPagesMin'); if (mn) mn.value = v; }
    recomputeWpPreview();
  };
  const startGen = document.getElementById('wpStartGenBtn');
  if (startGen) startGen.onclick = () => {

    const pMax = state.whitePaper.targetPagesMax || 10;

    state.whitePaper.awaitingPageCount = false;
    generateWhitePaper();
  };

  };

  if (skipIllust) skipIllust.onclick = () => { state.whitePaper.includeIllustrations = false; state.whitePaper.awaitingConfirm = false; continueWhitePaperBuild(); };
  const cancelBtn = document.getElementById('wpCancelBtn');
  if (cancelBtn) cancelBtn.onclick = () => {

    state.whitePaper.data = null;

function slideImageToPngBytes(b64) {
  const binStr = atob(b64);
  const bytes = new Uint8Array(binStr.length);
  for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
  return bytes;
}

async function attachSlideImageFigures(paper) {
  const sections = paper.sections || [];
  for (const sec of sections) {
    if (!sec.figure) continue;
    if (sec.figure.type === 'slide_image') {
      const idx = sec.figure.slideIndex;
      if (typeof idx !== 'number' || idx < 0 || idx >= state.slides.length) {
        sec.figure.renderError = 'Invalid slideIndex ' + idx;
        continue;
      }
      const src = state.slides[idx];
      if (!src || !src.imageB64) {
        sec.figure.renderError = 'Slide ' + idx + ' has no image';
        continue;
      }
      try {
        sec.figure.pngBytes = slideImageToPngBytes(src.imageB64);
        sec.figure.pngWidth = 1536;
        sec.figure.pngHeight = 1024;
      } catch (e) { sec.figure.renderError = e.message || String(e); }
    } else if (sec.figure.type === 'illustration') {
      // Defensive: demote any illustrations to null (should not be requested in this version)
      sec.figure = null;
    }
  }
}

function injectSvgDimensions(svgString, targetWidth) {
  const vbMatch = svgString.match(/viewBox\s*=\s*["']([^"']+)["']/i);
  let aspectRatio = 0.75;
  if (vbMatch) {
    const parts = vbMatch[1].split(/[\s,]+/).map(Number);
    if (parts.length === 4 && parts[2] > 0) {
      aspectRatio = parts[3] / parts[2];
    }
  }
  const targetHeight = Math.round(targetWidth * aspectRatio);
  let s = svgString.replace(/<svg([^>]*)\swidth\s*=\s*["'][^"']*["']/i, '<svg$1');
  s = s.replace(/<svg([^>]*)\sheight\s*=\s*["'][^"']*["']/i, '<svg$1');
  s = s.replace(/<svg([^>]*)>/i, '<svg$1 width="' + targetWidth + '" height="' + targetHeight + '">');
  return { svg: s, width: targetWidth, height: targetHeight };
}

async function renderMermaidToPng(syntax, targetWidthPx) {
  if (!window.mermaid) throw new Error('Mermaid library not loaded');
  targetWidthPx = targetWidthPx || 1200;
  const id = 'mermaid-' + Math.random().toString(36).slice(2);
  let svgString;
  try {
    const result = await window.mermaid.render(id, syntax);
    svgString = result.svg;
  } catch (e) {
    throw new Error('Mermaid parse error: ' + (e.message || String(e)));
  }
  const sized = injectSvgDimensions(svgString, targetWidthPx);
  const dataUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(sized.svg)));
  return new Promise(function(resolve, reject) {
    const timeoutId = setTimeout(function() {
      reject(new Error('SVG rasterization timed out after 10s'));
    }, 10000);
    const img = new Image();
    img.onload = function() {
      clearTimeout(timeoutId);
      try {
        const canvas = document.createElement('canvas');
        canvas.width = sized.width;
        canvas.height = sized.height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function(pngBlob) {
          if (!pngBlob) return reject(new Error('Canvas toBlob returned null'));
          const reader = new FileReader();
          reader.onload = function() {
            resolve({ bytes: new Uint8Array(reader.result), width: sized.width, height: sized.height });
          };
          reader.onerror = function() { reject(new Error('FileReader failed')); };
          reader.readAsArrayBuffer(pngBlob);
        }, 'image/png');
      } catch (err) { reject(err); }
    };
    img.onerror = function() {
      clearTimeout(timeoutId);
      reject(new Error('Image load failed for Mermaid SVG'));
    };
    img.src = dataUrl;
  });
}

async function prerenderFigures(paper) {

        sec.figure.pngBytes = out.bytes;
        sec.figure.pngWidth = out.width;
        sec.figure.pngHeight = out.height;
      } catch (e) {

      done++;
      state.whitePaper.figuresDone = done;

    }
  }
}

function parseWhitePaper(reply) {
  const cleaned = reply.trim().replace(/^```(?:json)?\s*/, '').replace(/```\s*$/, '');
  try {
    const obj = JSON.parse(cleaned);
    if (!obj.sections || !Array.isArray(obj.sections)) throw new Error('Missing sections array');
    return obj;
  } catch (e) {
    console.error('Failed to parse white paper response:', e, cleaned.slice(0, 500));
    throw new Error('Claude returned malformed white paper JSON. Try again or check the console for details.');
  }
}

async function assembleWhitePaperDocx(paper) {
  if (!window.docx) throw new Error('docx library not loaded');
  const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType,
          Footer, Header, ImageRun, PageNumber, NumberFormat } = window.docx;

  const logoB64Raw = safeStorage.getItem('dn_logo_b64') || state.logoB64 || '';
  const logoB64 = logoB64Raw.replace(/^data:image\/\w+;base64,/, '');
  let logoBytes = null;
  if (logoB64) {
    try { logoBytes = Uint8Array.from(atob(logoB64), c => c.charCodeAt(0)); } catch (e) { console.warn('Logo decode failed', e); logoBytes = null; }
  }

  const titleParas = [
    new Paragraph({
      alignment: AlignmentType.LEFT,
      spacing: { before: 600, after: 200 },
      children: [
        new TextRun({ text: paper.title || 'Companion White Paper', font: 'Syne', bold: true, size: 56, color: '07091A' })
      ]
    })
  ];
  if (paper.subtitle) {
    titleParas.push(new Paragraph({
      alignment: AlignmentType.LEFT,
      spacing: { after: 600 },
      children: [
        new TextRun({ text: paper.subtitle, font: 'DM Sans', size: 24, color: '6B7280', italics: true })
      ]
    }));
  }

  const sectionParas = [];
  paper.sections.forEach((sec) => {
    sectionParas.push(new Paragraph({
      heading: HeadingLevel.HEADING_1,
      spacing: { before: 480, after: 200 },
      children: [
        new TextRun({ text: sec.heading, font: 'Syne', bold: true, size: 32, color: '07091A' })
      ]
    }));
    const bodyParas = (sec.body || '').split(/\n\n+/).filter(p => p.trim());
    bodyParas.forEach(p => {
      sectionParas.push(new Paragraph({
        spacing: { after: 200, line: 320 },
        children: [
          new TextRun({ text: p.trim(), font: 'DM Sans', size: 22, color: '1F2937' })
        ]
      }));
    });

    if (sec.figure && sec.figure.pngBytes) {
      const targetWidthPts = 500;
      const w = sec.figure.pngWidth || 1200;
      const h = sec.figure.pngHeight || 900;
      const ratio = h / w;
      const targetHeightPts = Math.max(80, Math.min(650, Math.round(targetWidthPts * ratio)));
      sectionParas.push(new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 240, after: 120 },
        children: [
          new ImageRun({
            data: sec.figure.pngBytes,
            transformation: { width: targetWidthPts, height: targetHeightPts }
          })
        ]
      }));
      if (sec.figure.caption) {
        const figLabel = sec.figure.type === 'slide_image' ? 'Figure (from deck): ' : 'Figure: ';
        sectionParas.push(new Paragraph({
          alignment: AlignmentType.CENTER,
          spacing: { after: 240 },
          children: [
            new TextRun({ text: figLabel + sec.figure.caption, font: 'DM Sans', size: 18, color: '6B7280', italics: true })
          ]
        }));
      }
    } else if (sec.figure && sec.figure.renderError) {
      const figKind = sec.figure.type === 'slide_image' ? 'Slide image' : 'Diagram';
      sectionParas.push(new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 120, after: 240 },
        children: [
          new TextRun({ text: '[' + figKind + ' could not be rendered: ' + sec.figure.renderError + ']', font: 'DM Sans', size: 16, color: 'D14343', italics: true })
        ]
      }));
    }
  });

  const headerChildren = [];
  if (logoBytes) {
    headerChildren.push(new Paragraph({
      alignment: AlignmentType.LEFT,
      children: [
        new ImageRun({ data: logoBytes, transformation: { width: 100, height: 35 } })
      ]
    }));
  }

  const footerPara = new Paragraph({
    alignment: AlignmentType.CENTER,
    children: [
      new TextRun({
        text: `© ${new Date().getFullYear()} Digitata Networks. All rights reserved. — Page `,
        font: 'DM Sans', size: 16, color: '9CA3AF'
      }),
      new TextRun({ children: [PageNumber.CURRENT], font: 'DM Sans', size: 16, color: '9CA3AF' }),
      new TextRun({ text: ' of ', font: 'DM Sans', size: 16, color: '9CA3AF' }),
      new TextRun({ children: [PageNumber.TOTAL_PAGES], font: 'DM Sans', size: 16, color: '9CA3AF' })
    ]
  });

  const doc = new Document({
    creator: 'Digitata Networks',
    title: paper.title || 'Companion White Paper',
    description: 'Generated by DN Deck Generator',
    styles: {
      default: {
        document: { run: { font: 'DM Sans', size: 22 } }
      }
    },
    sections: [{
      properties: {
        page: {
          margin: { top: 1080, bottom: 1080, left: 1080, right: 1080 },
          pageNumbers: { start: 1, formatType: NumberFormat.DECIMAL }
        }
      },
      headers: { default: new Header({ children: headerChildren }) },
      footers: { default: new Footer({ children: [footerPara] }) },
      children: [...titleParas, ...sectionParas]
    }]
  });

  const blob = await Packer.toBlob(doc);
  return blob;
}

function downloadWhitePaper(blob, title) {
  const slug = (title || 'companion-white-paper').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${slug}-white-paper.docx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function columnStateClass(stepNum) {
  const cs = state.composeStep;
  if (cs === stepNum) return 'is-active';
  if (cs > stepNum) return 'is-done';
  return 'is-future';
}
function columnExpandedClass(stepNum) {
  const expanded = (typeof state.expandedStep === 'number') ? state.expandedStep : state.composeStep;
  return expanded === stepNum ? 'expanded' : 'collapsed';
}
function expandColumn(stepNum) {
  const stateCls = columnStateClass(stepNum);
  if (stateCls === 'is-future') { toast({ type: 'info', message: 'Complete the previous steps to unlock this one' }); return; }
  state.expandedStep = stepNum;
  renderCompose();
}
function renderCompose() {
  const cont = document.getElementById('content');
  cont.className = 'content';
  if (typeof state.expandedStep !== 'number') state.expandedStep = state.composeStep;
  // If user advanced workflow, snap expansion forward
  if (state.expandedStep < state.composeStep) state.expandedStep = state.composeStep;
  const stepsMeta = [
    { num: 1,   id: 'step1',  title: 'Input',    desc: 'Skill, range, text' },
    { num: 2,   id: 'step2',  title: 'Polish',   desc: 'AI shape to count' },
    { num: 3,   id: 'step3',  title: 'Edit',     desc: 'Titles & body' },
    { num: 3.5, id: 'step35', title: 'Model',    desc: 'Pick image model' },
    { num: 5,   id: 'step5',  title: 'Generate', desc: 'Render & assemble' }
  ];
  const columnsHtml = stepsMeta.map(s => {
    const stateCls = columnStateClass(s.num);
    const expCls = columnExpandedClass(s.num);
    const statusGlyph = stateCls === 'is-done' ? '✓' : stateCls === 'is-active' ? '●' : '';
    return `
      <div class="step-column ${stateCls} ${expCls}" data-step-col="${s.num}">
        <div class="step-column-spine" data-spine="${s.num}">
          <span class="spine-num">${s.num === 3.5 ? '3' : s.num}${s.num === 3.5 ? '<sub style="font-size:8px">.5</sub>' : ''}</span>
          <span class="spine-title">${s.title}</span>
          <span class="spine-status">${statusGlyph}</span>
        </div>
        <div class="step-column-body"><div id="${s.id}"></div></div>
      </div>`;
  }).join('');
  cont.innerHTML = `
    <div style="margin-bottom:24px">
      <div class="eyebrow" style="margin-bottom:8px">New deck</div>
      <div class="display">Compose a deck</div>
      <div class="muted body-sm" style="margin-top:8px;max-width:680px">Click any step\u2019s spine to expand it. Completed steps stay reachable; future steps unlock as you progress.</div>
    </div>
    <div class="compose-grid">
      <div class="compose-rail">
        <div id="pastDecksPanel">${renderPastDecksPanel()}</div>
      </div>
      <div class="step-columns">${columnsHtml}</div>
    </div>`;
  renderStep1(); renderStep2(); renderStep3(); renderStep35(); renderStep5();
  bindPastDecksPanel();
  // Bind spine clicks
  document.querySelectorAll('[data-spine]').forEach(el => {
    el.onclick = () => {
      const n = parseFloat(el.getAttribute('data-spine'));
      if (!isNaN(n)) expandColumn(n);
    };
  });
}

async function rewriteNotesWithClaude(idx) {
  const slide = state.slides[idx]; if (!slide) return;
  const key = (state.apiKeys.anthropic || '').trim();
  if (!key) { toast({ type: 'error', message: 'Set Anthropic API key in Settings.' }); return; }
  slide.rewritingNotes = true; renderStep5Slides();
  const systemPrompt = 'You are a presentation coach. Rewrite the following slide content as natural speaker notes — flowing presenter language a person would actually say aloud while presenting. Convert bullets to sentences. Keep the same facts and order. Stay under 150 words. Return only the rewritten notes, no preamble.';
  const userPrompt = `Slide title: ${slide.title}\n\nSlide content:\n${slide.speakerNotes || slide.body || ''}`;
  const modelName = 'claude-sonnet-4-5-20250929';
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: modelName, max_tokens: 800, system: systemPrompt, messages: [{ role: 'user', content: userPrompt }] })
    });
    if (!resp.ok) { const err = await resp.text(); throw new Error(`Claude ${resp.status}: ${err.slice(0,300)}`); }
    const data = await resp.json();
    if (data.usage) { const cost = getAnthropicCost(modelName, data.usage.input_tokens || 0, data.usage.output_tokens || 0); deckCost.polish += cost; renderCostBadge(); }
    const newText = (data.content[0].text || '').trim();
    slide.prevSpeakerNotes = slide.speakerNotes;
    slide.speakerNotes = newText;
    toast({ type: 'success', message: `Notes rewritten · slide ${idx+1}` });
  } catch (e) { toast({ type: 'error', message: e.message || String(e) }); }
  slide.rewritingNotes = false; renderStep5Slides();
}

// ===== Build #44 — skill preview generation =====
async function generateSkillPreview(skillPrompt, skillName) {
  const spec = currentEffectiveModel();
  const sampleSlide = { title: skillName || 'Sample Slide', body: 'A representative slide showing this skill\'s visual style.\nIncludes a heading, supporting text, and key visual elements.\nClean composition consistent with the brand.' };
  const prompt = composeSkillPrompt({ prompt: skillPrompt }, sampleSlide);
  const b64 = await generateImageWithProvider(spec.provider, spec.model, spec.quality, prompt);
  const cost = getImageCost(spec.provider, spec.model, '1536x1024', spec.quality);
  return { b64: b64, cost: cost, spec: spec };
}
async function regenerateSkillPreview(skillId) {
  const skill = skillById(skillId); if (!skill) return;
  toast({ type: 'info', message: 'Generating preview for "' + skill.name + '"\u2026' });
  try {
    const result = await generateSkillPreview(skill.prompt, skill.name);
    skill.preview_image_b64 = result.b64;
    deckCost.testImage += result.cost; renderCostBadge();
    const sb = getSupabaseClient();
    if (sb) {
      const upd = await sb.from('deck_templates').update({ preview_image_b64: result.b64 }).eq('id', skillId);
      if (upd && upd.error) {
        // Most likely the SQL migration wasn\'t run yet
        const msg = upd.error.message || String(upd.error);
        if (/column.*preview_image_b64/i.test(msg) || /schema cache/i.test(msg)) {
          toast({ type: 'error', message: 'Preview generated but DB save failed: column `preview_image_b64` missing. Run the build #44 SQL migration.' });
        } else {
          toast({ type: 'error', message: 'Preview saved in memory only (DB error: ' + msg.slice(0, 80) + ')' });
        }
        // Still show locally
      } else {
        toast({ type: 'success', message: 'Preview generated \u00b7 ' + fmtUsd4(result.cost) });
      }
    } else {
      toast({ type: 'success', message: 'Preview generated (Supabase offline) \u00b7 ' + fmtUsd4(result.cost) });
    }
    if (state.view === 'skills') renderSkills();
    if (state.view === 'compose') renderStep1();
    // If skill editor modal is open for this id, refresh it so the new thumbnail shows
    if (document.getElementById('skName') && typeof window.__currentEditSkillId === 'string' && window.__currentEditSkillId === skillId) {
      // Reopen editor to refresh preview pane
      closeModal();
      openSkillEditor(skillId);
    }
  } catch (e) { toast({ type: 'error', message: 'Preview generation failed: ' + (e.message || String(e)) }); }
}
// ===== end Build #44 helpers =====

async function saveSkill(skill) {
  const sb = getSupabaseClient();
  if (!sb) {
    if (skill.id) {
      const idx = allSkills.findIndex(s => s.id === skill.id);
      if (idx >= 0) allSkills[idx] = { ...allSkills[idx], name: skill.name, description: skill.description, prompt: skill.prompt, updated_at: new Date().toISOString() };
    } else {
      allSkills.push({ id: uuid(), name: skill.name, description: skill.description, prompt: skill.prompt, is_skill: true, is_active: true, updated_at: new Date().toISOString() });
    }
    window.allSkills = allSkills;
    return;
  }
  const payload = {
    name: skill.name,
    description: skill.description || null,
    prompt: skill.prompt,
    is_skill: true,
    is_active: true,
    layer: null,
    updated_at: new Date().toISOString(),
    updated_by: OWNER_ID
  };
  if (skill.id) payload.id = skill.id;
  const { data: saved, error } = await sb.from('deck_templates').upsert(payload).select().single();
  if (error) throw error;
  try {
    const { data: versionsExisting } = await sb.from('template_versions').select('version_num').eq('template_id', saved.id).order('version_num', { ascending: false }).limit(1);
    const nextVersion = (versionsExisting && versionsExisting[0] && versionsExisting[0].version_num || 0) + 1;
    await sb.from('template_versions').insert({ template_id: saved.id, version_num: nextVersion, prompt: saved.prompt, change_note: skill.change_note || null, updated_by: OWNER_ID });
  } catch (ve) { console.warn('Version row insert failed (non-fatal):', ve); }
  // Build #44 — auto preview
  const promptChanged = !skill.id || (skill.previousPrompt && skill.previousPrompt !== saved.prompt) || !saved.preview_image_b64;
  if (promptChanged) {
    try {
      toast({ type: 'info', message: 'Generating preview thumbnail\u2026' });
      const previewResult = await generateSkillPreview(saved.prompt, saved.name);
      await sb.from('deck_templates').update({ preview_image_b64: previewResult.b64 }).eq('id', saved.id);
      deckCost.testImage += previewResult.cost; renderCostBadge();
      toast({ type: 'success', message: 'Preview generated \u00b7 ' + fmtUsd4(previewResult.cost) });
    } catch (pe) {
      console.warn('Skill preview generation failed (non-fatal):', pe);
      toast({ type: 'info', message: 'Skill saved \u00b7 preview gen failed (use Regenerate preview later)' });
    }
  }
  await loadAllSkills();
}

}
