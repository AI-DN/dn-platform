// ===== Build #37 — saved_decks persistence =====
async function fetchSavedDecks() {
  const sb = getSupabaseClient();
  if (!sb) { state.savedDecksError = 'Supabase not initialised'; state.savedDecksLoaded = true; return; }
  try {
    const { data, error } = await sb.from('saved_decks').select('*').eq('owner', OWNER_ID).order('created_at', { ascending: false }).limit(50);
    if (error) { state.savedDecksError = error.message || String(error); state.savedDecksLoaded = true; state.savedDecks = []; return; }
    state.savedDecks = data || []; state.savedDecksError = null; state.savedDecksLoaded = true;
  } catch (e) { state.savedDecksError = e.message || String(e); state.savedDecksLoaded = true; state.savedDecks = []; }
}

async function saveCurrentDeckToSupabase() {
  const sb = getSupabaseClient();
  if (!sb) return null;
  if (!state.slides || state.slides.length === 0) return null;
  const skill = state.selectedSkillId ? skillById(state.selectedSkillId) : null;
  // Build #51 — name saved deck after its theme (first slide title), matching the .pptx filename
  const firstSlideTitle = (state.slides[0] && state.slides[0].title || '').trim();
  const themedTitle = firstSlideTitle && firstSlideTitle.toLowerCase() !== 'title' && firstSlideTitle.toLowerCase() !== 'untitled'
    ? firstSlideTitle
    : (skill && skill.name ? skill.name : 'Untitled deck');
  const title = themedTitle;
  const slidesPayload = state.slides.map(s => ({
    title: s.title || '',
    body: s.body || '',
    speakerNotes: s.speakerNotes || '',
    imagePrompt: s.imagePrompt || null,
    lastPrompt: s.lastPrompt || null,
    layoutBlocks: s.layoutBlocks || []
  }));
  const payload = {
    owner: OWNER_ID,
    title: title,
    skill_id: state.selectedSkillId || null,
    skill_name: skill ? skill.name : null,
    slide_min: state.slideMin || 6,
    slide_max: state.slideMax || 10,
    slide_count: state.slides.length,
    model_used: state.selectedModel || state.lastSelectedModel || state.defaultModel || null,
    customer_logo_enabled: !!state.customerLogoEnabled,
    slides: slidesPayload,
    updated_at: new Date().toISOString()
  };
  state.savingDeck = true;
  try {
    const { data, error } = await sb.from('saved_decks').insert(payload).select().single();
    if (error) { console.warn('saveCurrentDeckToSupabase failed:', error); state.savingDeck = false; return null; }
    state.lastSavedDeckId = data.id;
    state.savedDecks = [data].concat(state.savedDecks || []);
    state.savingDeck = false;
    // Build #52 — generate + upload thumbnail asynchronously (non-blocking)
    (async () => {
      try {
        const blob = await generateDeckThumbnail();
        if (!blob) return;
        const url = await uploadDeckThumbnail(data.id, blob);
        if (!url) return;
        await sb.from('saved_decks').update({ thumbnail_url: url }).eq('id', data.id);
        data.thumbnail_url = url;
        const idx = (state.savedDecks || []).findIndex(d => d.id === data.id);
        if (idx >= 0) state.savedDecks[idx].thumbnail_url = url;
        if (state.view === 'compose') { try { renderPastDecksCol(); } catch (e) {} }
      } catch (e) {
        console.warn('Deck thumbnail generation failed (non-fatal):', e);
      }
    })();
    return data;
  } catch (e) { console.warn('saveCurrentDeckToSupabase exception:', e); state.savingDeck = false; return null; }
}

function loadSavedDeckIntoState(deck) {
  if (!deck) return;
  deckCost.reset();
  state.whitePaper = { data: null, blob: null, status: 'idle', error: null, cost: 0, illustCost: 0, deckTitle: '', statusMsg: '', figuresTotal: 0, figuresDone: 0, illustTotal: 0, illustDone: 0, awaitingConfirm: false, includeIllustrations: true, targetPagesMin: 6, targetPagesMax: 10, targetPages: 8, awaitingPageCount: true };
  if (deck.skill_id && skillById(deck.skill_id)) state.selectedSkillId = deck.skill_id;
  if (typeof deck.slide_min === 'number') state.slideMin = deck.slide_min;
  if (typeof deck.slide_max === 'number') state.slideMax = deck.slide_max;
  state.customerLogoEnabled = !!deck.customer_logo_enabled;
  state.slides = (deck.slides || []).map(s => ({
    title: s.title || 'Untitled',
    body: s.body || '',
    speakerNotes: s.speakerNotes || '',
    prevSpeakerNotes: null,
    notesExpanded: false,
    rewritingNotes: false,
    imageB64: null,
    imagePrompt: s.imagePrompt || null,
    lastPrompt: s.lastPrompt || null,
    status: 'idle',
    error: null,
    regenCount: 0,
    costAccrued: 0,
    modelUsed: null,
    layoutBlocks: Array.isArray(s.layoutBlocks) ? s.layoutBlocks : []
  }));
  if (deck.model_used) state.lastSelectedModel = deck.model_used;
  state.polishMode = null;
  // Build #59 — land on Edit (composeStep=3, spine 4) so user can review/edit slide text.
  // Continue button from Edit will call enterStep35() which populates model candidates properly.
  state.composeStep = 3;
  state.expandedStep = 3;
  state.expandedStepLocked = true;
  state.view = 'compose';
  setActiveNav();
  renderCompose();
  toast({ type: 'success', message: 'Loaded "' + (deck.title || 'deck') + '" — review/edit text, then continue to pick a model' });
}

async function deleteSavedDeck(id) {
  const sb = getSupabaseClient(); if (!sb) return;
  try {
    const { error } = await sb.from('saved_decks').delete().eq('id', id).eq('owner', OWNER_ID);
    if (error) { toast({ type: 'error', message: 'Delete failed: ' + (error.message || String(error)) }); return; }
    state.savedDecks = (state.savedDecks || []).filter(d => d.id !== id);
    toast({ type: 'success', message: 'Deck removed from history' });
    if (state.view === 'compose' && (state.composeStep === 0 || state.composeStep === 1)) renderCompose();
  } catch (e) { toast({ type: 'error', message: 'Delete failed: ' + (e.message || String(e)) }); }
}

function renderPastDecksCol() {
  const el = document.getElementById('pastDecksCol'); if (!el) return;
  const filter = (state.pastDecksFilter || '').toLowerCase();
  const all = (state.savedDecks || []);
  const filtered = filter
    ? all.filter(d => (d.title || '').toLowerCase().includes(filter) || (d.skill_name || '').toLowerCase().includes(filter))
    : all;
  let body = '';
  if (!state.savedDecksLoaded) {
    body = '<div class="muted body-sm" style="padding:20px 16px;text-align:center">Loading past decks\u2026</div>';
  } else if (state.savedDecksError) {
    body = '<div class="muted body-sm" style="padding:20px 16px;color:var(--warning)">Past decks unavailable: ' + escapeHtml(state.savedDecksError) + '</div>';
  } else if (!all.length) {
    body = '<div class="muted body-sm" style="padding:20px 16px"><div style="font-weight:500;margin-bottom:6px">No past decks yet</div>Completed decks save automatically here. Once you finish a deck, you can reload it to skip Steps 1\u20134 and jump straight to the model picker.</div>';
  } else {
    const rows = filtered.slice(0, 50).map(d => {
      let when = '';
      try { when = new Date(d.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); } catch (e) {}
      const thumbHtml = d.thumbnail_url
        ? '<div class="past-deck-thumb"><img src="' + escapeAttr(d.thumbnail_url) + '" alt="" loading="lazy"></div>'
        : '<div class="past-deck-thumb past-deck-thumb-empty"><span>' + (d.slide_count || 0) + '<br>slides</span></div>';
      return '<div class="past-deck-card">' +
        thumbHtml +
        '<div class="past-deck-body">' +
          '<div class="past-deck-title">' + escapeHtml(d.title || 'Untitled') + '</div>' +
          '<div class="past-deck-meta">' + (d.slide_count || 0) + ' slides' + (d.skill_name ? ' \u00b7 ' + escapeHtml(d.skill_name) : '') + ' \u00b7 ' + when + '</div>' +
          '<div class="past-deck-actions">' +
            '<button class="btn-secondary" data-load-deck="' + d.id + '">Load \u2192 pick model</button>' +
            '<button class="btn-ghost" data-del-deck="' + d.id + '" title="Remove">\u2715</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    // Build #53/#54 — backfill button with cost estimate
    const missingThumbs = all.filter(d => !d.thumbnail_url).length;
    let backfillBar = '';
    if (state.backfillingThumbs && state.backfillProgress) {
      const costSoFar = (state.backfillProgress.cost || 0).toFixed(3);
      backfillBar = '<div style="margin-bottom:10px;padding:8px 10px;background:var(--surface-2,var(--surface));border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:8px"><div class="loading-spinner" style="width:12px;height:12px"></div><span>Generating thumbnails\u2026 ' + state.backfillProgress.done + ' / ' + state.backfillProgress.total + ' \u00b7 $' + costSoFar + '</span></div>';
    } else if (missingThumbs > 0) {
      const estTotal = backfillThumbCostEstimate(missingThumbs).total;
      backfillBar = '<div style="margin-bottom:10px"><button class="btn-secondary" id="pastDecksBackfillBtn" style="width:100%;padding:6px 10px;font-size:12px;justify-content:center">\u{1F5BC} Generate missing thumbnails (' + missingThumbs + ') \u00b7 ~$' + estTotal.toFixed(3) + '</button></div>';
    }
    body = backfillBar + '<div style="margin-bottom:12px"><input class="input" type="text" id="pastDecksFilterInput" placeholder="\u{1F50D} Filter by title or skill\u2026" value="' + escapeHtml(filter) + '"></div>' +
      '<div class="muted body-sm" style="font-size:11px;margin-bottom:8px">' + filtered.length + ' of ' + all.length + ' deck' + (all.length===1?'':'s') + '</div>' +
      '<div style="max-height:540px;overflow-y:auto;padding-right:4px">' + rows + '</div>' +
      (filtered.length === 0 ? '<div class="muted body-sm" style="padding:20px;text-align:center">No matches</div>' : '');
  }
  el.innerHTML = '<div class="step-card"><div class="step-header"><div class="step-num">0</div><div class="step-title">\u{1F4C1} Past decks</div><div class="step-desc">' + (all.length || 0) + ' saved</div></div><div class="step-body">' + body + '</div></div>';
  const fi = document.getElementById('pastDecksFilterInput');
  if (fi) fi.oninput = e => { state.pastDecksFilter = e.target.value; renderPastDecksCol(); };
  // Build #53 — backfill button wiring
  const bb = document.getElementById('pastDecksBackfillBtn');
  if (bb) bb.onclick = () => backfillDeckThumbnails();
}

function renderPastDecksPanel() {
  if (!state.savedDecksLoaded) return '<div class="muted body-sm" style="margin-bottom:14px">Loading past decks…</div>';
  if (state.savedDecksError) return '<div class="card" style="margin-bottom:14px;border-color:var(--warning)"><div class="muted body-sm">Past decks unavailable: ' + escapeHtml(state.savedDecksError) + '</div></div>';
  // Build #39 — show empty state so the feature is discoverable
  if (!state.savedDecks.length) return '<div class="step-card" style="margin-bottom:12px;opacity:0.7"><div class="step-header"><div class="step-title">📁 Past decks</div><div class="step-desc">none yet</div></div><div class="step-body" style="padding:14px 18px"><div class="muted body-sm">Completed decks save automatically here. Once you finish a deck, you can reload it to skip Steps 1–3 and jump straight to the model picker.</div></div></div>';
  const rows = state.savedDecks.slice(0, 12).map(d => {
    let when = '';
    try { when = new Date(d.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); } catch (e) {}
    const thumbHtml = d.thumbnail_url
      ? '<div class="past-deck-thumb"><img src="' + escapeAttr(d.thumbnail_url) + '" alt="" loading="lazy"></div>'
      : '<div class="past-deck-thumb past-deck-thumb-empty"><span>' + (d.slide_count || 0) + '<br>slides</span></div>';
    return '<div class="past-deck-card">' +
      thumbHtml +
      '<div class="past-deck-body">' +
        '<div class="past-deck-title">' + escapeHtml(d.title || 'Untitled') + '</div>' +
        '<div class="past-deck-meta">' + (d.slide_count || 0) + ' slides' + (d.skill_name ? ' · ' + escapeHtml(d.skill_name) : '') + ' · ' + when + '</div>' +
        '<div class="past-deck-actions">' +
        '<button class="btn-secondary" data-load-deck="' + d.id + '">Load → pick model</button>' +
        '<button class="btn-ghost" data-del-deck="' + d.id + '" title="Remove">✕</button>' +
      '</div>' +
      '</div>' +
    '</div>';
  }).join('');
  return '<div class="step-card" style="margin-bottom:12px">' +
    '<div class="step-header"><div class="step-title">📁 Past decks</div><div class="step-desc">' + state.savedDecks.length + ' saved · loading skips Steps 1–3</div></div>' +
    '<div class="step-body" style="padding-top:10px">' + rows + '</div>' +
  '</div>';
}

function bindPastDecksPanel() {
  document.querySelectorAll('[data-load-deck]').forEach(b => { b.onclick = () => { const id = b.getAttribute('data-load-deck'); const deck = (state.savedDecks || []).find(d => d.id === id); if (deck) loadSavedDeckIntoState(deck); }; });
  document.querySelectorAll('[data-del-deck]').forEach(b => { b.onclick = () => { const id = b.getAttribute('data-del-deck'); openModal('<div class="modal-header"><div><div class="h1">Remove from history?</div></div></div><div class="muted body-sm" style="margin-bottom:14px">This deletes the saved deck record only. The .pptx you already downloaded is untouched.</div><div class="modal-footer"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-danger" id="confirmDelDeck">Remove</button></div>'); document.getElementById('confirmDelDeck').onclick = async () => { closeModal(); await deleteSavedDeck(id); }; }; });
}
// ===== end Build #37 =====

// ===== Build #43 — brand library helpers =====
async function persistBrandLib() {
  await persistSetting('dn_brand_lib', JSON.stringify(state.brandLib));
}
function brandLibLogoById(id) {
  return (state.brandLib.customerLogos || []).find(l => l.id === id) || null;
}
function brandLibSubtextById(id) {
  return (state.brandLib.subtexts || []).find(s => s.id === id) || null;
}
async function addOwnLogo(name, b64) {
  const id = 'ol_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  state.brandLib.ownLogos.push({ id: id, name: name || 'Untitled', b64: b64 });
  await persistBrandLib();
  return id;
}
async function removeOwnLogo(id) {
  state.brandLib.ownLogos = state.brandLib.ownLogos.filter(l => l.id !== id);
  if (state.deckOwnLogoId === id) state.deckOwnLogoId = null;
  await persistBrandLib();
}
function ownLogoById(id) {
  return (state.brandLib.ownLogos || []).find(l => l.id === id) || null;
}
async function addCustomerLogo(name, b64) {
  const id = 'cl_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  state.brandLib.customerLogos.push({ id: id, name: name || 'Untitled', b64: b64 });
  await persistBrandLib();
  return id;
}
async function removeCustomerLogo(id) {
  state.brandLib.customerLogos = state.brandLib.customerLogos.filter(l => l.id !== id);
  if (state.deckCustomerLogoId === id) state.deckCustomerLogoId = null;
  await persistBrandLib();
}
async function addSubtext(text) {
  const id = 'st_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  state.brandLib.subtexts.push({ id: id, text: String(text || '').trim() });
  await persistBrandLib();
  return id;
}
async function removeSubtext(id) {
  state.brandLib.subtexts = state.brandLib.subtexts.filter(s => s.id !== id);
  if (state.deckSubtextId === id) state.deckSubtextId = null;
  await persistBrandLib();
}
// ===== end Build #43 helpers =====

function updateAdminBadge() {
  const el = document.getElementById('adminBadge'); if (!el) return;
  el.innerHTML = state.adminMode ? '<span class="badge badge-accent" style="cursor:pointer" id="adminBadgeBtn">Admin</span>' : '<span class="badge badge-neutral" style="cursor:pointer" id="adminBadgeBtn">Read-only</span>';
  const btn = document.getElementById('adminBadgeBtn');
  if (btn) btn.onclick = async () => { state.adminMode = !state.adminMode; await persistSetting('dn_admin', String(state.adminMode)); updateAdminBadge(); if (state.view === 'skills') renderSkills(); else if (state.view === 'settings') renderSettings(); };
}
function renderCostBadge() {
  const el = document.getElementById('costBadge'); if (!el) return;
  const total = deckCost.total();
  if (total <= 0) { el.innerHTML = ''; return; }
  el.innerHTML = `<span class="cost-badge">Deck cost <strong>${fmtUsd4(total)}</strong></span>`;
}

document.getElementById('themeToggle').addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = state.theme; });
function setActiveNav() { document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === state.view)); }
document.querySelectorAll('.nav-btn').forEach(b => { b.addEventListener('click', () => { state.view = b.dataset.view; setActiveNav(); render(); }); });
function render() {
  if (state.view === 'compose') renderCompose();
  else if (state.view === 'skills') renderSkills();
  else if (state.view === 'brand') renderBrand();
  else renderSettings();
  renderCostBadge();
}

async function initApp() {
  await bootstrapSettings();
  await loadAllReferenceData();
  hydrateStateFromStorage();
  // Build #63 — load user assets for layout blocks (non-blocking)
  loadUserAssets().catch(e => console.warn('loadUserAssets boot failed:', e));
  if (!state.selectedSkillId || !skillById(state.selectedSkillId)) state.selectedSkillId = defaultSkillId();
  updateAdminBadge();
  render();
  setInterval(updateSyncPill, 30000);
  if (!state.logoIsCustom) { const b = await loadDefaultLogo(); if (b) state.logoB64 = b; }
  // Build #37 — fetch saved decks in background, then re-render the panel
  fetchSavedDecks().then(() => { if (state.view === 'compose' && (state.composeStep === 0 || state.composeStep === 1)) renderCompose(); }).catch(e => console.warn('fetchSavedDecks boot failed:', e));
}
initApp();
</script>
</body></html>
