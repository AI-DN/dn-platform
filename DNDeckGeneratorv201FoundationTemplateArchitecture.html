<style>
:root {

  --accent: #7b85e3; --accent-hover: #8d96e8; --accent-bg: rgba(123,133,227,0.10);

  --warning: #f59e0b; --warning-bg: rgba(245,158,11,0.10);

}

.display { font-size: 28px; font-weight: 600; line-height: 1.2; color: var(--text); letter-spacing: -0.01em; }

.btn-danger:hover { background: var(--danger-bg); border-color: var(--danger); }
.input, .select, .textarea { background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text); padding: 7px 10px; border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; width: 100%; transition: all 150ms ease; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }

.step-num.done { background: var(--success-bg); color: var(--success); }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field-label { font-size: 12px; font-weight: 500; color: var(--text); display: flex; align-items: center; justify-content: space-between; }

.template-select { position: relative; }

.template-select::after { content: ''; position: absolute; right: 10px; top: 50%; width: 8px; height: 8px; border-right: 1.5px solid var(--text-muted); border-bottom: 1.5px solid var(--text-muted); transform: translateY(-75%) rotate(45deg); pointer-events: none; }
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; gap: 4px; }
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--warning-bg); color: var(--warning); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-info { background: var(--info-bg); color: var(--info); }
.badge-accent { background: var(--accent-bg); color: var(--accent); }
.badge-neutral { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
.toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; pointer-events: none; }
.toast { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 10px 14px; font-size: 13px; display: flex; align-items: center; gap: 10px; min-width: 280px; max-width: 440px; pointer-events: auto; animation: toast-in 200ms ease; }
.toast-icon { width: 14px; height: 14px; flex-shrink: 0; }
.toast-success { border-left: 3px solid var(--success); }
.toast-success .toast-icon { color: var(--success); }
.toast-error { border-left: 3px solid var(--danger); }
.toast-error .toast-icon { color: var(--danger); }
.toast-info { border-left: 3px solid var(--info); }
.toast-info .toast-icon { color: var(--info); }
.toast-body { flex: 1; color: var(--text); }
.toast-close { background: transparent; border: none; cursor: pointer; color: var(--text-subtle); padding: 0; font-size: 16px; line-height: 1; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; animation: fade-in 150ms ease; }

.modal-lg { max-width: 920px; }
.modal-xl { max-width: 1400px; }

.empty { padding: 48px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty-icon { opacity: 0.14; width: 44px; height: 44px; color: var(--text); }
.empty-title { font-size: 14px; font-weight: 600; color: var(--text); }
.empty-desc { font-size: 13px; color: var(--text-muted); max-width: 280px; line-height: 1.55; }

@keyframes spin { to { transform: rotate(360deg); } }
.warning-banner { padding: 10px 14px; background: var(--warning-bg); border: 1px solid var(--warning); border-radius: var(--radius-sm); color: var(--warning); font-size: 13px; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; }

.slide-img-thumb { aspect-ratio: 16/10.67; background: var(--surface-2); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; border-right: 1px solid var(--border); }

.refine-section { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; }
.refine-toggle { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; font-weight: 500; padding: 0; display: flex; align-items: center; gap: 4px; font-family: inherit; }
.refine-toggle:hover { color: var(--text); }
.lightbox-img { max-width: 100%; max-height: 70vh; display: block; margin: 0 auto; border-radius: var(--radius-sm); }
.logo-preview { width: 220px; height: 75px; background: #0a0e1a; border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: flex-start; padding: 10px 14px; overflow: hidden; }
.logo-preview img { max-width: 100%; max-height: 100%; object-fit: contain; object-position: left center; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
thead th { text-align: left; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); padding: 8px 12px; border-bottom: 1px solid var(--border); }
tbody td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text); }

.tab:hover { color: var(--text); }

.template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

<script>
const initialTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
document.documentElement.dataset.theme = initialTheme;

const MASTER_PROMPT = `Create a 16:9 widescreen enterprise presentation slide.

OVERALL STYLE:
Premium enterprise telecom / AI architecture presentation.
Boardroom-ready, executive consulting quality.
Dark navy and black gradient background.
Electric blue as primary accent.
Cyan, purple, green, and subtle gold as secondary accents.
Clean, structured, high-contrast, modern.
No cartoon style. No photorealistic people. No stock-photo look. No decorative clutter.

VISUAL CONSISTENCY:
All slides must feel like they belong to the same Digitata Networks executive deck.
Use the same visual language across slides:
- dark translucent panels
- glowing thin outlines
- rounded rectangles
- simple line icons
- clean directional arrows
- structured grid alignment
- generous margins
- strong hierarchy
- minimal but readable text

LAYOUT RULES:
Use a strict 16:9 widescreen slide format (1536 pixels wide x 864 pixels tall equivalent).
The slide must fill the entire canvas edge to edge — no letterboxing, no black bars, no borders.
Use a consistent title area at the top, but keep the TOP-LEFT CORNER (220x75px from edges) completely empty — this is the logo reserve zone.
Keep title large, bold, and centered or starting from center-left (not far left, to avoid the logo zone).
Use one main visual system per slide.
Use clear spacing between content blocks.
Avoid tiny text. Avoid overcrowding.
Do not create more than 5 major content groups unless explicitly requested.
Use clean infographic structure, not random decorative elements.

TYPOGRAPHY RULES:
Use modern sans-serif typography. Large title. Medium section headings. Readable body text.
Do not invent extra paragraphs. Text must be crisp, clean, and spelled correctly.
Use short labels only. Avoid excessive small text.

BRANDING RULES — STRICTLY ENFORCED:
Do NOT generate, draw, invent, or place any logo, wordmark, icon, badge, or brand symbol anywhere on the slide.
Do NOT create circular emblems, tree shapes, network graphs, or any symbol that could be mistaken for a company logo.

LOGO RESERVE ZONE — MANDATORY:
Reserve a clean, dark, empty rectangular area in the EXACT TOP-LEFT CORNER of the slide.
This zone must be: approximately 220px wide x 75px tall, positioned 20px from the left edge and 20px from the top edge.
ALSO reserve a matching clean, dark, empty rectangular area in the EXACT TOP-RIGHT CORNER of the slide.
This right zone must be: approximately 220px wide x 75px tall, positioned 20px from the right edge and 20px from the top edge.
Both zones must contain NO text, NO icons, NO decorative lines, NO gradients — only a flat dark background (matching the slide's dark background color).
Company logos will be composited into these exact zones after the slide is generated.
If the slide background in those corners is not dark, add subtle dark overlay rectangles in those zones only.

ARCHITECTURE RULES:
AI must NEVER connect directly to live network elements.
Execution must always flow through governed systems.
Where execution is shown, use this pattern:
Intent → Interpreter → Decision → Mediation → Anchor Products → Network → Feedback

ANCHOR PRODUCT RULES:
When anchor products are relevant, show them as solid engineered foundation blocks:
NetTOPO — Topology Intelligence
NetAM — Inventory & Assets
Flo — Workflow Orchestration
NetCM — Safe Execution Engine

COLOR DISCIPLINE:
Use electric blue for intent and AI.
Use gold for key messages or executive emphasis.
Use green for safe execution / validation.
Use purple for workflow or AI agent paths.
Use red only for warnings such as "NO direct AI-to-network interaction."

CONTENT DISCIPLINE:
Each slide must introduce one clear idea.
Prioritize architecture clarity over decorative visuals. Use concise wording.

OUTPUT:
Create one polished 16:9 widescreen slide. No explanation. No mockup frame. No presenter notes.`;

const DEFAULT_LOGO_URL = 'https://ai-dn.github.io/dn-platform/assets/dn-logo.png';
const COST_PER_IMAGE_GEN = 0.04;
const CUSTOMER_LOGO_STORAGE_KEY = 'dn_customer_logo_b64';

function safeGetCustomerLogo() {
  try { return (typeof localStorage !== 'undefined') ? localStorage.getItem(CUSTOMER_LOGO_STORAGE_KEY) : null; } catch (e) { return null; }

// ─── PARSE PASTED TEXT INTO SLIDES ──────────────────────────────────────
function parseSlides(text) {
  if (!text || !text.trim()) return [];
  const hasH2 = /^##\s+/m.test(text);
  const hasHr = /^\s*---\s*$/m.test(text);

  let chunks = [];
  if (hasH2) {
    // Split on lines starting with ##
    const lines = text.split(/\r?\n/);
    let current = null;
    for (const line of lines) {
      const m = line.match(/^##\s+(.+?)\s*$/);
      if (m) {
        if (current) chunks.push(current);
        current = { title: m[1].replace(/^Slide\s+\d+[:.]?\s*/i, '').trim() || 'Untitled', bodyLines: [] };
      } else if (current) {
        current.bodyLines.push(line);
      }
    }
    if (current) chunks.push(current);
  } else if (hasHr) {
    const segments = text.split(/^\s*---\s*$/m).map(s => s.trim()).filter(Boolean);
    chunks = segments.map((seg, i) => {
      const lines = seg.split(/\r?\n/);
      const firstNonEmpty = lines.findIndex(l => l.trim().length > 0);
      const title = firstNonEmpty >= 0 ? lines[firstNonEmpty].replace(/^#+\s*/, '').replace(/^Slide\s+\d+[:.]?\s*/i, '').trim() : `Slide ${i+1}`;
      const bodyLines = firstNonEmpty >= 0 ? lines.slice(firstNonEmpty + 1) : [];
      return { title: title || `Slide ${i+1}`, bodyLines };
    });
  } else {
    return null; // no markers
  }

  return chunks.map((c, i) => ({
    title: c.title,
    body: c.bodyLines.join('\n').trim(),
    imageB64: null,
    imagePrompt: null,
    lastPrompt: null,
    status: 'idle',
    error: null,
    regenCount: 0
  }));
}

// ─── ANTHROPIC POLISH ──────────────────────────────────────────────────
async function polishWithClaude(slides, mode) {
  const key = (state.apiKeys.anthropic || '').trim();
  if (!key) throw new Error('NO_ANTHROPIC_KEY: Set Anthropic API key in Settings.');

  let systemPrompt = '';
  if (mode === 'shorten') {
    systemPrompt = 'You are a presentation editor for Digitata Networks. Take the slide content provided and shorten each slide\'s text to bullet points suitable for presentation. Keep the title intact. Aim for 3-5 short bullets per slide. Respond with valid JSON only: {"slides": [{"title": "...", "bullets": ["..."]}, ...]}.';
  } else if (mode === 'expand') {
    systemPrompt = 'You are a presentation editor for Digitata Networks. Take the brief notes provided and expand each slide into well-formed presentation content. Keep the title intact. Produce a sub-headline plus 3-5 supporting points per slide. Respond with valid JSON only: {"slides": [{"title": "...", "subheadline": "...", "bullets": ["..."]}, ...]}.';
  } else if (mode === 'split') {
    systemPrompt = 'You are a presentation editor for Digitata Networks. Take this raw block of text and split it into a logical slide deck. Each slide should have one clear idea. Respond with valid JSON only: {"slides": [{"title": "...", "bullets": ["..."]}, ...]}.';
  }

  const userContent = mode === 'split'
    ? `Split this into approximately 8 slides:\n\n${state.rawText}`
    : `Slides:\n${JSON.stringify(slides.map(s => ({ title: s.title, body: s.body })))}`;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5-20250929',
      max_tokens: 4000,
      system: systemPrompt,
      messages: [{ role: 'user', content: userContent }]
    })
  });
  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(`Claude ${resp.status}: ${err.slice(0,300)}`);
  }
  const data = await resp.json();
  const raw = data.content[0].text;
  const clean = raw.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(clean);
  return parsed.slides || [];
}

function polishedToSlides(polished) {
  return polished.map(p => {
    const parts = [];
    if (p.subheadline) parts.push(p.subheadline);
    if (p.bullets && p.bullets.length) parts.push(...p.bullets.map(b => '• ' + b));
    return {
      title: p.title || 'Untitled',

      imageB64: null,
      imagePrompt: null,
      lastPrompt: null,
      status: 'idle',
      error: null,
      regenCount: 0
    };
  });
}

// ─── IMAGE PARAMS + GENERATION ─────────────────────────────────────────
function buildImageParams(model, prompt, quality) {
  const base = { model, prompt, n: 1 };
  if (model === 'gpt-image-2') {
    return { ...base, output_format: 'jpeg', size: '1536x1024', quality: quality === 'low' ? 'low' : quality === 'medium' ? 'medium' : 'high' };
  }
  if (model === 'gpt-image-1') {
    return { ...base, size: '1536x1024', quality: quality === 'low' ? 'low' : quality === 'medium' ? 'medium' : 'high' };
  }
  return { ...base, size: '1024x1024' };
}

function buildImagePrompt(slide) {
  return `${MASTER_PROMPT}\n\nSLIDE-SPECIFIC CONTENT:\nTitle: ${slide.title}\n\nBody content / talking points:\n${slide.body || '(no body content provided)'}\n\nRender this slide visually with the title prominent and the body content represented as clear structured visual elements (panels, bullets, diagrams) — NOT as direct text overlays unless short labels.`;
}

async function generateSlideImage(slide, customPrompt) {
  const openaiKey = (state.apiKeys.openai || '').trim();
  if (!openaiKey) throw new Error('NO_OPENAI_KEY: Set OpenAI API key in Settings.');
  if (!openaiKey.startsWith('sk-')) throw new Error('BAD_KEY_FORMAT: OpenAI key must start with sk-.');

  const prompt = customPrompt || buildImagePrompt(slide);
  const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${openaiKey}` };
  const org = (state.apiKeys.openai_org || '').trim();
  if (org) headers['OpenAI-Organization'] = org;

  let model = state.imageModel;
  let body = buildImageParams(model, prompt, 'high');

  let resp = await fetch('https://api.openai.com/v1/images/generations', {
    method: 'POST', headers, body: JSON.stringify(body)
  });

  if ((resp.status === 404 || resp.status === 400) && model === 'gpt-image-2') {
    const errText = await resp.text();
    if (/model/i.test(errText)) {
      if (!state.imageModelFellBack) {
        state.imageModelFellBack = true;
        toast({ type: 'info', message: 'gpt-image-2 not available on this org — falling back to gpt-image-1', duration: 6000 });
      }
      state.imageModel = 'gpt-image-1';
      model = 'gpt-image-1';
      body = buildImageParams(model, prompt, 'high');
      resp = await fetch('https://api.openai.com/v1/images/generations', {
        method: 'POST', headers, body: JSON.stringify(body)
      });
    } else {
      throw new Error(`OpenAI ${resp.status}: ${errText.slice(0,300)}`);
    }
  }

  if (!resp.ok) {
    const t = await resp.text().catch(() => '');
    throw new Error(`OpenAI ${resp.status}: ${t.slice(0,300)}`);
  }

  const data = await resp.json();
  const item = data.data[0];
  if (item.b64_json) return { b64: item.b64_json, prompt };
  if (item.url) {
    const imgResp = await fetch(item.url);
    const blob = await imgResp.blob();
    const b64 = await new Promise(res => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result.split(',')[1]);
      fr.readAsDataURL(blob);
    });
    return { b64, prompt };
  }
  throw new Error('OpenAI response had neither b64_json nor url');
}

// Concurrency limiter
async function generateAllImages() {
  const max = 3;
  let idx = 0;
  const total = state.slides.length;
  const workers = [];
  for (let w = 0; w < Math.min(max, total); w++) {
    workers.push((async () => {
      while (idx < total) {
        const myIdx = idx++;
        const slide = state.slides[myIdx];
        if (slide.status === 'done') continue;
        slide.status = 'generating';
        slide.error = null;
        renderStep4Slides();
        try {
          const { b64, prompt } = await generateSlideImage(slide);
          slide.imageB64 = b64;
          slide.imagePrompt = prompt;
          slide.lastPrompt = prompt;
          slide.status = 'done';
        } catch (err) {
          slide.status = 'error';
          slide.error = err.message || String(err);
        }
        renderStep4Slides();
      }
    })());
  }
  await Promise.all(workers);
}

async function regenerateOne(idx, newPrompt) {
  const slide = state.slides[idx];

}

// ─── LOGO STAMPING ─────────────────────────────────────────────────────
function drawLogoPanel(ctx, canvas, logoImg, position) {
  const scale = canvas.width / 1536;
  const lw = Math.round(195 * scale);
  const aspect = logoImg.naturalHeight / logoImg.naturalWidth;
  const lh = Math.round(lw * aspect);
  const padX = Math.round(20 * scale);
  const padY = Math.round(14 * scale);
  let x, y;
  if (position === 'right') {
    x = canvas.width - Math.round(22 * scale) - lw;
    y = Math.round(20 * scale);
  } else {
    x = Math.round(22 * scale);
    y = Math.round(20 * scale);
  }
  ctx.save();
  ctx.fillStyle = '#080c1a';
  const rx = x - padX, ry = y - padY;
  const rw = lw + padX * 2, rh = lh + padY * 2;
  const radius = Math.round(6 * scale);
  ctx.beginPath();
  ctx.moveTo(rx + radius, ry);
  ctx.lineTo(rx + rw - radius, ry);
  ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + radius);
  ctx.lineTo(rx + rw, ry + rh - radius);
  ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - radius, ry + rh);
  ctx.lineTo(rx + radius, ry + rh);
  ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - radius);
  ctx.lineTo(rx, ry + radius);
  ctx.quadraticCurveTo(rx, ry, rx + radius, ry);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.drawImage(logoImg, x, y, lw, lh);
  ctx.restore();
}

function loadImageFromB64(b64, mime) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Image failed to load'));
    img.src = `data:${mime};base64,` + b64;
  });
}

async function stampLogos(slideBase64, dnLogoB64, customerLogoB64) {
  const slideImg = await loadImageFromB64(slideBase64, 'image/jpeg');
  const canvas = document.createElement('canvas');
  canvas.width = slideImg.width;
  canvas.height = slideImg.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(slideImg, 0, 0);
  if (dnLogoB64) {
    try { const dnImg = await loadImageFromB64(dnLogoB64, 'image/png'); drawLogoPanel(ctx, canvas, dnImg, 'left'); } catch (e) { console.warn('DN logo stamp failed', e); }
  }
  if (customerLogoB64) {
    try { const custImg = await loadImageFromB64(customerLogoB64, 'image/png'); drawLogoPanel(ctx, canvas, custImg, 'right'); } catch (e) { console.warn('Customer logo stamp failed', e); }
  }
  return canvas.toDataURL('image/jpeg', 0.92).split(',')[1];
}

async function stampLogo(slideBase64, logoBase64) {
  return stampLogos(slideBase64, logoBase64, null);
}

async function loadDefaultLogo() {
  try {
    const r = await fetch(DEFAULT_LOGO_URL);

      const fr = new FileReader();

      fr.onerror = () => rej(new Error('FileReader failed'));
      fr.readAsDataURL(blob);
    });
  } catch (e) {
    console.warn('Default logo load failed', e);
    return null;
  }
}

// ─── PPTX ASSEMBLY ─────────────────────────────────────────────────────
async function assemblePptx() {
  if (!window.__pptxReady || typeof PptxGenJS === 'undefined') {
    toast({ type: 'error', message: 'PptxGenJS still loading — try again in a moment' });
    return;
  }
  const prs = new PptxGenJS();
  prs.layout = 'LAYOUT_WIDE';
  const b = state.selectedBundle ? bundleById(state.selectedBundle) : null;
  const deckTitle = b ? b.name : 'DN Deck';
  prs.title = deckTitle;
  prs.author = 'DN Deck Generator';

  const customerLogo = state.customerLogoEnabled ? state.customerLogoB64 : null;
  const stampedSlides = [];
  for (let i = 0; i < state.slides.length; i++) {
    const slide = state.slides[i];
    if (!slide.imageB64) continue;
    let finalB64 = slide.imageB64;
    if (state.logoB64 || customerLogo) {
      try {
        finalB64 = await stampLogos(slide.imageB64, state.logoB64, customerLogo);
      } catch (e) {
        console.warn('Logo stamp failed for slide', i, e);
      }
    }
    stampedSlides.push({ ...slide, finalB64 });
  }

  for (const s of stampedSlides) {
    const slideObj = prs.addSlide();
    slideObj.addImage({
      data: `data:image/jpeg;base64,${s.finalB64}`,
      x: 0, y: 0, w: 13.3, h: 7.5
    });
    slideObj.addNotes(`${s.title}\n\n${s.body || ''}`);
  }

  const fileName = `${slugify(deckTitle)}-${dateStr()}.pptx`;
  const blob = await prs.write({ outputType: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast({ type: 'success', html: `Downloaded <strong>${escapeHtml(fileName)}</strong> · ${(blob.size/1024).toFixed(0)} KB` });
  if (state.customerLogoEnabled) {
    safeClearCustomerLogo();
    state.customerLogoB64 = null;
    state.customerLogoEnabled = false;
    toast({ type: 'info', message: 'Customer logo cleared after assembly' });
  }
}

              ${state.bundles.map(b => `<option value="${b.id}" ${state.selectedBundle === b.id ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Slide deck text <span class="subtle" id="rawCount">${state.rawText.length} chars</span></label>
          <textarea class="textarea" id="rawText" rows="14" placeholder="${escapeHtml(placeholder)}">${escapeHtml(state.rawText)}</textarea>
        </div>
        <div class="field">
          <label class="field-label" style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="custLogoChk" ${state.customerLogoEnabled ? 'checked' : ''} style="margin:0">
            <span>Add customer logo (top-right of every slide)</span>
          </label>
          <div id="custLogoBlock" style="display:${state.customerLogoEnabled ? 'block' : 'none'};margin-top:8px">
            <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
              <div class="logo-preview">${state.customerLogoB64 ? `<img src="data:image/png;base64,${state.customerLogoB64}" alt="customer logo">` : '<span class="subtle" style="color:#71717a;font-size:11px;font-family:var(--mono)">no logo</span>'}</div>
              <div style="display:flex;gap:6px">
                <input type="file" id="custLogoFile" accept=".png,image/png" style="display:none">
                <button class="btn-secondary" id="custUploadBtn" type="button">Upload PNG</button>
                ${state.customerLogoB64 ? '<button class="btn-ghost" id="custClearBtn" type="button">Clear</button>' : ''}
              </div>
            </div>
            <div class="field-hint" style="margin-top:8px">Customer logo is cleared from storage after .pptx assembly. PNG with transparent background recommended.</div>
          </div>
        </div>
        <div id="step1Error"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
          <button class="btn-secondary" id="polishBtn">Polish with AI →</button>
          <button class="btn-primary" id="continueAsIsBtn">Continue with text as-is →</button>
        </div>
      </div>
    </div>`;

  const bundleSel = document.getElementById('bundleSel');
  if (bundleSel) bundleSel.onchange = e => { state.selectedBundle = e.target.value || null; };

  const custChk = document.getElementById('custLogoChk');
  if (custChk) custChk.onchange = e => {
    state.customerLogoEnabled = e.target.checked;
    document.getElementById('custLogoBlock').style.display = e.target.checked ? 'block' : 'none';
    if (!e.target.checked) {
      safeClearCustomerLogo();
      state.customerLogoB64 = null;
    }
    renderStep1();
  };
  const custUpload = document.getElementById('custUploadBtn');
  if (custUpload) custUpload.onclick = () => document.getElementById('custLogoFile').click();
  const custFile = document.getElementById('custLogoFile');
  if (custFile) custFile.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    if (!/png/i.test(file.type)) { toast({ type: 'error', message: 'PNG only' }); return; }
    const fr = new FileReader();
    fr.onload = () => {
      const b64 = fr.result.split(',')[1];
      state.customerLogoB64 = b64;
      safeSetCustomerLogo(b64);
      toast({ type: 'success', message: 'Customer logo uploaded' });
      renderStep1();
    };
    fr.readAsDataURL(file);
  };
  const custClear = document.getElementById('custClearBtn');
  if (custClear) custClear.onclick = () => {
    safeClearCustomerLogo();
    state.customerLogoB64 = null;
    toast({ type: 'info', message: 'Customer logo cleared' });
    renderStep1();
  };
  const raw = document.getElementById('rawText');
  raw.oninput = e => {
    state.rawText = e.target.value;
    document.getElementById('rawCount').textContent = e.target.value.length + ' chars';
  };
  document.getElementById('continueAsIsBtn').onclick = () => {
    const parsed = parseSlides(state.rawText);
    if (parsed === null) {
      document.getElementById('step1Error').innerHTML = '<div class="warning-banner" style="margin-top:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div>Please add slide breaks (<span class="mono">---</span> or <span class="mono">## headings</span>) before continuing, or use Polish with AI to auto-split.</div></div>';
      return;
    }
    if (parsed.length === 0) {
      toast({ type: 'error', message: 'No slides found in text' });
      return;
    }
    state.slides = parsed;
    state.composeStep = 3; // skip polish
    renderCompose();
  };
  document.getElementById('polishBtn').onclick = () => {
    if (!state.apiKeys.anthropic) {
      document.getElementById('step1Error').innerHTML = '<div class="info-banner" style="margin-top:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><div>Paste your Anthropic API key in <button class="btn-ghost" id="goSettings" style="color:var(--info);padding:0;text-decoration:underline">Settings → Anthropic</button> to use AI polish, or click <strong>Continue with text as-is</strong>.</div></div>';
      const gs = document.getElementById('goSettings');
      if (gs) gs.onclick = () => { state.view = 'settings'; setActiveNav(); render(); };
      return;
    }
    if (!state.rawText.trim()) {
      toast({ type: 'error', message: 'Paste some text first' });
      return;
    }
    // Try parsing first; if no markers, mark for split mode
    const parsed = parseSlides(state.rawText);
    state.slides = parsed || [];
    state.composeStep = 2;
    renderCompose();
  };
}

function renderStep2() {
  const el = document.getElementById('step2');
  if (!el) return;
  const isActive = state.composeStep === 2;
  const isDone = state.composeStep > 2;
  const isFuture = state.composeStep < 2;

  if (isFuture) {
    el.innerHTML = `<div class="step-card future"><div class="step-header"><div class="step-num">2</div><div class="step-title">Polish with AI (optional)</div><div class="step-desc">shorten / expand / preserve</div></div></div>`;
    return;
  }
  if (isDone) {
    el.innerHTML = `
      <div class="step-card collapsed">
        <div class="step-header" id="step2Edit">
          <div class="step-num done">✓</div>
          <div class="step-title">Polish</div>
          <div class="step-desc">${state.polishMode ? state.polishMode + ' applied' : 'skipped'}</div>
        </div>
      </div>`;
    return;
  }

  const hasMarkers = state.slides.length > 0;
  el.innerHTML = `
    <div class="step-card">
      <div class="step-header">
        <div class="step-num">2</div>
        <div class="step-title">Polish with AI</div>
        <div class="step-desc">${hasMarkers ? state.slides.length + ' slides detected' : 'no markers — will auto-split'}</div>
      </div>
      <div class="step-body">
        <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
          ${!hasMarkers ? `<button class="btn-secondary" id="splitBtn" ${state.polishing ? 'disabled' : ''}>${state.polishing && state.polishMode==='split' ? '<span class="spinner"></span> Splitting…' : 'Auto-split into slides'}</button>` : ''}
          ${hasMarkers ? `<button class="btn-secondary" id="shortenBtn" ${state.polishing ? 'disabled' : ''}>${state.polishing && state.polishMode==='shorten' ? '<span class="spinner"></span> Shortening…' : 'Shorten'}</button>
          <button class="btn-secondary" id="expandBtn" ${state.polishing ? 'disabled' : ''}>${state.polishing && state.polishMode==='expand' ? '<span class="spinner"></span> Expanding…' : 'Expand'}</button>
          <button class="btn-secondary" id="preserveBtn">Preserve text</button>` : ''}
        </div>
        ${state.slides.length > 0 ? `<div class="caption" style="margin-bottom:8px">${state.slides.length} slides</div>
        <div style="max-height:340px;overflow-y:auto">${state.slides.map((s, i) => `
          <div class="slide-edit-card" style="margin-bottom:6px">
            <div style="font-size:13px;font-weight:600;margin-bottom:4px">${i+1}. ${escapeHtml(s.title)}</div>
            <div style="font-size:12px;color:var(--text-muted);white-space:pre-wrap;line-height:1.5">${escapeHtml(s.body.slice(0, 200))}${s.body.length > 200 ? '…' : ''}</div>
          </div>`).join('')}</div>` : '<div class="empty" style="padding:24px"><div class="empty-desc">Click <strong>Auto-split</strong> to let Claude split your text into slides.</div></div>'}
        <div style="display:flex;gap:8px;justify-content:space-between;margin-top:14px">
          <button class="btn-ghost" id="backTo1">← Back</button>
          <button class="btn-primary" id="toStep3" ${state.slides.length === 0 ? 'disabled' : ''}>Continue to slide edit →</button>
        </div>
      </div>
    </div>`;

  const shortenBtn = document.getElementById('shortenBtn');
  if (shortenBtn) shortenBtn.onclick = () => runPolish('shorten');
  const expandBtn = document.getElementById('expandBtn');
  if (expandBtn) expandBtn.onclick = () => runPolish('expand');
  const splitBtn = document.getElementById('splitBtn');
  if (splitBtn) splitBtn.onclick = () => runPolish('split');
  const preserveBtn = document.getElementById('preserveBtn');
  if (preserveBtn) preserveBtn.onclick = () => { state.polishMode = 'preserve'; toast({ type: 'success', message: 'Text preserved' }); };
  document.getElementById('backTo1').onclick = () => { state.composeStep = 1; renderCompose(); };
  document.getElementById('toStep3').onclick = () => { state.composeStep = 3; renderCompose(); };
}

async function runPolish(mode) {
  state.polishing = true;
  state.polishMode = mode;
  renderStep2();
  try {
    const polished = await polishWithClaude(state.slides, mode);
    state.slides = polishedToSlides(polished);
    toast({ type: 'success', message: `${mode === 'split' ? 'Split' : mode === 'shorten' ? 'Shortened' : 'Expanded'} — ${state.slides.length} slides` });
  } catch (e) {
    toast({ type: 'error', message: e.message });
  }
  state.polishing = false;
  renderStep2();
}

function renderStep3() {
  const el = document.getElementById('step3');
  if (!el) return;
  const isActive = state.composeStep === 3;
  const isDone = state.composeStep > 3;
  const isFuture = state.composeStep < 3;

  if (isFuture) {
    el.innerHTML = `<div class="step-card future"><div class="step-header"><div class="step-num">3</div><div class="step-title">Slide text preview &amp; edit</div><div class="step-desc">edit titles and body</div></div></div>`;
    return;
  }
  if (isDone) {
    el.innerHTML = `
      <div class="step-card collapsed">
        <div class="step-header" id="step3Edit">
          <div class="step-num done">✓</div>
          <div class="step-title">Slide text</div>
          <div class="step-desc">${state.slides.length} slides</div>
          <button class="btn-ghost" style="margin-left:8px" id="step3EditBtn">Edit</button>
        </div>
      </div>`;
    document.getElementById('step3EditBtn').onclick = () => { state.composeStep = 3; renderCompose(); };
    return;
  }

  el.innerHTML = `
    <div class="step-card">
      <div class="step-header">
        <div class="step-num">3</div>
        <div class="step-title">Edit slide text</div>
        <div class="step-desc">${state.slides.length} slides</div>
      </div>
      <div class="step-body">
        <div id="slideEditList">${state.slides.map((s, i) => renderSlideEditCard(s, i)).join('')}</div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn-secondary" id="addSlideBtn">+ Add slide</button>
        </div>
        <div style="display:flex;gap:8px;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)">
          <button class="btn-ghost" id="backTo2or1">← Back</button>
          <button class="btn-primary lg" id="toStep4" ${state.slides.length === 0 ? 'disabled' : ''}>Generate images →</button>
        </div>
      </div>
    </div>`;

  state.slides.forEach((s, i) => bindSlideEditCard(i));
  document.getElementById('addSlideBtn').onclick = () => {
    state.slides.push({ title: 'New slide', body: '', imageB64: null, imagePrompt: null, lastPrompt: null, status: 'idle', error: null, regenCount: 0 });
    renderStep3();
  };
  document.getElementById('backTo2or1').onclick = () => { state.composeStep = state.polishMode ? 2 : 1; renderCompose(); };
  document.getElementById('toStep4').onclick = () => {
    if (!state.apiKeys.openai) {
      toast({ type: 'error', message: 'Add OpenAI API key in Settings first' });
      return;
    }
    state.composeStep = 4;
    renderCompose();
    generateAllImages();
  };
}

function renderSlideEditCard(s, i) {
  return `
    <div class="slide-edit-card" data-idx="${i}">
      <div class="slide-edit-head">
        <span class="slide-edit-num">Slide ${i+1}</span>
        <div class="slide-edit-actions">
          <button class="icon-btn-sm" disabled title="Move up (v2.0.5)" aria-label="Move up">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
          </button>
          <button class="icon-btn-sm" disabled title="Move down (v2.0.5)" aria-label="Move down">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <button class="icon-btn-sm" data-act="del" title="Delete slide" aria-label="Delete slide">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Title</label>
        <input class="input" data-act="title" value="${escapeHtml(s.title)}">
      </div>
      <div class="field" style="margin-bottom:0">
        <label class="field-label">Body</label>
        <textarea class="textarea prose" data-act="body" rows="4">${escapeHtml(s.body)}</textarea>
      </div>
    </div>`;
}

function bindSlideEditCard(i) {
  const card = document.querySelector(`.slide-edit-card[data-idx="${i}"]`);
  if (!card) return;
  const titleInp = card.querySelector('[data-act="title"]');
  const bodyInp = card.querySelector('[data-act="body"]');
  const delBtn = card.querySelector('[data-act="del"]');
  titleInp.oninput = e => { state.slides[i].title = e.target.value; };
  bodyInp.oninput = e => { state.slides[i].body = e.target.value; };
  delBtn.onclick = () => {
    if (state.slides.length === 1) { toast({ type: 'error', message: 'At least one slide required' }); return; }
    state.slides.splice(i, 1);
    renderStep3();
  };
}

function renderStep4() {
  const el = document.getElementById('step4');
  if (!el) return;
  const isActive = state.composeStep === 4;
  const isFuture = state.composeStep < 4;

  if (isFuture) {
    el.innerHTML = `<div class="step-card future"><div class="step-header"><div class="step-num">4</div><div class="step-title">Generate images &amp; assemble</div><div class="step-desc">${state.imageModel}</div></div></div>`;
    return;
  }

  const allDone = state.slides.every(s => s.status === 'done');
  el.innerHTML = `
    <div class="step-card">
      <div class="step-header">
        <div class="step-num">4</div>
        <div class="step-title">Generate &amp; refine images</div>
        <div class="step-desc">${state.imageModel} · ${state.slides.filter(s => s.status === 'done').length}/${state.slides.length} done</div>
      </div>
      <div class="step-body">
        <div id="step4Slides">${state.slides.map((s, i) => renderImgCard(s, i)).join('')}</div>
        <div style="display:flex;gap:8px;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)">
          <button class="btn-ghost" id="backTo3">← Back to text edit</button>
          <button class="btn-primary lg" id="assembleBtn" ${allDone ? '' : 'disabled'}>Assemble .pptx</button>
        </div>
      </div>
    </div>`;

  state.slides.forEach((s, i) => bindImgCard(i));
  document.getElementById('backTo3').onclick = () => { state.composeStep = 3; renderCompose(); };
  document.getElementById('assembleBtn').onclick = () => assemblePptx();
}

function renderStep4Slides() {
  const list = document.getElementById('step4Slides');
  if (!list) return;
  list.innerHTML = state.slides.map((s, i) => renderImgCard(s, i)).join('');
  state.slides.forEach((s, i) => bindImgCard(i));
  const head = document.querySelector('#step4 .step-desc');
  if (head) head.textContent = `${state.imageModel} · ${state.slides.filter(s => s.status === 'done').length}/${state.slides.length} done`;
  const allDone = state.slides.every(s => s.status === 'done');
  const ab = document.getElementById('assembleBtn');
  if (ab) ab.disabled = !allDone;
}

function renderImgCard(s, i) {
  let thumbContent = '';
  if (s.status === 'generating') {
    thumbContent = `<div class="placeholder"><span class="spinner-lg spinner"></span><div style="margin-top:10px">Generating…</div></div>`;
  } else if (s.status === 'error') {
    thumbContent = `<div class="err">${escapeHtml(s.error || 'Failed')}</div>`;
  } else if (s.imageB64) {
    thumbContent = `<img src="data:image/jpeg;base64,${s.imageB64}" alt="Slide ${i+1}">`;
  } else {
    thumbContent = `<div class="placeholder">Queued</div>`;
  }

  const expanded = !!state.expandedRefine[i];
  const cost = COST_PER_IMAGE_GEN;
  const regenCost = (s.regenCount * cost).toFixed(2);

  return `
    <div class="slide-img-card" data-idx="${i}">
      <div class="slide-img-head">
        <span class="slide-edit-num">Slide ${i+1}</span>
        <div class="slide-img-title">${escapeHtml(s.title)}</div>
        ${s.status === 'done' && s.regenCount === 0 ? `<span class="badge badge-neutral">Generated · ${COST_PER_IMAGE_GEN.toFixed(2)}</span>` : ''}
        ${s.regenCount > 0 ? `<span class="badge badge-neutral">Regenerated ${s.regenCount}× · ${regenCost}</span>` : ''}
        ${s.status === 'done' ? '<span class="badge badge-success">✓</span>' : ''}
        ${s.status === 'error' ? '<span class="badge badge-danger">Error</span>' : ''}
      </div>
      <div class="slide-img-body">
        <div class="slide-img-thumb ${s.status === 'generating' ? 'loading' : ''}" data-act="open">${thumbContent}</div>
        <div class="slide-img-controls">
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${s.status === 'error' ? `<button class="btn-secondary" data-act="retry">Retry</button>` : ''}
            ${s.status === 'done' ? `<button class="btn-secondary" data-act="enlarge">View full size</button>` : ''}
            <button class="btn-ghost" disabled title="Coming in v2.0.5">Replace with upload</button>
          </div>
          <div class="refine-section">
            <button class="refine-toggle" data-act="toggleRefine">${expanded ? '−' : '+'} Refine this image</button>
            ${expanded ? `
              <div style="margin-top:10px">
                <label class="field-label" style="margin-bottom:4px">Edit prompt</label>
                <textarea class="textarea" data-act="refinePrompt" rows="8" style="font-size:11px">${escapeHtml(s.lastPrompt || buildImagePrompt(s))}</textarea>
                <div style="display:flex;gap:6px;margin-top:8px">
                  <button class="btn-primary" data-act="regen" ${s.status === 'generating' ? 'disabled' : ''}>${s.status === 'generating' ? '<span class="spinner"></span> Regenerating…' : 'Regenerate'}</button>
                  <button class="btn-ghost" data-act="resetPrompt">Reset to default</button>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      </div>
    </div>`;
}

function bindImgCard(i) {
  const card = document.querySelector(`.slide-img-card[data-idx="${i}"]`);
  if (!card) return;
  const s = state.slides[i];

  const thumb = card.querySelector('[data-act="open"]');
  if (thumb && s.imageB64) thumb.onclick = () => openLightbox(i);

  const enlarge = card.querySelector('[data-act="enlarge"]');
  if (enlarge) enlarge.onclick = () => openLightbox(i);

  const retry = card.querySelector('[data-act="retry"]');
  if (retry) retry.onclick = () => regenerateOne(i);

  const toggle = card.querySelector('[data-act="toggleRefine"]');
  if (toggle) toggle.onclick = () => {
    state.expandedRefine[i] = !state.expandedRefine[i];
    renderStep4Slides();
  };

  const regen = card.querySelector('[data-act="regen"]');
  if (regen) regen.onclick = () => {
    const ta = card.querySelector('[data-act="refinePrompt"]');
    const newPrompt = ta ? ta.value : null;
    regenerateOne(i, newPrompt);
  };

  const reset = card.querySelector('[data-act="resetPrompt"]');
  if (reset) reset.onclick = () => {
    const ta = card.querySelector('[data-act="refinePrompt"]');
    if (ta) ta.value = buildImagePrompt(s);
  };
}

function openLightbox(i) {
  const s = state.slides[i];
  if (!s.imageB64) return;
  const html = `
    <div class="modal-header">
      <div>
        <div class="h1">Slide ${i+1}: ${escapeHtml(s.title)}</div>
        <div class="muted body-sm" style="margin-top:4px">${state.imageModel} · 1536×1024 · regenerated ${s.regenCount}×</div>
      </div>
      <button class="btn-ghost" onclick="closeModal()" aria-label="Close">×</button>
    </div>
    <img class="lightbox-img" src="data:image/jpeg;base64,${s.imageB64}" alt="Slide ${i+1}">
    <div style="margin-top:16px">
      <button class="refine-toggle" id="showPromptBtn">+ Show prompt used</button>
      <div id="promptBlock" style="display:none;margin-top:10px">
        <textarea class="textarea" readonly rows="10" style="font-size:11px">${escapeHtml(s.lastPrompt || '')}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="saveImgBtn">Save as PNG</button>
      <button class="btn-primary" onclick="closeModal()">Close</button>
    </div>`;
  openModal(html, { xl: true });
  document.getElementById('showPromptBtn').onclick = () => {
    const pb = document.getElementById('promptBlock');
    pb.style.display = pb.style.display === 'none' ? 'block' : 'none';
  };
  document.getElementById('saveImgBtn').onclick = () => {
    const a = document.createElement('a');
    a.href = 'data:image/jpeg;base64,' + s.imageB64;
    a.download = `slide-${i+1}-${slugify(s.title)}.jpg`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
}

// ═══════════════════════════════════════════════════════════════════════
// BUNDLES VIEW
// ═══════════════════════════════════════════════════════════════════════
function renderBundles() {
  const cont = document.getElementById('content');
  cont.innerHTML = `
    <div style="margin-bottom:20px">
      <div class="eyebrow" style="margin-bottom:8px">Library</div>
      <div class="display">Bundles</div>
      <div class="muted body-sm" style="margin-top:8px;max-width:620px">Bundles tag a deck with House Style, Domain Pack, and Deck Type for organisation. In v2.0.4 they no longer auto-generate content — you paste your own text.</div>
    </div>
    <div class="template-grid">
      ${state.bundles.map(b => {
        const hs = state.templates.house_style.find(t => t.id === b.house_style);
        const dp = state.templates.domain_pack.find(t => t.id === b.domain_pack);
        const dt = state.templates.deck_type.find(t => t.id === b.deck_type);
        return `
          <div class="template-card">
            <div class="template-card-header">
              <div class="template-card-name">${escapeHtml(b.name)}</div>
              <span class="badge badge-info mono">v${b.version}</span>
            </div>
            <div class="template-card-desc">${escapeHtml(b.description)}</div>
            <div style="font-size:11px;color:var(--text-muted);line-height:1.7">
              <div>Style: ${escapeHtml(hs ? hs.name : '—')}</div>
              <div>Domain: ${escapeHtml(dp ? dp.name : '—')}</div>
              <div>Type: ${escapeHtml(dt ? dt.name : '—')}</div>
            </div>
          </div>`;
      }).join('')}
    </div>`;
}

// ═══════════════════════════════════════════════════════════════════════
// TEMPLATES VIEW
// ═══════════════════════════════════════════════════════════════════════
function renderTemplates() {
  const cont = document.getElementById('content');
  const tab = state.templatesTab;
  const items = state.templates[tab];
  cont.innerHTML = `
    <div style="margin-bottom:20px">
      <div class="eyebrow" style="margin-bottom:8px">Layer library</div>
      <div class="display">Templates</div>
      <div class="muted body-sm" style="margin-top:8px">Reference templates for House Style, Domain Pack, and Deck Type. Read-only in this build.</div>
    </div>
    <div class="tabs">
      <button class="tab ${tab === 'house_style' ? 'active' : ''}" data-tab="house_style">House Style <span class="subtle mono" style="margin-left:6px">${state.templates.house_style.length}</span></button>
      <button class="tab ${tab === 'domain_pack' ? 'active' : ''}" data-tab="domain_pack">Domain Pack <span class="subtle mono" style="margin-left:6px">${state.templates.domain_pack.length}</span></button>
      <button class="tab ${tab === 'deck_type' ? 'active' : ''}" data-tab="deck_type">Deck Type <span class="subtle mono" style="margin-left:6px">${state.templates.deck_type.length}</span></button>
    </div>
    <div class="template-grid">
      ${items.map(t => `
        <div class="template-card">
          <div class="template-card-header">
            <div class="template-card-name">${escapeHtml(t.name)}</div>
            <span class="badge badge-info mono">v${t.version}</span>
          </div>
          <div class="template-card-desc">${escapeHtml(t.description)}</div>
          ${tab === 'house_style' && t.palette ? `<div class="swatches" style="margin-bottom:10px">${t.palette.map(c => `<div class="swatch" style="background:${c}"></div>`).join('')}</div>` : ''}
          <div class="template-card-footer">
            <span>Updated ${escapeHtml(t.updated_at)}</span>
            <span>${escapeHtml(t.id)}</span>
          </div>
        </div>`).join('')}
    </div>`;
  document.querySelectorAll('.tab').forEach(el => el.onclick = () => { state.templatesTab = el.dataset.tab; renderTemplates(); });
}

// ═══════════════════════════════════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════════════════════════════════
function renderSettings() {
  const cont = document.getElementById('content');
  const oai = state.apiKeys.openai ? (state.apiKeys.openai.slice(0,7) + '…' + state.apiKeys.openai.slice(-4)) : '';
  const ant = state.apiKeys.anthropic ? (state.apiKeys.anthropic.slice(0,10) + '…' + state.apiKeys.anthropic.slice(-4)) : '';
  cont.innerHTML = `
    <div style="margin-bottom:24px">
      <div class="eyebrow" style="margin-bottom:8px">Configuration</div>
      <div class="display">Settings</div>
      <div class="muted body-sm" style="margin-top:8px">API keys, logo, runtime configuration. Settings live in memory only (cleared on reload).</div>
    </div>

    <div class="section">
      <div class="section-header"><div class="h1">Brand logo</div></div>
      <div class="card">
        <div class="field">
          <label class="field-label">Logo image <span class="subtle">PNG with transparent background recommended</span></label>
          <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
            <div class="logo-preview">${state.logoB64 ? `<img src="data:image/png;base64,${state.logoB64}" alt="logo preview">` : '<span class="subtle" style="color:#71717a;font-size:11px;font-family:var(--mono)">no logo</span>'}</div>
            <div style="display:flex;gap:6px">
              <input type="file" id="logoFile" accept=".png,image/png" style="display:none">
              <button class="btn-secondary" id="uploadLogoBtn">Upload PNG</button>
              ${state.logoIsCustom ? '<button class="btn-ghost" id="clearLogoBtn">Reset to default</button>' : ''}
            </div>
          </div>
          <div class="field-hint" style="margin-top:10px">Logo is stamped onto each generated slide image at .pptx assembly time. Use a roughly 4:1 aspect ratio logo with cyan/white strokes for best results on dark backgrounds. ${state.logoB64 ? '<span class="badge badge-success" style="margin-left:6px">' + (state.logoIsCustom ? 'Custom logo' : 'Default DN logo') + '</span>' : '<span class="badge badge-warning" style="margin-left:6px">No logo loaded</span>'}</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header"><div class="h1">Anthropic</div></div>
      <div class="card">
        <div class="field">
          <label class="field-label">API key <span class="subtle">required for AI polish</span></label>
          <div class="api-key-row">
            <input class="input" id="anthropicKey" type="password" placeholder="sk-ant-..." value="${escapeHtml(state.apiKeys.anthropic)}" autocomplete="off">
            <button class="btn-secondary" id="saveAntBtn">Save</button>
            ${state.apiKeys.anthropic ? '<button class="btn-ghost" id="clearAntBtn">Clear</button>' : ''}
          </div>
          <div class="field-hint"><span class="mono">claude-sonnet-4-5</span> · used for shorten / expand / auto-split. ${state.apiKeys.anthropic ? 'Current: <span class="mono">' + escapeHtml(ant) + '</span>' : 'Not set.'}</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header"><div class="h1">OpenAI</div></div>
      <div class="card">
        <div class="field">
          <label class="field-label">API key <span class="subtle">required for image generation</span></label>
          <div class="api-key-row">
            <input class="input" id="openaiKey" type="password" placeholder="sk-..." value="${escapeHtml(state.apiKeys.openai)}" autocomplete="off">
            <button class="btn-secondary" id="saveKeyBtn">Save</button>
            ${state.apiKeys.openai ? '<button class="btn-ghost" id="clearKeyBtn">Clear</button>' : ''}
          </div>
          <div class="field-hint">Default model: <span class="mono">gpt-image-2</span> with auto-fallback to <span class="mono">gpt-image-1</span> if unavailable. ${state.apiKeys.openai ? 'Current: <span class="mono">' + escapeHtml(oai) + '</span>' : 'Not set.'}</div>
        </div>
        <div class="field">
          <label class="field-label">Organization ID <span class="subtle">optional</span></label>
          <div class="api-key-row">
            <input class="input" id="openaiOrg" type="text" placeholder="org-..." value="${escapeHtml(state.apiKeys.openai_org)}" autocomplete="off">
            <button class="btn-secondary" id="saveOrgBtn">Save</button>
            ${state.apiKeys.openai_org ? '<button class="btn-ghost" id="clearOrgBtn">Clear</button>' : ''}
          </div>
        </div>
        <div class="field">
          <label class="field-label">Image model</label>
          <select class="select" id="imgModelSel">
            <option value="gpt-image-2" ${state.imageModel === 'gpt-image-2' ? 'selected' : ''}>gpt-image-2 (default)</option>
            <option value="gpt-image-1" ${state.imageModel === 'gpt-image-1' ? 'selected' : ''}>gpt-image-1 (fallback)</option>
          </select>
          <div class="field-hint">Currently using <span class="mono">${state.imageModel}</span>${state.imageModelFellBack ? ' (auto-fell back from gpt-image-2)' : ''}</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header"><div class="h1">Runtime</div></div>
      <div class="card">
        <dl class="kv">
          <dt>Version</dt><dd><span class="mono">2.0.5</span> (build #12 — logo halo fix, cost captions, bundles, customer logo)</dd>
          <dt>Polish model</dt><dd><span class="mono">claude-sonnet-4-5-20250929</span></dd>
          <dt>Image model</dt><dd><span class="mono">${state.imageModel}</span> · 1536×1024</dd>
          <dt>PPTX engine</dt><dd>PptxGenJS 3.12 (in-browser)</dd>
          <dt>Logo</dt><dd>${state.logoB64 ? '<span class="badge badge-success">Loaded</span>' : '<span class="badge badge-warning">Not loaded</span>'} ${state.logoIsCustom ? '(custom)' : '(default)'}</dd>
          <dt>Storage</dt><dd>In-memory only · download via browser</dd>
        </dl>
      </div>
    </div>

    <div class="section">
      <div class="section-header"><div class="h1">Out of scope (deferred)</div></div>
      <div class="card">
        <dl class="kv">
          <dt>v2.0.5</dt><dt></dt><dd>Slide reordering · per-slide image upload · speaker notes editor · OneDrive upload</dd>
          <dt>v2.1</dt><dd>Multi-LLM comparison</dd>
          <dt>v2.2</dt><dd>Approval workflow</dd>
        </dl>
      </div>
    </div>`;

  document.getElementById('uploadLogoBtn').onclick = () => document.getElementById('logoFile').click();
  document.getElementById('logoFile').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    if (!/png/i.test(file.type)) { toast({ type: 'error', message: 'PNG only' }); return; }
    const fr = new FileReader();
    fr.onload = () => {
      state.logoB64 = fr.result.split(',')[1];
      state.logoIsCustom = true;
      toast({ type: 'success', message: 'Logo uploaded' });
      renderSettings();
    };
    fr.readAsDataURL(file);
  };
  const clrLogo = document.getElementById('clearLogoBtn');
  if (clrLogo) clrLogo.onclick = async () => {
    state.logoIsCustom = false;
    state.logoB64 = await loadDefaultLogo();
    toast({ type: 'info', message: 'Reset to default DN logo' });
    renderSettings();
  };

  document.getElementById('saveKeyBtn').onclick = () => {
    const v = (document.getElementById('openaiKey').value || '').trim();
    if (!v) { toast({ type: 'error', message: 'Enter a key' }); return; }
    if (!v.startsWith('sk-')) { toast({ type: 'error', message: 'OpenAI key must start with sk-' }); return; }
    state.apiKeys.openai = v;
    toast({ type: 'success', message: `Saved · ends …${v.slice(-4)}` });
    renderSettings();
  };
  const ck = document.getElementById('clearKeyBtn');
  if (ck) ck.onclick = () => { state.apiKeys.openai = ''; renderSettings(); toast({ type: 'info', message: 'Cleared' }); };

  document.getElementById('saveAntBtn').onclick = () => {
    const v = (document.getElementById('anthropicKey').value || '').trim();
    if (!v) { toast({ type: 'error', message: 'Enter a key' }); return; }
    if (!v.startsWith('sk-ant-')) { toast({ type: 'error', message: 'Anthropic key must start with sk-ant-' }); return; }
    state.apiKeys.anthropic = v;
    toast({ type: 'success', message: `Saved · ends …${v.slice(-4)}` });
    renderSettings();
  };
  const ca = document.getElementById('clearAntBtn');
  if (ca) ca.onclick = () => { state.apiKeys.anthropic = ''; renderSettings(); toast({ type: 'info', message: 'Cleared' }); };

  document.getElementById('saveOrgBtn').onclick = () => {
    state.apiKeys.openai_org = (document.getElementById('openaiOrg').value || '').trim();
    toast({ type: 'success', message: 'Org saved' });
    renderSettings();
  };
  const co = document.getElementById('clearOrgBtn');
  if (co) co.onclick = () => { state.apiKeys.openai_org = ''; renderSettings(); toast({ type: 'info', message: 'Cleared' }); };

  document.getElementById('imgModelSel').onchange = e => {
    state.imageModel = e.target.value;
    state.imageModelFellBack = false;
    toast({ type: 'info', message: `Image model set to ${state.imageModel}` });
    renderSettings();
  };
}

// ═══════════════════════════════════════════════════════════════════════
// MAIN ROUTING
// ═══════════════════════════════════════════════════════════════════════
document.getElementById('themeToggle').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = state.theme;
});
function setActiveNav() { document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === state.view)); }
document.querySelectorAll('.nav-btn').forEach(b => {
  b.addEventListener('click', () => { state.view = b.dataset.view; setActiveNav(); render(); });
});
function render() {
  if (state.view === 'compose') renderCompose();
  else if (state.view === 'bundles') renderBundles();
  else if (state.view === 'templates') renderTemplates();
  else renderSettings();
}

seedData();
const _storedCustomerLogo = safeGetCustomerLogo();
if (_storedCustomerLogo) {
  state.customerLogoB64 = _storedCustomerLogo;
  state.customerLogoEnabled = true;
}
render();
loadDefaultLogo().then(b => {
  if (b && !state.logoIsCustom) {
    state.logoB64 = b;
    console.log('Default DN logo loaded');
  } else if (!b) {
    console.warn('Default logo unavailable — upload one in Settings');
  }
});
</script>
</body>
</html>
