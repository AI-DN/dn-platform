function parseSlidesDetected(text) {
  if (!text || !text.trim()) return { slides: [], pattern: null };
  const lines = text.split(/\r?\n/);
  function buildChunks(markers) {
    const chunks = [];
    for (let i = 0; i < markers.length; i++) {
      const cur = markers[i]; const next = markers[i+1];
      const bodyLines = lines.slice(cur.idx + 1, next ? next.idx : lines.length);
      let title = (cur.title || '').replace(/^Slide\s+\d+\s*[—–:\-\.]?\s*/i, '').trim();
      if (!title) {
        for (let j = 0; j < bodyLines.length; j++) {
          const l = bodyLines[j].trim();
          if (!l) continue;
          if (/^title$/i.test(l)) continue;
          title = l.replace(/^#+\s*/, ''); bodyLines.splice(j, 1); break;
        }
      }
      while (bodyLines.length && /^\s*title\s*$/i.test(bodyLines[0])) bodyLines.shift();
      chunks.push({ title: title || ('Slide ' + (i+1)), bodyLines });
    }
    return chunks;
  }
  let chunks = []; let pattern = null;
  const h1Re = /^#\s+(.+?)\s*$/;
  const h1Markers = [];
  lines.forEach((line, idx) => { const m = line.match(h1Re); if (m) h1Markers.push({ idx, title: (m[1] || '').trim() }); });
  if (h1Markers.length >= 2) { pattern = 'h1'; chunks = buildChunks(h1Markers); }
  else {
    const slideNRe = /^\s*Slide\s+\d+\s*[—–:\-\.]?\s*(.*)$/i;
    const slideNMarkers = [];
    lines.forEach((line, idx) => { const m = line.match(slideNRe); if (m) slideNMarkers.push({ idx, title: (m[1] || '').trim() }); });
    if (slideNMarkers.length >= 2) { pattern = 'slide_n'; chunks = buildChunks(slideNMarkers); }
    else {
      const h2Re = /^##\s+(.+?)\s*$/;
      const h2Markers = [];
      lines.forEach((line, idx) => { const m = line.match(h2Re); if (m) h2Markers.push({ idx, title: (m[1] || '').trim() }); });
      if (h2Markers.length >= 2) { pattern = 'h2'; chunks = buildChunks(h2Markers); }
      else if (/^\s*---\s*$/m.test(text)) {
        pattern = 'hr';
        const segments = text.split(/^\s*---\s*$/m).map(s => s.trim()).filter(Boolean);
        chunks = segments.map((seg, i) => {
          const segLines = seg.split(/\r?\n/);
          const firstNonEmpty = segLines.findIndex(l => l.trim().length > 0);
          const title = firstNonEmpty >= 0 ? segLines[firstNonEmpty].replace(/^#+\s*/, '').replace(/^Slide\s+\d+[:.]?\s*/i, '').trim() : `Slide ${i+1}`;
          const bodyLines = firstNonEmpty >= 0 ? segLines.slice(firstNonEmpty + 1) : [];
          return { title: title || `Slide ${i+1}`, bodyLines };
        });
      } else return { slides: null, pattern: null };
    }
  }
  const slides = chunks.map(c => ({ title: c.title, body: c.bodyLines.join('\n').trim(), speakerNotes: '', prevSpeakerNotes: null, notesExpanded: false, rewritingNotes: false, imageB64: null, imagePrompt: null, lastPrompt: null, status: 'idle', error: null, regenCount: 0, costAccrued: 0, modelUsed: null }));
  return { slides, pattern };
}

async function polishWithClaude(_unused, mode) {
  const key = (state.apiKeys.anthropic || '').trim();
  if (!key) throw new Error('NO_ANTHROPIC_KEY: Set Anthropic API key in Settings.');
  const rawText = state.rawText || '';
  const min = state.slideMin, max = state.slideMax;
  const target = Math.round((min + max) / 2);
  const modeInstruction = {
    shorten: 'Aggressively shorten each slide.',
    expand:  'Expand each slide with supporting bullets.',
    preserve:'Preserve the wording where reasonable.',
    split:   'Split this raw text into a logical slide deck.'
  }[mode] || 'Reshape the input into a clean slide deck.';
  const baseSystem = `You are a presentation editor for Digitata Networks.\n\nCRITICAL: Return exactly between ${min} and ${max} slides. Aim for ${target}.\n\nMode: ${mode}\nInstruction: ${modeInstruction}\n\nReturn ONLY valid JSON, no markdown fences:\n{"slides":[{"title":"...","body":"..."}]}`;
  const userPrompt = `Produce between ${min} and ${max} slides.\n\nRAW:\n${rawText}`;
  const modelName = 'claude-sonnet-4-5-20250929';
  async function callClaude(sys) {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: modelName, max_tokens: 4000, system: sys, messages: [{ role: 'user', content: userPrompt }] })
    });
    if (!resp.ok) { const err = await resp.text(); throw new Error(`Claude ${resp.status}: ${err.slice(0,300)}`); }
    const data = await resp.json();
    if (data.usage) { const cost = getAnthropicCost(modelName, data.usage.input_tokens || 0, data.usage.output_tokens || 0); deckCost.polish += cost; renderCostBadge(); }
    const raw = data.content[0].text;
    return JSON.parse(raw.replace(/```json|```/g, '').trim()).slides || [];
  }
  let attempt = 0; let lastSlides = null;
  while (attempt < 3) {
    attempt++;
    const sys = attempt === 1 ? baseSystem : `${baseSystem}\n\nPREVIOUS ATTEMPT RETURNED ${lastSlides ? lastSlides.length : '?'} SLIDES. Must be ${min}–${max}.`;
    let result;
    try { result = await callClaude(sys); } catch (e) { if (attempt >= 3) throw e; continue; }
    lastSlides = result;
    const n = result.length;
    if (n >= min && n <= max) return result;
    if (attempt >= 3) { toast({ type: 'warning', message: `AI returned ${n} slides (target ${min}–${max}).` }); return result; }
  }
  throw new Error('Polish failed');
}

function polishedToSlides(polished) {
  return polished.map(p => {
    let body = '';
    if (typeof p.body === 'string' && p.body.trim()) body = p.body.replace(/^\s*\*\s+/gm, '• ');
    else { const parts = []; if (p.subheadline) parts.push(p.subheadline); if (Array.isArray(p.bullets) && p.bullets.length) parts.push(...p.bullets.map(b => '• ' + b)); body = parts.join('\n'); }
    return { title: p.title || 'Untitled', body, speakerNotes: '', prevSpeakerNotes: null, notesExpanded: false, rewritingNotes: false, imageB64: null, imagePrompt: null, lastPrompt: null, status: 'idle', error: null, regenCount: 0, costAccrued: 0, modelUsed: null };
  });
}

function composeSkillPrompt(skill, slide) {

  if (!slide) return base;
  return base + '\n\nSLIDE-SPECIFIC CONTENT:\nTitle: ' + slide.title + '\n\nBody:\n' + (slide.body || '(no body)') + '\n\nRender visually with title prominent, body as structured elements.';
}
function composeSkillPromptPreview(skill) { return composeSkillPrompt(skill, null); }

function blobToBase64(blob) { return new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(',')[1]); fr.readAsDataURL(blob); }); }

async function generateImageWithProvider(providerKey, modelKey, qualityKey, fullPrompt) {
  switch (providerKey) {
    case 'openai': return await generateOpenAIImage(modelKey, qualityKey, fullPrompt);
    case 'google': return await generateGoogleImage(modelKey, fullPrompt);
    default: throw new Error(`Unknown provider: ${providerKey}`);
  }
}

async function generateOpenAIImage(model, quality, prompt) {
  const apiKey = (state.apiKeys.openai || '').trim();
  if (!apiKey) throw new Error('NO_OPENAI_KEY: Set OpenAI API key in Settings.');
  if (!apiKey.startsWith('sk-')) throw new Error('BAD_OPENAI_KEY: must start with sk-');
  const q = quality || state.imageQuality || 'high';
  const body = (model === 'gpt-image-2')
    ? { model, prompt, size: '1536x1024', quality: q, n: 1, output_format: 'jpeg' }
    : { model, prompt, size: '1536x1024', quality: q, n: 1 };
  const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
  const org = (state.apiKeys.openai_org || '').trim();
  if (org) headers['OpenAI-Organization'] = org;
  const resp = await fetch('https://api.openai.com/v1/images/generations', { method: 'POST', headers, body: JSON.stringify(body) });
  if (!resp.ok) { const t = await resp.text(); throw new Error(`OpenAI ${model} ${resp.status}: ${t.slice(0,300)}`); }
  const data = await resp.json();
  const item = data.data[0];
  if (item.b64_json) return item.b64_json;
  if (item.url) { const r2 = await fetch(item.url); const blob = await r2.blob(); return await blobToBase64(blob); }
  throw new Error('OpenAI response missing b64_json/url');
}

async function generateGoogleImage(model, prompt) {
  const apiKey = (state.apiKeys.gemini || '').trim();
  if (!apiKey) throw new Error('NO_GEMINI_KEY: Set Gemini API key in Settings.');
  const MODEL_ROUTE = {
    'imagen-4-fast':           { id: 'imagen-4.0-fast-generate-001',       kind: 'imagen' },
    'imagen-4':                { id: 'imagen-4.0-generate-001',            kind: 'imagen' },
    'imagen-4-ultra':          { id: 'imagen-4.0-ultra-generate-001',      kind: 'imagen' },
    'gemini-2.5-flash-image':  { id: 'gemini-2.5-flash-image',             kind: 'gemini' },
    'gemini-3-flash-image':    { id: 'gemini-3.1-flash-image-preview',     kind: 'gemini' },
    'gemini-3-pro-image':      { id: 'gemini-3-pro-image-preview',         kind: 'gemini' }
  };
  const route = MODEL_ROUTE[model];
  if (!route) throw new Error(`Unknown Google model: ${model}`);
  if (route.kind === 'imagen') {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${route.id}:predict?key=${encodeURIComponent(apiKey)}`;
    const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instances: [{ prompt }], parameters: { sampleCount: 1, aspectRatio: '16:9' } }) });
    if (!resp.ok) { const errText = await resp.text(); throw new Error(`Google ${route.id} ${resp.status}: ${errText.slice(0,500)}`); }
    const data = await resp.json();
    const pred = data.predictions && data.predictions[0];
    if (!pred || !pred.bytesBase64Encoded) throw new Error(`${route.id} response missing bytesBase64Encoded`);
    return pred.bytesBase64Encoded;
  }
  if (route.kind === 'gemini') {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${route.id}:generateContent?key=${encodeURIComponent(apiKey)}`;
    const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseModalities: ['TEXT', 'IMAGE'] } }) });
    if (!resp.ok) { const errText = await resp.text(); throw new Error(`Google ${route.id} ${resp.status}: ${errText.slice(0,500)}`); }
    const data = await resp.json();
    const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
    const imgPart = parts.find(p => p.inlineData && p.inlineData.data);
    if (!imgPart) throw new Error(`${route.id} returned no image`);
    return imgPart.inlineData.data;
  }
  throw new Error(`Unhandled route kind: ${route.kind}`);
}

function modelLabel(provider, model, quality) {
  const row = allImageModels.find(c => c.provider === provider && c.model === model && (!quality || c.quality === quality));
  if (row && (row.label || row.display_name)) return row.label || row.display_name;
  return `${provider} / ${model}${quality ? ' (' + quality + ')' : ''}`;
}
function parseModelSpec(spec) { if (!spec) return null; const parts = spec.split(':'); return { provider: parts[0], model: parts[1], quality: parts[2] || null }; }
function currentEffectiveModel() { return parseModelSpec(state.selectedModel || state.defaultModel) || { provider: 'openai', model: 'gpt-image-2', quality: 'high' }; }

async function generateSlideImage(slide, customPromptOverride, overrideSpec) {
  const skill = state.selectedSkillId ? skillById(state.selectedSkillId) : null;
  const prompt = customPromptOverride || composeSkillPrompt(skill, slide);
  const spec = overrideSpec || currentEffectiveModel();
  const b64 = await generateImageWithProvider(spec.provider, spec.model, spec.quality, prompt);
  const cost = getImageCost(spec.provider, spec.model, '1536x1024', spec.quality);
  return { b64, prompt, cost, spec };
}

async function generateAllImages() {
  const max = 3;
  let idx = 0;
  const total = state.slides.length;
  const workers = [];
  for (let w = 0; w < Math.min(max, total); w++) {
    workers.push((async () => {
      while (idx < total) {
        const myIdx = idx++;
        const slide = state.slides[myIdx];
        if (slide.status === 'done') continue;
        slide.status = 'generating'; slide.error = null;
        renderStep5Slides();
        try {
          const { b64, prompt, cost, spec } = await generateSlideImage(slide);
          slide.imageB64 = b64; slide.imagePrompt = prompt; slide.lastPrompt = prompt;
          slide.status = 'done'; slide.costAccrued = (slide.costAccrued || 0) + cost; slide.modelUsed = spec;
          deckCost.image += cost;
          deckCost.imageDetails.push({ ...spec, cost, kind: 'slide' });
          renderCostBadge();
        } catch (err) { slide.status = 'error'; slide.error = err.message || String(err); }
        renderStep5Slides();
      }
    })());
  }
  await Promise.all(workers);
}

async function regenerateOne(idx, newPrompt) {
  const slide = state.slides[idx];
  slide.status = 'generating'; slide.error = null;
  renderStep5Slides();
  try {
    const { b64, prompt, cost, spec } = await generateSlideImage(slide, newPrompt);
    slide.imageB64 = b64; slide.imagePrompt = prompt; slide.lastPrompt = prompt;
    slide.status = 'done'; slide.regenCount++;
    slide.costAccrued = (slide.costAccrued || 0) + cost; slide.modelUsed = spec;
    deckCost.image += cost;
    deckCost.imageDetails.push({ ...spec, cost, kind: 'regen' });

  } catch (err) { slide.status = 'error'; slide.error = err.message || String(err); toast({ type: 'error', message: err.message }); }
  renderStep5Slides();
}

async function assemblePptx() {
  if (!window.__pptxReady || typeof PptxGenJS === 'undefined') { toast({ type: 'error', message: 'PptxGenJS still loading' }); return; }
  const prs = new PptxGenJS();
  prs.layout = 'LAYOUT_WIDE';
  const skill = state.selectedSkillId ? skillById(state.selectedSkillId) : null;
  const deckTitle = skill ? skill.name : 'DN Deck';
  prs.title = deckTitle; prs.subject = 'Digitata Networks'; prs.author = 'DN Deck Generator';
  const dnLogoB64 = state.logoB64;
  const customerLogoB64 = state.customerLogoEnabled ? state.customerLogoB64 : null;
  const showLogoBacking = !!state.logoBacking;
  const dnDims = dnLogoB64 ? await getImageDimensions(dnLogoB64) : null;
  const custDims = customerLogoB64 ? await getImageDimensions(customerLogoB64) : null;
  const LOGO_X_LEFT = 0.19, LOGO_Y = 0.17, LOGO_W = 1.69, LOGO_H_MAX = 0.75;
  const dnW = LOGO_W;
  const dnH = dnDims ? Math.min(LOGO_W * dnDims.aspect, LOGO_H_MAX) : 0.55;
  const custW = LOGO_W;
  const custH = custDims ? Math.min(LOGO_W * custDims.aspect, LOGO_H_MAX) : 0.55;
  const LOGO_X_RIGHT = 13.3 - LOGO_X_LEFT - custW;
  for (let i = 0; i < state.slides.length; i++) {
    const slide = state.slides[i];
    if (!slide.imageB64) continue;
    const s = prs.addSlide();
    s.addImage({ data: `data:image/jpeg;base64,${slide.imageB64}`, x: 0, y: 0, w: 13.3, h: 7.5 });
    if (showLogoBacking) {
      if (dnLogoB64) s.addShape(prs.ShapeType.roundRect, { x: LOGO_X_LEFT - 0.08, y: LOGO_Y - 0.06, w: dnW + 0.16, h: dnH + 0.12, fill: { color: '080C1A' }, line: { color: '080C1A', width: 0 }, rectRadius: 0.05 });
      if (customerLogoB64) s.addShape(prs.ShapeType.roundRect, { x: LOGO_X_RIGHT - 0.08, y: LOGO_Y - 0.06, w: custW + 0.16, h: custH + 0.12, fill: { color: '080C1A' }, line: { color: '080C1A', width: 0 }, rectRadius: 0.05 });
    }
    if (dnLogoB64) s.addImage({ data: `data:image/png;base64,${dnLogoB64}`, x: LOGO_X_LEFT, y: LOGO_Y, w: dnW, h: dnH });
    if (customerLogoB64) s.addImage({ data: `data:image/png;base64,${customerLogoB64}`, x: LOGO_X_RIGHT, y: LOGO_Y, w: custW, h: custH });
    const footerColor = getFooterColor(skill);
    s.addText(getFooterText(), { x: 0.5, y: 7.15, w: 12.3, h: 0.3, fontSize: 9, fontFace: 'Arial', color: footerColor, align: 'center', bold: false });
    const notesText = (slide.speakerNotes && slide.speakerNotes.trim()) ? slide.speakerNotes : (slide.body || '');
    if (notesText && notesText.trim()) s.addNotes(notesText);
  }
  const fileName = `${slugify(deckTitle)}-${dateStr()}.pptx`;
  const blob = await prs.write({ outputType: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  if (state.whitePaper.deckTitle !== deckTitle) {
    state.whitePaper.deckTitle = deckTitle;
    state.whitePaper.data = null;
    state.whitePaper.blob = null;
    state.whitePaper.status = 'idle';
    state.whitePaper.error = null;
    state.whitePaper.cost = 0;
    state.whitePaper.illustCost = 0;
    state.whitePaper.statusMsg = '';
    state.whitePaper.figuresTotal = 0;
    state.whitePaper.figuresDone = 0;
    state.whitePaper.illustTotal = 0;
    state.whitePaper.illustDone = 0;
    state.whitePaper.awaitingConfirm = false;
    state.whitePaper.includeIllustrations = true;
  }
  showDeckReadyModal(fileName, blob.size);
  if (state.customerLogoB64) { state.customerLogoB64 = null; state.customerLogoEnabled = false; }
}

  };
  const confirmFull = document.getElementById('wpConfirmFullBtn');
  if (confirmFull) confirmFull.onclick = () => { state.whitePaper.includeIllustrations = true; state.whitePaper.awaitingConfirm = false; continueWhitePaperBuild(); };
  const skipIllust = document.getElementById('wpSkipIllustBtn');
  if (skipIllust) skipIllust.onclick = () => { state.whitePaper.includeIllustrations = false; state.whitePaper.awaitingConfirm = false; continueWhitePaperBuild(); };

  if (cancelBtn) cancelBtn.onclick = () => {
    state.whitePaper.awaitingConfirm = false;
    state.whitePaper.status = 'idle';
    state.whitePaper.data = null;

async function generateWhitePaper() {
  if (!window.docx) {
    state.whitePaper.status = 'error';
    state.whitePaper.error = 'docx library failed to load from CDN. Refresh the page and try again.';
    refreshWhitePaperPanel();
    toast({ type: 'error', message: 'docx library not loaded — refresh the page' });
    return;
  }
  if (!window.mermaid) {
    toast({ type: 'info', message: 'Mermaid library not loaded — diagrams will ship as text-only error placeholders' });
  }
  const key = (state.apiKeys.anthropic || '').trim();
  if (!key) {
    state.whitePaper.status = 'error';
    state.whitePaper.error = 'NO_ANTHROPIC_KEY: Set Anthropic API key in Settings.';
    refreshWhitePaperPanel();
    return;
  }
  state.whitePaper.status = 'generating';
  state.whitePaper.error = null;
  state.whitePaper.figuresTotal = 0;
  state.whitePaper.figuresDone = 0;
  state.whitePaper.illustTotal = 0;
  state.whitePaper.illustDone = 0;
  state.whitePaper.illustCost = 0;
  state.whitePaper.statusMsg = 'Stage 1: Calling Claude to write paper sections…';
  refreshWhitePaperPanel();
  try {
    const paper = await callClaudeForWhitePaper(key);
    state.whitePaper.data = paper;
    // Enforce maxIllustrations cap defensively in case Claude exceeds it
    const illustSections = (paper.sections || []).filter(s => s.figure && s.figure.type === 'illustration');
    if (illustSections.length > state.maxIllustrations) {
      // Demote the excess to null
      for (let i = state.maxIllustrations; i < illustSections.length; i++) {
        illustSections[i].figure = null;
      }
      toast({ type: 'info', message: `Trimmed ${illustSections.length - state.maxIllustrations} excess illustration(s) to respect cap of ${state.maxIllustrations}` });
    }
    // Now show confirmation pre-flight
    state.whitePaper.awaitingConfirm = true;
    state.whitePaper.status = 'idle';
    refreshWhitePaperPanel();
  } catch (e) {
    console.error('White paper generation failed:', e);
    state.whitePaper.status = 'error';
    state.whitePaper.error = e.message || String(e);
    refreshWhitePaperPanel();
    toast({ type: 'error', message: e.message || 'White paper failed' });
  }
}

async function continueWhitePaperBuild() {
  const paper = state.whitePaper.data;
  if (!paper) return;
  state.whitePaper.status = 'generating';
  try {
    // If not including illustrations, null them out so they're skipped
    if (!state.whitePaper.includeIllustrations) {
      (paper.sections || []).forEach(s => {
        if (s.figure && s.figure.type === 'illustration') s.figure = null;
      });
    }
    const mermaidFigs = (paper.sections || []).filter(s => s.figure && s.figure.type === 'mermaid' && s.figure.syntax);
    const illustFigs = (paper.sections || []).filter(s => s.figure && s.figure.type === 'illustration' && s.figure.imagePrompt);
    state.whitePaper.figuresTotal = mermaidFigs.length;
    state.whitePaper.illustTotal = illustFigs.length;
    if (mermaidFigs.length > 0) {
      state.whitePaper.statusMsg = `Stage 2: Rendering Mermaid diagrams… (0 of ${mermaidFigs.length})`;
      refreshWhitePaperPanel();
      await prerenderFigures(paper);
    }
    if (illustFigs.length > 0) {
      state.whitePaper.statusMsg = `Stage 3: Generating illustrations… (0 of ${illustFigs.length})`;
      refreshWhitePaperPanel();
      await pregenerateIllustrations(paper);
    }
    state.whitePaper.statusMsg = 'Stage 4: Assembling .docx with DN branding…';
    refreshWhitePaperPanel();
    const blob = await assembleWhitePaperDocx(paper);
    state.whitePaper.blob = blob;
    state.whitePaper.status = 'done';
    state.whitePaper.statusMsg = 'Stage 5: Download ready.';
    refreshWhitePaperPanel();
    downloadWhitePaper(blob, state.whitePaper.deckTitle || paper.title);
    const renderedMermaid = (paper.sections || []).filter(s => s.figure && s.figure.type === 'mermaid' && s.figure.pngBytes).length;
    const renderedIllust = (paper.sections || []).filter(s => s.figure && s.figure.type === 'illustration' && s.figure.pngBytes).length;
    toast({ type: 'success', message: `White paper · ${renderedMermaid} diagram${renderedMermaid===1?'':'s'} · ${renderedIllust} illustration${renderedIllust===1?'':'s'} · ${fmtUsd4(state.whitePaper.cost + state.whitePaper.illustCost)}` });
  } catch (e) {
    console.error('White paper build failed:', e);
    state.whitePaper.status = 'error';
    state.whitePaper.error = e.message || String(e);
    refreshWhitePaperPanel();
    toast({ type: 'error', message: e.message || 'White paper build failed' });
  }
}

function injectSvgDimensions(svgString, targetWidth) {
  const vbMatch = svgString.match(/viewBox\s*=\s*["']([^"']+)["']/i);
  let aspectRatio = 0.75;
  if (vbMatch) {
    const parts = vbMatch[1].split(/[\s,]+/).map(Number);
    if (parts.length === 4 && parts[2] > 0) {
      aspectRatio = parts[3] / parts[2];
    }
  }
  const targetHeight = Math.round(targetWidth * aspectRatio);
  let s = svgString.replace(/<svg([^>]*)\swidth\s*=\s*["'][^"']*["']/i, '<svg$1');
  s = s.replace(/<svg([^>]*)\sheight\s*=\s*["'][^"']*["']/i, '<svg$1');
  s = s.replace(/<svg([^>]*)>/i, '<svg$1 width="' + targetWidth + '" height="' + targetHeight + '">');
  return { svg: s, width: targetWidth, height: targetHeight };
}

async function renderMermaidToPng(syntax, targetWidthPx) {
  if (!window.mermaid) throw new Error('Mermaid library not loaded');
  targetWidthPx = targetWidthPx || 1200;
  const id = 'mermaid-' + Math.random().toString(36).slice(2);
  let svgString;
  try {
    const result = await window.mermaid.render(id, syntax);
    svgString = result.svg;
  } catch (e) {
    throw new Error('Mermaid parse error: ' + (e.message || String(e)));
  }
  const sized = injectSvgDimensions(svgString, targetWidthPx);
  const dataUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(sized.svg)));
  return new Promise(function(resolve, reject) {
    const timeoutId = setTimeout(function() {
      reject(new Error('SVG rasterization timed out after 10s'));
    }, 10000);
    const img = new Image();
    img.onload = function() {
      clearTimeout(timeoutId);
      try {
        const canvas = document.createElement('canvas');
        canvas.width = sized.width;
        canvas.height = sized.height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function(pngBlob) {
          if (!pngBlob) return reject(new Error('Canvas toBlob returned null'));
          const reader = new FileReader();
          reader.onload = function() {
            resolve({ bytes: new Uint8Array(reader.result), width: sized.width, height: sized.height });
          };
          reader.onerror = function() { reject(new Error('FileReader failed')); };
          reader.readAsArrayBuffer(pngBlob);
        }, 'image/png');
      } catch (err) { reject(err); }
    };
    img.onerror = function() {
      clearTimeout(timeoutId);
      reject(new Error('Image load failed for Mermaid SVG'));
    };
    img.src = dataUrl;
  });
}

async function prerenderFigures(paper) {
  let done = 0;
  for (const sec of paper.sections) {
    if (sec.figure && sec.figure.type === 'mermaid' && sec.figure.syntax) {
      try {
        const out = await renderMermaidToPng(sec.figure.syntax, 1200);
        sec.figure.pngBytes = out.bytes;
        sec.figure.pngWidth = out.width;
        sec.figure.pngHeight = out.height;
      } catch (e) {
        console.warn('Mermaid render failed for section "' + sec.heading + '":', e.message);
        sec.figure.renderError = e.message;
      }
      done++;
      state.whitePaper.figuresDone = done;
      state.whitePaper.statusMsg = `Stage 2: Rendering Mermaid diagrams… (${done} of ${state.whitePaper.figuresTotal})`;
      const el = document.getElementById('wpStatusText');
      if (el) el.textContent = state.whitePaper.statusMsg;
    }
  }
}

async function generateWhitePaperIllustration(prompt) {

  const b64 = await generateImageWithProvider(spec.provider, spec.model, spec.quality, augmentedPrompt);

async function pregenerateIllustrations(paper) {
  const sections = (paper.sections || []).filter(s => s.figure && s.figure.type === 'illustration' && s.figure.imagePrompt);
  let done = 0;
  for (const sec of sections) {
    try {
      const { b64, cost, spec } = await generateWhitePaperIllustration(sec.figure.imagePrompt);
      const binStr = atob(b64);
      const bytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
      sec.figure.imageBase64 = b64;
      sec.figure.pngBytes = bytes;
      sec.figure.pngWidth = 1536;
      sec.figure.pngHeight = 1024;
      sec.figure.modelUsed = spec;
      state.whitePaper.illustCost += cost;
      deckCost.whitePaperIllust += cost;
      deckCost.imageDetails.push({ ...spec, cost, kind: 'wp-illust' });
      renderCostBadge();
    } catch (e) {
      console.warn('Illustration gen failed for section "' + sec.heading + '":', e);
      sec.figure.renderError = e.message || String(e);
    }
    done++;
    state.whitePaper.illustDone = done;
    state.whitePaper.statusMsg = `Stage 3: Generating illustrations… (${done} of ${state.whitePaper.illustTotal})`;
    const el = document.getElementById('wpStatusText');
    if (el) el.textContent = state.whitePaper.statusMsg;
  }
}

async function callClaudeForWhitePaper(key) {
  const deckTitle = state.whitePaper.deckTitle || (state.selectedSkillId ? (skillById(state.selectedSkillId) || {}).name : 'Untitled') || 'Untitled';
  const maxIll = state.maxIllustrations;
  const wpSystemPrompt = `You are a senior content strategist at Digitata Networks, a telco software and managed-services company. You write polished white papers that customers read AFTER a sales or technical meeting — readers who want depth beyond the slide deck.

Voice and style:
- Professional, evidence-led, confident but not boastful
- Telco/enterprise vocabulary used precisely, no marketing fluff
- Concrete, specific, anchored in operational reality
- Short paragraphs (3–5 sentences). Vary sentence length.
- British English spelling (Digitata Networks is South Africa-based serving global telcos)

Structure the paper as:
1. Executive Summary (~200 words) — what the paper argues, who should read it, the takeaway
2. Introduction / Context (~250 words) — the landscape, why this topic matters now
3. One section per slide (each ~350–500 words) — slide title becomes the section heading; expand the slide content into a flowing argument with examples, implications, and evidence-led reasoning
4. Conclusion (~250 words) — synthesise the argument, leave the reader with a clear position
5. About Digitata Networks (~150 words) — brief boilerplate: telco software + managed services, 25+ years, global telco customers, focus on revenue uplift and ops excellence

Each section's expansion must:
- Use the slide's title and body as the seed
- Use the speakerNotes (if present) as additional context
- NOT just rephrase the slide — expand it. Add the reasoning a presenter would say aloud, the implications a reader would want, the examples that make it concrete
- Stay anchored to the slide's intent — do not invent unrelated claims

FIGURES — three options per section: "mermaid", "illustration", or null.

Use a MERMAID DIAGRAM (free) when the section describes:
  - A flow or process (use flowchart)
  - A sequence of interactions between systems or people (use sequenceDiagram)
  - A state machine or lifecycle (use stateDiagram-v2)
  - A data model or entity relationships (use erDiagram)
  - A user journey (use journey)
  - A breakdown of proportions (use pie)
  - A timeline of activities (use gantt)

Use an ILLUSTRATION (costs ~$0.30 each, BUDGET ${maxIll} MAX FOR WHOLE PAPER) when the section:
  - Opens or closes the paper (Executive Summary, Conclusion) and would benefit from a hero image
  - Discusses a conceptual or evocative topic where a diagram would feel reductive (e.g. customer experience, brand transformation, future-of-X)
  - Would echo or complement a slide's visual style

Use NO FIGURE (figure: null) when:
  - The content is short and self-contained (About DN boilerplate)
  - The text already paints a strong picture
  - Neither a diagram nor an illustration would add meaningful value

CRITICAL BUDGET RULE: You may propose AT MOST ${maxIll} illustration${maxIll===1?'':'s'} in the entire paper. Pick the ${maxIll} sections where an illustration adds the most narrative value (typically Executive Summary, the most evocative deep section, and/or Conclusion). Mermaid diagrams are unlimited.

Mermaid syntax rules:
  - Keep diagrams readable: 5–12 nodes maximum
  - Use clear labels (short phrases, not full sentences)
  - Use --> for directional flow, --- for undirected connections
  - For flowcharts, use direction TB (top-to-bottom) by default; LR (left-to-right) for wider concepts
  - For sequenceDiagram, use 3–7 actors maximum
  - Escape any quotes inside labels — Mermaid breaks on raw quotes
  - DO NOT use HTML inside Mermaid labels
  - Test mentally: the diagram should be parseable by mermaid.js v10

Illustration prompt rules:
  - Write 30–80 words in the same style as the slide image prompts
  - Focus on mood, composition, and core visual concept — not literal depiction of the text
  - Anchor to DN brand palette: dark navy, cyan accents, professional editorial style
  - Single subject preferred — avoid busy compositions
  - No quotes inside the prompt string
  - No text overlays, no logos

Output format: a strict JSON object with this shape:
{
  "title": "string — the paper's title (use deck title)",
  "subtitle": "string — short tagline, optional",
  "sections": [
    {
      "heading": "string",
      "body": "string — paragraphs separated by \\n\\n",
      "figure": null OR {
        "type": "mermaid" OR "illustration",
        "caption": "string — short caption shown below the figure",
        "syntax": "string — valid Mermaid syntax (ONLY when type is mermaid)",
        "imagePrompt": "string — image-gen prompt (ONLY when type is illustration; 30–80 words)"
      }
    }
  ]
}

No prose outside the JSON. No markdown fences. Just the JSON object.`;
  const slidesContext = state.slides.map((s, i) => {
    return `SLIDE ${i + 1}: ${s.title}\nBody:\n${s.body || '(empty)'}\nSpeaker notes:\n${s.speakerNotes || '(empty)'}\n`;
  }).join('\n---\n\n');
  const wpUserPrompt = `Deck title: ${deckTitle}\n\n${slidesContext}\n\nFigure budget for this paper:\n- Mermaid diagrams: unlimited (free)\n- Illustrations: maximum ${maxIll} (each costs ~$0.30, so the user wants you to be selective)\n\nIf you propose more than ${maxIll} illustrations, the user will reject the paper. Pick the ${maxIll} sections where an illustration adds the most narrative value (typically Executive Summary, opening-of-deep-section, Conclusion).\n\nGenerate the companion white paper now. Return JSON only.`;
  const modelName = 'claude-sonnet-4-5-20250929';
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: modelName, max_tokens: 16000, system: wpSystemPrompt, messages: [{ role: 'user', content: wpUserPrompt }] })
  });
  if (!resp.ok) { const err = await resp.text(); throw new Error(`Claude ${resp.status}: ${err.slice(0,400)}`); }
  const data = await resp.json();
  if (data.usage) {
    const cost = getAnthropicCost(modelName, data.usage.input_tokens || 0, data.usage.output_tokens || 0);
    state.whitePaper.cost = cost;
    deckCost.whitePaper += cost;
    renderCostBadge();
  }
  const reply = data.content[0].text || '';
  return parseWhitePaper(reply);
}

function parseWhitePaper(reply) {
  const cleaned = reply.trim().replace(/^```(?:json)?\s*/, '').replace(/```\s*$/, '');
  try {
    const obj = JSON.parse(cleaned);
    if (!obj.sections || !Array.isArray(obj.sections)) throw new Error('Missing sections array');
    return obj;
  } catch (e) {
    console.error('Failed to parse white paper response:', e, cleaned.slice(0, 500));
    throw new Error('Claude returned malformed white paper JSON. Try again or check the console for details.');
  }
}

async function assembleWhitePaperDocx(paper) {
  if (!window.docx) throw new Error('docx library not loaded');
  const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType,
          Footer, Header, ImageRun, PageNumber, NumberFormat } = window.docx;

  const logoB64Raw = safeStorage.getItem('dn_logo_b64') || state.logoB64 || '';
  const logoB64 = logoB64Raw.replace(/^data:image\/\w+;base64,/, '');
  let logoBytes = null;
  if (logoB64) {
    try { logoBytes = Uint8Array.from(atob(logoB64), c => c.charCodeAt(0)); } catch (e) { console.warn('Logo decode failed', e); logoBytes = null; }
  }

  const titleParas = [
    new Paragraph({
      alignment: AlignmentType.LEFT,
      spacing: { before: 600, after: 200 },
      children: [
        new TextRun({ text: paper.title || 'Companion White Paper', font: 'Syne', bold: true, size: 56, color: '07091A' })
      ]
    })
  ];
  if (paper.subtitle) {
    titleParas.push(new Paragraph({
      alignment: AlignmentType.LEFT,
      spacing: { after: 600 },
      children: [
        new TextRun({ text: paper.subtitle, font: 'DM Sans', size: 24, color: '6B7280', italics: true })
      ]
    }));
  }

  const sectionParas = [];
  paper.sections.forEach((sec) => {
    sectionParas.push(new Paragraph({
      heading: HeadingLevel.HEADING_1,
      spacing: { before: 480, after: 200 },
      children: [
        new TextRun({ text: sec.heading, font: 'Syne', bold: true, size: 32, color: '07091A' })
      ]
    }));
    const bodyParas = (sec.body || '').split(/\n\n+/).filter(p => p.trim());
    bodyParas.forEach(p => {
      sectionParas.push(new Paragraph({
        spacing: { after: 200, line: 320 },
        children: [
          new TextRun({ text: p.trim(), font: 'DM Sans', size: 22, color: '1F2937' })
        ]
      }));
    });

    if (sec.figure && sec.figure.pngBytes) {
      const targetWidthPts = 500;
      const w = sec.figure.pngWidth || 1200;
      const h = sec.figure.pngHeight || 900;
      const ratio = h / w;
      const targetHeightPts = Math.max(80, Math.min(650, Math.round(targetWidthPts * ratio)));
      sectionParas.push(new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 240, after: 120 },
        children: [
          new ImageRun({
            data: sec.figure.pngBytes,
            transformation: { width: targetWidthPts, height: targetHeightPts }
          })
        ]
      }));
      if (sec.figure.caption) {
        const figLabel = sec.figure.type === 'illustration' ? 'Illustration: ' : 'Figure: ';
        sectionParas.push(new Paragraph({
          alignment: AlignmentType.CENTER,
          spacing: { after: 240 },
          children: [
            new TextRun({ text: figLabel + sec.figure.caption, font: 'DM Sans', size: 18, color: '6B7280', italics: true })
          ]
        }));
      }
    } else if (sec.figure && sec.figure.renderError) {
      const figKind = sec.figure.type === 'illustration' ? 'Illustration' : 'Diagram';
      sectionParas.push(new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 120, after: 240 },
        children: [
          new TextRun({ text: '[' + figKind + ' could not be rendered: ' + sec.figure.renderError + ']', font: 'DM Sans', size: 16, color: 'D14343', italics: true })
        ]
      }));
    }
  });

  const headerChildren = [];
  if (logoBytes) {
    headerChildren.push(new Paragraph({
      alignment: AlignmentType.LEFT,
      children: [
        new ImageRun({ data: logoBytes, transformation: { width: 100, height: 35 } })
      ]
    }));
  }

  const footerPara = new Paragraph({
    alignment: AlignmentType.CENTER,
    children: [
      new TextRun({
        text: `© ${new Date().getFullYear()} Digitata Networks. All rights reserved. — Page `,
        font: 'DM Sans', size: 16, color: '9CA3AF'
      }),
      new TextRun({ children: [PageNumber.CURRENT], font: 'DM Sans', size: 16, color: '9CA3AF' }),
      new TextRun({ text: ' of ', font: 'DM Sans', size: 16, color: '9CA3AF' }),
      new TextRun({ children: [PageNumber.TOTAL_PAGES], font: 'DM Sans', size: 16, color: '9CA3AF' })
    ]
  });

  const doc = new Document({
    creator: 'Digitata Networks',
    title: paper.title || 'Companion White Paper',
    description: 'Generated by DN Deck Generator',
    styles: {
      default: {
        document: { run: { font: 'DM Sans', size: 22 } }
      }
    },
    sections: [{
      properties: {
        page: {
          margin: { top: 1080, bottom: 1080, left: 1080, right: 1080 },
          pageNumbers: { start: 1, formatType: NumberFormat.DECIMAL }
        }
      },
      headers: { default: new Header({ children: headerChildren }) },
      footers: { default: new Footer({ children: [footerPara] }) },
      children: [...titleParas, ...sectionParas]
    }]
  });

  const blob = await Packer.toBlob(doc);
  return blob;
}

function downloadWhitePaper(blob, title) {
  const slug = (title || 'companion-white-paper').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${slug}-white-paper.docx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function runMockupGenerations() {
  if (state.modelPicker.inFlight) return;
  const slide = state.slides[state.modelPicker.testSlideIdx];
  if (!slide) { toast({ type: 'error', message: 'No test slide' }); return; }
  const ids = Array.from(state.modelPicker.selectedToMockup);
  const eligible = state.modelPicker.candidates.filter(c => ids.includes(`${c.provider}:${c.model}:${c.quality}`));
  if (eligible.length === 0) { toast({ type: 'error', message: 'Select at least one model' }); return; }
  state.modelPicker.inFlight = true;
  eligible.forEach(c => { c.status = 'generating'; c.error = null; c.imageB64 = null; });
  renderStep35();
  const skill = state.selectedSkillId ? skillById(state.selectedSkillId) : null;
  const prompt = composeSkillPrompt(skill, slide);
  await Promise.all(eligible.map(async c => {
    try {
      const b64 = await generateImageWithProvider(c.provider, c.model, c.quality, prompt);
      c.imageB64 = b64; c.status = 'done';
      deckCost.testImage += c.cost_per_image;
      deckCost.imageDetails.push({ provider: c.provider, model: c.model, quality: c.quality, cost: c.cost_per_image, kind: 'test' });
      renderCostBadge();
    } catch (err) { c.status = 'error'; c.error = err.message || String(err); }
    renderStep35();
  }));
  state.modelPicker.inFlight = false;
  renderStep35();
  toast({ type: 'success', message: `Mockups ready · ${fmtUsd4(eligible.reduce((s,c)=>s+(c.status==='done'?c.cost_per_image:0),0))}` });
}

async function rewriteNotesWithClaude(idx) {
  const slide = state.slides[idx]; if (!slide) return;
  const key = (state.apiKeys.anthropic || '').trim();
  if (!key) { toast({ type: 'error', message: 'Set Anthropic API key in Settings.' }); return; }
  slide.rewritingNotes = true; renderStep5Slides();
  const systemPrompt = 'You are a presentation coach. Rewrite the following slide content as natural speaker notes — flowing presenter language a person would actually say aloud while presenting. Convert bullets to sentences. Keep the same facts and order. Stay under 150 words. Return only the rewritten notes, no preamble.';
  const userPrompt = `Slide title: ${slide.title}\n\nSlide content:\n${slide.speakerNotes || slide.body || ''}`;
  const modelName = 'claude-sonnet-4-5-20250929';
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: modelName, max_tokens: 800, system: systemPrompt, messages: [{ role: 'user', content: userPrompt }] })
    });
    if (!resp.ok) { const err = await resp.text(); throw new Error(`Claude ${resp.status}: ${err.slice(0,300)}`); }
    const data = await resp.json();
    if (data.usage) { const cost = getAnthropicCost(modelName, data.usage.input_tokens || 0, data.usage.output_tokens || 0); deckCost.polish += cost; renderCostBadge(); }
    const newText = (data.content[0].text || '').trim();
    slide.prevSpeakerNotes = slide.speakerNotes;
    slide.speakerNotes = newText;
    toast({ type: 'success', message: `Notes rewritten · slide ${idx+1}` });
  } catch (e) { toast({ type: 'error', message: e.message || String(e) }); }
  slide.rewritingNotes = false; renderStep5Slides();
}

async function saveSkill(skill) {
  const sb = getSupabaseClient();
  if (!sb) {
    if (skill.id) {
      const idx = allSkills.findIndex(s => s.id === skill.id);
      if (idx >= 0) allSkills[idx] = { ...allSkills[idx], name: skill.name, description: skill.description, prompt: skill.prompt, updated_at: new Date().toISOString() };
    } else {
      allSkills.push({ id: uuid(), name: skill.name, description: skill.description, prompt: skill.prompt, is_skill: true, is_active: true, updated_at: new Date().toISOString() });
    }
    window.allSkills = allSkills;
    return;
  }
  const payload = {
    name: skill.name,
    description: skill.description || null,
    prompt: skill.prompt,
    is_skill: true,
    is_active: true,
    layer: null,
    updated_at: new Date().toISOString(),
    updated_by: OWNER_ID
  };
  if (skill.id) payload.id = skill.id;
  const { data: saved, error } = await sb.from('deck_templates').upsert(payload).select().single();
  if (error) throw error;
  try {
    const { data: versionsExisting } = await sb.from('template_versions').select('version_num').eq('template_id', saved.id).order('version_num', { ascending: false }).limit(1);
    const nextVersion = (versionsExisting && versionsExisting[0] && versionsExisting[0].version_num || 0) + 1;
    await sb.from('template_versions').insert({ template_id: saved.id, version_num: nextVersion, prompt: saved.prompt, change_note: skill.change_note || null, updated_by: OWNER_ID });
  } catch (ve) { console.warn('Version row insert failed (non-fatal):', ve); }
  await loadAllSkills();
}

async function duplicateSkill(id) {
  const s = skillById(id); if (!s) return;
  try {
    await saveSkill({ id: null, name: s.name + ' (copy)', description: s.description, prompt: s.prompt, change_note: 'Duplicated from ' + s.name });
    toast({ type: 'success', message: 'Skill duplicated' });
    renderSkills();
  } catch (e) { toast({ type: 'error', message: e.message || String(e) }); }
}
function confirmDeleteSkill(id) {
  const s = skillById(id); if (!s) return;
  openModal(`<div class="modal-header"><div><div class="h1">Delete "${escapeHtml(s.name)}"?</div></div></div><div class="danger-banner"><div>The skill will be deactivated (soft delete).</div></div><div class="modal-footer"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-danger" id="confirmDelSkill">Delete</button></div>`);
  document.getElementById('confirmDelSkill').onclick = async () => {
    try {
      const sb = getSupabaseClient();
      if (sb) {
        const { error } = await sb.from('deck_templates').update({ is_active: false, updated_at: new Date().toISOString() }).eq('id', id);
        if (error) throw error;
      }
      allSkills = allSkills.filter(x => x.id !== id);
      window.allSkills = allSkills;
      if (state.selectedSkillId === id) state.selectedSkillId = defaultSkillId();
      closeModal();
      toast({ type: 'success', message: 'Skill deleted' });
      renderSkills();
    } catch (e) { toast({ type: 'error', message: e.message || String(e) }); }
  };
}

  document.getElementById('skipPickerChk').onchange = async e => { state.skipModelPicker = e.target.checked; await persistSetting('dn_skip_model_picker', String(state.skipModelPicker)); };
  const maxIll = document.getElementById('maxIllustInput'); if (maxIll) maxIll.onchange = async e => { let v = Math.max(0, Math.min(20, parseInt(e.target.value) || 0)); state.maxIllustrations = v; e.target.value = v; await persistSetting('dn_wp_max_illust', String(v)); toast({ type: 'info', message: `Max illustrations: ${v}` }); };
  const lbChk = document.getElementById('logoBackingChk'); if (lbChk) lbChk.onchange = async e => { state.logoBacking = e.target.checked; await persistSetting('dn_logo_backing', String(state.logoBacking)); };
  document.getElementById('uploadLogoBtn').onclick = () => document.getElementById('logoFile').click();
  document.getElementById('logoFile').onchange = e => { const file = e.target.files[0]; if (!file) return; if (!/png/i.test(file.type)) { toast({ type: 'error', message: 'PNG only' }); return; } const fr = new FileReader(); fr.onload = async () => { state.logoB64 = fr.result.split(',')[1]; state.logoIsCustom = true; await persistSetting('dn_logo_b64', state.logoB64); toast({ type: 'success', message: 'Logo uploaded' }); renderSettings(); }; fr.readAsDataURL(file); };
  const clrLogo = document.getElementById('clearLogoBtn'); if (clrLogo) clrLogo.onclick = async () => { state.logoIsCustom = false; await persistSetting('dn_logo_b64', ''); state.logoB64 = await loadDefaultLogo(); renderSettings(); };
  document.getElementById('saveKeyBtn').onclick = async () => { const v = (document.getElementById('openaiKey').value || '').trim(); if (!v.startsWith('sk-')) { toast({ type: 'error', message: 'Must start with sk-' }); return; } state.apiKeys.openai = v; await persistSetting('dn_openai', v); toast({ type: 'success', message: 'Saved' }); renderSettings(); };
  const ck = document.getElementById('clearKeyBtn'); if (ck) ck.onclick = async () => { state.apiKeys.openai = ''; await persistSetting('dn_openai', ''); renderSettings(); };
  document.getElementById('saveAntBtn').onclick = async () => { const v = (document.getElementById('anthropicKey').value || '').trim(); if (!v.startsWith('sk-ant-')) { toast({ type: 'error', message: 'Must start with sk-ant-' }); return; } state.apiKeys.anthropic = v; await persistSetting('dn_anthropic', v); toast({ type: 'success', message: 'Saved' }); renderSettings(); };
  const ca = document.getElementById('clearAntBtn'); if (ca) ca.onclick = async () => { state.apiKeys.anthropic = ''; await persistSetting('dn_anthropic', ''); renderSettings(); };
  document.getElementById('saveGemBtn').onclick = async () => { const v = (document.getElementById('geminiKey').value || '').trim(); if (!v) { toast({ type: 'error', message: 'Enter a key' }); return; } state.apiKeys.gemini = v; await persistSetting('dn_gemini', v); toast({ type: 'success', message: 'Saved' }); renderSettings(); };
  const cg = document.getElementById('clearGemBtn'); if (cg) cg.onclick = async () => { state.apiKeys.gemini = ''; await persistSetting('dn_gemini', ''); renderSettings(); };
  document.getElementById('saveOrgBtn').onclick = async () => { const v = (document.getElementById('openaiOrg').value || '').trim(); state.apiKeys.openai_org = v; await persistSetting('dn_openai_org', v); toast({ type: 'success', message: 'Saved' }); renderSettings(); };
  document.getElementById('resetAllBtn').onclick = () => {
    openModal(`<div class="modal-header"><div><div class="h1">Reset all settings?</div></div></div><div class="danger-banner"><div>You will need to re-enter every API key.</div></div><div class="modal-footer"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-danger" id="confirmReset">Reset</button></div>`);
    document.getElementById('confirmReset').onclick = async () => {
      closeModal();
      await resetAllSettings();
      state.apiKeys = { openai: '', anthropic: '', gemini: '', openai_org: '' };
      state.imageQuality = 'high'; state.defaultModel = 'openai:gpt-image-2:high';
      state.skipModelPicker = false; state.logoBacking = false; state.adminMode = false;
      state.slideMin = 6; state.slideMax = 10; state.logoB64 = null; state.logoIsCustom = false;
      state.maxIllustrations = 3;
      favoriteSkillIds = new Set();
      const b = await loadDefaultLogo(); if (b) state.logoB64 = b;
      toast({ type: 'success', message: 'Settings cleared' });
      renderSettings(); updateAdminBadge();
    };
  };
}

function updateAdminBadge() {
  const el = document.getElementById('adminBadge'); if (!el) return;
  el.innerHTML = state.adminMode ? '<span class="badge badge-accent" style="cursor:pointer" id="adminBadgeBtn">Admin</span>' : '<span class="badge badge-neutral" style="cursor:pointer" id="adminBadgeBtn">Read-only</span>';
  const btn = document.getElementById('adminBadgeBtn');
  if (btn) btn.onclick = async () => { state.adminMode = !state.adminMode; await persistSetting('dn_admin', String(state.adminMode)); updateAdminBadge(); if (state.view === 'skills') renderSkills(); else if (state.view === 'settings') renderSettings(); };
}
function renderCostBadge() {
  const el = document.getElementById('costBadge'); if (!el) return;
  const total = deckCost.total();
  if (total <= 0) { el.innerHTML = ''; return; }
  el.innerHTML = `<span class="cost-badge">Deck cost <strong>${fmtUsd4(total)}</strong></span>`;
}

document.getElementById('themeToggle').addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = state.theme; });
function setActiveNav() { document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === state.view)); }
document.querySelectorAll('.nav-btn').forEach(b => { b.addEventListener('click', () => { state.view = b.dataset.view; setActiveNav(); render(); }); });
function render() {
  if (state.view === 'compose') renderCompose();
  else if (state.view === 'skills') renderSkills();
  else renderSettings();
  renderCostBadge();
}

async function initApp() {
  await bootstrapSettings();
  await loadAllReferenceData();
  hydrateStateFromStorage();
  if (!state.selectedSkillId || !skillById(state.selectedSkillId)) state.selectedSkillId = defaultSkillId();
  updateAdminBadge();
  render();
  setInterval(updateSyncPill, 30000);
  if (!state.logoIsCustom) { const b = await loadDefaultLogo(); if (b) state.logoB64 = b; }
}
initApp();
</script>
</body></html>
