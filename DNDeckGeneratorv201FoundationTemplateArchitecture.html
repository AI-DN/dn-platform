  if (!state.expandedStepLocked && state.expandedStep >= 0 && state.expandedStep < state.composeStep) {
    state.expandedStep = state.composeStep;
  }
  state.expandedStepLocked = false;
  const stepsMeta = [
    { num: -1,  id: 'pastDecksCol', title: 'Decks',    desc: 'Past decks', workflow: false },

    { num: 3,   id: 'step3',        title: 'Edit',     desc: 'Titles & body' },
    { num: 3.5, id: 'step35',       title: 'Model',    desc: 'Pick image model' },
    { num: 5,   id: 'step5',        title: 'Generate', desc: 'Render & assemble' },
    { num: 6,   id: 'step6',        title: 'Ready',    desc: 'Download & white paper' }
  ];
  const columnsHtml = stepsMeta.map((s, idx) => {
    const stateCls = columnStateClass(s.num, s.workflow);
    const expCls = columnExpandedClass(s.num);
    const statusGlyph = stateCls === 'is-done' ? '\u2713' : stateCls === 'is-active' ? '\u25CF' : '';
    // Display number: idx (0-based) so Past Decks = 0, Skill = 1, ... Generate = 6
    return `
      <div class="step-column ${stateCls} ${expCls} ${s.workflow === false ? 'is-meta' : ''}" data-step-col="${s.num}">

        </div>

      </div>`;
  }).join('');
  cont.innerHTML = `
    <div style="margin-bottom:24px">
      <div class="eyebrow" style="margin-bottom:8px">New deck</div>
      <div class="display">Compose a deck</div>
      <div class="muted body-sm" style="margin-top:8px;max-width:680px">Click any step\u2019s spine to expand it. Completed steps stay reachable; future steps unlock as you progress.</div>
    </div>
    <div class="step-columns">${columnsHtml}</div>`;
  renderPastDecksCol(); renderStep0(); renderStep1(); renderStep2(); renderStep3(); renderStep35(); renderStep5(); renderStep6();
  bindPastDecksPanel();

  document.querySelectorAll('[data-spine]').forEach(el => {
    el.onclick = () => {

}

async function runPolish(mode) {

  state.polishing = false; renderStep2();
}

async function addSlideWithAi() {
  state.addingSlide = true;
  renderStep3();
  const key = (state.apiKeys.anthropic || '').trim();
  const skill = state.selectedSkillId ? skillById(state.selectedSkillId) : null;
  const deckCtx = state.slides.map((s, i) => `Slide ${i+1}: ${s.title}${s.body ? ' — ' + s.body.slice(0, 120) : ''}`).join('\n');
  let title = 'New slide', body = '';
  if (key && state.slides.length > 0) {
    try {
      const sys = `You are a presentation editor for Digitata Networks. Suggest the next slide to add to the deck below. It should fit the narrative flow, not duplicate existing content, and stay anchored to the deck's theme. Return ONLY valid JSON: {"title":"...","body":"..."} (body uses '\\n' between lines, 3-6 short lines max).`;
      const user = `Skill: ${skill ? skill.name : '(none)'}\nExisting deck:\n${deckCtx}\n\nWhat is the most logical NEXT slide to add?`;
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 800, system: sys, messages: [{ role: 'user', content: user }] })
      });
      if (resp.ok) {
        const data = await resp.json();
        if (data.usage) { const cost = getAnthropicCost('claude-sonnet-4-6', data.usage.input_tokens || 0, data.usage.output_tokens || 0); deckCost.polish += cost; renderCostBadge(); }
        const raw = (data.content[0].text || '').replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(raw);
        if (parsed.title) title = parsed.title;
        if (parsed.body) body = parsed.body;
      }
    } catch (e) { console.warn('addSlideWithAi failed, falling back to blank:', e); toast({ type: 'info', message: 'Could not auto-generate — added blank slide' }); }
  } else if (!key && state.slides.length > 0) {

  const prompt = composeSkillPrompt(skill, slide);

async function rewriteNotesWithClaude(idx) {
  const slide = state.slides[idx]; if (!slide) return;
  const key = (state.apiKeys.anthropic || '').trim();
  if (!key) { toast({ type: 'error', message: 'Set Anthropic API key in Settings.' }); return; }
  slide.rewritingNotes = true; renderStep5Slides();
  const systemPrompt = 'You are a presentation coach. Rewrite the following slide content as natural speaker notes — flowing presenter language a person would actually say aloud while presenting. Convert bullets to sentences. Keep the same facts and order. Stay under 150 words. Return only the rewritten notes, no preamble.';
  const userPrompt = `Slide title: ${slide.title}\n\nSlide content:\n${slide.speakerNotes || slide.body || ''}`;
  const modelName = 'claude-sonnet-4-6';
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: modelName, max_tokens: 800, system: systemPrompt, messages: [{ role: 'user', content: userPrompt }] })
    });
    if (!resp.ok) { const err = await resp.text(); throw new Error(`Claude ${resp.status}: ${err.slice(0,300)}`); }
    const data = await resp.json();
    if (data.usage) { const cost = getAnthropicCost(modelName, data.usage.input_tokens || 0, data.usage.output_tokens || 0); deckCost.polish += cost; renderCostBadge(); }
    const newText = (data.content[0].text || '').trim();
    slide.prevSpeakerNotes = slide.speakerNotes;
    slide.speakerNotes = newText;
    toast({ type: 'success', message: `Notes rewritten · slide ${idx+1}` });
  } catch (e) { toast({ type: 'error', message: e.message || String(e) }); }
  slide.rewritingNotes = false; renderStep5Slides();
}

// Build #50 — bulk rewrite all slide notes
async function rewriteAllNotesWithClaude() {
  const key = (state.apiKeys.anthropic || '').trim();
  if (!key) { toast({ type: 'error', message: 'Set Anthropic API key in Settings.' }); return; }
  if (state.bulkRewritingNotes) { toast({ type: 'info', message: 'Already running' }); return; }
  state.bulkRewritingNotes = true;
  const total = state.slides.length;
  let done = 0, failed = 0;
  ensureSpeakerNotes();
  renderStep5();
  for (let i = 0; i < total; i++) {
    state.bulkRewriteProgress = { done: i, total: total, current: i + 1 };
    renderStep5();
    try {
      await rewriteNotesWithClaude(i);
      done++;
    } catch (e) {
      failed++;
      console.warn('Slide ' + (i+1) + ' rewrite failed:', e);
    }
  }
  state.bulkRewritingNotes = false;
  state.bulkRewriteProgress = null;
  renderStep5();
  toast({ type: failed === 0 ? 'success' : 'info', message: 'Bulk rewrite complete \u00b7 ' + done + ' of ' + total + ' slides' + (failed ? ' \u00b7 ' + failed + ' failed' : '') });
}

function openSkillGroupEditor(id) {
  if (!state.adminMode) { toast({ type: 'error', message: 'Admin mode required' }); return; }
  const existing = id ? skillById(id) : null;
  const draft = {
    id: existing ? existing.id : null,
    name: existing ? existing.name : '',
    description: existing ? existing.description : '',
    member_skill_ids: existing ? (existing.member_skill_ids || []) : [],
    is_group: true,
    prompt: ''
  };
  function renderEditor() {
    const leafSkills = (window.allSkills || []).filter(s => !skillIsGroup(s)).filter(s => s.is_active !== false);
    // Build #91 — inline best_for dropdown per tile
    const BEST_FOR_CANONICAL = ['title slides', 'agenda slides', 'content slides', 'data slides', 'diagram slides', 'callout slides', 'comparison slides', 'case study slides', 'closing slides'];
    const memberTiles = leafSkills.map(s => {
      const selected = draft.member_skill_ids.indexOf(s.id) >= 0;
      const bfCurrent = (s.best_for || '').trim();
      const isOther = bfCurrent && BEST_FOR_CANONICAL.indexOf(bfCurrent) < 0;
      const bfOpts = ['<option value="">\u2014 untagged \u2014</option>']
        .concat(BEST_FOR_CANONICAL.map(c => '<option value="' + c + '"' + (bfCurrent === c ? ' selected' : '') + '>' + c + '</option>'))
        .concat(['<option value="__other__"' + (isOther ? ' selected' : '') + '>Other\u2026</option>'])
        .join('');
      return '<label class="branding-picker-tile' + (selected ? ' is-selected' : '') + '" style="cursor:pointer;padding:8px;position:relative">' +
        '<input type="checkbox" data-member-id="' + s.id + '"' + (selected ? ' checked' : '') + ' style="position:absolute;top:6px;right:6px">' +
        (s.preview_image_b64 ? '<img src="data:image/jpeg;base64,' + s.preview_image_b64 + '" alt="" style="width:100%;height:60px;object-fit:cover;border-radius:4px">' : '<div style="width:100%;height:60px;background:var(--surface-2,var(--surface));border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:10px">no preview</div>') +
        '<div class="tile-label" style="margin-top:4px">' + escapeHtml(s.name) + '</div>' +
        '<select class="select" data-bf-tag="' + s.id + '" onclick="event.stopPropagation()" style="font-size:10px;padding:2px 4px;margin-top:4px;width:100%">' + bfOpts + '</select>' +
        (isOther ? '<div style="font-size:9px;color:var(--text-muted);margin-top:2px">custom: ' + escapeHtml(bfCurrent) + '</div>' : '') +
      '</label>';
    }).join('');
    const html = '<div class="modal-header"><div><div class="h1">' + (existing ? 'Edit skill group' : '\ud83c\udf9b\ufe0f New skill group') + '</div>' +
      '<div class="muted body-sm" style="margin-top:4px">A group bundles 2-4 related skills. Decks using this group get per-slide auto-routing via Claude Haiku.</div>' +
      '</div><button class="btn-ghost" onclick="closeModal()">\u00d7</button></div>' +
      '<div class="field"><label class="field-label">Group name <span class="subtle">required</span></label><input class="input" id="sgName" value="' + escapeAttr(draft.name) + '" placeholder="e.g. DN Telco Pitch Suite"></div>' +
      '<div class="field"><label class="field-label">Description</label><input class="input" id="sgDesc" value="' + escapeAttr(draft.description || '') + '" placeholder="One-line summary"></div>' +
      '<div class="field"><label class="field-label">Members <span class="subtle">tick 2-4 skills</span> <span style="color:var(--text-muted);font-size:11px">(' + draft.member_skill_ids.length + ' selected)</span></label>' +
        (leafSkills.length === 0 ? '<div class="empty"><div class="empty-desc">No skills available. Create at least 2 skills first.</div></div>' :
        '<div class="layout-asset-grid" style="margin-top:6px">' + memberTiles + '</div>') +
      '</div>' +
      '<div class="modal-footer">' +
        '<button class="btn-ghost" onclick="closeModal()">Cancel</button>' +
        '<button class="btn-primary" id="sgSaveBtn">Save group</button>' +
      '</div>';
    openModal(html, { lg: true });
    const ne = document.getElementById('sgName');
    if (ne) ne.oninput = e => { draft.name = e.target.value; };
    const de = document.getElementById('sgDesc');
    if (de) de.oninput = e => { draft.description = e.target.value; };
    document.querySelectorAll('input[data-member-id]').forEach(cb => {
      cb.onchange = e => {
        const mid = cb.getAttribute('data-member-id');
        if (cb.checked) {
          if (draft.member_skill_ids.indexOf(mid) < 0) draft.member_skill_ids.push(mid);
        } else {
          draft.member_skill_ids = draft.member_skill_ids.filter(x => x !== mid);
        }
        renderEditor();
      };
    });
    // Build #91 — inline best_for dropdown handlers
    document.querySelectorAll('select[data-bf-tag]').forEach(sel => {
      sel.onclick = e => e.stopPropagation();
      sel.onchange = async e => {
        const sid = sel.getAttribute('data-bf-tag');
        let value = e.target.value;
        if (value === '__other__') {
          const custom = window.prompt('Custom best-for label:', '');
          if (custom && custom.trim()) {
            value = custom.trim();
          } else {
            // Cancelled or empty — revert to untagged
            sel.value = '';
            value = '';
          }
        }
        await saveSkillBestForTag(sid, value);
        renderEditor();
      };
    });
    const saveBtn = document.getElementById('sgSaveBtn');
    if (saveBtn) saveBtn.onclick = async (ev) => {
      if (!draft.name.trim()) { toast({ type: 'error', message: 'Name is required' }); return; }
      if (draft.member_skill_ids.length < 2) { toast({ type: 'error', message: 'Pick at least 2 member skills' }); return; }
      if (draft.member_skill_ids.length > 8) { toast({ type: 'error', message: 'Max 8 members (2-4 recommended)' }); return; }
      // Build #89 — warn if members are untagged (picker will struggle)
      const untagged = draft.member_skill_ids.filter(id => { const sk = skillById(id); return sk && !((sk.best_for || '').trim()); });
      if (untagged.length > 0) {
        const proceed = window.confirm(untagged.length + ' member skill' + (untagged.length === 1 ? '' : 's') + ' lack a "best for" tag. The picker will struggle to differentiate them. Save anyway?');
        if (!proceed) return;
      }
      // Build #86 — disable + spinner while saving
      const btn = ev && ev.currentTarget;
      const cancelBtn = document.querySelector('.modal-footer .btn-ghost');
      const origText = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving\u2026'; }
      if (cancelBtn) cancelBtn.disabled = true;
      try {
        await saveSkill(draft);
        closeModal();
        toast({ type: 'success', message: 'Skill group saved' });
        renderSkills();
      } catch (e) {
        toast({ type: 'error', message: e.message || String(e) });
        if (btn) { btn.disabled = false; btn.innerHTML = origText; }
        if (cancelBtn) cancelBtn.disabled = false;
      }
    };
  }
  renderEditor();
}

    'Supporting: [secondary/utility tones]\n' +
    '[1-2 sentences on what the palette communicates.]\n\n' +
    'ICONOGRAPHY:\n' +

    '[Card/panel treatment observed: rounded corners, glow edges, drop shadows, glassmorphism, etc.]\n\n' +
    'EMOTIONAL TONE:\n' +

    'Do NOT create circular emblems, tree shapes, network graphs, or any symbol that could be mistaken for a company logo.\n\n' +

    'ABSOLUTE RULES for both quiet zones:\n' +

    '---\n\n' +

  const resp = await fetch('https://api.anthropic.com/v1/messages', {

    '- Keep OVERALL STYLE / COLOR PALETTE / TYPOGRAPHY / ICONOGRAPHY content unchanged or only lightly reworded \u2014 these MUST match the seed so all variants feel like one suite.\n' +
    '- Rewrite LAYOUT RULES / CONTENT PANELS / EMOTIONAL TONE / OVERALL DESIGN GOAL to match the variant brief above.\n' +
    '- Keep all [STANDARD] sections verbatim from the seed.\n' +

async function runSkillFanOut(opts, onProgress) {
  // opts: { seedPrompt, seedName, seedDescription, variantSpecs, groupName, groupDescription }
  // onProgress: (step, message) => void  // step: 'derive' | 'save' | 'group' | 'done' | 'error'
  const seedPrompt = opts.seedPrompt || '';
  const seedName = opts.seedName || 'Skill';

  const groupName = opts.groupName || (seedName + ' \u00b7 Group');
  const groupDescription = opts.groupDescription || ('Fan-out group derived from "' + seedName + '"');
  let totalCost = 0;
  const createdSkillIds = [];
  const sb = getSupabaseClient();
  if (!sb) throw new Error('Supabase required for fan-out (offline mode not supported)');
  // Step 1 \u2014 derive each variant prompt
  const derivedPrompts = [];
  for (let i = 0; i < variantSpecs.length; i++) {
    const v = variantSpecs[i];
    onProgress && onProgress('derive', 'Deriving variant ' + (i + 1) + '/' + variantSpecs.length + ': ' + v.best_for + '\u2026');
    const result = await deriveSkillVariantPrompt(seedPrompt, seedName, v);
    derivedPrompts.push({ ...v, prompt: result.prompt, cost: result.cost });
    totalCost += result.cost;
    if (typeof deckCost !== 'undefined') {
      deckCost.polish += result.cost;
      if (deckCost.imageDetails) deckCost.imageDetails.push({ provider: 'anthropic', model: 'claude-sonnet-4-6', quality: 'derive-variant', cost: result.cost, kind: 'fan-out-derive' });
      if (typeof renderCostBadge === 'function') renderCostBadge();
    }
  }
  // Step 2 \u2014 save each variant as a leaf skill (this auto-generates preview)
  for (let i = 0; i < derivedPrompts.length; i++) {
    const v = derivedPrompts[i];
    onProgress && onProgress('save', 'Saving variant ' + (i + 1) + '/' + derivedPrompts.length + ': ' + v.best_for + ' (generating preview\u2026 ~30s)');
    const newSkill = {
      id: null,
      name: seedName + v.name_suffix,
      description: v.description,
      prompt: v.prompt,
      best_for: v.best_for,
      change_note: 'Created by fan-out from "' + seedName + '" (Build #92)'
    };
    // saveSkill triggers auto-preview and reloads allSkills; we capture the new id afterwards
    await saveSkill(newSkill);
    // Find the newly-created skill by name match (most-recent updated_at)
    const candidates = (window.allSkills || allSkills || []).filter(s => s.name === newSkill.name && s.is_skill && s.is_active);
    if (candidates.length > 0) {
      candidates.sort((a, b) => new Date(b.updated_at || 0) - new Date(a.updated_at || 0));
      createdSkillIds.push(candidates[0].id);
    }
  }
  // Step 3 \u2014 create the group skill bundling all variants
  onProgress && onProgress('group', 'Bundling ' + createdSkillIds.length + ' variants into group: ' + groupName);
  const groupSkill = {
    id: null,
    name: groupName,
    description: groupDescription,
    prompt: '',
    is_group: true,
    member_skill_ids: createdSkillIds,
    change_note: 'Fan-out group created from "' + seedName + '" with ' + createdSkillIds.length + ' variants'
  };
  await saveSkill(groupSkill);
  const groupCandidates = (window.allSkills || allSkills || []).filter(s => s.name === groupName && s.is_group);
  let groupId = null;
  if (groupCandidates.length > 0) {
    groupCandidates.sort((a, b) => new Date(b.updated_at || 0) - new Date(a.updated_at || 0));
    groupId = groupCandidates[0].id;
  }
  onProgress && onProgress('done', 'Fan-out complete \u00b7 ' + createdSkillIds.length + ' variants + 1 group \u00b7 ' + fmtUsd4(totalCost) + ' on derivation');
  return { groupId: groupId, memberIds: createdSkillIds, totalCost: totalCost };
}

function openFanOutModal(seedSpec) {
  // seedSpec: { seedPrompt, seedName, seedDescription }
  if (!state.adminMode) { toast({ type: 'error', message: 'Admin mode required' }); return; }
  if (!(state.apiKeys.anthropic || '').trim()) { toast({ type: 'error', message: 'Anthropic key required (Settings)' }); return; }
  const seedName = (seedSpec && seedSpec.seedName) || 'Skill';
  const seedDescription = (seedSpec && seedSpec.seedDescription) || '';
  const seedPrompt = (seedSpec && seedSpec.seedPrompt) || '';
  if (!seedPrompt.trim()) { toast({ type: 'error', message: 'Seed prompt is empty \u2014 cannot derive variants' }); return; }
  const fanState = {
    running: false,
    log: [],
    groupName: seedName + ' \u00b7 Group',
    groupDescription: 'Fan-out group derived from "' + seedName + '"',
    selectedBestFor: FAN_OUT_VARIANT_PRESETS.map(v => v.best_for) // all selected by default
  };
  function renderFanModal() {
    const variantRows = FAN_OUT_VARIANT_PRESETS.map((v, i) => {
      const checked = fanState.selectedBestFor.indexOf(v.best_for) >= 0;
      return '<label style="display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2,var(--surface));margin-bottom:6px;cursor:pointer">' +
        '<input type="checkbox" data-fan-variant="' + v.best_for + '"' + (checked ? ' checked' : '') + ' style="margin-top:2px"' + (fanState.running ? ' disabled' : '') + '>' +
        '<div style="flex:1">' +
          '<div style="font-size:12px;font-weight:600">' + seedName + escapeHtml(v.name_suffix) + ' <span class="subtle" style="font-weight:400;color:var(--text-muted)">(best_for: ' + v.best_for + ')</span></div>' +
          '<div style="font-size:11px;color:var(--text-muted);margin-top:2px">' + escapeHtml(v.description) + ' \u2014 ' + escapeHtml(v.brief.slice(0, 140)) + '\u2026</div>' +
        '</div>' +
      '</label>';
    }).join('');
    const logHtml = fanState.log.length === 0 ? '' :
      '<div style="margin-top:14px;padding:10px;background:#0b1220;color:#a8d8ff;border-radius:6px;font-family:var(--mono);font-size:11px;max-height:200px;overflow-y:auto">' +
        fanState.log.map(l => '<div style="margin-bottom:4px">[' + l.step + '] ' + escapeHtml(l.message) + '</div>').join('') +
      '</div>';
    const html =
      '<div class="modal-header"><div><div class="h1">\u{1F39B}\u{FE0F} Fan out to group</div>' +
        '<div class="muted body-sm" style="margin-top:4px">Derive ' + fanState.selectedBestFor.length + ' style variants from <strong>' + escapeHtml(seedName) + '</strong> and bundle them into a new skill group. Each variant keeps the same visual language but is tuned for a different slide type.</div>' +
      '</div><button class="btn-ghost" onclick="closeModal()"' + (fanState.running ? ' disabled' : '') + '>\u00d7</button></div>' +
      '<div class="field"><label class="field-label">Group name</label>' +
        '<input class="input" id="fanGroupName" value="' + escapeAttr(fanState.groupName) + '"' + (fanState.running ? ' disabled' : '') + '>' +
      '</div>' +
      '<div class="field"><label class="field-label">Variants to create <span class="subtle">uncheck to skip a use case</span></label>' +
        variantRows +
      '</div>' +
      '<div style="padding:10px;background:rgba(217,138,52,0.10);border:1px solid #D89834;border-radius:6px;color:#5C3F00;font-size:12px">' +
        '\u26a1 Cost: ~$0.05 per variant in derivation + ~$0.30 per preview image. For 4 variants \u2192 ~$1.40 total. Time: ~2-3 minutes.' +
      '</div>' +
      logHtml +
      '<div class="modal-footer">' +
        '<button class="btn-ghost" onclick="closeModal()"' + (fanState.running ? ' disabled' : '') + '>Cancel</button>' +
        '<button class="btn-primary" id="fanRunBtn"' + (fanState.running ? ' disabled' : '') + '>' + (fanState.running ? '<span class="spinner"></span> Working\u2026' : '\u2728 Create group of ' + fanState.selectedBestFor.length + ' variants') + '</button>' +
      '</div>';
    openModal(html, { lg: true });
    const gnInp = document.getElementById('fanGroupName');
    if (gnInp) gnInp.oninput = e => { fanState.groupName = e.target.value; };
    document.querySelectorAll('[data-fan-variant]').forEach(cb => {
      cb.onchange = e => {
        const bf = cb.getAttribute('data-fan-variant');
        if (cb.checked) {
          if (fanState.selectedBestFor.indexOf(bf) < 0) fanState.selectedBestFor.push(bf);
        } else {
          fanState.selectedBestFor = fanState.selectedBestFor.filter(x => x !== bf);
        }
        renderFanModal();
      };
    });
    const runBtn = document.getElementById('fanRunBtn');
    if (runBtn) runBtn.onclick = async () => {
      if (fanState.selectedBestFor.length === 0) { toast({ type: 'error', message: 'Select at least one variant' }); return; }
      if (!fanState.groupName.trim()) { toast({ type: 'error', message: 'Group name required' }); return; }
      fanState.running = true;
      fanState.log = [];
      renderFanModal();
      const variantSpecs = FAN_OUT_VARIANT_PRESETS.filter(v => fanState.selectedBestFor.indexOf(v.best_for) >= 0);
      try {
        const result = await runSkillFanOut({
          seedPrompt: seedPrompt,
          seedName: seedName,
          seedDescription: seedDescription,
          variantSpecs: variantSpecs,
          groupName: fanState.groupName,
          groupDescription: fanState.groupDescription
        }, (step, message) => {
          fanState.log.push({ step: step, message: message });
          renderFanModal();
        });
        toast({ type: 'success', message: 'Group "' + fanState.groupName + '" created with ' + result.memberIds.length + ' variants' });
        closeModal();
        // Open the new group editor so user can review/tweak
        if (result.groupId) {
          setTimeout(() => { openSkillGroupEditor(result.groupId); }, 250);
        }
        renderSkills();
      } catch (e) {
        fanState.running = false;
        fanState.log.push({ step: 'error', message: e.message || String(e) });
        renderFanModal();
        toast({ type: 'error', message: 'Fan-out failed: ' + (e.message || String(e)) });
      }
    };
  }
  renderFanModal();
}

// Build #98 — extract clean {title, body} from a rendered page image via Claude vision
async function extractSlideContentWithClaude(imageB64, pdfTextHint, pageNum) {
  const ak = (state.apiKeys.anthropic || '').trim();
  if (!ak) throw new Error('Anthropic key required for vision extraction');
  const visionImage = await downscaleImageForVision(imageB64);
  const sysPrompt = 'You extract structured content from a presentation slide image. Return ONLY a JSON object with keys "title" and "body". No markdown fences, no commentary, no surrounding prose.';
  const hint = (pdfTextHint || '').slice(0, 1500);
  const userPrompt =
    'Extract the MAIN TITLE and BODY CONTENT from this slide image (page ' + pageNum + ').\n\n' +
    'STRICT RULES:\n' +
    '1. IGNORE all repeating chrome: footers, headers, page numbers, watermarks, slide-number labels, dates, confidentiality stamps (e.g. "Private & confidential", "Confidential", "Draft"), copyright lines, and company logos in corners. None of these belong in the title or body.\n' +
    '2. The TITLE is the slide\'s main headline \u2014 usually large text near the top of the slide. If the slide is a section divider with only a page number or no real headline, return an EMPTY STRING for title.\n' +
    '3. The BODY is the main content \u2014 bullets, paragraphs, key points, captions on diagrams. Preserve text verbatim. Use \u005Cn line breaks between distinct bullet points or paragraphs.\n' +
    '4. If the slide is essentially blank or only contains a number/divider, return empty strings for both.\n' +
    '5. Do NOT include footer chrome anywhere in title or body. "Private & confidential" must never appear in either field.\n\n' +
    'PDF.js raw text hint from this page (jumbled order \u2014 use only as a spelling/exact-wording aid; trust the IMAGE for structure):\n' +
    hint + '\n\n' +
    'Return JSON: {"title": "...", "body": "..."}';
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': ak, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1500,
      system: sysPrompt,
      messages: [{ role: 'user', content: [
        { type: 'image', source: { type: 'base64', media_type: visionImage.mediaType, data: visionImage.b64 } },
        { type: 'text', text: userPrompt }
      ] }]
    })
  });
  if (!resp.ok) { const t = await resp.text(); throw new Error('Vision extract ' + resp.status + ': ' + t.slice(0, 200)); }
  const data = await resp.json();
  let cost = 0.02;
  if (data.usage) { try { cost = getAnthropicCost('claude-sonnet-4-6', data.usage.input_tokens || 0, data.usage.output_tokens || 0); } catch (e) {} }
  const responseText = (data.content && data.content[0] && data.content[0].text) || '';
  let parsed = { title: '', body: '' };
  try {
    const m = responseText.match(/\{[\s\S]*\}/);
    if (m) parsed = JSON.parse(m[0]);
  } catch (e) { console.warn('Vision JSON parse failed for page ' + pageNum + ':', responseText.slice(0, 200)); }
  return { title: (parsed.title || '').trim(), body: (parsed.body || '').trim(), cost: cost };
}

// Build #98 — font-size heuristic extracted as fallback for no-Anthropic or vision-failure paths
function fontHeuristicExtract(textItems, pageNum) {
  if (!textItems || textItems.length === 0) return { title: 'Slide ' + pageNum, body: '' };
  const heights = textItems.map(it => it.height || 0);
  const maxH = Math.max.apply(null, heights);
  const titleThreshold = maxH * 0.9;
  const titleParts = [];
  const bodyParts = [];
  for (const it of textItems) {
    if ((it.height || 0) >= titleThreshold && titleParts.length < 6) titleParts.push(it.str);
    else bodyParts.push(it.str);
  }
  let title = titleParts.join(' ').replace(/\s+/g, ' ').trim();
  let body = bodyParts.join(' ').replace(/\s+/g, ' ').trim();
  if (!title && textItems[0]) {
    title = textItems[0].str;
    body = textItems.slice(1).map(it => it.str).join(' ').replace(/\s+/g, ' ').trim();
  }
  return { title: title || ('Slide ' + pageNum), body: body };
}

async function parsePdfDeck(file, onProgress) {
  if (typeof pdfjsLib === 'undefined') throw new Error('pdf.js not loaded \u2014 reload the page');
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  } catch (e) {}
  const ab = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
  const total = pdf.numPages;
  // === Phase 1: render every page + collect raw PDF text items ===
  const pages = [];
  for (let i = 1; i <= total; i++) {
    onProgress && onProgress(i, total, 'render');
    const page = await pdf.getPage(i);
    let textItems = [];
    try {
      const tc = await page.getTextContent();
      textItems = (tc.items || []).filter(it => it.str && it.str.trim());
    } catch (e) { console.warn('PDF text extract failed for page ' + i + ':', e); }
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    const b64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
    pages.push({ idx: i - 1, textItems: textItems, imageB64: b64 });
  }
  // === Phase 2: Claude vision extraction (preferred) or heuristic (fallback) ===
  const hasAnthropic = !!(state.apiKeys.anthropic || '').trim();
  const slides = new Array(pages.length);
  if (hasAnthropic) {
    let completed = 0;
    onProgress && onProgress(completed, pages.length, 'vision');
    const CONCURRENCY = 4;
    let totalCost = 0;
    const runOne = async (p) => {
      const pdfTextHint = p.textItems.map(it => it.str).join(' ').replace(/\s+/g, ' ').trim();
      try {
        const result = await extractSlideContentWithClaude(p.imageB64, pdfTextHint, p.idx + 1);
        totalCost += result.cost || 0;
        slides[p.idx] = {
          idx: p.idx,
          title: result.title || ('Slide ' + (p.idx + 1)),
          body: result.body || '',
          referenceImageB64: p.imageB64
        };
      } catch (e) {
        console.warn('Vision extract failed for page ' + (p.idx + 1) + ':', e);
        const fb = fontHeuristicExtract(p.textItems, p.idx + 1);
        slides[p.idx] = { idx: p.idx, title: fb.title, body: fb.body, referenceImageB64: p.imageB64 };
      }
      completed++;
      onProgress && onProgress(completed, pages.length, 'vision');
    };
    // Process in batches of CONCURRENCY
    for (let i = 0; i < pages.length; i += CONCURRENCY) {
      await Promise.all(pages.slice(i, i + CONCURRENCY).map(runOne));
    }
    if (typeof deckCost !== 'undefined') {
      deckCost.polish += totalCost;
      if (deckCost.imageDetails) deckCost.imageDetails.push({ provider: 'anthropic', model: 'claude-sonnet-4-6', quality: 'vision', cost: totalCost, kind: 'pdf-text-extract' });
      if (typeof renderCostBadge === 'function') renderCostBadge();
    }
  } else {
    // No Anthropic key \u2014 fall back to font heuristic (warn user via toast at caller level)
    for (const p of pages) {
      const fb = fontHeuristicExtract(p.textItems, p.idx + 1);
      slides[p.idx] = { idx: p.idx, title: fb.title, body: fb.body, referenceImageB64: p.imageB64 };
    }
  }
  return { slides: slides, slideCount: slides.length, fileName: file.name };
}

// Build #94 — Import .pptx for re-styling with current skill/group
// =====================================================================
async function parsePptxText(file) {
  if (typeof JSZip === 'undefined') throw new Error('JSZip not loaded — reload the page');
  const zip = await JSZip.loadAsync(file);
  const slideFiles = Object.keys(zip.files)
    .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a, b) => {
      const na = parseInt(a.match(/slide(\d+)/)[1]);
      const nb = parseInt(b.match(/slide(\d+)/)[1]);
      return na - nb;
    });
  if (slideFiles.length === 0) throw new Error('No slides found inside the .pptx');
  const slides = [];
  for (let i = 0; i < slideFiles.length; i++) {
    const xml = await zip.file(slideFiles[i]).async('text');
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const shapes = doc.getElementsByTagName('p:sp');
    let title = '';
    const bodyParts = [];
    for (let s = 0; s < shapes.length; s++) {
      const sp = shapes[s];
      const ph = sp.getElementsByTagName('p:ph')[0];
      const phType = ph ? (ph.getAttribute('type') || 'body') : '';
      const isTitle = phType === 'title' || phType === 'ctrTitle';
      const paragraphs = sp.getElementsByTagName('a:p');
      const lines = [];
      for (let p = 0; p < paragraphs.length; p++) {
        const runs = paragraphs[p].getElementsByTagName('a:t');
        let para = '';
        for (let r = 0; r < runs.length; r++) para += runs[r].textContent;
        if (para.trim()) lines.push(para);
      }
      if (lines.length === 0) continue;
      if (isTitle && !title) title = lines.join(' ').trim();
      else bodyParts.push(lines.join('\n'));
    }
    // Fallback: if no explicit title placeholder, take the first line as title
    if (!title && bodyParts.length > 0) {
      const firstParts = bodyParts[0].split('\n');
      title = firstParts[0];
      bodyParts[0] = firstParts.slice(1).join('\n').trim();
      if (!bodyParts[0]) bodyParts.shift();
    }
    slides.push({ idx: i, title: title || ('Slide ' + (i + 1)), body: bodyParts.join('\n\n').trim() });
  }
  return { slides: slides, slideCount: slides.length, fileName: file.name };
}

function matchPngsToSlides(slides, pngFiles) {
  const matches = slides.map(s => ({ ...s, referencePng: null }));
  if (!pngFiles || pngFiles.length === 0) return matches;
  const numbered = [];
  const unnumbered = [];
  for (const f of pngFiles) {
    const m = f.name.match(/[sS]lide\s*(\d+)/);
    if (m) numbered.push({ file: f, num: parseInt(m[1]) });
    else unnumbered.push(f);
  }
  // Pass 1: match by Slide<N> filename
  for (const n of numbered) {
    const target = matches[n.num - 1];
    if (target && !target.referencePng) target.referencePng = n.file;
  }
  // Pass 2: fill remaining slots alphabetically
  unnumbered.sort((a, b) => a.name.localeCompare(b.name));
  let unIdx = 0;
  for (const m of matches) {
    if (!m.referencePng && unIdx < unnumbered.length) {
      m.referencePng = unnumbered[unIdx++];
    }
  }
  return matches;
}

async function pptxFileToB64(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();

// ===== Build #52 — deck thumbnail generation =====
async function generateDeckThumbnail(opts) {
  opts = opts || {};
  // Build #53 — accept explicit args for backfill use
  // Priority: opts.sourceB64 > first slide with imageB64 > none (-> fallback canvas)
  let sourceB64 = (opts.sourceB64 !== undefined) ? opts.sourceB64 : null;
  let titleArg = opts.title;
  let subArg = opts.sub;
  if (sourceB64 === null && titleArg === undefined) {
    // Original state-based behavior (used by saveCurrentDeckToSupabase hook)
    const slides = state.slides || [];
    for (let i = 0; i < slides.length; i++) {
      if (slides[i] && slides[i].imageB64) { sourceB64 = slides[i].imageB64; break; }
    }
    titleArg = (slides[0] && slides[0].title) || 'Untitled deck';
    const skill = state.selectedSkillId ? skillById(state.selectedSkillId) : null;
    subArg = skill ? skill.name : '';
  }
  const W = 400, H = 225;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  if (sourceB64) {
    const img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => reject(new Error('Thumbnail source image failed to load'));
      im.src = 'data:image/png;base64,' + sourceB64;
    });
    const srcRatio = img.width / img.height;
    const dstRatio = W / H;
    let sx, sy, sw, sh;
    if (srcRatio > dstRatio) {
      sh = img.height; sw = sh * dstRatio; sx = (img.width - sw) / 2; sy = 0;
    } else {
      sw = img.width; sh = sw / dstRatio; sx = 0; sy = (img.height - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
  } else {
    // Build #53 — use args if provided, else state
    const title = (titleArg !== undefined ? titleArg : ((state.slides[0] && state.slides[0].title) || 'Untitled deck'));
    const sub = (subArg !== undefined ? subArg : (() => { const sk = state.selectedSkillId ? skillById(state.selectedSkillId) : null; return sk ? sk.name : ''; })());
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, '#0d9488');
    grad.addColorStop(1, '#0f766e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff';
    ctx.font = '600 22px system-ui, -apple-system, sans-serif';
    ctx.textBaseline = 'middle';
    _wrapThumbText(ctx, title, 24, H / 2 - 12, W - 48, 26);
    if (sub) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '14px system-ui, -apple-system, sans-serif';
      ctx.fillText(sub, 24, H - 28);
    }
  }
  return await new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (!blob) { reject(new Error('toBlob returned null')); return; }
      resolve(blob);
    }, 'image/webp', 0.72);
  });
}
function _wrapThumbText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = String(text).split(' ');
  let line = '';
  const lines = [];
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i] + ' ';
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line.trim());
      line = words[i] + ' ';
    } else { line = test; }
  }
  if (line) lines.push(line.trim());
  const max = Math.min(lines.length, 3);
  for (let i = 0; i < max; i++) {
    ctx.fillText(lines[i] + (i === 2 && lines.length > 3 ? '…' : ''), x, y + i * lineHeight);
  }
}
async function uploadDeckThumbnail(deckId, blob) {
  const sb = getSupabaseClient();
  if (!sb) return null;
  const path = 'decks/' + deckId + '.webp';
  const upRes = await sb.storage
    .from('dn-deck-thumbnails')
    .upload(path, blob, { upsert: true, contentType: 'image/webp', cacheControl: '3600' });
  if (upRes && upRes.error) {
    const msg = upRes.error.message || String(upRes.error);
    if (/Bucket not found/i.test(msg) || /does not exist/i.test(msg)) {
      console.warn('Thumbnail upload failed: bucket dn-deck-thumbnails missing. Run the Build #52 storage SQL.');
    } else {
      console.warn('Thumbnail upload failed:', msg);
    }
    return null;
  }
  const pubRes = sb.storage.from('dn-deck-thumbnails').getPublicUrl(path);
  return (pubRes && pubRes.data && pubRes.data.publicUrl) || null;
}

async function saveSkill(skill) {
  const sb = getSupabaseClient();
  if (!sb) {
    if (skill.id) {
      const idx = allSkills.findIndex(s => s.id === skill.id);
      if (idx >= 0) allSkills[idx] = { ...allSkills[idx], name: skill.name, description: skill.description, prompt: skill.prompt, updated_at: new Date().toISOString() };
    } else {
      allSkills.push({ id: uuid(), name: skill.name, description: skill.description, prompt: skill.prompt, is_skill: true, is_active: true, updated_at: new Date().toISOString() });
    }
    window.allSkills = allSkills;
    return;
  }
  const payload = {
    name: skill.name,
    description: skill.description || null,
    prompt: skill.prompt || '',
    is_skill: true,
    is_active: true,
    layer: null,
    updated_at: new Date().toISOString(),
    updated_by: OWNER_ID,
    is_group: !!skill.is_group,
    member_skill_ids: Array.isArray(skill.member_skill_ids) ? skill.member_skill_ids : [],
    best_for: skill.best_for || null
  };
  if (skill.id) payload.id = skill.id;
  let { data: saved, error } = await sb.from('deck_templates').upsert(payload).select().single();
  if (error) {
    const msg = error.message || String(error);
    if (/is_group|member_skill_ids|best_for/i.test(msg) && /column|schema/i.test(msg)) {
      console.warn('Skill group columns missing; retrying without. Run Build #85 SQL.');
      const fb = Object.assign({}, payload); delete fb.is_group; delete fb.member_skill_ids; delete fb.best_for;
      const retry = await sb.from('deck_templates').upsert(fb).select().single();
      saved = retry.data; error = retry.error;
    }
    if (error) throw error;
  }
  try {
    const { data: versionsExisting } = await sb.from('template_versions').select('version_num').eq('template_id', saved.id).order('version_num', { ascending: false }).limit(1);
    const nextVersion = (versionsExisting && versionsExisting[0] && versionsExisting[0].version_num || 0) + 1;
    await sb.from('template_versions').insert({ template_id: saved.id, version_num: nextVersion, prompt: saved.prompt, change_note: skill.change_note || null, updated_by: OWNER_ID });
  } catch (ve) { console.warn('Version row insert failed (non-fatal):', ve); }
  // Build #44 — auto preview ; Build #47 — track in-flight + spinner
  // Build #85 — skip auto-preview for skill groups (no prompt of their own)
  const promptChanged = !skill.is_group && (!skill.id || (skill.previousPrompt && skill.previousPrompt !== saved.prompt) || !saved.preview_image_b64);
  if (promptChanged) {
    state.skillsGenerating.add(saved.id);
    if (state.view === 'skills') renderSkills();
    try {
      toast({ type: 'info', message: 'Generating preview thumbnail\u2026' });
      const previewResult = await generateSkillPreview(saved.prompt, saved.name);
      await sb.from('deck_templates').update({ preview_image_b64: previewResult.b64 }).eq('id', saved.id);
      deckCost.testImage += previewResult.cost; renderCostBadge();
      toast({ type: 'success', message: 'Preview generated \u00b7 ' + fmtUsd4(previewResult.cost) });
    } catch (pe) {
      console.warn('Skill preview generation failed (non-fatal):', pe);
      toast({ type: 'info', message: 'Skill saved \u00b7 preview gen failed (use Regenerate preview later)' });
    } finally {
      state.skillsGenerating.delete(saved.id);
    }
  }
  await loadAllSkills();
}

async function duplicateSkill(id) {
  const s = skillById(id); if (!s) return;
  try {
    await saveSkill({ id: null, name: s.name + ' (copy)', description: s.description, prompt: s.prompt, change_note: 'Duplicated from ' + s.name });
    toast({ type: 'success', message: 'Skill duplicated' });
    renderSkills();
  } catch (e) { toast({ type: 'error', message: e.message || String(e) }); }
}
function confirmDeleteSkill(id) {

  };

async function fetchSavedDecks() {
  const sb = getSupabaseClient();
  if (!sb) { state.savedDecksError = 'Supabase not initialised'; state.savedDecksLoaded = true; return; }
  try {
    const { data, error } = await sb.from('saved_decks').select('*').eq('owner', OWNER_ID).order('created_at', { ascending: false }).limit(50);
    if (error) { state.savedDecksError = error.message || String(error); state.savedDecksLoaded = true; state.savedDecks = []; return; }
    state.savedDecks = data || []; state.savedDecksError = null; state.savedDecksLoaded = true;
  } catch (e) { state.savedDecksError = e.message || String(e); state.savedDecksLoaded = true; state.savedDecks = []; }
}

async function saveCurrentDeckToSupabase() {
  const sb = getSupabaseClient();
  if (!sb) return null;
  if (!state.slides || state.slides.length === 0) return null;
  const skill = state.selectedSkillId ? skillById(state.selectedSkillId) : null;
  // Build #51 — name saved deck after its theme (first slide title), matching the .pptx filename
  const firstSlideTitle = (state.slides[0] && state.slides[0].title || '').trim();
  const themedTitle = firstSlideTitle && firstSlideTitle.toLowerCase() !== 'title' && firstSlideTitle.toLowerCase() !== 'untitled'
    ? firstSlideTitle
    : (skill && skill.name ? skill.name : 'Untitled deck');
  const title = themedTitle;
  const slidesPayload = state.slides.map(s => ({
    title: s.title || '',
    body: s.body || '',
    speakerNotes: s.speakerNotes || '',
    imagePrompt: s.imagePrompt || null,
    lastPrompt: s.lastPrompt || null,
    layoutBlocks: (s.layoutBlocks || []).map(b => ({ ...b, fillMode: b.fillMode || 'contain' }))
  }));
  // Build #70 — capture per-deck branding snapshot
  ensureDeckBranding();
  const brandingSnapshot = state.deckBranding ? JSON.parse(JSON.stringify(state.deckBranding)) : null;
  const payload = {
    owner: OWNER_ID,
    title: title,
    skill_id: state.selectedSkillId || null,
    skill_name: skill ? skill.name : null,
    slide_min: state.slideMin || 6,
    slide_max: state.slideMax || 10,
    slide_count: state.slides.length,
    model_used: state.selectedModel || state.lastSelectedModel || state.defaultModel || null,
    customer_logo_enabled: !!state.customerLogoEnabled,
    slides: slidesPayload,
    branding: brandingSnapshot,
    updated_at: new Date().toISOString()
  };
  state.savingDeck = true;
  try {
    let { data, error } = await sb.from('saved_decks').insert(payload).select().single();
    if (error) {
      const msg = error.message || String(error);
      // Build #70 — if branding column doesn't exist yet, retry without it
      if (/branding/i.test(msg) && /column|schema/i.test(msg)) {
        console.warn('saved_decks.branding column missing; retrying without it. Run Build #70 SQL to enable per-deck branding.');
        const fallbackPayload = Object.assign({}, payload);
        delete fallbackPayload.branding;
        const retry = await sb.from('saved_decks').insert(fallbackPayload).select().single();
        data = retry.data; error = retry.error;
      }
      if (error) { console.warn('saveCurrentDeckToSupabase failed:', error); state.savingDeck = false; return null; }
    }
    state.lastSavedDeckId = data.id;
    state.savedDecks = [data].concat(state.savedDecks || []);
    state.savingDeck = false;
    // Build #52 — generate + upload thumbnail asynchronously (non-blocking)
    (async () => {
      try {
        const blob = await generateDeckThumbnail();
        if (!blob) return;
        const url = await uploadDeckThumbnail(data.id, blob);
        if (!url) return;
        await sb.from('saved_decks').update({ thumbnail_url: url }).eq('id', data.id);
        data.thumbnail_url = url;
        const idx = (state.savedDecks || []).findIndex(d => d.id === data.id);
        if (idx >= 0) state.savedDecks[idx].thumbnail_url = url;
        if (state.view === 'compose') { try { renderPastDecksCol(); } catch (e) {} }
      } catch (e) {
        console.warn('Deck thumbnail generation failed (non-fatal):', e);
      }
    })();
    return data;
  } catch (e) { console.warn('saveCurrentDeckToSupabase exception:', e); state.savingDeck = false; return null; }
}

function loadSavedDeckIntoState(deck) {
  if (!deck) return;
  deckCost.reset();
  state.whitePaper = { data: null, blob: null, status: 'idle', error: null, cost: 0, illustCost: 0, deckTitle: '', statusMsg: '', figuresTotal: 0, figuresDone: 0, illustTotal: 0, illustDone: 0, awaitingConfirm: false, includeIllustrations: true, targetPagesMin: 6, targetPagesMax: 10, targetPages: 8, awaitingPageCount: true };
  if (deck.skill_id && skillById(deck.skill_id)) state.selectedSkillId = deck.skill_id;
  if (typeof deck.slide_min === 'number') state.slideMin = deck.slide_min;
  if (typeof deck.slide_max === 'number') state.slideMax = deck.slide_max;
  state.customerLogoEnabled = !!deck.customer_logo_enabled;
  state.slides = (deck.slides || []).map(s => ({
    title: s.title || 'Untitled',
    body: s.body || '',
    speakerNotes: s.speakerNotes || '',
    prevSpeakerNotes: null,
    notesExpanded: false,
    rewritingNotes: false,
    imageB64: null,
    imagePrompt: s.imagePrompt || null,
    lastPrompt: s.lastPrompt || null,
    status: 'idle',
    error: null,
    regenCount: 0,
    costAccrued: 0,
    modelUsed: null,
    layoutBlocks: Array.isArray(s.layoutBlocks) ? s.layoutBlocks : []
  }));
  if (deck.model_used) state.lastSelectedModel = deck.model_used;
  state.polishMode = null;
  // Build #70 — restore per-deck branding if it was saved with the deck
  if (deck.branding && typeof deck.branding === 'object' && deck.branding.topLeft) {
    state.deckBranding = JSON.parse(JSON.stringify(deck.branding));
    // Persist as new last-used so subsequent renders use it
    try { persistDeckBranding(); } catch (e) {}
    // Sync legacy fields for assemblePptx compatibility
    if (state.deckBranding.topRight && state.deckBranding.topRight.type === 'customer-logo') {
      state.deckCustomerLogoId = state.deckBranding.topRight.refId;
      const sel = brandLibLogoById(state.deckCustomerLogoId);
      state.customerLogoB64 = sel ? sel.b64 : null;
      state.customerLogoEnabled = !!state.customerLogoB64;
    } else {
      state.deckCustomerLogoId = null;
      state.customerLogoB64 = null;
      state.customerLogoEnabled = false;
    }
  }
  // Build #59 — land on Edit (composeStep=3, spine 4) so user can review/edit slide text.
  // Continue button from Edit will call enterStep35() which populates model candidates properly.
  state.composeStep = 3;
  state.expandedStep = 3;
  state.expandedStepLocked = true;
  state.view = 'compose';
  setActiveNav();
  renderCompose();
  toast({ type: 'success', message: 'Loaded "' + (deck.title || 'deck') + '" — review/edit text, then continue to pick a model' });
}

async function deleteSavedDeck(id) {
  const sb = getSupabaseClient(); if (!sb) return;
  try {
    const { error } = await sb.from('saved_decks').delete().eq('id', id).eq('owner', OWNER_ID);
    if (error) { toast({ type: 'error', message: 'Delete failed: ' + (error.message || String(error)) }); return; }
    state.savedDecks = (state.savedDecks || []).filter(d => d.id !== id);
    toast({ type: 'success', message: 'Deck removed from history' });
    if (state.view === 'compose' && (state.composeStep === 0 || state.composeStep === 1)) renderCompose();
  } catch (e) { toast({ type: 'error', message: 'Delete failed: ' + (e.message || String(e)) }); }
}

          '</div>' +

    // Build #53/#54 — backfill button with cost estimate

    } else if (missingThumbs > 0) {
      const estTotal = backfillThumbCostEstimate(missingThumbs).total;

    }
    body = backfillBar + '<div style="margin-bottom:12px"><input class="input" type="text" id="pastDecksFilterInput" placeholder="\u{1F50D} Filter by title or skill\u2026" value="' + escapeHtml(filter) + '"></div>' +
      '<div class="muted body-sm" style="font-size:11px;margin-bottom:8px">' + filtered.length + ' of ' + all.length + ' deck' + (all.length===1?'':'s') + '</div>' +
      '<div style="max-height:540px;overflow-y:auto;padding-right:4px">' + rows + '</div>' +

  const fi = document.getElementById('pastDecksFilterInput');

function updateAdminBadge() {
  const el = document.getElementById('adminBadge'); if (!el) return;
  el.innerHTML = state.adminMode ? '<span class="badge badge-accent" style="cursor:pointer" id="adminBadgeBtn">Admin</span>' : '<span class="badge badge-neutral" style="cursor:pointer" id="adminBadgeBtn">Read-only</span>';
  const btn = document.getElementById('adminBadgeBtn');
  if (btn) btn.onclick = async () => { state.adminMode = !state.adminMode; await persistSetting('dn_admin', String(state.adminMode)); updateAdminBadge(); if (state.view === 'skills') renderSkills(); else if (state.view === 'settings') renderSettings(); };
}
function renderCostBadge() {
  const el = document.getElementById('costBadge'); if (!el) return;
  const total = deckCost.total();
  if (total <= 0) { el.innerHTML = ''; return; }
  el.innerHTML = `<span class="cost-badge">Deck cost <strong>${fmtUsd4(total)}</strong></span>`;
}

document.getElementById('themeToggle').addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = state.theme; });
function setActiveNav() { document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === state.view)); }
document.querySelectorAll('.nav-btn').forEach(b => { b.addEventListener('click', () => { state.view = b.dataset.view; setActiveNav(); render(); }); });
function render() {
  if (state.view === 'compose') renderCompose();
  else if (state.view === 'skills') renderSkills();
  else if (state.view === 'brand') renderBrand();
  else renderSettings();
  renderCostBadge();
}

async function initApp() {
  await bootstrapSettings();
  await loadAllReferenceData();
  hydrateStateFromStorage();
  // Build #63 — load user assets for layout blocks (non-blocking)
  loadUserAssets().catch(e => console.warn('loadUserAssets boot failed:', e));
  if (!state.selectedSkillId || !skillById(state.selectedSkillId)) state.selectedSkillId = defaultSkillId();
  updateAdminBadge();
  render();
  setInterval(updateSyncPill, 30000);
  if (!state.logoIsCustom) { const b = await loadDefaultLogo(); if (b) state.logoB64 = b; }
  // Build #37 — fetch saved decks in background, then re-render the panel
  fetchSavedDecks().then(() => { if (state.view === 'compose' && (state.composeStep === 0 || state.composeStep === 1)) renderCompose(); }).catch(e => console.warn('fetchSavedDecks boot failed:', e));
}
initApp();
</script>
</body></html>
