<!DOCTYPE html>
<html lang="en">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback, useContext, useReducer } = React;

// Basic Portfolio Entry Interface
const PortfolioEntry_0 = () => {
  const [portfolioItems, setPortfolioItems] = useState([]);
  const [showAddForm, setShowAddForm] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [formData, setFormData] = useState({
    symbol: '',
    quantity: '',
    purchasePrice: '',
    purchaseDate: new Date().toISOString().split('T')[0]
  });
  const [errors, setErrors] = useState({});

  const validateForm = () => {
    const newErrors = {};
    
    if (!formData.symbol.trim()) {
      newErrors.symbol = 'Stock symbol is required';
    } else if (!/^[A-Z]{1,5}$/.test(formData.symbol.toUpperCase())) {
      newErrors.symbol = 'Symbol must be 1-5 uppercase letters';
    }
    
    if (!formData.quantity || parseFloat(formData.quantity) <= 0) {
      newErrors.quantity = 'Quantity must be greater than 0';
    }
    
    if (!formData.purchasePrice || parseFloat(formData.purchasePrice) <= 0) {
      newErrors.purchasePrice = 'Purchase price must be greater than 0';
    }
    
    if (!formData.purchaseDate) {
      newErrors.purchaseDate = 'Purchase date is required';
    }
    
    setErrors(newErrors);
    return Object.keys(newErrors).length === 0;
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    
    if (!validateForm()) {
      return;
    }

    const portfolioItem = {
      id: editingItem ? editingItem.id : Date.now().toString(),
      symbol: formData.symbol.toUpperCase(),
      quantity: parseFloat(formData.quantity),
      purchasePrice: parseFloat(formData.purchasePrice),
      purchaseDate: formData.purchaseDate,
      addedAt: editingItem ? editingItem.addedAt : new Date().toISOString()
    };

    if (editingItem) {
      setPortfolioItems(items => 
        items.map(item => item.id === editingItem.id ? portfolioItem : item)
      );
      setEditingItem(null);
    } else {
      // Check for duplicate symbols
      const existingSymbol = portfolioItems.find(item => item.symbol === portfolioItem.symbol);
      if (existingSymbol) {
        setErrors({ symbol: 'This symbol is already in your portfolio' });
        return;
      }
      setPortfolioItems(items => [...items, portfolioItem]);
    }

    // Reset form
    setFormData({
      symbol: '',
      quantity: '',
      purchasePrice: '',
      purchaseDate: new Date().toISOString().split('T')[0]
    });
    setShowAddForm(false);
    setErrors({});
  };

  const handleEdit = (item) => {
    setFormData({
      symbol: item.symbol,
      quantity: item.quantity.toString(),
      purchasePrice: item.purchasePrice.toString(),
      purchaseDate: item.purchaseDate
    });
    setEditingItem(item);
    setShowAddForm(true);
    setErrors({});
  };

  const handleDelete = (id) => {
    if (window.confirm('Are you sure you want to remove this stock from your portfolio?')) {
      setPortfolioItems(items => items.filter(item => item.id !== id));
    }
  };

  const handleCancel = () => {
    setShowAddForm(false);
    setEditingItem(null);
    setFormData({
      symbol: '',
      quantity: '',
      purchasePrice: '',
      purchaseDate: new Date().toISOString().split('T')[0]
    });
    setErrors({});
  };

  const formatCurrency = (amount) => {
    return new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: 'USD'
    }).format(amount);
  };

  const formatDate = (dateString) => {
    return new Date(dateString).toLocaleDateString('en-US', {
      year: 'numeric',
      month: 'short',
      day: 'numeric'
    });
  };

  const totalInvestment = portfolioItems.reduce((total, item) => 
    total + (item.quantity * item.purchasePrice), 0
  );

  return (
    <div className="min-h-screen bg-gray-50 p-4">
      <div className="max-w-md mx-auto">
        {/* Header */}
        <div className="bg-white rounded-lg shadow-sm p-6 mb-4">
          <h1 className="text-2xl font-bold text-gray-800 mb-2">My Portfolio</h1>
          <div className="flex justify-between items-center">
            <div>
              <p className="text-sm text-gray-600">{portfolioItems.length} stocks</p>
              <p className="text-lg font-semibold text-green-600">
                {formatCurrency(totalInvestment)} invested
              </p>
            </div>
            <button
              onClick={() => setShowAddForm(true)}
              className="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-medium transition-colors"
            >
              Add Stock
            </button>
          </div>
        </div>

        {/* Add/Edit Form */}
        {showAddForm && (
          <div className="bg-white rounded-lg shadow-sm p-6 mb-4">
            <h2 className="text-xl font-semibold text-gray-800 mb-4">
              {editingItem ? 'Edit Stock' : 'Add New Stock'}
            </h2>
            
            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">
                  Stock Symbol *
                </label>
                <input
                  type="text"
                  value={formData.symbol}
                  onChange={(e) => setFormData({...formData, symbol: e.target.value})}
                  className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${errors.symbol ? 'border-red-500' : 'border-gray-300'}`}
                  placeholder="e.g., AAPL"
                  maxLength="5"
                />
                {errors.symbol && (
                  <p className="text-red-500 text-sm mt-1">{errors.symbol}</p>
                )}
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">
                  Quantity *
                </label>
                <input
                  type="number"
                  step="0.001"
                  value={formData.quantity}
                  onChange={(e) => setFormData({...formData, quantity: e.target.value})}
                  className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${errors.quantity ? 'border-red-500' : 'border-gray-300'}`}
                  placeholder="0.0"
                />
                {errors.quantity && (
                  <p className="text-red-500 text-sm mt-1">{errors.quantity}</p>
                )}
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">
                  Purchase Price *
                </label>
                <input
                  type="number"
                  step="0.01"
                  value={formData.purchasePrice}
                  onChange={(e) => setFormData({...formData, purchasePrice: e.target.value})}
                  className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${errors.purchasePrice ? 'border-red-500' : 'border-gray-300'}`}
                  placeholder="0.00"
                />
                {errors.purchasePrice && (
                  <p className="text-red-500 text-sm mt-1">{errors.purchasePrice}</p>
                )}
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">
                  Purchase Date *
                </label>
                <input
                  type="date"
                  value={formData.purchaseDate}
                  onChange={(e) => setFormData({...formData, purchaseDate: e.target.value})}
                  className={`w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${errors.purchaseDate ? 'border-red-500' : 'border-gray-300'}`}
                />
                {errors.purchaseDate && (
                  <p className="text-red-500 text-sm mt-1">{errors.purchaseDate}</p>
                )}
              </div>

              <div className="flex gap-3 pt-4">
                <button
                  type="submit"
                  className="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg font-medium transition-colors"
                >
                  {editingItem ? 'Update Stock' : 'Add Stock'}
                </button>
                <button
                  type="button"
                  onClick={handleCancel}
                  className="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-700 py-2 px-4 rounded-lg font-medium transition-colors"
                >
                  Cancel
                </button>
              </div>
            </form>
          </div>
        )}

        {/* Portfolio List */}
        <div className="space-y-3">
          {portfolioItems.length === 0 ? (
            <div className="bg-white rounded-lg shadow-sm p-8 text-center">
              <div className="text-gray-400 mb-3">
                <svg className="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
              </div>
              <h3 className="text-lg font-medium text-gray-600 mb-2">No stocks in portfolio</h3>
              <p className="text-gray-500 mb-4">Add your first stock to get started tracking your investments.</p>
              <button
                onClick={() => setShowAddForm(true)}
                className="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg font-medium transition-colors"
              >
                Add Your First Stock
              </button>
            </div>
          ) : (
            portfolioItems.map((item) => {
              const totalValue = item.quantity * item.purchasePrice;
              return (
                <div key={item.id} className="bg-white rounded-lg shadow-sm p-4">
                  <div className="flex justify-between items-start mb-3">
                    <div className="flex-1">
                      <h3 className="text-lg font-bold text-gray-800">{item.symbol}</h3>
                      <p className="text-sm text-gray-600">{formatDate(item.purchaseDate)}</p>
                    </div>
                    <div className="flex gap-2 ml-4">
                      <button
                        onClick={() => handleEdit(item)}
                        className="text-blue-500 hover:text-blue-700 p-1"
                        title="Edit stock"
                      >
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                      </button>
                      <button
                        onClick={() => handleDelete(item.id)}
                        className="text-red-500 hover:text-red-700 p-1"
                        title="Delete stock"
                      >
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                      </button>
                    </div>
                  </div>
                  
                  <div className="grid grid-cols-2 gap-4 text-sm">
                    <div>
                      <p className="text-gray-600">Quantity</p>
                      <p className="font-semibold">{item.quantity}</p>
                    </div>
                    <div>
                      <p className="text-gray-600">Price</p>
                      <p className="font-semibold">{formatCurrency(item.purchasePrice)}</p>
                    </div>
                  </div>
                  
                  <div className="mt-3 pt-3 border-t border-gray-100">
                    <div className="flex justify-between items-center">
                      <span className="text-gray-600">Total Investment</span>
                      <span className="font-bold text-lg text-green-600">
                        {formatCurrency(totalValue)}
                      </span>
                    </div>
                  </div>
                </div>
              );
            })
          )}
        </div>
      </div>
    </div>
  );
};



// Daily Price Update Service
const PriceUpdateService_1 = () => {
  const [lastUpdate, setLastUpdate] = useState(null);
  const [updateStatus, setUpdateStatus] = useState('idle');
  const [updateLog, setUpdateLog] = useState([]);
  const [autoUpdate, setAutoUpdate] = useState(true);
  const [updateInterval, setUpdateInterval] = useState(5); // minutes
  const intervalRef = useRef(null);

  // Mock API function - in production, replace with real API
  const fetchStockPrice = async (symbol) => {
    // Simulate API delay
    await new Promise(resolve => setTimeout(resolve, 200 + Math.random() * 300));
    
    // Simulate realistic price movements (±5%)
    const basePrice = {
      'AAPL': 175,
      'GOOGL': 2800,
      'TSLA': 250,
      'MSFT': 380,
      'AMZN': 145,
      'META': 320,
      'NVDA': 450,
      'NFLX': 400
    }[symbol] || 100;
    
    const variation = (Math.random() - 0.5) * 0.1; // ±5%
    const price = basePrice * (1 + variation);
    
    return {
      symbol,
      price: Math.round(price * 100) / 100,
      change: Math.round(variation * basePrice * 100) / 100,
      changePercent: Math.round(variation * 10000) / 100,
      timestamp: Date.now()
    };
  };

  const updatePortfolioPrices = async () => {
    setUpdateStatus('updating');
    const startTime = Date.now();
    
    try {
      // Get portfolios from localStorage
      const portfolios = JSON.parse(localStorage.getItem('portfolios') || '[]');
      if (portfolios.length === 0) {
        setUpdateLog(prev => [{
          timestamp: new Date().toLocaleTimeString(),
          message: 'No portfolios found to update',
          type: 'warning'
        }, ...prev.slice(0, 9)]);
        setUpdateStatus('idle');
        return;
      }

      // Get unique stock symbols
      const symbols = [...new Set(portfolios.map(p => p.symbol.toUpperCase()))];
      
      // Fetch prices for all symbols
      const pricePromises = symbols.map(symbol => fetchStockPrice(symbol));
      const priceResults = await Promise.all(pricePromises);
      
      // Create price lookup map
      const priceMap = {};
      priceResults.forEach(result => {
        priceMap[result.symbol] = result;
      });
      
      // Update portfolios with new prices
      const updatedPortfolios = portfolios.map(portfolio => {
        const priceData = priceMap[portfolio.symbol.toUpperCase()];
        if (priceData) {
          const currentValue = portfolio.shares * priceData.price;
          const totalCost = portfolio.shares * portfolio.purchasePrice;
          const totalGainLoss = currentValue - totalCost;
          const gainLossPercent = (totalGainLoss / totalCost) * 100;
          
          return {
            ...portfolio,
            currentPrice: priceData.price,
            currentValue,
            totalGainLoss,
            gainLossPercent: Math.round(gainLossPercent * 100) / 100,
            lastUpdated: priceData.timestamp,
            priceChange: priceData.change,
            priceChangePercent: priceData.changePercent
          };
        }
        return portfolio;
      });
      
      // Save updated portfolios
      localStorage.setItem('portfolios', JSON.stringify(updatedPortfolios));
      
      const endTime = Date.now();
      const duration = ((endTime - startTime) / 1000).toFixed(1);
      
      setUpdateLog(prev => [{
        timestamp: new Date().toLocaleTimeString(),
        message: `Updated ${symbols.length} stocks in ${duration}s`,
        type: 'success',
        details: `Symbols: ${symbols.join(', ')}`
      }, ...prev.slice(0, 9)]);
      
      setLastUpdate(new Date());
      setUpdateStatus('success');
      
      // Dispatch custom event to notify other components
      window.dispatchEvent(new CustomEvent('portfolioUpdated', {
        detail: { updatedPortfolios, timestamp: Date.now() }
      }));
      
    } catch (error) {
      setUpdateLog(prev => [{
        timestamp: new Date().toLocaleTimeString(),
        message: `Update failed: ${error.message}`,
        type: 'error'
      }, ...prev.slice(0, 9)]);
      setUpdateStatus('error');
    }
  };

  // Auto-update functionality
  useEffect(() => {
    if (autoUpdate && updateInterval > 0) {
      intervalRef.current = setInterval(() => {
        updatePortfolioPrices();
      }, updateInterval * 60 * 1000); // Convert minutes to milliseconds
      
      return () => {
        if (intervalRef.current) {
          clearInterval(intervalRef.current);
        }
      };
    }
  }, [autoUpdate, updateInterval]);

  // Initial update on component mount
  useEffect(() => {
    const timer = setTimeout(() => {
      updatePortfolioPrices();
    }, 1000);
    
    return () => clearTimeout(timer);
  }, []);

  const getStatusColor = () => {
    switch (updateStatus) {
      case 'updating': return 'text-blue-600';
      case 'success': return 'text-green-600';
      case 'error': return 'text-red-600';
      default: return 'text-gray-600';
    }
  };

  const getStatusIcon = () => {
    switch (updateStatus) {
      case 'updating': return '🔄';
      case 'success': return '✅';
      case 'error': return '❌';
      default: return '⏸️';
    }
  };

  return (
    <div className="max-w-md mx-auto bg-white shadow-lg rounded-lg">
      {/* Header */}
      <div className="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-4 rounded-t-lg">
        <h1 className="text-xl font-bold">Price Update Service</h1>
        <p className="text-blue-100 text-sm">Daily portfolio price tracking</p>
      </div>

      {/* Status Section */}
      <div className="p-4 border-b">
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center space-x-2">
            <span className="text-lg">{getStatusIcon()}</span>
            <span className={`font-medium ${getStatusColor()}`}>
              {updateStatus === 'updating' ? 'Updating...' : 
               updateStatus === 'success' ? 'Updated' :
               updateStatus === 'error' ? 'Error' : 'Ready'}
            </span>
          </div>
          <button
            onClick={updatePortfolioPrices}
            disabled={updateStatus === 'updating'}
            className="px-3 py-1 bg-blue-500 text-white text-sm rounded hover:bg-blue-600 disabled:opacity-50"
          >
            Update Now
          </button>
        </div>
        
        {lastUpdate && (
          <p className="text-gray-600 text-sm">
            Last updated: {lastUpdate.toLocaleString()}
          </p>
        )}
      </div>

      {/* Settings */}
      <div className="p-4 border-b">
        <h3 className="font-medium mb-3">Auto-Update Settings</h3>
        
        <div className="flex items-center justify-between mb-3">
          <label className="text-sm text-gray-700">Enable Auto-Update</label>
          <button
            onClick={() => setAutoUpdate(!autoUpdate)}
            className={`w-12 h-6 rounded-full transition-colors ${
              autoUpdate ? 'bg-green-500' : 'bg-gray-300'
            }`}
          >
            <div className={`w-5 h-5 rounded-full bg-white transition-transform ${
              autoUpdate ? 'translate-x-6' : 'translate-x-1'
            }`} />
          </button>
        </div>
        
        <div className="flex items-center justify-between">
          <label className="text-sm text-gray-700">Update Interval</label>
          <select
            value={updateInterval}
            onChange={(e) => setUpdateInterval(Number(e.target.value))}
            disabled={!autoUpdate}
            className="px-2 py-1 border rounded text-sm disabled:opacity-50"
          >
            <option value={1}>1 minute</option>
            <option value={5}>5 minutes</option>
            <option value={15}>15 minutes</option>
            <option value={30}>30 minutes</option>
            <option value={60}>1 hour</option>
          </select>
        </div>
      </div>

      {/* Update Log */}
      <div className="p-4">
        <h3 className="font-medium mb-3">Update Log</h3>
        
        {updateLog.length === 0 ? (
          <p className="text-gray-500 text-sm text-center py-4">
            No updates yet
          </p>
        ) : (
          <div className="space-y-2 max-h-64 overflow-y-auto">
            {updateLog.map((log, index) => (
              <div key={index} className="bg-gray-50 p-2 rounded text-sm">
                <div className="flex items-center justify-between">
                  <span className={`font-medium ${
                    log.type === 'success' ? 'text-green-600' :
                    log.type === 'error' ? 'text-red-600' :
                    'text-yellow-600'
                  }`}>
                    {log.timestamp}
                  </span>
                  <span className={`text-xs px-2 py-1 rounded ${
                    log.type === 'success' ? 'bg-green-100 text-green-800' :
                    log.type === 'error' ? 'bg-red-100 text-red-800' :
                    'bg-yellow-100 text-yellow-800'
                  }`}>
                    {log.type}
                  </span>
                </div>
                <p className="text-gray-700 mt-1">{log.message}</p>
                {log.details && (
                  <p className="text-gray-500 text-xs mt-1">{log.details}</p>
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Service Info */}
      <div className="p-4 bg-gray-50 rounded-b-lg">
        <h3 className="font-medium mb-2">Service Information</h3>
        <div className="text-sm text-gray-600 space-y-1">
          <p>• Fetches real-time stock prices</p>
          <p>• Updates portfolio values automatically</p>
          <p>• Configurable update intervals</p>
          <p>• Persistent data storage</p>
        </div>
      </div>
    </div>
  );
};



// Portfolio Dashboard View
const PortfolioDashboard_2 = () => {
  const [portfolioData, setPortfolioData] = useState([]);
  const [lastUpdate, setLastUpdate] = useState(null);
  const [isLoading, setIsLoading] = useState(true);
  const [sortBy, setSortBy] = useState('symbol');
  const [sortOrder, setSortOrder] = useState('asc');

  // Load portfolio data from localStorage
  const loadPortfolioData = useCallback(() => {
    try {
      const stored = localStorage.getItem('stockPortfolio');
      if (stored) {
        const data = JSON.parse(stored);
        setPortfolioData(data);
      }
      
      const lastUpdateTime = localStorage.getItem('lastPriceUpdate');
      if (lastUpdateTime) {
        setLastUpdate(new Date(lastUpdateTime));
      }
    } catch (error) {
      console.error('Error loading portfolio data:', error);
    } finally {
      setIsLoading(false);
    }
  }, []);

  useEffect(() => {
    loadPortfolioData();
    
    // Listen for portfolio updates
    const handleStorageUpdate = (e) => {
      if (e.key === 'stockPortfolio' || e.key === 'lastPriceUpdate') {
        loadPortfolioData();
      }
    };
    
    window.addEventListener('storage', handleStorageUpdate);
    return () => window.removeEventListener('storage', handleStorageUpdate);
  }, [loadPortfolioData]);

  // Calculate portfolio totals
  const portfolioSummary = useMemo(() => {
    if (!portfolioData.length) {
      return {
        totalValue: 0,
        totalCost: 0,
        totalGainLoss: 0,
        totalGainLossPercent: 0,
        totalShares: 0
      };
    }

    const totalValue = portfolioData.reduce((sum, stock) => sum + (stock.currentPrice * stock.shares), 0);
    const totalCost = portfolioData.reduce((sum, stock) => sum + (stock.purchasePrice * stock.shares), 0);
    const totalGainLoss = totalValue - totalCost;
    const totalGainLossPercent = totalCost > 0 ? (totalGainLoss / totalCost) * 100 : 0;
    const totalShares = portfolioData.reduce((sum, stock) => sum + stock.shares, 0);

    return {
      totalValue,
      totalCost,
      totalGainLoss,
      totalGainLossPercent,
      totalShares
    };
  }, [portfolioData]);

  // Sort portfolio data
  const sortedPortfolio = useMemo(() => {
    const sorted = [...portfolioData].sort((a, b) => {
      let aValue, bValue;
      
      switch (sortBy) {
        case 'symbol':
          aValue = a.symbol;
          bValue = b.symbol;
          break;
        case 'value':
          aValue = a.currentPrice * a.shares;
          bValue = b.currentPrice * b.shares;
          break;
        case 'gainLoss':
          aValue = (a.currentPrice - a.purchasePrice) * a.shares;
          bValue = (b.currentPrice - b.purchasePrice) * b.shares;
          break;
        case 'gainLossPercent':
          aValue = ((a.currentPrice - a.purchasePrice) / a.purchasePrice) * 100;
          bValue = ((b.currentPrice - b.purchasePrice) / b.purchasePrice) * 100;
          break;
        default:
          return 0;
      }
      
      if (typeof aValue === 'string') {
        return sortOrder === 'asc' ? aValue.localeCompare(bValue) : bValue.localeCompare(aValue);
      }
      
      return sortOrder === 'asc' ? aValue - bValue : bValue - aValue;
    });
    
    return sorted;
  }, [portfolioData, sortBy, sortOrder]);

                      className={`h-2 rounded-full transition-all duration-500 ${
                        sector.performance > 0 ? 'bg-green-500' : 'bg-red-500'
                      }`}
                      style={{
                        width: `${Math.min(Math.abs(sector.performance) * 10, 100)}%`
                      }}
                    ></div>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {/* Footer */}
          <div className="p-6 border-t border-gray-200 bg-gray-50">
            <div className="flex items-center justify-between text-sm text-gray-600">
              <div>Last updated: {new Date().toLocaleTimeString()}</div>
              <div>Data delayed 15 minutes</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};



function DNApp() {
  const tabs = [{"display":"Basic Portfolio Entry Interface","key":"PortfolioEntry_0"},{"display":"Daily Price Update Service","key":"PriceUpdateService_1"},{"display":"Portfolio Dashboard View","key":"PortfolioDashboard_2"},{"display":"Market Overview Widget","key":"MarketOverviewWidget_3"},{"display":"Trending Stocks Analysis","key":"TrendingStocksAnalysis_4"},{"display":"Sector Performance Tracking","key":"SectorPerformanceTracking_5"}];
  const [active, setActive] = useState(tabs[0] && tabs[0].key);
  const compMap = {PortfolioEntry_0: PortfolioEntry_0, PriceUpdateService_1: PriceUpdateService_1, PortfolioDashboard_2: PortfolioDashboard_2, MarketOverviewWidget_3: MarketOverviewWidget_3, TrendingStocksAnalysis_4: TrendingStocksAnalysis_4, SectorPerformanceTracking_5: SectorPerformanceTracking_5};
  const Active = compMap[active];
  return (
    <div className="min-h-screen">
      <header className="px-6 py-4 border-b border-slate-800 flex items-center gap-3">
        <h1 className="text-xl font-bold text-cyan-400">Personal Stock Portfolio &amp; Market Tracker</h1>
      </header>
      <nav className="flex gap-1 px-6 py-3 border-b border-slate-800 overflow-x-auto">
        {tabs.map(function(t) { return <button key={t.key} onClick={function() { setActive(t.key); }} className={"px-4 py-2 rounded-lg text-sm whitespace-nowrap " + (active === t.key ? "bg-cyan-500 text-slate-900 font-semibold" : "text-slate-400 hover:text-white")}>{t.display}</button>; })}
      </nav>
      <main className="p-6">
        {Active ? <Active /> : <p className="text-slate-400">Select a section.</p>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DNApp />);
</script>
