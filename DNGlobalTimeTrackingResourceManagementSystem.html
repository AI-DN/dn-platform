<style>
:root{--bg:#fafafa;--surface:#fff;--surface-2:#f5f5f5;--text:#18181b;--text-muted:#52525b;--text-subtle:#a1a1aa;--border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.16);--accent:#5e6ad2;--accent-hover:#4f59c4;--accent-bg:rgba(94,106,210,.08);--success:#16a34a;--success-bg:rgba(22,163,74,.08);--warning:#d97706;--warning-bg:rgba(217,119,6,.08);--danger:#dc2626;--danger-bg:rgba(220,38,38,.08);--info:#0284c7;--info-bg:rgba(2,132,199,.08);--radius-sm:4px;--radius-md:6px;--radius-lg:8px}
[data-theme=dark]{--bg:#09090b;--surface:#131316;--surface-2:#1c1c20;--text:#fafafa;--text-muted:#a1a1aa;--text-subtle:#71717a;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);--accent:#7b85e3;--accent-hover:#8d96e8;--accent-bg:rgba(123,133,227,.1);--success:#22c55e;--success-bg:rgba(34,197,94,.1);--warning:#f59e0b;--warning-bg:rgba(245,158,11,.1);--danger:#ef4444;--danger-bg:rgba(239,68,68,.1);--info:#38bdf8;--info-bg:rgba(56,189,248,.1)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.num{text-align:right;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.cap{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}
.muted{color:var(--text-muted)}.subtle{color:var(--text-subtle)}
h1,h2,h3{margin:0}
button{font-family:inherit}
.btn-primary{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:6px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:background 150ms ease}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);padding:6px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:background 150ms,border-color 150ms}
.btn-secondary:hover{background:var(--surface-2);border-color:var(--text-subtle)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid transparent;padding:6px 10px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;transition:background 150ms,color 150ms}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
button:disabled{opacity:.5;cursor:not-allowed}
.input{background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);padding:7px 10px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;transition:border-color 150ms,background 150ms}
.input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.input::placeholder{color:var(--text-subtle)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
thead th{text-align:left;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text)}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--surface-2)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge-success{background:var(--success-bg);color:var(--success)}.badge-warning{background:var(--warning-bg);color:var(--warning)}.badge-danger{background:var(--danger-bg);color:var(--danger)}.badge-info{background:var(--info-bg);color:var(--info)}.badge-neutral{background:var(--surface-2);color:var(--text-muted)}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}
.brand .logo{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.spacer{flex:1}
.pills{display:flex;gap:4px}
.pill{padding:4px 10px;border-radius:12px;font-size:12px;font-weight:500;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-muted);cursor:pointer;transition:all 150ms}
.pill.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.pill:disabled{cursor:not-allowed}
.subnav{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:49px;z-index:19;overflow-x:auto}
.tab{padding:10px 14px;font-size:13px;font-weight:500;color:var(--text-muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
main{padding:16px;max-width:1400px;margin:0 auto}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .l{margin-top:4px}
.kpi .d{font-size:12px;margin-top:6px;font-variant-numeric:tabular-nums}
.up{color:var(--success)}.down{color:var(--danger)}
.gridwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}
table.entry{border-collapse:separate;border-spacing:0}
table.entry th,table.entry td{padding:6px 10px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);font-size:13px}
table.entry th{position:sticky;top:0;background:var(--surface-2);z-index:2}
table.entry .frz{position:sticky;left:0;background:var(--surface);z-index:1;min-width:120px}
table.entry th.frz{z-index:3;background:var(--surface-2)}
table.entry .totcol{background:var(--surface-2);font-weight:600}
table.entry input{width:62px;text-align:right;border:1px solid transparent;background:transparent;color:var(--text);font-family:ui-monospace,Menlo,monospace;font-size:13px;padding:3px 4px;border-radius:4px}
table.entry input:focus{outline:none;border-color:var(--accent);background:var(--surface-2)}
.daybad{font-size:11px;margin-left:6px}
.toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:9999}
.toast{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:8px;min-width:220px;animation:slin 150ms ease}
@keyframes slin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.dot{width:8px;height:8px;border-radius:50%}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;z-index:100}
.slide{margin-left:auto;width:560px;max-width:96vw;height:100%;background:var(--surface);border-left:1px solid var(--border-strong);overflow-y:auto;animation:slx 180ms ease}
@keyframes slx{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.modalc{margin:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:24px;max-width:520px;width:92vw}
.cmdk{margin:80px auto auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-md);width:560px;max-width:94vw;height:fit-content;max-height:70vh;overflow:hidden;display:flex;flex-direction:column}
.cmdres{overflow-y:auto}
.cmdrow{padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;border-bottom:1px solid var(--border)}
.cmdrow:hover,.cmdrow.sel{background:var(--surface-2)}
.sec{margin-bottom:24px}
.sechd{display:flex;align-items:center;justify-content:between;gap:12px;margin-bottom:12px}
.lbl{display:block;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
.field{margin-bottom:14px}
.field .input,.field select{width:100%}
select.input{appearance:none}
.heat{display:inline-block;width:100%;height:26px;border-radius:3px;text-align:center;line-height:26px;font-size:11px;font-variant-numeric:tabular-nums}
.indent{padding-left:28px;border-left:2px solid var(--border);margin-left:6px}
.empty{text-align:center;padding:48px 16px;color:var(--text-muted)}
.empty svg{opacity:.14;margin-bottom:12px}
.thread{border-left:2px solid var(--border);padding-left:12px;margin:8px 0}
@media(max-width:640px){main{padding:12px}.hdr{flex-wrap:wrap}.slide{width:100%}.kpi .v{font-size:22px}}
</style>

function weekKey(d){return ymd(mondayOf(d));}
(function seed(){
  var r=mulberry32(7);var id=1;var weeks=9;var base=mondayOf(new Date());
  EMPLOYEES.forEach(function(emp){
    var projs=PROJECTS.filter(function(p){return p.status==='active'&&p.id!=='leave'&&(p.entity===emp.entity);});
    var mine=shuffle(projs,r).slice(0,2+Math.floor(r()*2));
    if(mine.length===0)mine=[projs[0]||PROJECTS[0]];
    for(var w=1;w<weeks;w++){
      var ws=addDays(base,-7*w);
      var wk=weekKey(ws);
      for(var di=0;di<5;di++){
        var date=ymd(addDays(ws,di));var rem=8;
        mine.forEach(function(p,ix){
          if(rem<=0)return;
          var h=(ix===mine.length-1)?rem:Math.round(r()*rem*0.7*10)/10;
          if(h<0)h=0;rem-=h;
          if(h>0.05)ENTRIES.push({id:id++,empId:emp.id,date:date,projectId:p.id,hours:h,type:'work',by:emp.id,at:date+'T17:30'});
        });
      }
      if(r()<0.18){var ld=ymd(addDays(ws,4));ENTRIES.push({id:id++,empId:emp.id,date:ld,projectId:'leave',hours:8,type:'leave',by:emp.id,at:ld+'T09:00'});}
      SUBMISSIONS[emp.id+'|'+wk]={status:(w<=2?(r()<0.5?'submitted':'approved'):'approved'),comments:[]};
    }
    emp._projs=mine.map(function(p){return p.id;});
  });
})();

function getWeekProjects(){
  var wk=weekKey(state.weekStart);var emp=state.currentEmp;var set={};
  ENTRIES.forEach(function(e){if(e.empId===emp){var d=new Date(e.date);if(weekKey(d)===wk)set[e.projectId]=1;}});
  (state.manualAdds[wk]||[]).forEach(function(p){set[p]=1;});
  var ids=Object.keys(set);
  if(ids.length===0)return [];
  ids.sort(function(a,b){if(a==='leave')return 1;if(b==='leave')return -1;return (projById(a).name<projById(b).name?-1:1);});
  return ids;
}
function getHours(date,pid){for(var i=0;i<ENTRIES.length;i++){var e=ENTRIES[i];if(e.empId===state.currentEmp&&e.date===date&&e.projectId===pid)return e.hours;}return null;}
function setHours(date,pid,val){
  var v=parseFloat(val);if(isNaN(v)||v<0)v=0;v=Math.round(v*10)/10;
  var found=null;for(var i=0;i<ENTRIES.length;i++){var e=ENTRIES[i];if(e.empId===state.currentEmp&&e.date===date&&e.projectId===pid){found=e;break;}}
  if(v===0){if(found){ENTRIES=ENTRIES.filter(function(x){return x!==found;});AUDIT.unshift({who:state.currentEmp,act:'cleared',pid:pid,date:date,at:new Date().toISOString()});}}
  else if(found){if(found.hours!==v){AUDIT.unshift({who:state.currentEmp,act:'edited '+found.hours+'\u2192'+v,pid:pid,date:date,at:new Date().toISOString()});}found.hours=v;found.at=new Date().toISOString();}
  else{ENTRIES.push({id:nextId(),empId:state.currentEmp,date:date,projectId:pid,hours:v,type:(pid==='leave'?'leave':'work'),by:state.currentEmp,at:new Date().toISOString()});AUDIT.unshift({who:state.currentEmp,act:'entered '+v,pid:pid,date:date,at:new Date().toISOString()});}
  autosave();
}

function periodRange(period,offset){
  offset=offset||0;var now=new Date();
  if(period==='week'){var ws=mondayOf(addDays(now,offset*7));return [ws,addDays(ws,7)];}
  if(period==='month'){var m=new Date(now.getFullYear(),now.getMonth()+offset,1);return [m,new Date(now.getFullYear(),now.getMonth()+offset+1,1)];}
  var q=Math.floor(now.getMonth()/3)+offset;var y=now.getFullYear()+Math.floor(q/4);var qq=((q%4)+4)%4;return [new Date(y,qq*3,1),new Date(y,qq*3+3,1)];}
function entriesIn(start,end){var ents=activeEntities();return ENTRIES.filter(function(e){var d=new Date(e.date);if(d<start||d>=end)return false;var emp=empById(e.empId);if(e.projectId==='leave')return true;return ents.indexOf(emp.entity)>=0||ents.indexOf(projById(e.projectId).entity)>=0;});}
function rollup(start,end){
  var ents=entriesIn(start,end);var byPnl={};var total={hours:0,cost:0,bill:0,billCost:0};
  ents.forEach(function(e){var emp=empById(e.empId);var p=projById(e.projectId);var pn=pnlById(p.pnlId);var cost=e.hours*emp.rate;var bill=pnlBillable(pn);
    if(!byPnl[pn.id])byPnl[pn.id]={pnl:pn,hours:0,cost:0,projects:{}};
    byPnl[pn.id].hours+=e.hours;byPnl[pn.id].cost+=cost;
    if(!byPnl[pn.id].projects[p.id])byPnl[pn.id].projects[p.id]={proj:p,hours:0,cost:0};
    byPnl[pn.id].projects[p.id].hours+=e.hours;byPnl[pn.id].projects[p.id].cost+=cost;
    total.hours+=e.hours;total.cost+=cost;if(bill){total.bill+=e.hours;total.billCost+=cost;}
  });
  return {byPnl:byPnl,total:total};
}

  h+='<div class="row" style="justify-content:space-between"><div><div style="font-size:18px;font-weight:600">'+esc(emp.name)+'</div><div class="cap">Week '+isoWeek(ws)+' \u00b7 '+rangeLabel(ws)+'</div></div><button class="btn-ghost" id="closeSlide">\u2715</button></div>';
  h+='<table style="margin-top:16px"><thead><tr><th>Project</th><th class="num">Hours</th></tr></thead><tbody>';
  var tot=0;Object.keys(byProj).forEach(function(k){tot+=byProj[k];h+='<tr><td>'+esc(projById(k).name)+'</td><td class="num">'+fmtH(byProj[k])+'</td></tr>';});
  h+='<tr style="font-weight:600"><td>Total</td><td class="num">'+fmtH(tot)+'</td></tr></tbody></table>';
  h+='<div class="field" style="margin-top:16px"><label class="lbl">Comment</label><textarea class="input" id="revComment" rows="2" style="width:100%" placeholder="Optional note to employee\u2026"></textarea></div>';
  if(s.comments.length){h+='<div class="thread">'+s.comments.map(function(c){return '<div style="margin-bottom:6px"><span class="badge badge-neutral">'+esc(c.by)+'</span> '+esc(c.text)+'</div>';}).join('')+'</div>';}
  h+='<div class="row" style="margin-top:14px"><button class="btn-primary" id="approveBtn">Approve</button><button class="btn-secondary" id="rejectBtn">Reject</button></div>';
  h+='</div></div>';
  openSlide(h);
  $('#approveBtn').addEventListener('click',function(){var c=$('#revComment').value.trim();if(c)s.comments.push({by:'Manager',text:c});s.status='approved';toast('Approved '+emp.name+'\u2019s timesheet','success');closeSlide();renderApprovals();});
  $('#rejectBtn').addEventListener('click',function(){var c=$('#revComment').value.trim();if(!c){toast('Add a comment explaining the rejection','error');return;}s.comments.push({by:'Manager',text:c});s.status='rejected';toast('Rejected \u2014 sent back to '+emp.name,'info');closeSlide();renderApprovals();});
}

/* =========================================================
   ADMIN
========================================================= */
function renderAdmin(){
  var h='<div style="margin-bottom:14px"><div style="font-size:20px;font-weight:600">Administration</div><div class="cap">Project hierarchy &amp; user management</div></div>';
  /* Project hierarchy */
  h+='<div class="card sec"><div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="cap">P&amp;L hierarchy &amp; projects</div><button class="btn-secondary" id="addPrjBtn">+ New project</button></div>';
  CATEGORIES.forEach(function(cat){
    h+='<div style="margin-bottom:14px"><div style="font-weight:600;margin-bottom:6px">'+cat+'</div>';
    PNL.filter(function(p){return p.cat===cat&&p.id!=='leave';}).forEach(function(pn){
      var prs=PROJECTS.filter(function(p){return p.pnlId===pn.id;});
      h+='<div class="indent" style="margin-bottom:8px"><div class="cap" style="margin-bottom:4px">'+esc(pn.name)+'</div>';
      if(prs.length===0)h+='<div class="subtle" style="font-size:12px">No projects</div>';
      prs.forEach(function(p){h+='<div class="row" style="justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)"><div>'+esc(p.name)+' <span class="badge badge-neutral">'+(p.entity==='ALL'?'ALL':p.entity)+'</span> '+(p.status==='archived'?'<span class="badge badge-warning">archived</span>':'')+'</div><div class="row"><span class="muted" style="font-size:12px">'+(p.budget>0?fmtH(p.budget)+'h budget':'no budget')+'</span><button class="btn-ghost" data-arch="'+p.id+'">'+(p.status==='archived'?'Restore':'Archive')+'</button></div></div>';});
      h+='</div>';
    });
    h+='</div>';
  });
  h+='</div>';
  /* user management */
  h+='<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="cap">User management ('+EMPLOYEES.length+')</div><button class="btn-secondary" id="addUserBtn">+ Onboard employee</button></div>';
  h+='<table><thead><tr><th>Name</th><th>Title</th><th>Team</th><th>Entity</th><th class="num">Rate</th><th class="num">Cap</th></tr></thead><tbody>';
  EMPLOYEES.forEach(function(e){h+='<tr><td>'+esc(e.name)+'</td><td class="muted">'+esc(e.title)+'</td><td>'+esc(e.team)+'</td><td>'+e.entity+'</td><td class="num">'+fmtMoney(e.rate)+'</td><td class="num">'+fmtH(e.cap)+'</td></tr>';});
  h+='</tbody></table></div>';
  $('#main').innerHTML=h;
  $$('[data-arch]').forEach(function(b){b.addEventListener('click',function(){var p=projById(b.dataset.arch);p.status=p.status==='archived'?'active':'archived';toast(p.name+' '+(p.status==='archived'?'archived \u2014 entry locked':'restored'),'info');renderAdmin();});});
  $('#addPrjBtn').addEventListener('click',openAddProjectAdmin);
  $('#addUserBtn').addEventListener('click',openAddUser);
}
function openAddProjectAdmin(){
  var ov=document.createElement('div');ov.className='ov';
  var pnlOpts=PNL.filter(function(p){return p.id!=='leave';}).map(function(p){return '<option value="'+p.id+'">'+p.cat+' \u203a '+esc(p.name)+'</option>';}).join('');
  var entOpts=ENTITIES.map(function(e){return '<option value="'+e+'">'+ENTITY_NAME[e]+'</option>';}).join('');
  ov.innerHTML='<div class="modalc"><h2 style="font-size:16px;margin-bottom:14px">New project</h2><div class="field"><label class="lbl">Project name</label><input class="input" id="npName"></div><div class="field"><label class="lbl">P&amp;L center</label><select class="input" id="npPnl">'+pnlOpts+'</select></div><div class="field"><label class="lbl">Entity</label><select class="input" id="npEnt">'+entOpts+'</select></div><div class="field"><label class="lbl">Budget hours</label><input class="input" id="npBud" type="number" min="0" value="0"></div><div class="row" style="justify-content:flex-end"><button class="btn-secondary" id="npCancel">Cancel</button><button class="btn-primary" id="npSave">Create</button></div></div>';
  $('#ovroot').appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
  $('#npCancel').addEventListener('click',function(){ov.remove();});
  $('#npSave').addEventListener('click',function(){var n=$('#npName').value.trim();if(!n){toast('Project name is required','error');return;}PROJECTS.push({id:'pr'+(PROJECTS.length+100),name:n,pnlId:$('#npPnl').value,entity:$('#npEnt').value,budget:parseFloat($('#npBud').value)||0,status:'active'});toast('Created project '+n,'success');ov.remove();renderAdmin();});
  $('#npName').focus();
}
function openAddUser(){
  var ov=document.createElement('div');ov.className='ov';
  var entOpts=ENTITIES.map(function(e){return '<option value="'+e+'">'+ENTITY_NAME[e]+'</option>';}).join('');
  var teamOpts=TEAMS.map(function(t){return '<option value="'+t+'">'+t+'</option>';}).join('');
  ov.innerHTML='<div class="modalc"><h2 style="font-size:16px;margin-bottom:14px">Onboard employee</h2><div class="field"><label class="lbl">Full name</label><input class="input" id="nuName"></div><div class="field"><label class="lbl">Title</label><input class="input" id="nuTitle"></div><div class="field"><label class="lbl">Team</label><select class="input" id="nuTeam">'+teamOpts+'</select></div><div class="field"><label class="lbl">Entity</label><select class="input" id="nuEnt">'+entOpts+'</select></div><div class="field"><label class="lbl">Loaded rate ($/h)</label><input class="input" id="nuRate" type="number" min="0" value="50"></div><div class="row" style="justify-content:flex-end"><button class="btn-secondary" id="nuCancel">Cancel</button><button class="btn-primary" id="nuSave">Onboard</button></div></div>';
  $('#ovroot').appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
  $('#nuCancel').addEventListener('click',function(){ov.remove();});
  $('#nuSave').addEventListener('click',function(){var n=$('#nuName').value.trim();if(!n){toast('Name is required','error');return;}EMPLOYEES.push({id:'e'+(EMPLOYEES.length+100),name:n,entity:$('#nuEnt').value,team:$('#nuTeam').value,title:$('#nuTitle').value.trim()||'Staff',rate:parseFloat($('#nuRate').value)||50,cap:40,manager:'e12'});toast('Onboarded '+n,'success');ov.remove();renderAdmin();});
  $('#nuName').focus();
}

/* =========================================================
   EXPORT VIEW
========================================================= */
function renderExport(){
  var h='<div style="margin-bottom:14px"><div style="font-size:20px;font-weight:600">Export &amp; ERP Integration</div><div class="cap">Generate finance-ready extracts with filter context preserved</div></div>';
  h+='<div class="card sec"><div class="cap" style="margin-bottom:12px">Export configuration</div>';
  h+='<div class="field"><label class="lbl">Period</label><select class="input" id="exPeriod"><option value="week">This Week</option><option value="month" selected>This Month</option><option value="quarter">This Quarter</option></select></div>';
  h+='<div class="field"><label class="lbl">Format</label><select class="input" id="exFmt"><option value="detail">Detailed time entries</option><option value="gl">GL summary by P&amp;L center</option><option value="proj">Project cost roll-up</option></select></div>';
  h+='<div class="muted" style="font-size:12px;margin-bottom:12px">Active entities: '+activeEntities().join(', ')+'. Metadata footer (report date, user, filters) is appended automatically.</div>';
  h+='<div id="exProg" class="muted" style="font-size:13px;margin-bottom:10px;display:none"></div>';
  h+='<button class="btn-primary" id="exGo">Generate &amp; download</button></div>';
  h+='<div class="card"><div class="cap" style="margin-bottom:10px">Saved report configurations</div><table><thead><tr><th>Name</th><th>Scope</th><th>Schedule</th></tr></thead><tbody><tr><td>Monthly P&amp;L by Company</td><td class="muted">All entities \u00b7 month</td><td><span class="badge badge-info">1st of month</span></td></tr><tr><td>Q-Development Costs</td><td class="muted">DNH+DNC \u00b7 quarter</td><td><span class="badge badge-neutral">manual</span></td></tr><tr><td>Weekly Utilization</td><td class="muted">All entities \u00b7 week</td><td><span class="badge badge-info">Mondays</span></td></tr></tbody></table></div>';
  $('#main').innerHTML=h;
  $('#exGo').addEventListener('click',function(){
    var prog=$('#exProg');prog.style.display='block';prog.textContent='Collecting entries\u2026';
    var pr=periodRange($('#exPeriod').value,0);var fmt=$('#exFmt').value;
    setTimeout(function(){prog.textContent='Formatting rows\u2026';setTimeout(function(){
      if(fmt==='detail'){exportReportCSV(pr[0],pr[1]);}
      else if(fmt==='gl'){exportGL(pr[0],pr[1]);}
      else{exportProjRoll(pr[0],pr[1]);}
      prog.textContent='Done.';setTimeout(function(){prog.style.display='none';},1500);
    },350);},300);
  });
}
function exportGL(start,end){var ru=rollup(start,end);var lines=[['Category','P&L Center','Hours','Cost'].join(',')];Object.keys(ru.byPnl).forEach(function(k){var g=ru.byPnl[k];lines.push([csv(g.pnl.cat),csv(g.pnl.name),g.hours.toFixed(1),g.cost.toFixed(2)].join(','));});lines.push('');lines.push('# GL summary,'+new Date().toISOString()+',Entities,'+activeEntities().join(' '));downloadCSV(lines.join('\
'),'dn-gl-summary.csv');toast('GL summary exported','success');}
function exportProjRoll(start,end){var ents=entriesIn(start,end);var byP={};ents.forEach(function(e){var p=projById(e.projectId);if(!byP[p.id])byP[p.id]={p:p,h:0,c:0};byP[p.id].h+=e.hours;byP[p.id].c+=e.hours*empById(e.empId).rate;});var lines=[['Project','P&L Center','Entity','Hours','Cost','Budget h','Variance h'].join(',')];Object.keys(byP).forEach(function(k){var g=byP[k];lines.push([csv(g.p.name),csv(pnlById(g.p.pnlId).name),g.p.entity,g.h.toFixed(1),g.c.toFixed(2),g.p.budget,(g.h-g.p.budget).toFixed(1)].join(','));});lines.push('');lines.push('# Project roll-up,'+new Date().toISOString());downloadCSV(lines.join('\
'),'dn-project-rollup.csv');toast('Project roll-up exported','success');}

/* =========================================================
   SLIDEOVER / CMDK
========================================================= */
function openSlide(html){var ov=document.createElement('div');ov.className='ov';ov.id='slideOv';ov.innerHTML=html;$('#ovroot').appendChild(ov);ov.addEventListener('click',function(e){if(e.target===ov)closeSlide();});var c=$('#closeSlide');if(c)c.addEventListener('click',closeSlide);}
function closeSlide(){var o=$('#slideOv');if(o)o.remove();}
function openCmdK(){
  var ov=document.createElement('div');ov.className='ov';ov.id='cmdkOv';
  ov.innerHTML='<div class="cmdk"><div style="padding:10px 14px;border-bottom:1px solid var(--border)"><input class="input" id="cmdInput" placeholder="Search projects, employees, P&amp;L centers\u2026" style="width:100%;border:none;background:transparent" autocomplete="off"></div><div class="cmdres" id="cmdRes"></div></div>';
  $('#ovroot').appendChild(ov);
  function paint(q){
    q=(q||'').toLowerCase();var out=[];
    if(!q){state.recents.map(projById).filter(Boolean).forEach(function(p){out.push({t:'Recent',n:p.name,s:breadcrumb(p),act:function(){addProjectToWeek(p.id);}});});}
    PROJECTS.forEach(function(p){if(p.status!=='active')return;if(q&&(p.name+' '+breadcrumb(p)).toLowerCase().indexOf(q)<0)return;out.push({t:'Project',n:p.name,s:breadcrumb(p),act:function(){state.view='reports';renderNav();renderReports();}});});
    EMPLOYEES.forEach(function(e){if(q&&(e.name+' '+e.title).toLowerCase().indexOf(q)<0)return;out.push({t:'Person',n:e.name,s:e.title+' \u00b7 '+e.entity,act:function(){state.view='resources';renderNav();renderResources();}});});
    PNL.forEach(function(p){if(q&&(p.name+' '+p.cat).toLowerCase().indexOf(q)<0)return;out.push({t:'P&L',n:p.name,s:p.cat+' \u00b7 P&L center',act:function(){state.view='reports';renderNav();renderReports();}});});
    out=out.slice(0,30);
    $('#cmdRes').innerHTML=out.length?out.map(function(o,i){return '<div class="cmdrow" data-i="'+i+'"><span class="badge badge-neutral">'+o.t+'</span><div><div style="font-weight:500">'+esc(o.n)+'</div><div class="subtle" style="font-size:11px">'+esc(o.s)+'</div></div></div>';}).join(''):'<div class="muted" style="padding:16px">No results</div>';
    $$('#cmdRes [data-i]').forEach(function(row){row.addEventListener('click',function(){var o=out[+row.dataset.i];closeCmdK();o.act();});});
  }
  paint('');
  $('#cmdInput').addEventListener('input',function(){paint(this.value);});
  $('#cmdInput').focus();
  ov.addEventListener('click',function(e){if(e.target===ov)closeCmdK();});
}
function closeCmdK(){var o=$('#cmdkOv');if(o)o.remove();}

/* =========================================================
   ROOT RENDER
========================================================= */
function render(){
  if(state.view==='entry')renderEntry();
  else if(state.view==='reports')renderReports();
  else if(state.view==='resources')renderResources();
  else if(state.view==='approvals')renderApprovals();
  else if(state.view==='admin')renderAdmin();
  else if(state.view==='export')renderExport();
}
function fullRender(){renderEntities();renderNav();render();}

/* header bindings */
$('#themeBtn').addEventListener('click',function(){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;});
$('#roleSel').addEventListener('change',function(){state.role=this.value;if(this.value==='employee'||this.value==='manager'){state.currentEmp= this.value==='manager'?'e9':'e1';state.entities=[empById(state.currentEmp).entity];}else{state.entities=ENTITIES.slice();}fullRender();});
$('#searchBtn').addEventListener('click',openCmdK);
document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdK();}if(e.key==='Escape'){closeCmdK();closeSlide();}});

fullRender();
})();
</script>
