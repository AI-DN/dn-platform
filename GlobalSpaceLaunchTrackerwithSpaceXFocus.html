<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apogee — Launch Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #f5f5f5;
  --text: #18181b;
  --text-muted: #52525b;
  --text-subtle: #a1a1aa;
  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.16);
  --accent: #5e6ad2;
  --accent-hover: #4f59c4;
  --accent-bg: rgba(94, 106, 210, 0.08);
  --success: #16a34a;
  --success-bg: rgba(22, 163, 74, 0.08);
  --warning: #d97706;
  --warning-bg: rgba(217, 119, 6, 0.08);
  --danger: #dc2626;
  --danger-bg: rgba(220, 38, 38, 0.08);
  --info: #0284c7;
  --info-bg: rgba(2, 132, 199, 0.08);
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
}
[data-theme="dark"] {
  --bg: #09090b;
  --surface: #131316;
  --surface-2: #1c1c20;
  --text: #fafafa;
  --text-muted: #a1a1aa;
  --text-subtle: #71717a;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);
  --accent: #7b85e3;
  --accent-hover: #8d96e8;
  --accent-bg: rgba(123, 133, 227, 0.10);
  --success: #22c55e;
  --success-bg: rgba(34, 197, 94, 0.10);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.10);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.10);
  --info: #38bdf8;
  --info-bg: rgba(56, 189, 248, 0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  height: 100%;
}
body { font-variant-numeric: tabular-nums; }
button { font-family: inherit; }

/* Layout — mobile-first app shell */
.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  position: relative;
}
@media (max-width: 520px) {
  .app { border-left: none; border-right: none; }
}

.header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-mark {
  width: 24px; height: 24px;
  background: var(--accent);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: white;
  font-weight: 700;
  font-size: 13px;
}
.brand-name {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.005em;
}
.header-actions {
  display: flex;
  gap: 4px;
}
.icon-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  cursor: pointer;
  transition: background 150ms ease, color 150ms ease;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.active { background: var(--accent-bg); color: var(--accent); }
.icon-btn svg { width: 16px; height: 16px; }

/* Tabs */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 49px;
  z-index: 19;
}
.tab {
  flex: 1;
  padding: 10px 8px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: color 150ms ease, border-color 150ms ease;
}
.tab.active {
  color: var(--text);
  border-bottom-color: var(--accent);
}
.tab:hover:not(.active) { color: var(--text); }

/* Time selector pills */
.pill-group {
  display: flex;
  gap: 4px;
  padding: 12px 16px 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.pill-group::-webkit-scrollbar { display: none; }
.pill {
  padding: 6px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 150ms ease;
}
.pill.active {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.pill:hover:not(.active) { background: var(--surface-2); color: var(--text); }

/* Filter chips */
.chip-row {
  display: flex;
  gap: 6px;
  padding: 4px 16px 12px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}
.chip-row::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 150ms ease;
}
.chip:hover { background: var(--surface-2); color: var(--text); }
.chip.has-active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-bg);
}
.chip-count {
  background: var(--accent);
  color: white;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 8px;
  min-width: 14px;
  text-align: center;
}
.chip svg { width: 12px; height: 12px; }

/* Refresh status */
.refresh-bar {
  padding: 8px 16px;
  font-size: 11px;
  color: var(--text-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.refresh-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
}
.refresh-btn:hover { background: var(--surface-2); color: var(--text); }
.refresh-btn svg { width: 11px; height: 11px; }
.refresh-btn.spinning svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Timeline */
.timeline {
  padding: 12px 16px 80px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}
.section-header {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 16px 0 4px;
  position: sticky;
  top: 91px;
  background: var(--bg);
  z-index: 5;
}
.section-header:first-child { padding-top: 0; }

/* Launch card */
.launch-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
  cursor: pointer;
  position: relative;
  transition: border-color 150ms ease, background 150ms ease;
  overflow: hidden;
}
.launch-card:hover { border-color: var(--border-strong); }
.launch-card.spacex {
  border-left: 3px solid var(--accent);
}
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}
.card-left { flex: 1; min-width: 0; }
.agency-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.agency-logo {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px;
  font-weight: 700;
  color: var(--text-muted);
  flex-shrink: 0;
}
.agency-name {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
}
.mission-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.005em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rocket-name {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 2px;
}
.launch-site {
  font-size: 12px;
  color: var(--text-subtle);
  margin-top: 2px;
}
.card-right {
  text-align: right;
  flex-shrink: 0;
}
.countdown {
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.02em;
}
.countdown.imminent {
  color: var(--accent);
}
.countdown.live {
  color: var(--danger);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.live-dot {
  width: 6px; height: 6px;
  background: var(--danger);
  border-radius: 50%;
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
.launch-date {
  font-size: 11px;
  color: var(--text-subtle);
  margin-top: 2px;
  font-family: 'SF Mono', 'Menlo', monospace;
}
.card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.card-meta {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--text-muted);
}
.card-meta span { display: inline-flex; align-items: center; gap: 4px; }
.card-meta svg { width: 11px; height: 11px; }
.card-actions {
  display: flex;
  gap: 4px;
}
.card-action-btn {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  color: var(--text-subtle);
  cursor: pointer;
  transition: all 150ms ease;
}
.card-action-btn:hover { background: var(--surface-2); color: var(--text); }
.card-action-btn.active { color: var(--accent); }
.card-action-btn svg { width: 13px; height: 13px; }

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.02em;
}
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--warning-bg); color: var(--warning); }
.badge-danger  { background: var(--danger-bg);  color: var(--danger); }
.badge-info    { background: var(--info-bg);    color: var(--info); }
.badge-neutral { background: var(--surface-2); color: var(--text-muted); }
.badge-accent  { background: var(--accent-bg); color: var(--accent); }

/* Empty state */
.empty {
  padding: 64px 24px;
  text-align: center;
  color: var(--text-muted);
}
.empty svg {
  width: 48px; height: 48px;
  opacity: 0.14;
  margin-bottom: 16px;
}
.empty-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}
.empty-text {
  font-size: 13px;
  color: var(--text-muted);
  max-width: 280px;
  margin: 0 auto;
}

/* Search */
.search-wrap {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.search-input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  color: var(--text);
  padding: 8px 12px 8px 32px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: inherit;
  transition: border-color 150ms ease, background 150ms ease;
}
.search-input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface);
}
.search-input::placeholder { color: var(--text-subtle); }
.search-rel { position: relative; }
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px; height: 14px;
  color: var(--text-subtle);
  pointer-events: none;
}

/* Modal / Sheet */
.sheet-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms ease;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 101;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 250ms ease;
  max-width: 480px;
  margin: 0 auto;
  pointer-events: none;
  visibility: hidden;
}
.sheet.open { transform: translateY(0); pointer-events: auto; visibility: visible; }
.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 5;
}
.sheet-title {
  font-size: 14px;
  font-weight: 600;
}
.sheet-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

/* Detail sheet specifics */
.detail-hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 16px;
}
.detail-status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.detail-mission {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.005em;
  margin-bottom: 4px;
}
.detail-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.detail-countdown {
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
  margin-bottom: 4px;
}
.detail-countdown.imminent { color: var(--accent); }
.detail-countdown.live { color: var(--danger); }
.detail-time {
  font-size: 12px;
  color: var(--text-subtle);
  font-family: 'SF Mono', 'Menlo', monospace;
}

.detail-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.detail-tabs::-webkit-scrollbar { display: none; }
.detail-tab {
  padding: 8px 12px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 150ms ease;
}
.detail-tab.active {
  color: var(--text);
  border-bottom-color: var(--accent);
}

.section-block {
  margin-bottom: 20px;
}
.section-block h3 {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.section-block p {
  font-size: 13px;
  color: var(--text);
  line-height: 1.6;
}
.dl {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.dl-row {
  display: contents;
}
.dl dt {
  font-size: 12px;
  color: var(--text-muted);
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.dl dd {
  font-size: 12px;
  color: var(--text);
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-family: 'SF Mono', 'Menlo', monospace;
  text-align: right;
  background: var(--surface);
}
.dl-row:last-child dt, .dl-row:last-child dd { border-bottom: none; }

.progress-bar {
  height: 6px;
  background: var(--surface-2);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 6px;
}
.progress-fill {
  height: 100%;
  background: var(--success);
  transition: width 300ms ease;
}
.progress-fill.warn { background: var(--warning); }
.progress-fill.danger { background: var(--danger); }

/* Filter sheet */
.filter-group {
  margin-bottom: 20px;
}
.filter-group-title {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.filter-options {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.filter-option {
  padding: 6px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 150ms ease;
}
.filter-option.selected {
  background: var(--accent-bg);
  border-color: var(--accent);
  color: var(--accent);
}

/* Buttons */
.btn-primary {
  background: var(--accent);
  color: white;
  border: 1px solid var(--accent);
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 150ms ease;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border-strong);
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 150ms ease, border-color 150ms ease;
}
.btn-secondary:hover { background: var(--surface-2); border-color: var(--text-subtle); }
.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid transparent;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  cursor: pointer;
}
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }

/* Notification preferences */
.pref-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.pref-row:first-child { border-radius: var(--radius-md) var(--radius-md) 0 0; }
.pref-row:last-child { border-bottom: none; border-radius: 0 0 var(--radius-md) var(--radius-md); }
.pref-group {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  margin-bottom: 12px;
  overflow: hidden;
}
.pref-nested {
  padding-left: 28px;
  background: var(--bg);
}
.pref-label-wrap { flex: 1; }
.pref-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}
.pref-desc {
  font-size: 11px;
  color: var(--text-subtle);
  margin-top: 2px;
}
.toggle {
  position: relative;
  width: 32px;
  height: 18px;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  cursor: pointer;
  transition: background 150ms ease, border-color 150ms ease;
  flex-shrink: 0;
}
.toggle::after {
  content: '';
  position: absolute;
  top: 1px;
  left: 1px;
  width: 14px;
  height: 14px;
  background: var(--text-subtle);
  border-radius: 50%;
  transition: transform 150ms ease, background 150ms ease;
}
.toggle.on {
  background: var(--accent);
  border-color: var(--accent);
}
.toggle.on::after {
  transform: translateX(14px);
  background: white;
}
.expand-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  margin-right: 4px;
  display: flex;
  align-items: center;
}
.expand-btn svg { width: 14px; height: 14px; transition: transform 150ms ease; }
.expand-btn.open svg { transform: rotate(90deg); }

/* Toast */
.toast-container {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
  width: 92%;
  max-width: 420px;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: auto;
  animation: slideDown 200ms ease;
}
.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--info); }
.toast svg { width: 14px; height: 14px; flex-shrink: 0; }
.toast.success svg { color: var(--success); }
.toast.error svg { color: var(--danger); }
.toast.info svg { color: var(--info); }
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Stats */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
}
.stat-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.stat-value {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}
.stat-delta {
  font-size: 11px;
  margin-top: 2px;
  font-family: 'SF Mono', 'Menlo', monospace;
}
.stat-delta.up { color: var(--success); }
.stat-delta.down { color: var(--danger); }

.stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.stat-row:last-child { border-bottom: none; }
.stat-row-label {
  display: flex;
  align-items: center;
  gap: 8px;
}
.stat-row-value {
  font-family: 'SF Mono', 'Menlo', monospace;
  color: var(--text-muted);
}

/* History table */
.history-table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.history-row {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  align-items: center;
  transition: background 150ms ease;
}
.history-row:hover { background: var(--surface-2); }
.history-row:last-child { border-bottom: none; }
.history-date {
  font-size: 11px;
  color: var(--text-subtle);
  font-family: 'SF Mono', 'Menlo', monospace;
  width: 56px;
}
.history-mission {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.history-sub {
  font-size: 11px;
  color: var(--text-muted);
}

/* Map */
.map-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 16px;
  position: relative;
}
.map-svg {
  width: 100%;
  height: 220px;
  display: block;
}
.map-pad {
  cursor: pointer;
}
.map-pad-dot {
  fill: var(--accent);
  stroke: var(--bg);
  stroke-width: 1.5;
}
.map-pad-pulse {
  fill: var(--accent);
  opacity: 0.3;
  animation: padPulse 2s ease-in-out infinite;
}
@keyframes padPulse {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 0; transform: scale(2.5); }
}
.map-bg {
  fill: var(--surface-2);
  stroke: var(--border);
  stroke-width: 0.5;
}

.site-list .stat-row { cursor: default; }

/* Updates */
.update-item {
  padding: 10px 12px;
  border-left: 2px solid var(--border);
  margin-left: 4px;
  position: relative;
  font-size: 12px;
}
.update-item::before {
  content: '';
  position: absolute;
  left: -5px;
  top: 14px;
  width: 8px;
  height: 8px;
  background: var(--surface);
  border: 2px solid var(--border-strong);
  border-radius: 50%;
}
.update-item.latest::before {
  background: var(--accent);
  border-color: var(--accent);
}
.update-time {
  font-size: 10px;
  color: var(--text-subtle);
  font-family: 'SF Mono', 'Menlo', monospace;
  margin-bottom: 2px;
}
.update-text { color: var(--text); }

/* Compare */
.compare-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.compare-col {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
  font-size: 12px;
}
.compare-col h4 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 4px;
}
.compare-col p {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.compare-spec {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
}
.compare-spec:last-child { border: none; }
.compare-spec span:last-child {
  font-family: 'SF Mono', 'Menlo', monospace;
}

.weather-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
}
.weather-icon {
  font-size: 24px;
  color: var(--text-muted);
}
.weather-prob {
  font-size: 18px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.media-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.media-thumb {
  aspect-ratio: 16/10;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-subtle);
  font-size: 11px;
  position: relative;
  overflow: hidden;
}
.media-thumb svg { width: 24px; height: 24px; opacity: 0.4; }

.stream-link {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 13px;
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
  transition: background 150ms ease;
}
.stream-link:hover { background: var(--surface-2); }
.stream-link svg { width: 16px; height: 16px; color: var(--danger); }

/* Skeleton */
.skel {
  background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface) 50%, var(--surface-2) 100%);
  background-size: 200% 100%;
  animation: skeletonShimmer 1.5s ease-in-out infinite;
  border-radius: var(--radius-sm);
}
@keyframes skeletonShimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skel-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
}
.skel-line { height: 12px; margin-bottom: 8px; }

  display: flex;

  color: var(--text-muted);
}
.spacex-extra strong {
  color: var(--text);
  font-weight: 600;
  font-family: 'SF Mono', 'Menlo', monospace;
}

// ============= UTIL =============
function fmtCountdown(date) {
  const ms = date.getTime() - Date.now();
  if (ms < 0 && ms > -3600000) {
    return { text: 'IN PROGRESS', class: 'live', live: true };
  }
  if (ms < 0) {
    return { text: 'COMPLETE', class: '', live: false };
  }
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (ms > 86400000) {
    return { text: 'T-' + d + 'd ' + String(h).padStart(2, '0') + 'h', class: '' };
  }
  if (ms > 3600000) {
    return { text: 'T-' + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0'), class: 'imminent' };
  }
  return { text: 'T-' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0'), class: 'imminent' };
}

function fmtAbsTime(date) {
  return date.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });
}

function fmtDate(date) {
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtRel(date) {
  const ms = Date.now() - date.getTime();
  const days = Math.floor(ms / 86400000);
  if (days < 1) return 'today';
  if (days < 2) return 'yesterday';
  if (days < 30) return days + ' days ago';
  if (days < 365) return Math.floor(days / 30) + ' months ago';
  return Math.floor(days / 365) + ' years ago';
}

function statusBadge(status) {
  const map = {
    scheduled: { label: 'Scheduled', cls: 'badge-neutral' },
    delayed: { label: 'Delayed', cls: 'badge-warning' },
    scrubbed: { label: 'Scrubbed', cls: 'badge-warning' },
    success: { label: 'Success', cls: 'badge-success' },
    failure: { label: 'Failure', cls: 'badge-danger' },
    live: { label: 'Live', cls: 'badge-danger' },
  };
  const s = map[status] || map.scheduled;
  return '<span class="badge ' + s.cls + '">' + s.label + '</span>';
}

function filterLaunches() {
  let list = LAUNCHES.slice();
  const now = Date.now();
  if (state.horizon === 'upcoming') {
    list = list.filter(l => l.date.getTime() > now - 3600000);
  } else if (state.horizon === '30d') {
    list = list.filter(l => l.date.getTime() > now - 3600000 && l.date.getTime() < now + 30 * 86400000);
  } else if (state.horizon === '90d') {
    list = list.filter(l => l.date.getTime() > now - 3600000 && l.date.getTime() < now + 90 * 86400000);
  } else if (state.horizon === 'past') {
    list = list.filter(l => l.date.getTime() < now - 3600000);
  } else if (state.horizon === 'favs') {
    list = list.filter(l => state.favorites.has(l.id));
  }
  if (state.filters.agency.size) list = list.filter(l => state.filters.agency.has(l.agency));
  if (state.filters.rocket.size) list = list.filter(l => state.filters.rocket.has(l.rocket));
  if (state.filters.type.size) list = list.filter(l => state.filters.type.has(l.missionType));
  if (state.filters.site.size) list = list.filter(l => state.filters.site.has(l.site));
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(l =>
      l.mission.toLowerCase().includes(q) ||
      (l.payload || '').toLowerCase().includes(q) ||
      l.rocket.toLowerCase().includes(q) ||
      l.agency.toLowerCase().includes(q)
    );
  }
  if (state.horizon === 'past') {
    list.sort((a, b) => b.date - a.date);
  } else {
    list.sort((a, b) => a.date - b.date);
  }
  return list;
}

function countActiveFilters() {
  return state.filters.agency.size + state.filters.rocket.size + state.filters.type.size + state.filters.site.size;
}

// ============= RENDER =============
function render() {
  const c = document.getElementById('viewContent');
  if (state.view === 'timeline') renderTimeline(c);
  else if (state.view === 'history') renderHistory(c);
  else if (state.view === 'sites') renderSites(c);
  else if (state.view === 'stats') renderStats(c);
}

function renderTimeline(c) {
  const launches = filterLaunches();
  const activeFilters = countActiveFilters();

  let html = '';

  html += '<div class="pill-group">';
  const pills = [
    { k: 'upcoming', label: 'Upcoming' },
    { k: '30d', label: 'Next 30d' },
    { k: '90d', label: 'Next 90d' },
    { k: 'past', label: 'Past' },
    { k: 'favs', label: 'Favorites' },
  ];
  pills.forEach(p => {
    html += '<button class="pill ' + (state.horizon === p.k ? 'active' : '') + '" data-horizon="' + p.k + '">' + p.label + '</button>';
  });
  html += '</div>';

  html += '<div class="chip-row">';
  html += '<button class="chip ' + (state.filters.agency.size ? 'has-active' : '') + '" data-chip="agency">';
  html += 'Agency' + (state.filters.agency.size ? ' <span class="chip-count">' + state.filters.agency.size + '</span>' : '');
  html += '</button>';
  html += '<button class="chip ' + (state.filters.rocket.size ? 'has-active' : '') + '" data-chip="rocket">';
  html += 'Rocket' + (state.filters.rocket.size ? ' <span class="chip-count">' + state.filters.rocket.size + '</span>' : '');
  html += '</button>';
  html += '<button class="chip ' + (state.filters.type.size ? 'has-active' : '') + '" data-chip="type">';
  html += 'Mission' + (state.filters.type.size ? ' <span class="chip-count">' + state.filters.type.size + '</span>' : '');
  html += '</button>';
  html += '<button class="chip ' + (state.filters.site.size ? 'has-active' : '') + '" data-chip="site">';
  html += 'Site' + (state.filters.site.size ? ' <span class="chip-count">' + state.filters.site.size + '</span>' : '');
  html += '</button>';
  if (activeFilters > 0) {
    html += '<button class="chip" data-chip="clear" style="color:var(--danger)">Clear all</button>';
  }
  html += '</div>';

  html += '<div class="refresh-bar">';
  html += '<span>Updated ' + fmtRel(state.lastRefresh) + ' · ' + state.lastRefresh.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) + '</span>';
  html += '<button class="refresh-btn" id="refreshBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg> Refresh</button>';
  html += '</div>';

  html += '<div class="timeline">';

  if (launches.length === 0) {
    html += emptyState(state.horizon === 'favs' ? 'No favorited launches' : 'No launches match your filters', state.horizon === 'favs' ? 'Tap the star on any launch card to track it here.' : 'Adjust your filters or time range to see more launches.');
  } else {
    let lastSection = '';
    launches.forEach(l => {
      const section = sectionLabel(l.date, state.horizon);
      if (section !== lastSection) {
        html += '<div class="section-header">' + section + '</div>';
        lastSection = section;
      }
      html += renderLaunchCard(l);
    });
  }

  html += '</div>';
  c.innerHTML = html;

  // Wire events
  c.querySelectorAll('[data-horizon]').forEach(el => {
    el.addEventListener('click', () => {
      state.horizon = el.dataset.horizon;
      render();
    });
  });
  c.querySelectorAll('[data-chip]').forEach(el => {
    el.addEventListener('click', () => {
      if (el.dataset.chip === 'clear') {
        state.filters.agency.clear();
        state.filters.rocket.clear();
        state.filters.type.clear();
        state.filters.site.clear();
        toast('Filters cleared', 'info');
        render();
      } else {
        openFilterSheet(el.dataset.chip);
      }
    });
  });
  const refreshBtn = c.querySelector('#refreshBtn');
  if (refreshBtn) {
    refreshBtn.addEventListener('click', doRefresh);
  }
  c.querySelectorAll('.launch-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.card-action-btn')) return;
      openDetail(card.dataset.id);
    });
  });
  c.querySelectorAll('.fav-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      if (state.favorites.has(id)) {
        state.favorites.delete(id);
        toast('Removed from favorites', 'info');
      } else {
        state.favorites.add(id);
        toast('Added to favorites', 'success');
      }
      render();
    });
  });
  c.querySelectorAll('.notif-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openNotifSheet(btn.dataset.id);
    });
  });
}

function sectionLabel(date, horizon) {
  if (horizon === 'past') {
    return date.toLocaleString('en-US', { month: 'long', year: 'numeric' });
  }
  const ms = date.getTime() - Date.now();
  if (ms < 86400000) return 'Today';
  if (ms < 172800000) return 'Tomorrow';
  if (ms < 7 * 86400000) return 'This week';
  if (ms < 30 * 86400000) return 'This month';
  if (ms < 90 * 86400000) return date.toLocaleString('en-US', { month: 'long', year: 'numeric' });
  return 'Later';
}

function renderLaunchCard(l) {
  const cd = fmtCountdown(l.date);
  const isSpaceX = l.agency === 'SpaceX';
  const fav = state.favorites.has(l.id);
  let h = '<div class="launch-card ' + (isSpaceX ? 'spacex' : '') + '" data-id="' + l.id + '">';
  h += '<div class="card-top">';
  h += '<div class="card-left">';
  h += '<div class="agency-row">';
  h += '<div class="agency-logo">' + l.agencyCode + '</div>';
  h += '<span class="agency-name">' + l.agency + '</span>';
  h += '</div>';
  h += '<div class="mission-name">' + l.mission + '</div>';
  h += '<div class="rocket-name">' + l.rocket + ' <span style="color:var(--text-subtle)">· ' + l.variant + '</span></div>';
  h += '<div class="launch-site">' + l.site + '</div>';
  h += '</div>';
  h += '<div class="card-right">';
  if (cd.live) {
    h += '<div class="countdown live"><span class="live-dot"></span>LIVE</div>';
  } else {
    h += '<div class="countdown ' + cd.class + '">' + cd.text + '</div>';
  }
  h += '<div class="launch-date">' + fmtAbsTime(l.date) + '</div>';
  h += '</div>';
  h += '</div>';

  if (isSpaceX && l.booster) {
    h += '<div class="spacex-extra">';
    h += '<span>Booster <strong>' + l.booster + '</strong></span>';
    h += '<span>Flights <strong>' + (l.reuse + 1) + '</strong></span>';
    if (l.landing) h += '<span style="flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + l.landing + '</span>';
    h += '</div>';
  }

  h += '<div class="card-bottom">';
  h += '<div class="card-meta">';
  h += statusBadge(l.status);
  h += '<span>' + l.missionType + ' · ' + l.orbit + '</span>';
  h += '</div>';
  h += '<div class="card-actions">';
  h += '<button class="card-action-btn notif-btn" data-id="' + l.id + '" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>';
  h += '<button class="card-action-btn fav-btn ' + (fav ? 'active' : '') + '" data-id="' + l.id + '" aria-label="Favorite"><svg viewBox="0 0 24 24" fill="' + (fav ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></button>';
  h += '</div>';
  h += '</div>';
  h += '</div>';
  return h;
}

function emptyState(title, text) {
  return '<div class="empty">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09zM12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2zM9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>' +
    '<div class="empty-title">' + title + '</div>' +

function renderHistory(c) {
  const past = LAUNCHES.filter(l => l.date.getTime() < Date.now() - 3600000).sort((a, b) => b.date - a.date);
  let html = '';
  html += '<div style="padding: 16px 16px 8px">';
  html += '<div style="display:flex; gap:8px; margin-bottom:12px">';
  html += '<div class="search-rel" style="flex:1">';
  html += '<svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  html += '<input type="text" class="search-input" id="histSearch" placeholder="Search history..." value="' + (state.search || '') + '">';
  html += '</div>';
  html += '</div>';
  html += '</div>';

  html += '<div style="padding: 0 16px">';
  const filtered = state.search ? past.filter(l => {
    const q = state.search.toLowerCase();
    return l.mission.toLowerCase().includes(q) || l.rocket.toLowerCase().includes(q) || l.agency.toLowerCase().includes(q);
  }) : past;

  if (filtered.length === 0) {
    html += emptyState('No historical launches found', 'Try a different search term or check back later.');
  } else {
    let lastYear = '';
    let curHtml = '<div class="history-table-wrap">';
    filtered.forEach(l => {
      const year = String(l.date.getFullYear());
      if (year !== lastYear) {
        if (lastYear) curHtml += '</div>';
        if (lastYear) html += curHtml;
        html += '<div class="section-header" style="padding-top:16px">' + year + '</div>';
        curHtml = '<div class="history-table-wrap">';
        lastYear = year;
      }
      curHtml += '<div class="history-row" data-id="' + l.id + '">';
      curHtml += '<div class="history-date">' + l.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</div>';
      curHtml += '<div>';
      curHtml += '<div class="history-mission">' + l.mission + '</div>';
      curHtml += '<div class="history-sub">' + l.agency + ' · ' + l.rocket + '</div>';
      curHtml += '</div>';
      curHtml += '<div>' + statusBadge(l.status) + '</div>';
      curHtml += '</div>';
    });
    curHtml += '</div>';
    html += curHtml;
  }
  html += '<div style="height:48px"></div>';
  html += '</div>';
  c.innerHTML = html;

  const search = c.querySelector('#histSearch');
  if (search) {
    search.addEventListener('input', () => {
      state.search = search.value;
      renderHistory(c);
    });
  }
  c.querySelectorAll('.history-row').forEach(row => {
    row.addEventListener('click', () => openDetail(row.dataset.id));
  });
}

let _gisMap = null;
function initGisMap() {
  const el = document.getElementById('gisMap');
  if (!el || typeof L === 'undefined') {
    if (el) el.innerHTML = '<div style="padding:24px; text-align:center; color:var(--text-muted); font-size:13px">Map library unavailable</div>';
    return;
  }
  if (_gisMap) { try { _gisMap.remove(); } catch(e){} _gisMap = null; }
  const isDark = document.documentElement.dataset.theme === 'dark';
  _gisMap = L.map(el, { worldCopyJump: true, zoomControl: false, attributionControl: true }).setView([20, 0], 2);
  const tileUrl = isDark
    ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
    : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
  L.tileLayer(tileUrl, {
    attribution: '© OpenStreetMap, © CARTO',
    subdomains: 'abcd',
    maxZoom: 18
  }).addTo(_gisMap);
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#5e6ad2';
  SITES.forEach(s => {
    const radius = Math.max(5, Math.min(14, 4 + s.launches / 4));
    const marker = L.circleMarker([s.lat, s.lon], {
      radius: radius,
      fillColor: accent,
      color: isDark ? '#09090b' : '#ffffff',
      weight: 1.5,
      fillOpacity: 0.85
    }).addTo(_gisMap);
    const scrubRate = s.launches > 0 ? (s.scrubs / (s.launches + s.scrubs) * 100).toFixed(1) : '0.0';
    const popupHtml = '<div style="font-family:Inter,sans-serif;min-width:180px">' +
      '<div style="font-size:13px;font-weight:600;margin-bottom:2px">' + s.name + '</div>' +
      '<div style="font-size:11px;color:#71717a;margin-bottom:8px">' + s.country + '</div>' +
      '<div style="font-size:11px;display:flex;justify-content:space-between;padding:2px 0"><span>Launches YTD</span><strong style="font-family:SF Mono,Menlo,monospace">' + s.launches + '</strong></div>' +
      '<div style="font-size:11px;display:flex;justify-content:space-between;padding:2px 0"><span>Scrubs</span><strong style="font-family:SF Mono,Menlo,monospace">' + s.scrubs + '</strong></div>' +
      '<div style="font-size:11px;display:flex;justify-content:space-between;padding:2px 0"><span>Scrub rate</span><strong style="font-family:SF Mono,Menlo,monospace">' + scrubRate + '%</strong></div>' +
      '<div style="font-size:11px;display:flex;justify-content:space-between;padding:2px 0"><span>Coordinates</span><strong style="font-family:SF Mono,Menlo,monospace">' + s.lat.toFixed(2) + ', ' + s.lon.toFixed(2) + '</strong></div>' +
      '</div>';
    marker.bindPopup(popupHtml);
    marker.bindTooltip(s.name, { direction: 'top', offset: [0, -radius] });
  });
  const zin = document.getElementById('mapZoomIn');
  const zout = document.getElementById('mapZoomOut');
  const zreset = document.getElementById('mapReset');
  if (zin) zin.addEventListener('click', () => _gisMap.zoomIn());
  if (zout) zout.addEventListener('click', () => _gisMap.zoomOut());
  if (zreset) zreset.addEventListener('click', () => _gisMap.setView([20, 0], 2));
  setTimeout(() => { if (_gisMap) _gisMap.invalidateSize(); }, 100);
}

function renderStats(c) {
  const now = Date.now();
  const yearStart = new Date(NOW.getFullYear(), 0, 1).getTime();
  const ytd = LAUNCHES.filter(l => l.date.getTime() < now && l.date.getTime() >= yearStart);
  const next7 = LAUNCHES.filter(l => l.date.getTime() > now && l.date.getTime() < now + 7 * 86400000);
  const next30 = LAUNCHES.filter(l => l.date.getTime() > now && l.date.getTime() < now + 30 * 86400000);
  const next90 = LAUNCHES.filter(l => l.date.getTime() > now && l.date.getTime() < now + 90 * 86400000);

  const byAgency = {};
  ytd.forEach(l => { byAgency[l.agency] = (byAgency[l.agency] || 0) + 1; });

  const byType = {};
  LAUNCHES.forEach(l => { byType[l.missionType] = (byType[l.missionType] || 0) + 1; });
  const totalType = Object.values(byType).reduce((a, b) => a + b, 0);

  let html = '<div style="padding:16px">';

  html += '<div class="stats-grid">';
  html += '<div class="stat-card"><div class="stat-label">Next 7 Days</div><div class="stat-value">' + next7.length + '</div><div class="stat-delta">' + next30.length + ' in 30d</div></div>';
  html += '<div class="stat-card"><div class="stat-label">Next 90 Days</div><div class="stat-value">' + next90.length + '</div><div class="stat-delta" style="color:var(--text-muted)">across ' + new Set(next90.map(l => l.agency)).size + ' agencies</div></div>';
  html += '<div class="stat-card"><div class="stat-label">Launches YTD</div><div class="stat-value">' + ytd.length + '</div><div class="stat-delta up">+12% vs prior</div></div>';
  const successPct = ytd.length ? (ytd.filter(l => l.status === 'success').length / ytd.length * 100).toFixed(1) : 0;
  html += '<div class="stat-card"><div class="stat-label">Success Rate</div><div class="stat-value">' + successPct + '%</div><div class="stat-delta" style="color:var(--text-muted)">' + ytd.length + ' attempts</div></div>';
  html += '</div>';

  html += '<div class="section-block">';
  html += '<h3>Success Rate by Rocket Family</h3>';
  html += '<div class="history-table-wrap">';
  Object.keys(ROCKETS).slice(0, 6).forEach(r => {
    const data = ROCKETS[r];
    const cls = data.successRate >= 95 ? '' : data.successRate >= 80 ? 'warn' : 'danger';
    html += '<div class="stat-row" style="display:block; padding:12px">';
    html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px">';
    html += '<span style="font-size:13px; font-weight:500">' + r + '</span>';
    html += '<span style="font-family:SF Mono, Menlo, monospace; font-size:12px">' + data.successRate + '% <span style="color:var(--text-subtle)">· ' + data.attempts + '</span></span>';
    html += '</div>';
    html += '<div class="progress-bar"><div class="progress-fill ' + cls + '" style="width:' + data.successRate + '%"></div></div>';
    html += '</div>';
  });
  html += '</div>';
  html += '</div>';

  html += '<div class="section-block">';
  html += '<h3>Launches YTD by Agency</h3>';
  html += '<div class="history-table-wrap">';
  const totalYtd = ytd.length || 1;
  Object.entries(byAgency).sort((a, b) => b[1] - a[1]).forEach(([a, n]) => {
    const pct = (n / totalYtd * 100).toFixed(0);
    html += '<div class="stat-row">';
    html += '<div class="stat-row-label"><span>' + a + '</span></div>';
    html += '<div style="display:flex; align-items:center; gap:8px; flex:1; max-width:140px">';
    html += '<div class="progress-bar" style="flex:1"><div class="progress-fill" style="width:' + pct + '%; background:var(--accent)"></div></div>';
    html += '<span class="stat-row-value" style="min-width:24px; text-align:right">' + n + '</span>';
    html += '</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '</div>';

  html += '<div class="section-block">';
  html += '<h3>Mission Type Distribution</h3>';
  html += '<div class="history-table-wrap">';
  Object.entries(byType).sort((a, b) => b[1] - a[1]).forEach(([t, n]) => {
    const pct = (n / totalType * 100).toFixed(1);
    html += '<div class="stat-row">';
    html += '<div class="stat-row-label"><span>' + t + '</span></div>';
    html += '<div class="stat-row-value">' + pct + '%</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '</div>';

  html += '<div class="section-block">';
  html += '<h3>SpaceX Booster Reuse</h3>';
  html += '<div class="history-table-wrap">';
  BOOSTERS.slice().sort((a, b) => b.flights - a.flights).slice(0, 6).forEach(b => {
    html += '<div class="stat-row">';
    html += '<div class="stat-row-label">';
    html += '<span style="font-family:SF Mono, Menlo, monospace; font-weight:500">' + b.serial + '</span>';
    html += '<span class="badge ' + (b.status === 'Active' ? 'badge-success' : 'badge-neutral') + '">' + b.status + '</span>';
    html += '</div>';
    html += '<div class="stat-row-value">' + b.flights + ' flights · ' + b.lastTurn + 'd turn</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div style="margin-top:12px; text-align:center">';
  html += '<button class="btn-secondary" id="openCompare">Compare Rockets</button>';
  html += '</div>';
  html += '</div>';

  html += '<div style="height:48px"></div></div>';
  c.innerHTML = html;

  const cmpBtn = c.querySelector('#openCompare');
  if (cmpBtn) cmpBtn.addEventListener('click', openCompareSheet);
}

function openLightbox(url, caption) {
  const existing = document.getElementById('lightbox');
  if (existing) existing.remove();
  const lb = document.createElement('div');
  lb.id = 'lightbox';
  lb.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;cursor:pointer';
  lb.innerHTML = '<img src="' + url + '" alt="' + caption + '" style="max-width:100%;max-height:80vh;border-radius:6px;border:1px solid rgba(255,255,255,0.1)"><div style="color:#fafafa;font-size:13px;margin-top:12px;font-family:Inter,sans-serif">' + caption + '</div><div style="color:#a1a1aa;font-size:11px;margin-top:4px">Tap anywhere to close</div>';
  lb.addEventListener('click', () => lb.remove());

    html += '<div class="filter-options">';
    g.items.forEach(i => {
      const sel = g.set.has(i);
      html += '<button class="filter-option ' + (sel ? 'selected' : '') + '" data-group="' + g.key + '" data-value="' + i + '">' + i + '</button>';

function renderNotifSheet() {
  const c = document.getElementById('notifContent');
  const launch = notifContext ? LAUNCHES.find(l => l.id === notifContext) : null;

  if (launch) {

    const mp = state.notifPrefs.byMission[launch.id] || { t24: true, t1: true, live: true };
    html += '<div class="pref-group">';
    html += renderPrefRow('Alert 24 hours before', 'Get notified the day before launch', mp.t24, 'mission-' + launch.id + '-t24');
    html += renderPrefRow('Alert 1 hour before', 'Final go/no-go window approaches', mp.t1, 'mission-' + launch.id + '-t1');
    html += renderPrefRow('Live launch alert', 'Pushed at T-0', mp.live, 'mission-' + launch.id + '-live');
    html += renderPrefRow('Status changes', 'Delays, scrubs, weather holds', mp.status !== false, 'mission-' + launch.id + '-status');
    html += '</div>';
    html += '</div>';
  }

  html += '<div class="section-block">';
  html += '<h3>Global Defaults</h3>';
  const g = state.notifPrefs.global;
  html += '<div class="pref-group">';
  html += renderPrefRow('Notifications enabled', 'Master switch for all alerts', g.enabled, 'global-enabled');
  html += renderPrefRow('24-hour alerts', 'Default for all tracked missions', g.t24, 'global-t24');
  html += renderPrefRow('1-hour alerts', 'Default for all tracked missions', g.t1, 'global-t1');
  html += renderPrefRow('Live launch alerts', 'Default for all tracked missions', g.live, 'global-live');
  html += '</div>';
  html += '</div>';

  html += '<div class="section-block">';
  html += '<h3>By Agency</h3>';
  ['SpaceX', 'ULA', 'CNSA', 'ESA'].forEach(a => {
    const key = 'by' + a;
    const p = state.notifPrefs[key] || { enabled: false, expanded: false };
    html += '<div class="pref-group">';
    html += '<div class="pref-row">';
    html += '<button class="expand-btn ' + (p.expanded ? 'open' : '') + '" data-expand="' + key + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>';
    html += '<div class="pref-label-wrap"><div class="pref-label">' + a + '</div><div class="pref-desc">All ' + a + ' missions</div></div>';
    html += '<button class="toggle ' + (p.enabled ? 'on' : '') + '" data-toggle="' + key + '-enabled" aria-label="Toggle"></button>';
    html += '</div>';
    if (p.expanded) {
      const families = LAUNCHES.filter(l => l.agency === a).map(l => l.rocket);
      const uniqFamilies = [...new Set(families)];
      uniqFamilies.forEach(rf => {
        html += '<div class="pref-row pref-nested">';
        html += '<div class="pref-label-wrap"><div class="pref-label" style="font-size:12px">' + rf + '</div></div>';
        html += '<button class="toggle ' + (p.enabled ? 'on' : '') + '" data-toggle="rocket-' + rf + '" aria-label="Toggle"></button>';
        html += '</div>';
      });
    }
    html += '</div>';
  });
  html += '</div>';

  html += '<div style="height:48px"></div>';
  c.innerHTML = html;

  c.querySelectorAll('[data-toggle]').forEach(t => {
    t.addEventListener('click', () => {
      const id = t.dataset.toggle;
      handleToggle(id);
      renderNotifSheet();
    });
  });
  c.querySelectorAll('[data-expand]').forEach(e => {
    e.addEventListener('click', () => {
      const k = e.dataset.expand;
      state.notifPrefs[k] = state.notifPrefs[k] || { enabled: false, expanded: false };
      state.notifPrefs[k].expanded = !state.notifPrefs[k].expanded;
      renderNotifSheet();
    });
  });
}

function renderPrefRow(label, desc, on, id) {
  return '<div class="pref-row">' +
    '<div class="pref-label-wrap"><div class="pref-label">' + label + '</div><div class="pref-desc">' + desc + '</div></div>' +
    '<button class="toggle ' + (on ? 'on' : '') + '" data-toggle="' + id + '" aria-label="Toggle"></button>' +
    '</div>';
}

function handleToggle(id) {
  if (id.startsWith('global-')) {
    const k = id.replace('global-', '');
    state.notifPrefs.global[k] = !state.notifPrefs.global[k];
    toast('Updated global ' + k + ' alerts', 'success');
  } else if (id.startsWith('mission-')) {
    const parts = id.replace('mission-', '').split('-');
    const t = parts.pop();
    const mid = parts.join('-');
    if (!state.notifPrefs.byMission[mid]) state.notifPrefs.byMission[mid] = { t24: true, t1: true, live: true };
    state.notifPrefs.byMission[mid][t] = !state.notifPrefs.byMission[mid][t];
    toast('Mission alert updated', 'success');
  } else if (id.endsWith('-enabled')) {
    const k = id.replace('-enabled', '');
    state.notifPrefs[k] = state.notifPrefs[k] || { enabled: false, expanded: false };
    state.notifPrefs[k].enabled = !state.notifPrefs[k].enabled;
    toast(state.notifPrefs[k].enabled ? 'Agency alerts enabled' : 'Agency alerts disabled', state.notifPrefs[k].enabled ? 'success' : 'info');
  }
}

// ============= LAUNCH REPORT GENERATOR =============
function sanitizeFilename(s) {
  return String(s).replace(/[^a-zA-Z0-9-]+/g, '-').replace(/^-+|-+$/g, '').replace(/-+/g, '-');
}

function buildReportHTML(l) {
  const rk = ROCKETS[l.rocket] || {};
  const cd = fmtCountdown(l.date);
  const statusMap = { scheduled: 'Scheduled', delayed: 'Delayed', scrubbed: 'Scrubbed', success: 'Success', failure: 'Failure', live: 'Live' };
  const statusLabel = statusMap[l.status] || l.status;
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const ytQuery = encodeURIComponent(l.agency + ' ' + l.mission + ' launch');
  const ytUrl = 'https://www.youtube.com/results?search_query=' + ytQuery;
  const generated = new Date().toLocaleString('en-US', { dateStyle: 'long', timeStyle: 'short' });

    ];
    specs.forEach(([k, v]) => { specsRows += '<tr><td>' + esc(k) + '</td><td>' + esc(v) + '</td></tr>'; });
  } else {
    specsRows = '<tr><td colspan="2" style="color:#666">Specifications not available.</td></tr>';
  }

  let updatesHTML = '';
  const updates = l.updates && l.updates.length ? l.updates : [];
  if (updates.length === 0) {
    updatesHTML = '<p style="color:#666">No mission updates published yet.</p>';

    updatesHTML = '<ul style="padding-left:18px; margin:0">';

  let spacexBlock = '';

  let weatherBlock = '';
  if (l.weather !== undefined && l.date.getTime() > Date.now()) {
    weatherBlock = '<div class="section"><h2>Weather Forecast</h2><p><strong>' + l.weather + '% GO</strong> — probability of acceptable launch conditions.</p></div>';
  }

  let windowBlock = '';
  if (l.windowStart !== undefined && l.windowEnd !== undefined) {
    const winHours = (l.windowEnd - l.windowStart).toFixed(1);
    windowBlock = '<tr><td>Launch Window</td><td>' + winHours + ' hours</td></tr>';
  }

  const galleryImages = getGalleryImages(l);
  let galleryHTML = '<div class="gallery">';

    galleryHTML += '<figure><img src="' + esc(img.url) + '" alt="' + esc(img.caption) + '"/><figcaption>' + esc(img.caption) + '</figcaption></figure>';
  });
  galleryHTML += '</div>';

  const html = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Launch Report — ' + esc(l.mission) + '</title>' +
    '<style>' +
    '@page { size: letter; margin: 0.6in; }' +
    'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; color: #18181b; line-height: 1.55; max-width: 780px; margin: 32px auto; padding: 0 24px; }' +
    '.header { border-bottom: 2px solid #18181b; padding-bottom: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; gap:16px; }' +
    '.brand { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #5e6ad2; }' +
    '.meta { font-size: 11px; color: #71717a; text-align: right; }' +
    'h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; margin: 4px 0 8px; }' +
    'h2 { font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #52525b; margin: 24px 0 10px; border-bottom: 1px solid #e4e4e7; padding-bottom: 6px; }' +
    'h3 { font-size: 13px; font-weight: 600; margin: 12px 0 4px; color: #18181b; }' +
    '.subtitle { font-size: 15px; color: #52525b; margin-bottom: 4px; }' +
    '.agency { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5e6ad2; }' +
    '.status { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; background: #f4f4f5; color: #18181b; border: 1px solid #e4e4e7; }' +
    '.status-success { background: rgba(22,163,74,0.1); color: #16a34a; }' +
    '.status-failure { background: rgba(220,38,38,0.1); color: #dc2626; }' +
    '.status-delayed { background: rgba(217,119,6,0.1); color: #d97706; }' +
    '.hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0 8px; padding: 14px; background: #fafafa; border: 1px solid #e4e4e7; border-radius: 6px; }' +
    '.hero-grid div { font-size: 12px; }' +
    '.hero-grid strong { display: block; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: #71717a; font-weight: 500; margin-bottom: 2px; }' +
    '.hero-grid span { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; color: #18181b; }' +
    '.section { margin-bottom: 20px; page-break-inside: avoid; }' +
    '.section p { font-size: 13px; margin: 0 0 8px; }' +
    'table.specs { width: 100%; border-collapse: collapse; font-size: 12px; }' +
    'table.specs td { padding: 6px 10px; border-bottom: 1px solid #e4e4e7; }' +
    'table.specs td:first-child { color: #52525b; width: 45%; }' +

    '.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }' +

    '.print-btn { position: fixed; top: 16px; right: 16px; background: #5e6ad2; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }' +
    '@media print { .print-btn { display: none; } body { margin: 0; } }' +
    '</style></head><body>' +
    '<button class="print-btn" onclick="window.print()">Save as PDF</button>' +
    '<div class="header">' +
    '<div><div class="brand">Apogee · Launch Report</div><h1>' + esc(l.mission) + '</h1><div class="subtitle">' + esc(l.rocket) + ' · ' + esc(l.variant) + '</div><div style="margin-top:8px"><span class="agency">' + esc(l.agency) + '</span> &nbsp;·&nbsp; <span class="status status-' + esc(l.status) + '">' + esc(statusLabel) + '</span></div></div>' +
    '<div class="meta">Generated<br/><strong>' + esc(generated) + '</strong></div>' +
    '</div>' +

    '<div><strong>Launch Time</strong><span>' + esc(fmtAbsTime(l.date)) + '</span></div>' +

    '<tr><td>Operator</td><td>' + esc(l.agency) + '</td></tr>' +

    '<tr><td>Launch Site</td><td>' + esc(l.site) + '</td></tr>' +
    '<tr><td>Launch Date</td><td>' + esc(fmtDate(l.date)) + '</td></tr>' +
    windowBlock +
    '<tr><td>Status</td><td>' + esc(statusLabel) + '</td></tr>' +
    '</table></div>' +
    weatherBlock +
    '<div class="section"><h2>Payload</h2><p>' + esc(l.payload) + '</p>' +
    '<table class="specs">' +
    '<tr><td>Primary Payload</td><td>' + esc(l.payload) + '</td></tr>' +
    '<tr><td>Payload Mass</td><td>' + esc(l.payloadMass ? l.payloadMass.toLocaleString() + ' kg' : 'N/A') + '</td></tr>' +
    '<tr><td>Target Orbit</td><td>' + esc(l.orbit) + '</td></tr>' +
    '</table></div>' +
    '<div class="section"><h2>Rocket Specifications — ' + esc(l.rocket) + '</h2><table class="specs">' + specsRows + '</table></div>' +
    spacexBlock +
    '<div class="section"><h2>Mission Updates</h2>' + updatesHTML + '</div>' +
    '<div class="section"><h2>Media &amp; Links</h2>' +

    '<h3 style="margin-top:14px">Imagery</h3>' + galleryHTML +
    '</div>' +
    '<div class="footer">Apogee Launch Tracker · This report compiled from publicly-available launch data. Times and details subject to change.</div>' +
    '</body></html>';
  return html;
}

function downloadLaunchReport(l) {
  try {
    const html = buildReportHTML(l);
    const filename = 'launch-report-' + sanitizeFilename(l.agency) + '-' + sanitizeFilename(l.mission) + '.html';
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Report saved · open and use "Save as PDF" to print', 'success');
    // Also open in new tab so user can print to PDF immediately
    setTimeout(() => {
      try {
        const previewUrl = URL.createObjectURL(blob);
        const w = window.open(previewUrl, '_blank', 'noopener,noreferrer');
        if (!w) toast('Pop-up blocked — open the downloaded file to print', 'info');
      } catch (e) { /* ignore */ }
    }, 300);
  } catch (err) {
    toast('Report generation failed: ' + err.message, 'error');
  }
}

function generateShareableLink(l) {
  try {
    const html = buildReportHTML(l);
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    showShareLinkModal(l, url);
  } catch (err) {
    toast('Could not generate link: ' + err.message, 'error');
  }
}

function showShareLinkModal(l, url) {
  const existing = document.getElementById('shareLinkModal');
  if (existing) existing.remove();
  const m = document.createElement('div');
  m.id = 'shareLinkModal';
  m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px';
  const isDark = document.documentElement.dataset.theme === 'dark';
  m.innerHTML = '<div style="background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;padding:20px;max-width:440px;width:100%">' +
    '<div style="font-size:14px;font-weight:600;margin-bottom:4px">Shareable Report Link</div>' +
    '<div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">A self-contained preview of <strong>' + l.mission + '</strong>. This link is valid for the current session — for permanent sharing, use the PDF download or email options.</div>' +
    '<input id="shareUrlInput" readonly value="' + url + '" style="width:100%;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);padding:8px 10px;border-radius:4px;font-size:12px;font-family:SF Mono,Menlo,monospace;margin-bottom:12px"/>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end">' +
    '<button class="btn-secondary" id="shareCancel">Close</button>' +
    '<button class="btn-secondary" id="shareOpen">Open Preview</button>' +
    '<button class="btn-primary" id="shareCopy">Copy Link</button>' +
    '</div></div>';
  document.body.appendChild(m);
  document.getElementById('shareCancel').onclick = () => m.remove();
  document.getElementById('shareOpen').onclick = () => {
    try { window.open(url, '_blank', 'noopener,noreferrer'); toast('Preview opened', 'success'); }
    catch(e) { toast('Could not open preview', 'error'); }
  };
  document.getElementById('shareCopy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(url);
      toast('Link copied to clipboard', 'success');
    } catch (e) {
      const input = document.getElementById('shareUrlInput');
      input.select(); input.setSelectionRange(0, 99999);
      try { document.execCommand('copy'); toast('Link copied', 'success'); }
      catch(e2) { toast('Copy failed — select and copy manually', 'error'); }
    }
  };
}

function composeReportEmail(l) {
  try {
    const rk = ROCKETS[l.rocket] || {};
    const statusMap = { scheduled: 'Scheduled', delayed: 'Delayed', scrubbed: 'Scrubbed', success: 'Success', failure: 'Failure', live: 'Live' };
    const subject = 'Launch Report — ' + l.mission + ' (' + l.agency + ')';
    let body = '';
    body += 'LAUNCH REPORT\n';
    body += '=============\n\n';
    body += 'Mission: ' + l.mission + '\n';
    body += 'Agency: ' + l.agency + '\n';
    body += 'Vehicle: ' + l.rocket + ' (' + l.variant + ')\n';
    body += 'Site: ' + l.site + '\n';
    body += 'Launch Time: ' + fmtAbsTime(l.date) + '\n';
    body += 'Status: ' + (statusMap[l.status] || l.status) + '\n\n';
    body += 'MISSION OVERVIEW\n----------------\n' + l.objective + '\n\n';
    body += 'PAYLOAD\n-------\n' + l.payload + '\n';
    if (l.payloadMass) body += 'Mass: ' + l.payloadMass.toLocaleString() + ' kg\n';
    body += 'Target Orbit: ' + l.orbit + '\n\n';
    if (rk.height) {
      body += 'ROCKET SPECIFICATIONS\n---------------------\n';
      body += 'Height: ' + rk.height + '\n';
      body += 'Mass: ' + rk.mass + '\n';
      body += 'Thrust: ' + rk.thrust + '\n';
      body += 'Payload to LEO: ' + rk.payloadLEO + '\n';
      body += 'Success rate: ' + rk.successRate + '% (' + rk.attempts + ' attempts)\n\n';
    }
    if (l.agency === 'SpaceX' && l.booster) {
      body += 'BOOSTER\n-------\n';
      body += 'Core: ' + l.booster + ' (flight ' + (l.reuse + 1) + ')\n';
      body += 'Landing: ' + (l.landing || 'Expendable') + '\n\n';
    }
    const updates = l.updates && l.updates.length ? l.updates : [];
    if (updates.length) {
      body += 'LATEST UPDATES\n--------------\n';
      updates.forEach(u => { body += '· ' + u.time + ' — ' + u.text + '\n'; });
      body += '\n';
    }
    body += 'WEBCAST\nhttps://www.youtube.com/results?search_query=' + encodeURIComponent(l.agency + ' ' + l.mission + ' launch') + '\n\n';
    body += '— Generated by Apogee Launch Tracker';
    const mailto = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    if (mailto.length > 1900) {
      // Some clients truncate long mailto — fall back to copying
      navigator.clipboard.writeText(body).then(() => {
        toast('Report copied to clipboard (too long for mailto)', 'info');
      }).catch(() => {
        window.location.href = mailto;
      });
      return;
    }
    window.location.href = mailto;
    toast('Opening your email client...', 'success');
  } catch (err) {
    toast('Email compose failed: ' + err.message, 'error');
  }
}

function downloadLaunchCard_unused(l) {
  try {
    const isDark = document.documentElement.dataset.theme === 'dark';
    const styles = getComputedStyle(document.documentElement);
    const bg = styles.getPropertyValue('--surface').trim() || (isDark ? '#131316' : '#ffffff');
    const bg2 = styles.getPropertyValue('--bg').trim() || (isDark ? '#09090b' : '#fafafa');
    const text = styles.getPropertyValue('--text').trim() || (isDark ? '#fafafa' : '#18181b');
    const muted = styles.getPropertyValue('--text-muted').trim() || (isDark ? '#a1a1aa' : '#52525b');
    const subtle = styles.getPropertyValue('--text-subtle').trim() || (isDark ? '#71717a' : '#a1a1aa');
    const border = isDark ? 'rgba(255,255,255,0.14)' : 'rgba(0,0,0,0.12)';
    const accent = styles.getPropertyValue('--accent').trim() || '#5e6ad2';

    const W = 1200, H = 630;
    const cd = fmtCountdown(l.date);
    const cdText = cd.live ? 'IN PROGRESS' : cd.text;
    const cdColor = cd.live ? (styles.getPropertyValue('--danger').trim() || '#dc2626') : (cd.class === 'imminent' ? accent : text);
    const statusMap = { scheduled: 'Scheduled', delayed: 'Delayed', scrubbed: 'Scrubbed', success: 'Success', failure: 'Failure', live: 'Live' };
    const statusLabel = statusMap[l.status] || l.status;

    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    let svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
    svg += '<rect width="' + W + '" height="' + H + '" fill="' + bg2 + '"/>';
    svg += '<rect x="40" y="40" width="' + (W - 80) + '" height="' + (H - 80) + '" fill="' + bg + '" stroke="' + border + '" stroke-width="1" rx="8"/>';
    if (l.agency === 'SpaceX') {
      svg += '<rect x="40" y="40" width="4" height="' + (H - 80) + '" fill="' + accent + '"/>';
    }
    // Agency badge
    svg += '<circle cx="96" cy="104" r="18" fill="' + (isDark ? '#1c1c20' : '#f5f5f5') + '"/>';
    svg += '<text x="96" y="110" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="' + muted + '" text-anchor="middle">' + esc(l.agencyCode) + '</text>';
    svg += '<text x="126" y="110" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="' + muted + '">' + esc(l.agency) + '</text>';
    // Status badge
    svg += '<rect x="' + (W - 200) + '" y="88" width="140" height="32" rx="16" fill="' + (isDark ? '#1c1c20' : '#f5f5f5') + '"/>';
    svg += '<text x="' + (W - 130) + '" y="108" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="' + muted + '" text-anchor="middle">' + esc(statusLabel) + '</text>';
    // Mission name
    let mission = l.mission;
    if (mission.length > 32) mission = mission.slice(0, 30) + '…';
    svg += '<text x="96" y="200" font-family="Inter, sans-serif" font-size="56" font-weight="600" fill="' + text + '" letter-spacing="-1">' + esc(mission) + '</text>';
    svg += '<text x="96" y="248" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="' + muted + '">' + esc(l.rocket + ' · ' + l.variant) + '</text>';
    svg += '<text x="96" y="282" font-family="Inter, sans-serif" font-size="18" font-weight="400" fill="' + subtle + '">' + esc(l.site) + '</text>';
    // Divider
    svg += '<line x1="96" y1="330" x2="' + (W - 96) + '" y2="330" stroke="' + border + '" stroke-width="1"/>';
    // Countdown label
    svg += '<text x="96" y="370" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="' + muted + '" letter-spacing="2">' + (cd.live ? 'STATUS' : 'COUNTDOWN') + '</text>';
    svg += '<text x="96" y="450" font-family="SF Mono, Menlo, monospace" font-size="72" font-weight="600" fill="' + cdColor + '" letter-spacing="-2">' + esc(cdText) + '</text>';
    svg += '<text x="96" y="490" font-family="SF Mono, Menlo, monospace" font-size="18" fill="' + subtle + '">' + esc(fmtAbsTime(l.date)) + '</text>';
    // Meta footer
    svg += '<text x="96" y="550" font-family="Inter, sans-serif" font-size="15" fill="' + muted + '">' + esc(l.missionType + ' · ' + l.orbit) + '</text>';
    if (l.agency === 'SpaceX' && l.booster) {
      svg += '<text x="96" y="576" font-family="SF Mono, Menlo, monospace" font-size="13" fill="' + subtle + '">' + esc('Booster ' + l.booster + ' · Flight ' + (l.reuse + 1)) + '</text>';
    }
    // Brand mark
    svg += '<rect x="' + (W - 156) + '" y="540" width="28" height="28" rx="4" fill="' + accent + '"/>';
    svg += '<text x="' + (W - 142) + '" y="560" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">A</text>';
    svg += '<text x="' + (W - 120) + '" y="560" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="' + text + '">Apogee</text>';
    svg += '</svg>';

    const filename = sanitizeFilename(l.agency) + '-' + sanitizeFilename(l.rocket) + '-' + sanitizeFilename(l.mission) + '-launch-card.png';

    // Render SVG to canvas then trigger PNG download
    const img = new Image();
    const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    img.onload = function() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(blob) {
          if (!blob) { toast('Export failed: could not encode image', 'error'); return; }
          const dlUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = dlUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(dlUrl), 2000);
          toast('Saved ' + filename, 'success');
        }, 'image/png');
      } catch (err) {
        URL.revokeObjectURL(url);
        toast('Export failed: ' + err.message, 'error');
      }
    };
    img.onerror = function() {
      URL.revokeObjectURL(url);
      // Fallback: download the SVG directly
      const a = document.createElement('a');
      const svgUrl = URL.createObjectURL(svgBlob);
      a.href = svgUrl;
      a.download = filename.replace(/\.png$/, '.svg');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(svgUrl), 2000);
      toast('Saved as SVG (PNG conversion blocked)', 'info');
    };
    img.src = url;
  } catch (err) {
    toast('Export failed: ' + err.message, 'error');
  }
}

document.getElementById('detailBackdrop').addEventListener('click', () => closeSheet('detail'));
document.getElementById('shareDetail').addEventListener('click', () => { if (state.activeLaunch) downloadLaunchReport(state.activeLaunch); });
document.getElementById('clearFilters').addEventListener('click', () => {
  state.filters.agency.clear();
  state.filters.rocket.clear();
  state.filters.type.clear();
  state.filters.site.clear();
  renderFilterSheet();
  toast('Filters cleared', 'info');
});
document.getElementById('applyFilters').addEventListener('click', () => {
  closeSheet('filter');
  render();
  toast('Filters applied', 'success');
});
document.getElementById('filterBackdrop').addEventListener('click', () => closeSheet('filter'));
document.getElementById('closeNotif').addEventListener('click', () => closeSheet('notif'));
document.getElementById('notifBackdrop').addEventListener('click', () => closeSheet('notif'));
document.getElementById('closeCompare').addEventListener('click', () => closeSheet('compare'));
document.getElementById('compareBackdrop').addEventListener('click', () => closeSheet('compare'));

// ============= HEADER ACTIONS =============
document.getElementById('filterBtn').addEventListener('click', () => openFilterSheet());
document.getElementById('searchBtn').addEventListener('click', () => {
  state.searchOpen = !state.searchOpen;
  document.getElementById('searchSection').style.display = state.searchOpen ? 'block' : 'none';
  document.getElementById('searchBtn').classList.toggle('active', state.searchOpen);
  if (state.searchOpen) {
    setTimeout(() => document.getElementById('searchInput').focus(), 50);
  } else {
    state.search = '';
    document.getElementById('searchInput').value = '';
    render();
  }
});
document.getElementById('searchInput').addEventListener('input', e => {
  state.search = e.target.value;
  render();
});

// Tabs
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    state.view = t.dataset.tab;
    state.search = '';
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    render();
  });
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    ['detail', 'filter', 'notif', 'compare'].forEach(closeSheet);
  }
});

// Refresh
function doRefresh() {
  const btn = document.getElementById('refreshBtn');
  if (btn) btn.classList.add('spinning');
  setTimeout(() => {
    state.lastRefresh = new Date();
    if (btn) btn.classList.remove('spinning');
    render();
    toast('Launch data refreshed', 'success');
  }, 800);
}

// Live countdown tick
setInterval(() => {
  if (state.view === 'timeline') {
    document.querySelectorAll('.launch-card').forEach(card => {
      const id = card.dataset.id;
      const l = LAUNCHES.find(x => x.id === id);
      if (!l) return;
      const cd = fmtCountdown(l.date);
      const cdEl = card.querySelector('.countdown');
      if (cdEl) {
        if (cd.live) {
          cdEl.className = 'countdown live';
          cdEl.innerHTML = '<span class="live-dot"></span>LIVE';
        } else {
          cdEl.className = 'countdown ' + cd.class;
          cdEl.textContent = cd.text;
        }
      }
    });
  }
  if (state.activeLaunch && document.getElementById('detailSheet').classList.contains('open')) {
    const cd = fmtCountdown(state.activeLaunch.date);
    const cdEl = document.querySelector('.detail-countdown');
    if (cdEl) {
      if (cd.live) {
        cdEl.className = 'detail-countdown live';
        cdEl.innerHTML = '<span class="live-dot"></span> IN PROGRESS';
      } else {
        cdEl.className = 'detail-countdown ' + cd.class;
        cdEl.textContent = cd.text;
      }
    }
  }
}, 1000);

// Initial render
render();
setTimeout(() => toast('Tracking ' + LAUNCHES.filter(l => l.date > NOW).length + ' upcoming launches', 'info'), 400);
</script>
</body>
</html>
