<!DOCTYPE html>
<html lang='en'>

<title>DN World Cup Syndicate Contest Platform</title>

<style>
:root{--bg:#fafafa;--surface:#ffffff;--surface-2:#f5f5f5;--text:#18181b;--text-muted:#52525b;--text-subtle:#a1a1aa;--border:rgba(0,0,0,0.08);--border-strong:rgba(0,0,0,0.16);--accent:#5e6ad2;--accent-hover:#4f59c4;--accent-bg:rgba(94,106,210,0.08);--success:#16a34a;--success-bg:rgba(22,163,74,0.08);--warning:#d97706;--warning-bg:rgba(217,119,6,0.08);--danger:#dc2626;--danger-bg:rgba(220,38,38,0.08);--info:#0284c7;--info-bg:rgba(2,132,199,0.08);--radius-sm:4px;--radius-md:6px;--radius-lg:8px;}
[data-theme='dark']{--bg:#09090b;--surface:#131316;--surface-2:#1c1c20;--text:#fafafa;--text-muted:#a1a1aa;--text-subtle:#71717a;--border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.14);--accent:#7b85e3;--accent-hover:#8d96e8;--accent-bg:rgba(123,133,227,0.10);--success:#22c55e;--success-bg:rgba(34,197,94,0.10);--warning:#f59e0b;--warning-bg:rgba(245,158,11,0.10);--danger:#ef4444;--danger-bg:rgba(239,68,68,0.10);--info:#38bdf8;--info-bg:rgba(56,189,248,0.10);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{margin:0;}
button{font-family:inherit;}
.tnum{font-variant-numeric:tabular-nums;}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;}
.muted{color:var(--text-muted);}
.subtle{color:var(--text-subtle);}
.cap{font-size:11px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-muted);}
.hdr{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-0.005em;}
.brand .dot{width:22px;height:22px;border-radius:6px;background:#47d1ff;color:#071a2e;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;}
.nav{display:flex;gap:2px;flex-wrap:wrap;}
.nav button{background:transparent;border:1px solid transparent;color:var(--text-muted);padding:6px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:background 150ms ease,color 150ms ease;}
.nav button:hover{background:var(--surface-2);color:var(--text);}
.nav button.active{background:var(--accent-bg);color:var(--accent);}
.spacer{flex:1;}
.iconbtn{background:transparent;border:1px solid var(--border-strong);color:var(--text-muted);width:32px;height:32px;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 150ms ease;}
.iconbtn:hover{background:var(--surface-2);color:var(--text);}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 64px;}
.btn-primary{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:7px 13px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:background 150ms ease;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);padding:7px 13px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:background 150ms ease,border-color 150ms ease;}
.btn-secondary:hover{background:var(--surface-2);border-color:var(--text-subtle);}
.btn-secondary:disabled{opacity:0.5;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid transparent;padding:6px 10px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-bg);padding:7px 13px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;}
.input,select.input,textarea.input{background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);padding:7px 10px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;transition:border-color 150ms ease,background 150ms ease;width:100%;}
.input:focus{outline:none;border-color:var(--accent);background:var(--surface);}
.input::placeholder{color:var(--text-subtle);}
textarea.input{resize:vertical;min-height:72px;font-family:ui-monospace,Menlo,monospace;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.matrix{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:stretch;}
.matrix>.synd-card{display:flex;flex-direction:column;min-height:280px;}
.synd-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px;}
.synd-head .editname{flex:1;min-width:0;font-size:15px;}
.synd-card .member-list{margin-top:4px;}
.synd-tiers{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:8px;}
.synd-hidden{align-items:center;justify-content:center;text-align:center;opacity:0.7;gap:6px;}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
thead th{text-align:left;font-size:11px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-muted);padding:8px 12px;border-bottom:1px solid var(--border);}
tbody td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text);}
tbody tr.clk{cursor:pointer;}
tbody tr.clk:hover{background:var(--surface-2);}
.numeric{text-align:right;font-family:ui-monospace,Menlo,monospace;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-warning{background:var(--warning-bg);color:var(--warning);}
.badge-danger{background:var(--danger-bg);color:var(--danger);}
.badge-info{background:var(--info-bg);color:var(--info);}
.badge-neutral{background:var(--surface-2);color:var(--text-muted);}
.tierA{background:var(--accent-bg);color:var(--accent);}
.flag{line-height:1;display:inline-flex;align-items:center;transition:filter 400ms ease,opacity 400ms ease;}
.flag img,img.flagimg{width:21px;height:16px;border-radius:2px;object-fit:cover;vertical-align:middle;display:inline-block;border:1px solid var(--border);}
.flagx{font-size:16px;}
.flag.elim{filter:grayscale(1);opacity:0.35;}
.flagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.fchip{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11px;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:24px;max-width:520px;width:100%;max-height:90vh;overflow:auto;}
.toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--surface);border:1px solid var(--border-strong);border-left:3px solid var(--text-subtle);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;min-width:240px;max-width:340px;animation:slidein 180ms ease;}
.toast.success{border-left-color:var(--success);}
.toast.error{border-left-color:var(--danger);}
.toast.info{border-left-color:var(--info);}
@keyframes slidein{from{opacity:0;transform:translateX(12px);}to{opacity:1;transform:none;}}
.empty{text-align:center;padding:48px 24px;color:var(--text-muted);}
.empty svg{opacity:0.14;margin-bottom:12px;}
.empty h3{font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px;}
.pts{font-size:20px;font-weight:600;letter-spacing:-0.005em;}
.rankbubble{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--text-muted);}
.rankbubble.r1{background:var(--accent-bg);color:var(--accent);}
.section-title{font-size:20px;font-weight:600;letter-spacing:-0.005em;margin-bottom:4px;}
.eyebrow{margin-bottom:18px;}
.divider{height:1px;background:var(--border);margin:16px 0;}
.scene{perspective:1200px;}
.flipcard{position:relative;width:100%;max-width:520px;margin:0 auto;height:340px;transition:transform 700ms cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;}
.flipcard.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--border-strong);border-radius:var(--radius-lg);background:var(--surface);padding:28px;display:flex;flex-direction:column;}
.face.back{transform:rotateY(180deg);}
.face .big{font-size:28px;font-weight:600;letter-spacing:-0.01em;}
.confetti{font-size:40px;text-align:center;}
.member-list{display:flex;flex-wrap:wrap;gap:6px;}
.member{font-size:12px;padding:2px 8px;background:var(--surface-2);border-radius:10px;color:var(--text-muted);}
.detailbox{background:var(--surface-2);padding:14px;border-radius:var(--radius-sm);}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-0.01em;}
.tabs2{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;}
.tabs2 button{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-muted);padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:-1px;}
.tabs2 button.active{color:var(--accent);border-bottom-color:var(--accent);}
.editname{border:1px solid transparent;background:transparent;color:inherit;font:inherit;font-weight:600;padding:2px 4px;border-radius:4px;cursor:text;}
.editname:hover{border-color:var(--border-strong);background:var(--surface-2);}
@media(max-width:1024px){.matrix{grid-template-columns:repeat(2,1fr);}.kpis{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.wrap{padding:16px 12px 48px;}.matrix{grid-template-columns:1fr;}.grid2{grid-template-columns:1fr;}.kpis{grid-template-columns:repeat(2,1fr);}.hide-sm{display:none;}}
</style>

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function fmtDate(ts){ var d=new Date(ts); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+', '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}); }

// ---------- CSV ----------
function parseCSV(text){ var lines=text.replace(/\r/g,'').split('\n').filter(function(l){return l.trim()!=='';}); var rows=[]; for(var i=0;i<lines.length;i++){ var line=lines[i]; var out=[]; var cur=''; var q=false; for(var c=0;c<line.length;c++){ var ch=line[c]; if(q){ if(ch==='"'){ if(line[c+1]==='"'){cur+='"';c++;} else q=false; } else cur+=ch; } else { if(ch==='"') q=true; else if(ch===','){ out.push(cur); cur=''; } else cur+=ch; } } out.push(cur); rows.push(out.map(function(x){return x.trim();})); } return rows; }
function looksHeader(r,keys){ var j=r.join(' ').toLowerCase(); for(var i=0;i<keys.length;i++){ if(j.indexOf(keys[i])!==-1) return true; } return false; }

// ---------- Recompute scoring ----------
function recompute(){
  S.synds.forEach(function(s){ s.points=0; s.goals=0; });
  S.countries.forEach(function(c){ c.eliminated = !!c.elimManual; });
  S.fixtures.filter(function(f){return f.status==='final';}).forEach(function(f){
    var oh=ownerOf(f.home), oa=ownerOf(f.away);
    var hg=Number(f.homeGoals)||0, ag=Number(f.awayGoals)||0;
    if(oh) oh.goals+=hg; if(oa) oa.goals+=ag;
    var winner=null, loser=null;
    if(f.winner==='home'){winner=f.home;loser=f.away;} else if(f.winner==='away'){winner=f.away;loser=f.home;}
    else if(hg>ag){winner=f.home;loser=f.away;} else if(ag>hg){winner=f.away;loser=f.home;}
    if(winner){ var ow=ownerOf(winner); if(ow) ow.points+=(STAGE_PTS[f.stage]||0); }
    if(f.stage!=='group' && loser){ var lc=S.countries.find(function(x){return x.name===loser;}); if(lc) lc.eliminated=true; }
  });
}
function ranked(){ recompute(); return S.synds.slice().sort(function(a,b){ return (b.points-a.points)||(b.goals-a.goals)||a.name.localeCompare(b.name); }); }

// ---------- Generation ----------
function generateSyndicates(){
  if(S.emp.length<8){ toast('Need at least 8 employees to form 8 syndicates','error'); return; }
  var tA=S.countries.filter(function(c){return c.tier==='A';});
  var tB=S.countries.filter(function(c){return c.tier==='B';});
  var tC=S.countries.filter(function(c){return c.tier==='C';});
  if(tA.length<8||tB.length<16||tC.length<24){ toast('Need >=8 Tier A, >=16 Tier B, >=24 Tier C countries (have '+tA.length+'/'+tB.length+'/'+tC.length+')','error'); return; }
  var names=shuffle(FUNNY).slice(0,8);
  var emp=shuffle(S.emp);
  var sA=shuffle(tA), sB=shuffle(tB), sC=shuffle(tC);
  var synds=[];
  for(var i=0;i<8;i++){ synds.push({id:'syn'+i,name:names[i],members:[],countries:[],revealed:false,points:0,goals:0}); }
  emp.forEach(function(e,i){ synds[i%8].members.push(e); });
  for(var k=0;k<8;k++){ synds[k].countries.push(sA[k].name); synds[k].countries.push(sB[k*2].name); synds[k].countries.push(sB[k*2+1].name); synds[k].countries.push(sC[k*3].name); synds[k].countries.push(sC[k*3+1].name); synds[k].countries.push(sC[k*3+2].name); }
  S.synds=synds;
  log('generate','Generated 8 syndicates ('+emp.length+' employees, portfolios assigned)');
  toast('Generated 8 syndicates with portfolios','success');
  render();
}

function fixDetail(f){

// ---------- Override modal ----------
function openOverride(fid){
  var f=S.fixtures.find(function(x){return x.id===fid;}); if(!f) return;

  function close(){ root.innerHTML=''; }
  document.getElementById('mclose').onclick=close; document.getElementById('ovCancel').onclick=close;
  document.getElementById('mbk').onclick=function(e){ if(e.target.id==='mbk') close(); };
  document.getElementById('ovSave').onclick=function(){ var hg=document.getElementById('ovH').value, ag=document.getElementById('ovA').value; if(hg===''||ag===''){ toast('Enter both scores','error'); return; } f.homeGoals=parseInt(hg,10); f.awayGoals=parseInt(ag,10); f.status='final'; f.overrideBy=S.adminName; f.overrideAt=Date.now(); log('override','Override '+f.home+' '+f.homeGoals+'-'+f.awayGoals+' '+f.away+' ('+STAGE_LABEL[f.stage]+')'); toast('Score override saved','success'); close(); render(); };
}

// ---------- Import handlers ----------
function importEmployees(text){ var rows=parseCSV(text); if(!rows.length){ toast('No rows found','error'); return; } if(looksHeader(rows[0],['name','email','department','dept'])) rows.shift(); var out=[]; rows.forEach(function(r){ if(r[0]) out.push({name:r[0],email:r[1]||'',dept:r[2]||'General'}); }); if(!out.length){ toast('No valid employee rows','error'); return; } S.emp=out; log('upload','Uploaded '+out.length+' employees'); toast('Imported '+out.length+' employees','success'); render(); }
function importCountries(text){ var rows=parseCSV(text); if(!rows.length){ toast('No rows found','error'); return; } if(looksHeader(rows[0],['country','tier','name'])) rows.shift(); var out=[]; rows.forEach(function(r){ if(r[0]){ var t=(r[1]||'C').trim().toUpperCase(); if(t!=='A'&&t!=='B'&&t!=='C') t='C'; out.push({name:r[0],tier:t,eliminated:false,elimManual:false}); } }); if(!out.length){ toast('No valid country rows','error'); return; } S.countries=out; log('upload','Uploaded '+out.length+' countries'); toast('Imported '+out.length+' countries','success'); render(); }
function readFile(input,cb){ var f=input.files&&input.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ cb(String(r.result)); }; r.onerror=function(){ toast('Could not read file','error'); }; r.readAsText(f); }

// ---------- API fetch ----------
function fetchApi(){
  var url=document.getElementById('apiUrl').value.trim(); S.apiUrl=url; var st=document.getElementById('apiStatus');
  if(!url){ toast('Enter an API URL first','error'); return; }
  st.textContent='Fetching…';
  fetch(url).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(function(data){
    var arr = Array.isArray(data)?data:(data.matches||data.results||data.data||data.fixtures||[]);
    if((!Array.isArray(arr)||!arr.length)&&Array.isArray(data.rounds)){ arr=[]; data.rounds.forEach(function(r){ if(Array.isArray(r.matches)) arr=arr.concat(r.matches); }); }
    if(!Array.isArray(arr)||!arr.length) throw new Error('No matches array found in response');
    var added=0;
    var ALIAS={'South Korea':'Korea Republic','Korea Republic':'South Korea','USA':'United States','United States':'USA','IR Iran':'Iran','Iran':'IR Iran','Republic of Ireland':'Ireland'};
    function findCountry(nm){ if(!nm) return null; var c=S.countries.find(function(x){return x.name===nm;}); if(c) return c; if(ALIAS[nm]){ c=S.countries.find(function(x){return x.name===ALIAS[nm];}); if(c) return c; } return null; }
    function mapStage(m){ var r=((m.stage||m.round||m.group||'')+'').toLowerCase(); if(m.group||r.indexOf('group')!==-1||r.indexOf('matchday')!==-1) return 'group'; if(r.indexOf('third')!==-1||r.indexOf('3rd')!==-1||r.indexOf('play-off')!==-1) return null; if(r.indexOf('16')!==-1) return 'r16'; if(r.indexOf('quart')!==-1) return 'quarter'; if(r.indexOf('semi')!==-1) return 'semi'; if(r.indexOf('final')!==-1) return 'final'; if(r.indexOf('round of')!==-1) return 'r16'; return 'group'; }
    arr.forEach(function(m){
      var home=m.home||m.homeTeam||m.home_team||m.team1||(m.teams&&m.teams.home&&m.teams.home.name);
      var away=m.away||m.awayTeam||m.away_team||m.team2||(m.teams&&m.teams.away&&m.teams.away.name);
      if(typeof home==='object'&&home) home=home.name; if(typeof away==='object'&&away) away=away.name;
      if(!home||!away) return;
      var hc=findCountry(home), ac=findCountry(away);
      if(!hc||!ac) return;
      home=hc.name; away=ac.name;
      var stage=mapStage(m); if(!stage) return;
      var hg=null, ag=null, winner=null;
      if(m.score){
        var ft=m.score.ft, et=m.score.et, pen=m.score.p;
        if(Array.isArray(ft)){ hg=ft[0]; ag=ft[1]; } else { hg=(m.score.home!=null?m.score.home:null); ag=(m.score.away!=null?m.score.away:null); }
        if(Array.isArray(et)){ if(et[0]!=null&&et[1]!=null){ hg=et[0]; ag=et[1]; } }
        if(Array.isArray(pen)){ winner=pen[0]>pen[1]?'home':(pen[1]>pen[0]?'away':null); }
      } else {
        hg=m.homeScore!=null?m.homeScore:(m.home_score!=null?m.home_score:null);
        ag=m.awayScore!=null?m.awayScore:(m.away_score!=null?m.away_score:null);
      }
      var dt=m.date?Date.parse(m.date+(m.time?('T'+m.time):'')):Date.now(); if(isNaN(dt)) dt=Date.now();
      var fin = (hg!=null&&ag!=null);
      if(!winner&&fin){ winner=Number(hg)>Number(ag)?'home':(Number(ag)>Number(hg)?'away':null); }
      var ex=S.fixtures.find(function(f){return f.home===home&&f.away===away&&f.stage===stage;});
      if(ex){ if(ex.overrideBy){ return; } if(fin){ex.homeGoals=Number(hg);ex.awayGoals=Number(ag);ex.status='final';ex.winner=winner;} ex.date=dt; }
      else { S.fixtures.push({id:'fx'+Date.now()+'_'+Math.random().toString(36).slice(2,6),home:home,away:away,stage:stage,date:dt,homeGoals:fin?Number(hg):null,awayGoals:fin?Number(ag):null,status:fin?'final':'scheduled',winner:fin?winner:null}); added++; }
    });
    log('api','Fetched API results from '+url+' ('+added+' new fixtures)');
    toast('API sync complete · '+added+' new fixtures','success');
    render();
  }).catch(function(e){ if(st)st.textContent=''; toast('API fetch failed: '+(e.message||e),'error'); log('api','API fetch failed: '+(e.message||e)); });
}

// ---------- Bind ----------
function bind(){
  var v=document.getElementById('view');
  function on(sel,ev,fn){ var el=document.getElementById(sel); if(el) el.addEventListener(ev,fn); }
  // leaderboard
  Array.prototype.forEach.call(v.querySelectorAll('tr[data-syn]'),function(tr){ tr.onclick=function(){ var id=tr.getAttribute('data-syn'); S.expand['lb-'+id]=!S.expand['lb-'+id]; render(); }; });
  on('csvBtn','click',function(){ exportCsv(); });
  // matrix edit
  Array.prototype.forEach.call(v.querySelectorAll('input[data-edit]'),function(inp){ inp.onclick=function(e){e.stopPropagation();}; inp.onchange=function(){ var id=inp.getAttribute('data-edit'); var s=S.synds.find(function(x){return x.id===id;}); if(s){ var old=s.name; s.name=inp.value.trim()||old; log('rename','Renamed "'+old+'" to "'+s.name+'"'); toast('Syndicate renamed','success'); } }; });
  // fixtures rows
  Array.prototype.forEach.call(v.querySelectorAll('tr[data-fix]'),function(tr){ tr.onclick=function(){ var id=tr.getAttribute('data-fix'); S.expand['fx-'+id]=!S.expand['fx-'+id]; render(); }; });
  var sfEl=document.getElementById('stageFilter'); if(sfEl){ sfEl.value=S._stageFilter||''; sfEl.onchange=function(){ S._stageFilter=sfEl.value; render(); }; }
  Array.prototype.forEach.call(v.querySelectorAll('[data-override]'),function(b){ b.onclick=function(e){ e.stopPropagation(); openOverride(b.getAttribute('data-override')); }; });
  Array.prototype.forEach.call(v.querySelectorAll('[data-delfix]'),function(b){ b.onclick=function(){ var id=b.getAttribute('data-delfix'); S.fixtures=S.fixtures.filter(function(f){return f.id!==id;}); log('fixture','Deleted a fixture'); toast('Fixture deleted','info'); render(); }; });
  // find
  on('findBtn','click',function(){ S._findQ=document.getElementById('findInput').value.trim(); render(); });
  var fi=document.getElementById('findInput'); if(fi) fi.onkeydown=function(e){ if(e.key==='Enter'){ S._findQ=fi.value.trim(); render(); } };
  // reveal
  on('revealBtn','click',revealNext);
  // admin login
  on('adminLoginBtn','click',function(){ var nm=document.getElementById('adminSelect').value; var pw=document.getElementById('adminPass').value; if(!nm){ toast('Select an admin','error'); return; } if(pw!==ADMIN_PASS){ toast('Incorrect password','error'); return; } S.adminName=nm; log('login','Admin signed in'); toast('Welcome, '+nm,'success'); render(); });
  var ap=document.getElementById('adminPass'); if(ap) ap.onkeydown=function(e){ if(e.key==='Enter') document.getElementById('adminLoginBtn').click(); };
  on('adminLogout','click',function(){ log('logout','Admin signed out'); S.adminName=null; toast('Signed out','info'); render(); });
  Array.prototype.forEach.call(v.querySelectorAll('[data-sub]'),function(b){ b.onclick=function(){ S._adminSub=b.getAttribute('data-sub'); render(); }; });
  // data upload
  on('empPaste','click',function(){ importEmployees(document.getElementById('empCsv').value); });
  on('cntPaste','click',function(){ importCountries(document.getElementById('cntCsv').value); });
  on('empFile','change',function(){ readFile(this,importEmployees); });
  on('cntFile','change',function(){ readFile(this,importCountries); });
  on('demoBtn','click',loadDemo);
  on('resetBtn','click',function(){ S.emp=[];S.countries=[];S.synds=[];S.fixtures=[];S.expand={}; log('reset','Reset all data'); toast('All data reset','info'); render(); });
  // generate
  on('genBtn','click',generateSyndicates);
  on('goReveal','click',function(){ setTab('reveal'); });
  // fixtures admin
  on('addFix','click',function(){ var home=document.getElementById('fHome').value, away=document.getElementById('fAway').value, stage=document.getElementById('fStage').value, dt=document.getElementById('fDate').value, hg=document.getElementById('fHG').value, ag=document.getElementById('fAG').value; if(!home||!away){ toast('Select both teams','error'); return; } if(home===away){ toast('Teams must differ','error'); return; } var final=(hg!==''&&ag!==''); S.fixtures.push({id:'fx'+Date.now()+'_'+Math.random().toString(36).slice(2,6),home:home,away:away,stage:stage,date:dt?Date.parse(dt):Date.now(),homeGoals:final?parseInt(hg,10):null,awayGoals:final?parseInt(ag,10):null,status:final?'final':'scheduled'}); log('fixture','Added fixture '+home+' v '+away+' ('+STAGE_LABEL[stage]+')'); toast('Fixture added','success'); render(); });
  // api
  on('fetchApi','click',fetchApi);
  on('apiDefault','click',function(){ S.apiUrl=DEFAULT_API; render(); });
  on('api2022','click',function(){ S.apiUrl=SAMPLE_API; render(); });
  var au=document.getElementById('apiUrl'); if(au) au.onchange=function(){ S.apiUrl=au.value; };
}

function exportCsv(){
  var rs=ranked(); function q(x){ x=String(x==null?'':x); if(x.indexOf(',')!==-1||x.indexOf('"')!==-1||x.indexOf('\n')!==-1){ return '"'+x.replace(/"/g,'""')+'"'; } return x; }
  var lines=['Rank,Syndicate,Points,Members,Goals,Countries'];
  rs.forEach(function(s,i){ lines.push([i+1,q(s.revealed?s.name:'Hidden'),s.points,s.members.length,s.goals,q(s.revealed?s.countries.join(' / '):'')].join(',')); });
  var blob=new Blob([lines.join('\n')],{type:'text/csv'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='leaderboard.csv'; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},1000); toast('Leaderboard exported','success');
}

// initial
render();
})();
