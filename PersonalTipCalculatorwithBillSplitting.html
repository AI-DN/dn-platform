<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 1;
        }

        select {
            cursor: pointer;
            background-color: white;
        }

        .slider-container {
            margin-top: 15px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .slider-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 3px 12px rgba(102, 126, 234, 0.6);
        }

        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
            transition: all 0.2s ease;
        }

        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 3px 12px rgba(102, 126, 234, 0.6);
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: linear-gradient(to right, #e0e0e0 0%, #667eea 100%);
        }

        input[type="range"]::-moz-range-track {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #e0e0e0;
        }

        .slider-markers {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 11px;
            color: #999;
        }

        .results {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
            color: white;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .result-row:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .result-label {
            font-size: 16px;
            font-weight: 500;
            opacity: 0.95;
        }

        .result-value {
            font-size: 24px;
            font-weight: 700;
        }

        .per-person-result {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .per-person-result .result-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .per-person-result .result-value {
            font-size: 32px;
        }

        .reset-btn {
            width: 100%;
            padding: 15px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reset-btn:hover {
            background: #ee5a52;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        .reset-btn:active {
            transform: translateY(0);
        }

        .input-prefix {
            position: relative;
        }

        .input-prefix input {
            padding-left: 35px;
        }

        .input-prefix::before {
            content: attr(data-prefix);
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            .result-value {
                font-size: 20px;
            }

            .per-person-result .result-value {
                font-size: 28px;
            }
        }

        .error {
            border-color: #ff6b6b !important;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💵 Tip Calculator</h1>
        
        <div class="input-group">
            <label for="billAmount">Bill Amount</label>
            <div class="input-prefix" data-prefix="$">
                <input type="number" id="billAmount" min="0" step="0.01" value="0" placeholder="0.00">
            </div>
        </div>

        <div class="input-group">
            <label for="location">Location (Sales Tax)</label>
            <select id="location">
                <option value="0">No Tax</option>
                <option value="6.25">Massachusetts (6.25%)</option>
                <option value="8.875">New York, NY (8.875%)</option>
                <option value="9.5">Los Angeles, CA (9.5%)</option>
                <option value="10.25">Chicago, IL (10.25%)</option>
                <option value="8.25">Austin, TX (8.25%)</option>
                <option value="6">Florida (6%)</option>
                <option value="7">Tennessee (7%)</option>
                <option value="6.5">Washington (6.5%)</option>
                <option value="4.5">Hawaii (4.5%)</option>
                <option value="0">Oregon (0%)</option>
            </select>
        </div>

        <div class="input-group">
            <label>Tip Percentage</label>
            <div class="slider-container">
                <div class="slider-label">
                    <span>Adjust Tip:</span>
                    <span class="slider-value" id="tipValue">15%</span>
                </div>
                <input type="range" id="tipSlider" min="0" max="30" step="1" value="15">
                <div class="slider-markers">
                    <span>0%</span>
                    <span>15%</span>
                    <span>30%</span>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label for="numPeople">Number of People</label>
            <input type="number" id="numPeople" min="1" step="1" value="1" placeholder="1">
        </div>

        <div class="results">
            <div class="result-row">
                <span class="result-label">Subtotal:</span>
                <span class="result-value" id="subtotalAmount">$0.00</span>
            </div>
            <div class="result-row">
                <span class="result-label">Sales Tax:</span>
                <span class="result-value" id="taxAmount">$0.00</span>
            </div>
            <div class="result-row">
                <span class="result-label">Tip Amount:</span>
                <span class="result-value" id="tipAmount">$0.00</span>
            </div>
            <div class="result-row">
                <span class="result-label">Total:</span>
                <span class="result-value" id="totalAmount">$0.00</span>
            </div>
            <div class="per-person-result">
                <div class="result-label">Per Person</div>
                <div class="result-value" id="perPersonAmount">$0.00</div>
            </div>
        </div>

        <button class="reset-btn" id="resetBtn">Reset</button>
    </div>

    <script>
        const billAmountInput = document.getElementById('billAmount');
        const locationSelect = document.getElementById('location');
        const tipSlider = document.getElementById('tipSlider');
        const tipValue = document.getElementById('tipValue');
        const numPeopleInput = document.getElementById('numPeople');
        const subtotalAmountDisplay = document.getElementById('subtotalAmount');
        const taxAmountDisplay = document.getElementById('taxAmount');
        const tipAmountDisplay = document.getElementById('tipAmount');
        const totalAmountDisplay = document.getElementById('totalAmount');
        const perPersonAmountDisplay = document.getElementById('perPersonAmount');
        const resetBtn = document.getElementById('resetBtn');

        function formatCurrency(amount) {
            return '$' + amount.toFixed(2);
        }

        function validateInput(input, min = 0) {
            let value = parseFloat(input.value);
            if (isNaN(value) || value < min) {
                value = min;
                input.value = value;
            }
            return value;
        }

        function updateTipValue() {
            const tipPercentage = parseInt(tipSlider.value);
            tipValue.textContent = tipPercentage + '%';
        }

        function calculate() {
            try {
                let billAmount = validateInput(billAmountInput, 0);
                let taxRate = parseFloat(locationSelect.value);
                let tipPercentage = parseInt(tipSlider.value);
                let numPeople = validateInput(numPeopleInput, 1);

                // Ensure numPeople is at least 1 and an integer
                numPeople = Math.max(1, Math.round(numPeople));
                numPeopleInput.value = numPeople;

                // Calculate sales tax on the bill amount
                const taxAmount = billAmount * (taxRate / 100);
                
                // Subtotal is bill + tax
                const subtotal = billAmount + taxAmount;
                
                // Calculate tip on the subtotal (bill + tax)
                const tipAmount = subtotal * (tipPercentage / 100);
                
                // Total is bill + tax + tip
                const totalAmount = subtotal + tipAmount;
                
                // Per person amount
                const perPersonAmount = totalAmount / numPeople;

                // Update displays
                subtotalAmountDisplay.textContent = formatCurrency(billAmount);
                taxAmountDisplay.textContent = formatCurrency(taxAmount);
                tipAmountDisplay.textContent = formatCurrency(tipAmount);
                totalAmountDisplay.textContent = formatCurrency(totalAmount);
                perPersonAmountDisplay.textContent = formatCurrency(perPersonAmount);
            } catch (error) {
                console.error('Calculation error:', error);
                // Set default values on error
                subtotalAmountDisplay.textContent = '$0.00';
                taxAmountDisplay.textContent = '$0.00';
                tipAmountDisplay.textContent = '$0.00';
                totalAmountDisplay.textContent = '$0.00';
                perPersonAmountDisplay.textContent = '$0.00';
            }
        }

        function reset() {
            billAmountInput.value = '0';
            locationSelect.value = '0';
            tipSlider.value = '15';
            updateTipValue();
            numPeopleInput.value = '1';
            calculate();
        }

        // Add event listeners for real-time calculation
        billAmountInput.addEventListener('input', calculate);
        locationSelect.addEventListener('change', calculate);
        tipSlider.addEventListener('input', function() {
            updateTipValue();
            calculate();
        });
        numPeopleInput.addEventListener('input', calculate);

        // Reset button
        resetBtn.addEventListener('click', reset);

        // Initial calculation
        updateTipValue();
        calculate();
    </script>
</body>
</html>
