<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Ping Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 100%;
        }

        .title {
            text-align: center;
            color: #00ff88;
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff88;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            color: #fff;
            font-size: 48px;
            font-weight: bold;
        }

        .player-score {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 5px;
        }

        #gameCanvas {
            display: block;
            background: #0f0f1e;
            border: 3px solid #00ff88;
            border-radius: 10px;
            margin: 0 auto;
            cursor: none;
        }

        .controls {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .controls h3 {
            color: #00ff88;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .controls p {
            color: #ccc;
            margin: 5px 0;
            font-size: 14px;
        }

        .difficulty-selector {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .difficulty-selector label {
            color: #fff;
            font-size: 14px;
        }

        .difficulty-selector select {
            padding: 8px 15px;
            background: #2a2a3e;
            color: #fff;
            border: 2px solid #00ff88;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .difficulty-selector select:hover {
            background: #3a3a4e;
        }

        .game-message {
            text-align: center;
            margin-top: 15px;
            font-size: 24px;
            color: #00ff88;
            min-height: 30px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff88;
        }

        .restart-btn {
            display: block;
            margin: 15px auto 0;
            padding: 12px 30px;
            background: #00ff88;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .restart-btn:hover {
            background: #00dd77;
            transform: scale(1.05);
        }

        .restart-btn:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">🏓 PING PONG 🏓</h1>
        
        <div class="score-board">
            <div class="player-score">
                <div class="score-label">PLAYER</div>
                <div id="playerScore">0</div>
            </div>
            <div class="player-score">
                <div class="score-label">COMPUTER</div>
                <div id="computerScore">0</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div class="game-message" id="gameMessage"></div>
        <button class="restart-btn hidden" id="restartBtn">Play Again</button>

        <div class="controls">
            <h3>🎮 Controls</h3>
            <p>⬆️ Move Up: W or Arrow Up</p>
            <p>⬇️ Move Down: S or Arrow Down</p>
            
            <div class="difficulty-selector">
                <label for="difficulty">AI Difficulty:</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const playerScoreEl = document.getElementById('playerScore');
        const computerScoreEl = document.getElementById('computerScore');
        const gameMessageEl = document.getElementById('gameMessage');
        const restartBtn = document.getElementById('restartBtn');
        const difficultySelect = document.getElementById('difficulty');

        // Game constants
        const WINNING_SCORE = 11;
        const PADDLE_WIDTH = 15;
        const PADDLE_HEIGHT = 80;
        const BALL_SIZE = 12;
        const INITIAL_BALL_SPEED = 5;
        const SPEED_INCREASE = 0.3;
        const PADDLE_SPEED = 7;

        // Game state
        let gameState = {
            playerScore: 0,
            computerScore: 0,
            gameOver: false,
            difficulty: 'medium'
        };

        // Paddle objects
        const playerPaddle = {
            x: 30,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            dy: 0
        };

        const computerPaddle = {
            x: canvas.width - 30 - PADDLE_WIDTH,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT
        };

        // Ball object
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: BALL_SIZE,
            dx: INITIAL_BALL_SPEED,
            dy: INITIAL_BALL_SPEED,
            speed: INITIAL_BALL_SPEED
        };

        // Keyboard state
        const keys = {
            w: false,
            s: false,
            arrowUp: false,
            arrowDown: false
        };

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                keys.arrowUp = true;
            }
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                keys.arrowDown = true;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'ArrowUp') keys.arrowUp = false;
            if (e.key === 'ArrowDown') keys.arrowDown = false;
        });

        restartBtn.addEventListener('click', resetGame);

        difficultySelect.addEventListener('change', (e) => {
            gameState.difficulty = e.target.value;
        });

        // Draw functions
        function drawRect(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
        }

        function drawCircle(x, y, size, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawCenterLine() {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawPaddles() {
            drawRect(playerPaddle.x, playerPaddle.y, playerPaddle.width, playerPaddle.height, '#00ff88');
            drawRect(computerPaddle.x, computerPaddle.y, computerPaddle.width, computerPaddle.height, '#ff0055');
        }

        function drawBall() {
            drawCircle(ball.x, ball.y, ball.size, '#fff');
        }

        function draw() {
            // Clear canvas
            drawRect(0, 0, canvas.width, canvas.height, '#0f0f1e');
            
            // Draw game elements
            drawCenterLine();
            drawPaddles();
            drawBall();
        }

        // Update functions
        function updatePaddlePosition() {
            if (gameState.gameOver) return;

            // Player paddle movement
            if (keys.w || keys.arrowUp) {
                playerPaddle.y -= PADDLE_SPEED;
            }
            if (keys.s || keys.arrowDown) {
                playerPaddle.y += PADDLE_SPEED;
            }

            // Keep player paddle in bounds
            if (playerPaddle.y < 0) playerPaddle.y = 0;
            if (playerPaddle.y + playerPaddle.height > canvas.height) {
                playerPaddle.y = canvas.height - playerPaddle.height;
            }
        }

        function updateComputerPaddle() {
            if (gameState.gameOver) return;

            // AI difficulty settings
            let aiSpeed = 0;
            let reactionDelay = 0;
            
            switch(gameState.difficulty) {
                case 'easy':
                    aiSpeed = 3;
                    reactionDelay = 30;
                    break;
                case 'medium':
                    aiSpeed = 5;
                    reactionDelay = 15;
                    break;
                case 'hard':
                    aiSpeed = 6.5;
                    reactionDelay = 5;
                    break;
            }

            // AI follows ball with some delay for realism
            const paddleCenter = computerPaddle.y + computerPaddle.height / 2;
            const targetY = ball.y;

            if (Math.abs(paddleCenter - targetY) > reactionDelay) {
                if (paddleCenter < targetY) {
                    computerPaddle.y += aiSpeed;
                } else {
                    computerPaddle.y -= aiSpeed;
                }
            }

            // Keep computer paddle in bounds
            if (computerPaddle.y < 0) computerPaddle.y = 0;
            if (computerPaddle.y + computerPaddle.height > canvas.height) {
                computerPaddle.y = canvas.height - computerPaddle.height;
            }
        }

        function updateBall() {
            if (gameState.gameOver) return;

            ball.x += ball.dx;
            ball.y += ball.dy;

            // Ball collision with top and bottom walls
            if (ball.y - ball.size < 0 || ball.y + ball.size > canvas.height) {
                ball.dy *= -1;
            }

            // Ball collision with player paddle
            if (ball.x - ball.size < playerPaddle.x + playerPaddle.width &&
                ball.x + ball.size > playerPaddle.x &&
                ball.y > playerPaddle.y &&
                ball.y < playerPaddle.y + playerPaddle.height) {
                
                // Calculate hit position for angle variation
                const hitPos = (ball.y - (playerPaddle.y + playerPaddle.height / 2)) / (playerPaddle.height / 2);
                ball.dy = hitPos * 5;
                
                ball.dx = Math.abs(ball.dx) + SPEED_INCREASE;
                ball.x = playerPaddle.x + playerPaddle.width + ball.size;
            }

            // Ball collision with computer paddle
            if (ball.x + ball.size > computerPaddle.x &&
                ball.x - ball.size < computerPaddle.x + computerPaddle.width &&
                ball.y > computerPaddle.y &&
                ball.y < computerPaddle.y + computerPaddle.height) {
                
                // Calculate hit position for angle variation
                const hitPos = (ball.y - (computerPaddle.y + computerPaddle.height / 2)) / (computerPaddle.height / 2);
                ball.dy = hitPos * 5;
                
                ball.dx = -(Math.abs(ball.dx) + SPEED_INCREASE);
                ball.x = computerPaddle.x - ball.size;
            }

            // Ball goes past player paddle (computer scores)
            if (ball.x - ball.size < 0) {
                gameState.computerScore++;
                updateScore();
                resetBall();
                checkWin();
            }

            // Ball goes past computer paddle (player scores)
            if (ball.x + ball.size > canvas.width) {
                gameState.playerScore++;
                updateScore();
                resetBall();
                checkWin();
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            
            // Random direction
            const angle = (Math.random() * Math.PI / 2) - Math.PI / 4;
            const direction = Math.random() < 0.5 ? 1 : -1;
            
            ball.speed = INITIAL_BALL_SPEED;
            ball.dx = Math.cos(angle) * ball.speed * direction;
            ball.dy = Math.sin(angle) * ball.speed;
        }

        function updateScore() {
            playerScoreEl.textContent = gameState.playerScore;
            computerScoreEl.textContent = gameState.computerScore;
        }

        function checkWin() {
            if (gameState.playerScore >= WINNING_SCORE) {
                gameState.gameOver = true;
                gameMessageEl.textContent = '🎉 YOU WIN! 🎉';
                restartBtn.classList.remove('hidden');
            } else if (gameState.computerScore >= WINNING_SCORE) {
                gameState.gameOver = true;
                gameMessageEl.textContent = '💻 COMPUTER WINS! 💻';
                restartBtn.classList.remove('hidden');
            }
        }

        function resetGame() {
            gameState.playerScore = 0;
            gameState.computerScore = 0;
            gameState.gameOver = false;
            
            updateScore();
            resetBall();
            
            playerPaddle.y = canvas.height / 2 - PADDLE_HEIGHT / 2;
            computerPaddle.y = canvas.height / 2 - PADDLE_HEIGHT / 2;
            
            gameMessageEl.textContent = '';
            restartBtn.classList.add('hidden');
        }

        function gameLoop() {
            updatePaddlePosition();
            updateComputerPaddle();
            updateBall();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initialize game
        resetBall();
        gameLoop();
    </script>
</body>
</html>
