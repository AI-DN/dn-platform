<body>
    <div class="app-container">
        <div class="app-header">

            <div class="app-subtitle">Your Personal Weather Assistant</div>
        </div>

        <!-- Permission Request State -->

        <div id="location-loading" class="permission-card hidden">
            <div class="loading-spinner"></div>

                Please wait while we determine your current location...
            </div>
        </div>

        <div id="location-success" class="permission-card hidden">
            <div class="permission-icon">✅</div>
            <div class="permission-title">
                <span class="status-indicator status-granted"></span>

            </div>
            <div class="permission-description">
                Great! We can now show you weather information for your current location.
            </div>
            <div class="location-info">
                <div><strong>📍 Current Location:</strong></div>
                <div id="location-display">Determining location...</div>
                <div class="location-coords" id="coordinates-display"></div>
            </div>
            <button id="continue-to-weather" class="btn">Continue to Weather</button>
        </div>

        <!-- Error State -->
        <div id="location-error" class="permission-card hidden">
            <div class="permission-icon">❌</div>
            <div class="permission-title">
                <span class="status-indicator status-denied"></span>
                Location Access Required
            </div>
            <div class="permission-description" id="error-description">
                We couldn't access your location. Please check your browser settings or try again.
            </div>
            <div class="error-message hidden" id="error-details">
                <div class="error-icon">⚠️</div>
                <div id="error-text"></div>
            </div>
            <button id="retry-location" class="btn">Try Again</button>
            <button id="use-manual" class="btn btn-secondary">Enter Location Manually</button>
        </div>

        <!-- Manual Location Input -->
        <div id="manual-input" class="permission-card hidden">
            <div class="permission-icon">🗺️</div>
            <div class="permission-title">Enter Your Location</div>

                Enter your city and state to get weather information.
            </div>
            <input type="text" id="manual-location-input" placeholder="e.g., New York, NY" 
                   style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; margin-bottom: 16px; font-size: 16px;">
            <button id="submit-manual" class="btn">Get Weather</button>
            <button id="back-to-gps" class="btn btn-secondary">Use GPS Instead</button>
        </div>

    <script>
        class LocationManager {
            constructor() {
                this.currentLocation = null;
                this.permissionStatus = 'prompt';
                this.init();
            }

            init() {
                this.bindEvents();
                this.checkExistingPermission();
            }

            bindEvents() {
                document.getElementById('request-location').addEventListener('click', () => this.requestLocation());
                document.getElementById('manual-location').addEventListener('click', () => this.showManualInput());
                document.getElementById('retry-location').addEventListener('click', () => this.requestLocation());
                document.getElementById('use-manual').addEventListener('click', () => this.showManualInput());
                document.getElementById('back-to-gps').addEventListener('click', () => this.showPermissionRequest());
                document.getElementById('submit-manual').addEventListener('click', () => this.submitManualLocation());
                document.getElementById('continue-to-weather').addEventListener('click', () => this.continueToWeather());
                
                // Handle Enter key in manual input
                document.getElementById('manual-location-input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.submitManualLocation();
                    }
                });
            }

            async checkExistingPermission() {
                if ('geolocation' in navigator && 'permissions' in navigator) {
                    try {
                        const permission = await navigator.permissions.query({ name: 'geolocation' });
                        this.permissionStatus = permission.state;
                        
                        if (permission.state === 'granted') {
                            this.requestLocation();
                        }
                    } catch (error) {
                        console.log('Permission API not supported, using standard geolocation');
                    }
                }
            }

            showState(stateId) {
                const states = ['permission-request', 'location-loading', 'location-success', 'location-error', 'manual-input'];
                states.forEach(state => {
                    const element = document.getElementById(state);
                    if (state === stateId) {
                        element.classList.remove('hidden');
                        element.classList.add('fade-in');
                    } else {
                        element.classList.add('hidden');
                        element.classList.remove('fade-in');
                    }
                });
            }

            showPermissionRequest() {
                this.showState('permission-request');
            }

            showLoading() {
                this.showState('location-loading');
            }

            showSuccess(location) {
                this.currentLocation = location;
                document.getElementById('location-display').textContent = `${location.city}, ${location.state}`;
                document.getElementById('coordinates-display').textContent = 
                    `Lat: ${location.latitude.toFixed(6)}, Lng: ${location.longitude.toFixed(6)}`;
                this.showState('location-success');
            }

            showError(errorMessage, details = '') {
                document.getElementById('error-description').textContent = errorMessage;
                
                if (details) {
                    document.getElementById('error-text').textContent = details;
                    document.getElementById('error-details').classList.remove('hidden');
                } else {
                    document.getElementById('error-details').classList.add('hidden');
                }
                
                this.showState('location-error');
            }

            showManualInput() {
                this.showState('manual-input');
                document.getElementById('manual-location-input').focus();
            }

            async requestLocation() {
                if (!('geolocation' in navigator)) {
                    this.showError(
                        'Geolocation is not supported by this browser.',
                        'Please enter your location manually or use a different browser.'
                    );
                    return;
                }

                this.showLoading();

                const options = {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 300000 // 5 minutes
                };

                navigator.geolocation.getCurrentPosition(
                    (position) => this.onLocationSuccess(position),
                    (error) => this.onLocationError(error),
                    options
                );
            }

                    // Simulate reverse geocoding (in real app, use actual geocoding service)
                    const location = await this.reverseGeocode(latitude, longitude);
                    this.showSuccess(location);
                } catch (error) {
                    // If geocoding fails, still show coordinates
                    const location = {
                        latitude,
                        longitude,
                        city: 'Unknown City',
                        state: 'Unknown State'
                    };
                    this.showSuccess(location);
                }
            }

            onLocationError(error) {
                let errorMessage = 'Unable to retrieve your location.';
                let details = '';

                switch (error.code) {
                    case error.PERMISSION_DENIED:
                        errorMessage = 'Location access was denied.';
                        details = 'Please enable location services in your browser settings and try again.';
                        break;
                    case error.POSITION_UNAVAILABLE:
                        errorMessage = 'Location information is unavailable.';
                        details = 'Your device may not support location services or GPS may be disabled.';
                        break;
                    case error.TIMEOUT:
                        errorMessage = 'Location request timed out.';
                        details = 'Please check your internet connection and try again.';
                        break;
                    default:
                        details = 'An unknown error occurred while retrieving your location.';
                        break;
                }

                this.showError(errorMessage, details);
            }

            async reverseGeocode(latitude, longitude) {
                // Simulate API call with mock data based on coordinates
                // In a real app, you would call an actual geocoding service
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Mock city data based on rough coordinate ranges
                const mockCities = [

                    { lat: [39.9, 40.0], lng: [-75.2, -75.1], city: 'Philadelphia', state: 'PA' }
                ];

                const match = mockCities.find(city => 
                    latitude >= city.lat[0] && latitude <= city.lat[1] &&
                    longitude >= city.lng[0] && longitude <= city.lng[1]
                );

                if (match) {
                    return {

                        longitude,

                        state: match.state

    <script>
        // Mock data for demonstration
        const mockLocations = {
            'new-york': { city: 'New York', state: 'NY', lat: 40.7128, lon: -74.0060 },
            'miami': { city: 'Miami', state: 'FL', lat: 25.7617, lon: -80.1918 },
            'chicago': { city: 'Chicago', state: 'IL', lat: 41.8781, lon: -87.6298 },

            'los-angeles': { city: 'Los Angeles', state: 'CA', lat: 34.0522, lon: -118.2437 }
        };

        const alertTypes = {
            tornado: {
                name: 'Tornado Warning',
                icon: '🌪️',
                severity: 'EXTREME',
                color: '#ff3b30',
                description: 'A tornado has been sighted or indicated by weather radar. Take shelter immediately in a sturdy building on the lowest floor, away from windows.'

            severe: {
                name: 'Severe Thunderstorm Warning',
                icon: '⛈️',
                severity: 'SEVERE',
                color: '#ff9500',
                description: 'Severe thunderstorms with damaging winds, large hail, and dangerous lightning are occurring or imminent. Seek shelter indoors.'
            },
            flood: {
                name: 'Flash Flood Warning',
                icon: '🌊',
                severity: 'SEVERE',
                color: '#007aff',
                description: 'Flash flooding is occurring or imminent. Move to higher ground immediately. Do not drive through flooded roads.'
            },
            winter: {
                name: 'Winter Storm Warning',
                icon: '❄️',
                severity: 'MODERATE',
                color: '#5856d6',
                description: 'Heavy snow, ice, and dangerous wind chills expected. Avoid unnecessary travel and prepare for power outages.'
            }
        };

        let activeAlerts = [];
        let currentLocation = null;
        let notificationSettings = {
            severe: true,
            tornado: true,
            flood: true,
            winter: true
        };

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            initializeLocation();
            requestNotificationPermission();
            startAlertMonitoring();
        });

        function initializeLocation() {
            // Simulate getting location
            setTimeout(() => {
                const locations = Object.values(mockLocations);
                currentLocation = locations[Math.floor(Math.random() * locations.length)];
                document.getElementById('locationText').textContent = `${currentLocation.city}, ${currentLocation.state}`;
            }, 1000);
        }

        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission().then(permission => {
                    console.log('Notification permission:', permission);
                });
            }
        }

        function startAlertMonitoring() {
            // Simulate periodic alert checking
            setInterval(checkForAlerts, 30000); // Check every 30 seconds
        }

        function checkForAlerts() {
            const statusElement = document.getElementById('alertStatus');
            const spinner = document.createElement('div');
            spinner.className = 'loading';
            spinner.innerHTML = '<div class="spinner"></div>';
            
            // Show loading state briefly
            const originalContent = statusElement.innerHTML;
            statusElement.innerHTML = '';
            statusElement.appendChild(spinner);
            
            setTimeout(() => {
                statusElement.innerHTML = originalContent;
                // Simulate random alert occurrence (10% chance)
                if (Math.random() < 0.1 && activeAlerts.length === 0) {
                    const alertTypeKeys = Object.keys(alertTypes);
                    const randomAlert = alertTypeKeys[Math.floor(Math.random() * alertTypeKeys.length)];
                    simulateAlert(randomAlert);
                }
            }, 2000);
        }

        function simulateAlert(type) {
            if (!notificationSettings[type]) {
                showNotificationPopup('🔕', 'Alert Blocked', `${alertTypes[type].name} notifications are disabled`);
                return;
            }

            const alertData = alertTypes[type];
            const alertId = Date.now() + Math.random();
            
            const alert = {
                id: alertId,
                type: type,
                title: alertData.name,
                icon: alertData.icon,
                severity: alertData.severity,
                description: alertData.description,
                timestamp: new Date(),
                location: currentLocation
            };

            activeAlerts.push(alert);
            updateAlertDisplay();
            showNotificationPopup(alertData.icon, alertData.name, 'Tap to view details');
            
            // Browser notification
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(`${alertData.name} - ${currentLocation?.city || 'Your Area'}`, {
                    body: alertData.description.substring(0, 100) + '...',
                    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">' + alertData.icon + '</text></svg>',
                    tag: `weather-alert-${alertId}`,
                    requireInteraction: true
                });
            }
        }

        function updateAlertDisplay() {
            const statusElement = document.getElementById('alertStatus');
            const statusTitle = document.getElementById('statusTitle');
            const statusDescription = document.getElementById('statusDescription');
            const statusIcon = document.getElementById('statusIcon');
            const activeAlertsContainer = document.getElementById('activeAlerts');

            if (activeAlerts.length === 0) {
                statusElement.className = 'alert-status clear';
                statusTitle.textContent = 'All Clear';
                statusDescription.textContent = 'No active weather alerts';
                statusIcon.textContent = '✅';
                activeAlertsContainer.innerHTML = '';
            } else {
                statusElement.className = 'alert-status active';
                statusTitle.textContent = `${activeAlerts.length} Active Alert${activeAlerts.length > 1 ? 's' : ''}`;
                statusDescription.textContent = 'Severe weather conditions detected';
                statusIcon.textContent = '⚠️';
                
                activeAlertsContainer.innerHTML = activeAlerts.map(alert => `
                    <div class="alert-card">
                        <div class="alert-header">
                            <div class="alert-type">${alert.icon} ${alert.title}</div>
                            <div class="alert-severity">${alert.severity}</div>
                        </div>
                        <div class="alert-time">Issued: ${alert.timestamp.toLocaleTimeString()}</div>
                        <div class="alert-description">${alert.description}</div>
                        <div class="alert-actions">
                            <button class="btn btn-primary" onclick="viewAlertDetails(${alert.id})">View Details</button>
                            <button class="btn btn-secondary" onclick="dismissAlert(${alert.id})">Dismiss</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function dismissAlert(alertId) {
            activeAlerts = activeAlerts.filter(alert => alert.id !== alertId);
            updateAlertDisplay();
        }

        function clearAllAlerts() {
            activeAlerts = [];
            updateAlertDisplay();
            showNotificationPopup('✅', 'Alerts Cleared', 'All weather alerts have been dismissed');
        }

        function viewAlertDetails(alertId) {
            const alert = activeAlerts.find(a => a.id === alertId);
            if (alert) {
                alert(`${alert.title}\n\nIssued: ${alert.timestamp.toLocaleString()}\nLocation: ${currentLocation?.city || 'Your Area'}\n\n${alert.description}`);
            }
        }

        function toggleSetting(element, setting) {
            element.classList.toggle('active');
            notificationSettings[setting] = element.classList.contains('active');
            
            const status = notificationSettings[setting] ? 'enabled' : 'disabled';
            showNotificationPopup('🔔', 'Settings Updated', `${alertTypes[setting].name} notifications ${status}`);
        }

        function showNotificationPopup(icon, title, message) {
            const popup = document.getElementById('notificationPopup');
            const iconElement = document.getElementById('notificationIcon');
            const titleElement = document.getElementById('notificationTitle');
            const messageElement = document.getElementById('notificationMessage');
            
            iconElement.textContent = icon;
            titleElement.textContent = title;
            messageElement.textContent = message;
            
            popup.classList.add('show');
            
            setTimeout(() => {
                popup.classList.remove('show');
            }, 4000);
        }

        // Hide notification popup when clicked
        document.getElementById('notificationPopup').addEventListener('click', function() {
            this.classList.remove('show');
        });
    </script>
</body>

            { name: 'Portland, OR', key: 'portland' }
        ];

        function MultipleLocationSupport() {
            const [currentLocation, setCurrentLocation] = useState('current_location');
            const [savedLocations, setSavedLocations] = useState(['new_york', 'miami', 'denver']);
            const [showAddForm, setShowAddForm] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [isSearching, setIsSearching] = useState(false);

            const currentWeather = useMemo(() => {
                return mockWeatherData[currentLocation] || mockWeatherData.current_location;
            }, [currentLocation]);

            const savedLocationWeather = useMemo(() => {
                return savedLocations.map(locationKey => ({
                    key: locationKey,
                    ...mockWeatherData[locationKey]
                })).filter(Boolean);
            }, [savedLocations]);

            const searchResults = useMemo(() => {
                if (!searchQuery.trim()) return [];
                return mockCitySearch.filter(city =>
                    city.name.toLowerCase().includes(searchQuery.toLowerCase())
                ).slice(0, 5);
            }, [searchQuery]);

            const handleLocationSwitch = (locationKey) => {
                setIsLoading(true);
                setTimeout(() => {
                    setCurrentLocation(locationKey);
                    setIsLoading(false);
                }, 800);
            };

            const handleAddLocation = (cityKey, cityName) => {
                if (savedLocations.includes(cityKey)) {
                    alert('This location is already saved!');
                    return;
                }

                // Create mock data for new city if it doesn't exist
                if (!mockWeatherData[cityKey]) {
                    mockWeatherData[cityKey] = {
                        name: cityName,
                        lat: Math.random() * 180 - 90,
                        lon: Math.random() * 360 - 180,
                        temperature: Math.floor(Math.random() * 40) + 50,
                        condition: ['Sunny', 'Partly Cloudy', 'Cloudy', 'Light Rain'][Math.floor(Math.random() * 4)],
                        icon: ['☀️', '⛅', '☁️', '🌦️'][Math.floor(Math.random() * 4)],
                        precipitation: Math.floor(Math.random() * 100),
                        wind: Math.floor(Math.random() * 20) + 5,
                        humidity: Math.floor(Math.random() * 40) + 40,
                        pressure: (Math.random() * 2 + 29).toFixed(2)
                    };
                }

                setSavedLocations(prev => [...prev, cityKey]);
                setShowAddForm(false);
                setSearchQuery('');
            };

            const handleRemoveLocation = (locationKey, e) => {
                e.stopPropagation();
                setSavedLocations(prev => prev.filter(key => key !== locationKey));
                if (currentLocation === locationKey) {
                    setCurrentLocation('current_location');
                }
            };

            const handleSearchSubmit = (e) => {
                e.preventDefault();
                if (searchResults.length > 0) {
                    const result = searchResults[0];
                    handleAddLocation(result.key, result.name);
                }
            };

            if (isLoading) {
                return (
                    <div className="container">
                        <div className="glass loading">
                            <div className="loading-spinner"></div>
                            <p>Loading weather data...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="glass header">
                        <h1>Weather Locations</h1>
                        <p>Manage and switch between your saved locations</p>
                    </div>

                    <div className="glass current-location">
                        <h2>
                            <span className="location-icon">📍</span>
                            Current Location
                        </h2>
                        <div className="current-weather">
                            <div className="temp-section">
                                <div className="temperature">{currentWeather.temperature}°</div>
                                <div className="condition">{currentWeather.condition}</div>
                            </div>
                            <div className="weather-icon">{currentWeather.icon}</div>
                        </div>
                        <div className="weather-details">
                            <div className="detail-item">
                                <div className="detail-label">Precipitation</div>
                                <div className="detail-value">{currentWeather.precipitation}%</div>
                            </div>
                            <div className="detail-item">
                                <div className="detail-label">Wind</div>
                                <div className="detail-value">{currentWeather.wind} mph</div>
                            </div>
                            <div className="detail-item">
                                <div className="detail-label">Humidity</div>
                                <div className="detail-value">{currentWeather.humidity}%</div>
                            </div>
                            <div className="detail-item">
                                <div className="detail-label">Pressure</div>
                                <div className="detail-value">{currentWeather.pressure} in</div>
                            </div>
                        </div>
                    </div>

                    <div className="glass saved-locations">
                        <div className="section-header">
                            <h3 className="section-title">Saved Locations</h3>
                            <button 
                                className="add-location-btn"
                                onClick={() => setShowAddForm(!showAddForm)}
                                title="Add Location"
                            >
                                {showAddForm ? '×' : '+'}
                            </button>
                        </div>

                        {showAddForm && (
                            <div className="add-location-form glass">
                                <form onSubmit={handleSearchSubmit}>
                                    <div className="form-group">
                                        <label className="form-label">Search for a city</label>
                                        <input
                                            type="text"
                                            className="form-input"
                                            placeholder="Enter city name..."
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            autoFocus
                                        />
                                    </div>
                                    
                                    {searchResults.length > 0 && (
                                        <div style={{ marginBottom: '15px' }}>
                                            <div className="form-label">Search Results:</div>
                                            {searchResults.map(result => (
                                                <div 
                                                    key={result.key}
                                                    className="location-item"
                                                    style={{ marginBottom: '8px', cursor: 'pointer' }}
                                                    onClick={() => handleAddLocation(result.key, result.name)}
                                                >
                                                    <div className="location-name">{result.name}</div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    
                                    <div className="form-buttons">
                                        <button 
                                            type="button" 
                                            className="btn btn-secondary"
                                            onClick={() => {
                                                setShowAddForm(false);
                                                setSearchQuery('');
                                            }}
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="btn btn-primary"
                                            disabled={searchResults.length === 0}
                                        >
                                            Add Location
                                        </button>
                                    </div>
                                </form>
                            </div>
                        )}

                        {savedLocationWeather.length === 0 ? (
                            <div className="empty-state">
                                <div className="empty-state-icon">🌍</div>
                                <p>No saved locations yet</p>
                                <p style={{ fontSize: '0.9rem', opacity: '0.7', marginTop: '8px' }}>
                                    Tap the + button to add your first location
                                </p>
                            </div>
                        ) : (
                            savedLocationWeather.map(location => (
                                <div 
                                    key={location.key}
                                    className={`location-item ${currentLocation === location.key ? 'active' : ''}`}
                                    onClick={() => handleLocationSwitch(location.key)}
                                >
                                    <button 
                                        className="delete-btn"
                                        onClick={(e) => handleRemoveLocation(location.key, e)}
                                        title="Remove location"
                                    >
                                        ×
                                    </button>
                                    <div className="location-header">
                                        <div className="location-name">{location.name}</div>
                                        <div className="location-temp">{location.temperature}°</div>
                                    </div>
                                    <div className="location-details">
                                        <div className="location-condition">
                                            <span>{location.icon}</span>
                                            <span>{location.condition}</span>
                                        </div>
                                        <div>💧 {location.precipitation}% • 💨 {location.wind}mph</div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<MultipleLocationSupport />, document.getElementById('root'));
    </script>
</body>
</html></template>
<script>
(function() {
  // Hydrate iframes from templates
  document.querySelectorAll(".dn-frame").forEach(function(f) {
    const idx = f.getAttribute("data-idx");
    const tpl = document.getElementById("dn-tpl-" + idx);
    if (tpl) f.srcdoc = tpl.innerHTML.replace(/<\\\/template>/g, "<\/template>");
  });
  // Tab switching
  document.querySelectorAll(".dn-tab").forEach(function(b) {
    b.addEventListener("click", function() {
      const idx = b.getAttribute("data-idx");
      document.querySelectorAll(".dn-tab").forEach(function(x) { x.removeAttribute("data-active"); });
      b.setAttribute("data-active", "1");
      document.querySelectorAll(".dn-frame").forEach(function(x) { x.removeAttribute("data-active"); });
      const f = document.querySelector(".dn-frame[data-idx=\"" + idx + "\"]");
      if (f) f.setAttribute("data-active", "1");
    });
  });
})();
</script>
</body>
</html>
