<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>F1 Fan Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #f5f5f5;
  --text: #18181b;
  --text-muted: #52525b;
  --text-subtle: #a1a1aa;
  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.16);
  --accent: #5e6ad2;
  --accent-hover: #4f59c4;
  --accent-bg: rgba(94, 106, 210, 0.08);
  --success: #16a34a;
  --success-bg: rgba(22, 163, 74, 0.08);
  --warning: #d97706;
  --warning-bg: rgba(217, 119, 6, 0.08);
  --danger: #dc2626;
  --danger-bg: rgba(220, 38, 38, 0.08);
  --info: #0284c7;
  --info-bg: rgba(2, 132, 199, 0.08);
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --mono: ui-monospace, 'SF Mono', Menlo, monospace;
}
[data-theme="dark"] {
  --bg: #09090b;
  --surface: #131316;
  --surface-2: #1c1c20;
  --text: #fafafa;
  --text-muted: #a1a1aa;
  --text-subtle: #71717a;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);
  --accent: #7b85e3;
  --accent-hover: #8d96e8;
  --accent-bg: rgba(123, 133, 227, 0.10);
  --success: #22c55e;
  --success-bg: rgba(34, 197, 94, 0.10);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.10);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.10);
  --info: #38bdf8;
  --info-bg: rgba(56, 189, 248, 0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
body {
  min-height: 100vh;
  padding-bottom: 64px;
}
.app-container { max-width: 720px; margin: 0 auto; }

/* Header */
.app-header {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-mark {
  width: 24px; height: 24px;
  background: var(--accent);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: white; font-weight: 700; font-size: 13px;
  font-family: var(--mono);
}
.brand-name { font-weight: 600; font-size: 15px; letter-spacing: -0.005em; }
.header-actions { display: flex; gap: 4px; align-items: center; }

/* Bottom nav */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: color-mix(in srgb, var(--surface) 96%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  z-index: 40;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav-item {
  flex: 1;
  background: none; border: none;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 4px;
  cursor: pointer;
  color: var(--text-subtle);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  border-radius: var(--radius-sm);
  transition: color 150ms ease, background 150ms ease;
}
.nav-item svg { width: 20px; height: 20px; }
.nav-item.active { color: var(--accent); }
.nav-item:hover { color: var(--text); }

/* Pages */
.page { padding: 16px; display: none; }
.page.active { display: block; animation: fadeIn 180ms ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Type */
.display { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
.h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.005em; }
.h2 { font-size: 16px; font-weight: 600; }
.body-sm { font-size: 13px; }
.caption { font-size: 12px; font-weight: 500; letter-spacing: 0.02em; text-transform: uppercase; color: var(--text-muted); }
.muted { color: var(--text-muted); }
.subtle { color: var(--text-subtle); }
.mono { font-family: var(--mono); font-size: 13px; }

/* Buttons */
.btn-primary, .btn-secondary, .btn-ghost {
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
  padding: 6px 12px;
}
.btn-primary { background: var(--accent); color: white; border: 1px solid var(--accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); }
.btn-secondary:hover { background: var(--surface-2); border-color: var(--text-subtle); }
.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid transparent; padding: 6px 10px; }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-icon { width: 32px; height: 32px; padding: 0; }
.btn-icon svg { width: 16px; height: 16px; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Inputs */
.input, select.input {
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  color: var(--text);
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: inherit;
  width: 100%;
}
.input:focus { outline: none; border-color: var(--accent); background: var(--surface); }

/* Card */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
}
.card + .card { margin-top: 12px; }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
}
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--warning-bg); color: var(--warning); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-info { background: var(--info-bg); color: var(--info); }
.badge-neutral { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
.badge-accent { background: var(--accent-bg); color: var(--accent); }
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--danger);
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* Hero next race */
.hero-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.hero-eyebrow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.hero-title { font-size: 22px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 2px; }
.hero-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
.countdown {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.count-cell {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 8px;
  text-align: center;
}
.count-num { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.count-label { font-size: 10px; text-transform: uppercase; color: var(--text-subtle); letter-spacing: 0.06em; margin-top: 2px; }

/* Schedule list */
.session-list { display: flex; flex-direction: column; gap: 6px; }
.session-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  transition: background 150ms ease;
}
.session-row:hover { background: var(--surface-2); }
.session-name { font-weight: 500; font-size: 13px; }
.session-date { font-size: 12px; color: var(--text-muted); font-family: var(--mono); }

/* KPI grid */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px;
}
.kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); font-weight: 500; }
.kpi-value { font-family: var(--mono); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
.kpi-delta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
thead th {
  text-align: left;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody td {
  padding: 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  vertical-align: middle;
}
tbody tr { transition: background 100ms ease; cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: none; }
.numeric { text-align: right; font-family: var(--mono); }
.pos {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--mono); font-size: 12px; font-weight: 600;
}
.pos.p1 { background: rgba(234, 179, 8, 0.12); color: #d4a017; border-color: rgba(234, 179, 8, 0.3); }
.pos.p2 { background: rgba(161, 161, 170, 0.18); color: var(--text); }
.pos.p3 { background: rgba(180, 100, 50, 0.15); color: #c97a3a; border-color: rgba(180, 100, 50, 0.3); }

.team-strip { display: inline-block; width: 3px; height: 14px; border-radius: 1px; margin-right: 8px; vertical-align: middle; }

/* Tabs */
.tabs {
  display: flex; gap: 2px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: none; border: none;
  padding: 10px 12px;
  font-family: inherit; font-size: 13px; font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }

/* Pill toggle (period switcher) */
.pill-toggle {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 2px;
  gap: 2px;
}
.pill-toggle button {
  background: none; border: none;
  font-family: inherit; font-size: 12px; font-weight: 500;
  color: var(--text-muted);
  padding: 5px 10px;
  border-radius: 3px;
  cursor: pointer;
}
.pill-toggle button.active { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

/* Form row */
.row { display: flex; gap: 8px; align-items: center; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.section-header h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  padding: 16px;
  animation: fadeIn 150ms ease;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 20px;
  max-width: 480px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.modal-title { font-size: 16px; font-weight: 600; }

/* Toasts */
.toast-container {
  position: fixed; top: 16px; right: 16px; left: 16px;
  z-index: 300;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
@media (min-width: 480px) { .toast-container { left: auto; max-width: 360px; } }
.toast {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  font-size: 13px;
  display: flex; align-items: center; gap: 8px;
  pointer-events: auto;
  animation: slideIn 200ms ease;
}
@keyframes slideIn { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--info); }

/* Sparkline */
.sparkline { display: inline-block; vertical-align: middle; }

/* Form list (item) */
.form-list { display: inline-flex; gap: 3px; align-items: center; }
.form-dot {
  width: 16px; height: 16px;
  border-radius: 3px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600;
  background: var(--surface-2); color: var(--text-muted);
  font-family: var(--mono);
  border: 1px solid var(--border);
}
.form-dot.p1 { background: rgba(234, 179, 8, 0.16); color: #d4a017; border-color: rgba(234, 179, 8, 0.3); }
.form-dot.p23 { background: var(--accent-bg); color: var(--accent); border-color: rgba(94,106,210,0.2); }
.form-dot.pts { background: var(--surface-2); color: var(--text); }

/* Empty state */
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 48px 24px;
  text-align: center;
  color: var(--text-muted);
  gap: 8px;
}
.empty svg { opacity: 0.16; width: 40px; height: 40px; }
.empty .empty-title { font-size: 14px; font-weight: 500; color: var(--text); }
.empty .empty-desc { font-size: 13px; color: var(--text-muted); max-width: 260px; }

/* Skeleton */
.skeleton {
  background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface) 50%, var(--surface-2) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
  border-radius: var(--radius-sm);
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Race calendar item */
.cal-item {
  display: grid;
  grid-template-columns: 56px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 100ms ease;
}
.cal-item:hover { background: var(--surface-2); }
.cal-round {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-subtle);
  text-align: center;
  border-right: 1px solid var(--border);
  padding-right: 12px;
}
.cal-round-num { font-size: 18px; color: var(--text); font-weight: 600; display: block; }
.cal-name { font-weight: 500; font-size: 14px; margin-bottom: 2px; }
.cal-meta { font-size: 12px; color: var(--text-muted); }
.cal-status { font-size: 11px; }

/* Feed */
.feed-item {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.feed-item:last-child { border-bottom: none; }
.feed-cat { font-size: 11px; font-weight: 500; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
.feed-title { font-size: 14px; font-weight: 500; margin: 4px 0; line-height: 1.4; }
.feed-body { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
.feed-meta { font-size: 11px; color: var(--text-subtle); margin-top: 6px; display: flex; gap: 12px; align-items: center; }

/* Driver profile mini */
.profile-card { display: flex; gap: 12px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.profile-avatar {
  width: 48px; height: 48px;
  border-radius: 24px;
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-weight: 700; font-size: 16px;
  color: var(--text);
  border: 1px solid var(--border);
}
.profile-name { font-size: 16px; font-weight: 600; }
.profile-meta { font-size: 12px; color: var(--text-muted); }

/* Q1/Q2/Q3 columns */
.qual-grid { display: grid; grid-template-columns: 30px 1fr 1fr 1fr; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); align-items: center; font-size: 12px; }
.qual-grid.head { font-size: 10px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.06em; }
.qual-time { font-family: var(--mono); font-size: 12px; }
.qual-time.elim { color: var(--text-subtle); }
.qual-time.best { color: var(--accent); font-weight: 500; }

/* Stale data indicator */
.refresh-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  font-size: 12px;
  margin-bottom: 12px;
}

/* Compare overlay rows */
.compare-row { display: grid; grid-template-columns: 1fr 90px 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: center; }
.compare-row:last-child { border-bottom: none; }
.compare-label { text-align: center; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.compare-val { font-family: var(--mono); font-weight: 600; font-size: 15px; }
.compare-val.l { text-align: right; }
.compare-val.r { text-align: left; }
.compare-val.win { color: var(--success); }

/* Track svg container */
.track-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; }
.track-svg-wrap { background: var(--surface-2); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; }

/* Switch */
.switch { position: relative; display: inline-block; width: 32px; height: 18px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 10px; transition: 150ms; cursor: pointer; }
.slider:before { content: ""; position: absolute; height: 12px; width: 12px; left: 2px; top: 2px; background: var(--text-muted); transition: 150ms; border-radius: 50%; }
.switch input:checked + .slider { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .slider:before { transform: translateX(14px); background: white; }

/* Misc list */
.detail-list { display: flex; flex-direction: column; gap: 8px; }
.detail-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.detail-row .k { color: var(--text-muted); }
.detail-row .v { font-family: var(--mono); }

/* Weekend type badge */
.weekend-strip { display:inline-block; width: 4px; height: 12px; vertical-align: middle; border-radius: 1px; margin-right: 6px; }
.weekend-strip.sprint { background: var(--warning); }
.weekend-strip.street { background: var(--info); }
.weekend-strip.standard { background: var(--accent); }

/* Prediction league row */
.predict-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: center; }
.predict-row:last-child { border-bottom: none; }

@media (max-width: 480px) {
  .display { font-size: 24px; }
  .kpi-grid { gap: 8px; }
  .kpi { padding: 10px; }
  .kpi-value { font-size: 18px; }
  .page { padding: 12px; }
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style id="dn-auth-style">
  html body > *:not(#dn-auth-overlay):not(script){display:none !important}
  body{visibility:visible !important;background:#07091a !important}
</style>
<div id="dn-auth-overlay" style="position:fixed;inset:0;background:#07091a;display:flex;align-items:center;justify-content:center;z-index:99999;color:#e8eaf0;font-family:system-ui,-apple-system,sans-serif;padding:24px">
  <div style="font-size:13px;color:#7a8099">Checking access…</div>
</div>

function futureISO(daysAhead){

  f.setUTCHours(15, 0, 0, 0);
  return f.toISOString().replace('Z','');
}

function sessionsFor(race){
  const start = d(race.date);
  const list = [];
  if (race.type === 'sprint') {
    list.push({ name: 'Practice 1', at: addH(start, -73) });
    list.push({ name: 'Sprint Qualifying', at: addH(start, -69) });
    list.push({ name: 'Sprint', at: addH(start, -28) });
    list.push({ name: 'Qualifying', at: addH(start, -24) });
    list.push({ name: 'Race', at: start });
  } else {
    list.push({ name: 'Practice 1', at: addH(start, -50) });
    list.push({ name: 'Practice 2', at: addH(start, -46) });
    list.push({ name: 'Practice 3', at: addH(start, -26) });
    list.push({ name: 'Qualifying', at: addH(start, -23) });
    list.push({ name: 'Race', at: start });
  }

/* =================== UTILITIES =================== */
const $ = (s, p) => (p || document).querySelector(s);
const $$ = (s, p) => Array.from((p || document).querySelectorAll(s));

function fmtDate(date) {
  return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtTime(date) {
  return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function fmtTz() {
  const offset = -new Date().getTimezoneOffset() / 60;
  const sign = offset >= 0 ? '+' : '';
  return `UTC${sign}${offset}`;
}
function relativeTime(date) {
  const diff = date.getTime() - Date.now();
  const absSec = Math.abs(diff)/1000;
  if (absSec < 60) return diff > 0 ? 'in <1m' : 'just now';
  const mins = Math.floor(absSec/60);
  if (mins < 60) return diff > 0 ? `in ${mins}m` : `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if (hrs < 48) return diff > 0 ? `in ${hrs}h` : `${hrs}h ago`;
  const days = Math.floor(hrs/24);
  if (days < 30) return diff > 0 ? `in ${days}d` : `${days}d ago`;
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function teamStrip(teamKey) {
  const c = TEAMS[teamKey] ? TEAMS[teamKey].color : 'var(--text-subtle)';
  return `<span class="team-strip" style="background:${c}"></span>`;
}
function posBadge(p){ return `<span class="pos p${p<=3?p:''}">${p}</span>`; }
function formDot(p){
  let cls = 'form-dot';
  if (p === 1) cls += ' p1';
  else if (p <= 3) cls += ' p23';
  else if (p <= 10) cls += ' pts';
  return `<span class="${cls}" title="P${p}">${p}</span>`;
}
function sparkline(values, w, h){
  if (!values || !values.length) return '';
  w = w || 60; h = h || 18;
  const max = Math.max(...values, 6);
  const min = 1;
  const range = max - min || 1;
  const step = w / (values.length - 1 || 1);
  const pts = values.map((v,i)=>`${(i*step).toFixed(1)},${(h - ((v - min)/range)*(h-2) - 1).toFixed(1)}`).join(' ');
  return `<svg class="sparkline" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/></svg>`;
}
function driverName(code){ return DRIVERS[code] ? DRIVERS[code].name : code; }
function driverTeamColor(code){ return DRIVERS[code] ? TEAMS[DRIVERS[code].team].color : '#888'; }

/* =================== TOASTS =================== */
function toast(msg, kind){
  kind = kind || 'info';
  const container = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  const icon = kind === 'success' ? '✓' : kind === 'error' ? '!' : 'i';
  el.innerHTML = `<span style="font-family:var(--mono); font-weight:600; color: var(--${kind === 'success' ? 'success' : kind === 'error' ? 'danger' : 'info'})">${icon}</span> <span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(-4px)'; el.style.transition='all 200ms ease'; setTimeout(()=>el.remove(), 220); }, 4000);
}

function generateLiveData(race){
  const codes = ['VER','NOR','LEC','PIA','SAI','HAM','RUS','PER','ALO','GAS','HUL','TSU','STR','OCO','ALB'];
  let cum = 0;
  return {
    session: 'Race',
    lap: 23, totalLaps: 58,
    estTimeRemaining: '54m',
    trackTemp: 38,
    positions: codes.map((c,i) => {
      const gap = i === 0 ? '—' : '+' + (cum += Math.random()*2 + 0.5).toFixed(3);
      const lap = '1:2' + (Math.floor(Math.random()*9)) + '.' + (100 + Math.floor(Math.random()*900));

/* =================== MODALS: RACE / DRIVER / TEAM / CIRCUIT =================== */
function openRace(raceId){
  const race = CALENDAR_2024.find(r => r.id === raceId);
  if (!race) return;
  const c = CIRCUITS[race.circuit];
  const sessions = sessionsFor(race);
  const weather = WEATHER_FORECAST[race.id];
  let tab = race.status === 'finished' ? 'results' : 'schedule';
  function bodyHtml(){
    let body = `
      <div class="tabs">
        <button class="tab ${tab==='schedule'?'active':''}" data-rtab="schedule">Schedule</button>
        ${race.status==='finished' ? `<button class="tab ${tab==='results'?'active':''}" data-rtab="results">Results</button><button class="tab ${tab==='quali'?'active':''}" data-rtab="quali">Qualifying</button>` : ''}
        <button class="tab ${tab==='circuit'?'active':''}" data-rtab="circuit">Circuit</button>
        ${race.status==='upcoming' ? `<button class="tab ${tab==='weather'?'active':''}" data-rtab="weather">Weather</button>` : ''}
      </div>
    `;
    if (tab === 'schedule') {
      body += `<div class="session-list">
        ${sessions.map((s, i) => `
          <div class="session-row">
            <div>
              <div class="session-name">${s.name}</div>
              <div style="font-size:11px;color:var(--text-subtle)">${fmtDate(s.at)}</div>
            </div>
            <div class="session-date">${fmtTime(s.at)}</div>
            <span class="badge ${s.at < new Date() ? 'badge-neutral' : 'badge-accent'}">${s.at < new Date() ? 'done' : relativeTime(s.at)}</span>
          </div>
        `).join('')}
      </div>
      <div class="row" style="margin-top:12px;gap:8px">
        <button class="btn-secondary" data-action="set-reminder" data-race="${race.id}">${state.reminders[race.id] ? '✓ Reminder set' : 'Set reminder'}</button>
        <button class="btn-ghost" data-action="share-race" data-race="${race.id}">Share schedule</button>
      </div>`;
    } else if (tab === 'results') {
      const results = RACE_RESULTS[race.id] ? RACE_RESULTS[race.id].results : null;
      if (results) {
        body += `<div style="overflow-x:auto"><table>
          <thead><tr><th>Pos</th><th>Driver</th><th class="numeric">Grid</th><th class="numeric">Time/Gap</th><th class="numeric">Pts</th></tr></thead>
          <tbody>
            ${results.map(r => {
              const drv = DRIVERS[r.code];
              const delta = r.startGrid - r.pos;
              return `<tr data-action="open-driver" data-driver="${r.code}">
                <td>${posBadge(r.pos)}</td>
                <td>${teamStrip(drv.team)}<strong>${drv.name.split(' ').pop()}</strong>${r.fastest ? ` <span class="badge badge-accent" style="font-size:10px">FL</span>` : ''}</td>
                <td class="numeric">${r.startGrid} ${delta!==0 ? `<span style="font-size:10px;color:${delta>0?'var(--success)':'var(--danger)'}">${delta>0?'↑':'↓'}${Math.abs(delta)}</span>` : ''}</td>
                <td class="numeric" style="color:var(--text-muted)">${r.gap}</td>
                <td class="numeric"><strong>${r.pts}</strong></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>`;
      } else {
        body += emptyState('No results yet', 'Results will appear here after the race finishes.');
      }
    } else if (tab === 'quali') {
      const q = RACE_RESULTS[race.id] ? RACE_RESULTS[race.id].qualifying : null;
      if (q) {
        body += `
          <div class="qual-grid head"><div>Pos</div><div>Q1</div><div>Q2</div><div>Q3</div></div>
          ${q.map(row => {
            const drv = DRIVERS[row.code];
            const eliminated = !row.q3;
            return `<div class="qual-grid" data-action="open-driver" data-driver="${row.code}" style="cursor:pointer">
              <div>${posBadge(row.pos)}</div>
              <div>${teamStrip(drv.team)}<strong>${drv.name.split(' ').pop()}</strong><div class="qual-time ${eliminated && !row.q2 ? 'elim':''}">${row.q1}</div></div>
              <div class="qual-time ${!row.q2?'elim':eliminated?'':''}">${row.q2 || '—'}</div>
              <div class="qual-time ${row.pos===1?'best':''} ${!row.q3?'elim':''}">${row.q3 || '—'}</div>
            </div>`;
          }).join('')}
        `;
      } else {
        body += emptyState('No qualifying yet', 'Qualifying results will appear after the session.');
      }
    } else if (tab === 'circuit') {
      body += `<div class="track-card" style="padding:0;border:none">
        <div class="track-svg-wrap">${trackSvg(race.circuit)}</div>
        <div class="detail-list">
          <div class="detail-row"><span class="k">Length</span><span class="v">${c.length} km</span></div>
          <div class="detail-row"><span class="k">Race laps</span><span class="v">${c.laps}</span></div>
          <div class="detail-row"><span class="k">Turns</span><span class="v">${c.turns}</span></div>
          <div class="detail-row"><span class="k">DRS zones</span><span class="v">${c.drsZones}</span></div>
          <div class="detail-row"><span class="k">Lap record</span><span class="v">${c.lapRecord}</span></div>
          <div class="detail-row"><span class="k">Record holder</span><span class="v">${c.recordHolder} (${c.recordYear})</span></div>
          <div class="detail-row"><span class="k">First GP</span><span class="v">${c.firstGp}</span></div>
        </div>
      </div>`;
    } else if (tab === 'weather') {
      if (weather) {
        body += `<div class="kpi-grid">
          <div class="kpi"><div class="kpi-label">Forecast</div><div class="kpi-value">${weather.temp}°C</div><div class="kpi-delta">${weather.condition}</div></div>
          <div class="kpi"><div class="kpi-label">Rain probability</div><div class="kpi-value">${weather.rainPct}%</div><div class="kpi-delta">Wind ${weather.wind} km/h</div></div>
          <div class="kpi"><div class="kpi-label">Humidity</div><div class="kpi-value">${weather.humid}%</div><div class="kpi-delta">Track temp est. ${weather.temp+10}°C</div></div>
          <div class="kpi"><div class="kpi-label">Tire strategy hint</div><div style="font-size:14px;margin-top:6px">${weather.rainPct > 50 ? 'Inter / wet possible' : 'Medium-hard 1-stop'}</div></div>
        </div>`;
      } else {
        body += emptyState('Forecast unavailable', 'Weather forecast will appear closer to the race weekend.');
      }
    }
    return body;
  }
  function rerender(){
    showModal(`
      <div class="modal-header">
        <div>
          <div class="modal-title">${race.name}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:2px">Round ${race.round} · ${c.short} · ${fmtDate(d(race.date))}</div>
        </div>
        <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div id="race-body">${bodyHtml()}</div>
    `);
    $('#close-modal').addEventListener('click', closeModal);
    $$('[data-rtab]').forEach(b => b.addEventListener('click', () => { tab = b.dataset.rtab; rerender(); }));
    bindActions($('.modal'));
  }
  rerender();
}

    <div class="modal-header">
      <div class="modal-title"><span class="team-strip" style="background:${team.color};height:18px;width:4px"></span>${team.name}</div>
      <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">2024 pts</div><div class="kpi-value">${standing.points}</div><div class="kpi-delta">P${CONSTRUCTORS_STANDINGS.findIndex(c=>c.team===teamKey)+1} in constructors</div></div>
      <div class="kpi"><div class="kpi-label">Wins</div><div class="kpi-value">${standing.wins}</div><div class="kpi-delta">${standing.poles} poles · ${standing.podiums} podiums</div></div>
    </div>
    <div class="card" style="padding:12px;margin-bottom:12px">
      <div class="caption" style="margin-bottom:8px">Technical</div>
      <div class="detail-list">
        <div class="detail-row"><span class="k">Engine supplier</span><span class="v">${team.engine}</span></div>
        <div class="detail-row"><span class="k">Team colour</span><span class="v" style="color:${team.color}">${team.color}</span></div>
      </div>
    </div>
    <div class="card" style="padding:0; overflow:hidden">
      <div style="padding:10px 12px; border-bottom:1px solid var(--border)"><span class="caption">Drivers</span></div>
      ${teamDrivers.map(c => {
        const drv = DRIVERS[c];
        const st = DRIVERS_STANDINGS.find(d => d.code === c);
        return `<div class="session-row" data-action="open-driver" data-driver="${c}">
          <div><div class="session-name">#${drv.num} ${drv.name}</div><div class="session-date">${drv.country} · ${st ? st.points + ' pts' : 'No 2024 entry'}</div></div>
          <span></span><span class="muted">›</span>
        </div>`;
      }).join('')}
    </div>
    <div class="row" style="margin-top:12px;gap:8px">
      <button class="btn-secondary" data-action="compare-with-team" data-team="${teamKey}">Compare team</button>
    </div>
  `);
  $('#close-modal').addEventListener('click', closeModal);
  bindActions($('.modal'));
}

function openCircuit(key){
  const c = CIRCUITS[key];
  showModal(`
    <div class="modal-header">
      <div>
        <div class="modal-title">${c.short}</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${c.name}</div>
      </div>
      <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="track-svg-wrap">${trackSvg(key)}</div>
    <div class="detail-list">
      <div class="detail-row"><span class="k">Country</span><span class="v">${c.country}</span></div>
      <div class="detail-row"><span class="k">Type</span><span class="v">${c.type}</span></div>
      <div class="detail-row"><span class="k">Length</span><span class="v">${c.length} km</span></div>
      <div class="detail-row"><span class="k">Race laps</span><span class="v">${c.laps}</span></div>
      <div class="detail-row"><span class="k">Turns</span><span class="v">${c.turns}</span></div>
      <div class="detail-row"><span class="k">DRS zones</span><span class="v">${c.drsZones}</span></div>
      <div class="detail-row"><span class="k">Lap record</span><span class="v">${c.lapRecord} · ${c.recordHolder} (${c.recordYear})</span></div>
      <div class="detail-row"><span class="k">First GP</span><span class="v">${c.firstGp}</span></div>
    </div>
  `);
  $('#close-modal').addEventListener('click', closeModal);
}

function trackSvg(key){
  // Stylized track shapes per circuit
  const paths = {
    bhr: 'M20,80 Q40,20 80,40 Q120,60 160,30 Q200,10 240,40 Q280,70 260,110 Q220,140 180,120 Q140,100 100,130 Q60,150 20,120 Z',
    jed: 'M10,60 L80,30 Q120,20 160,40 L240,50 Q280,60 270,100 Q230,130 180,120 L100,130 Q40,135 20,100 Z',
    alb: 'M30,90 Q50,40 100,50 Q160,55 200,30 Q260,40 270,90 Q260,140 200,135 Q120,140 70,130 Q20,120 30,90 Z',
    suz: 'M40,80 Q20,40 70,30 L130,50 Q180,30 220,60 Q260,90 240,130 Q190,150 140,130 Q90,150 50,130 Q20,110 40,80 Z',
    cot: 'M30,100 L70,30 Q100,20 130,50 L180,60 Q220,50 250,90 Q260,130 220,140 Q170,150 130,130 L80,140 Q20,140 30,100 Z',
    mex: 'M40,70 Q70,30 130,40 Q180,30 230,60 Q260,90 250,130 Q210,150 160,140 Q110,150 70,130 Q20,110 40,70 Z',
    spa: 'M20,90 Q40,30 100,40 Q140,30 190,60 L250,50 Q280,90 250,130 Q200,150 150,130 Q100,150 60,130 Q10,110 20,90 Z',
    mco: 'M40,90 L60,40 Q100,30 140,50 L180,40 Q220,60 220,90 Q200,130 160,120 Q120,130 80,120 Q40,110 40,90 Z',
    sin: 'M30,80 L80,40 Q130,30 170,60 L220,50 Q260,80 240,120 Q190,140 140,130 Q90,140 50,120 Q20,100 30,80 Z',
    yas: 'M30,70 Q70,30 130,40 Q190,30 240,70 Q270,110 240,140 Q190,150 140,135 Q80,150 40,130 Q10,100 30,70 Z',
  };
  const path = paths[key] || paths.bhr;
  const c = CIRCUITS[key];
  return `<svg viewBox="0 0 290 170" width="100%" height="160" style="display:block" aria-label="${c.short} circuit layout">
    <path d="${path}" fill="none" stroke="var(--text-subtle)" stroke-opacity="0.3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="80" r="4" fill="var(--accent)"/>
    <text x="30" y="75" font-size="10" font-family="ui-monospace,monospace" fill="var(--text-muted)">S/F</text>
  </svg>`;
}

function emptyState(title, desc){
  return `<div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <div class="empty-title">${title}</div>
    <div class="empty-desc">${desc}</div>
  </div>`;
}

/* =================== COMPARE =================== */
function openCompare(presetCode){
  let a = presetCode || 'VER';
  let b = a === 'VER' ? 'NOR' : 'VER';

  function rerender(){
    const dA = DRIVERS[a], dB = DRIVERS[b];
    const sA = DRIVERS_STANDINGS.find(d => d.code === a) || { points: 0, wins: 0, podiums: 0, poles: 0 };
    const sB = DRIVERS_STANDINGS.find(d => d.code === b) || { points: 0, wins: 0, podiums: 0, poles: 0 };
    const rows = [
      { label: '2024 pts', a: sA.points, b: sB.points },
      { label: '2024 wins', a: sA.wins, b: sB.wins },
      { label: '2024 pod.', a: sA.podiums, b: sB.podiums },
      { label: '2024 poles', a: sA.poles, b: sB.poles },
      { label: 'Career wins', a: dA.wins, b: dB.wins },
      { label: 'Career poles', a: dA.poles, b: dB.poles },
      { label: 'Career pod.', a: dA.podiums, b: dB.podiums },
      { label: 'Titles', a: dA.championships, b: dB.championships },
    ];
    showModal(`
      <div class="modal-header">
        <div class="modal-title">Head-to-head</div>
        <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="row" style="gap:8px;margin-bottom:16px">
        <select class="input" id="cmp-a">${Object.keys(DRIVERS).map(c => `<option value="${c}" ${c===a?'selected':''}>${DRIVERS[c].name}</option>`).join('')}</select>
        <span style="font-weight:600;color:var(--text-muted)">vs</span>
        <select class="input" id="cmp-b">${Object.keys(DRIVERS).map(c => `<option value="${c}" ${c===b?'selected':''}>${DRIVERS[c].name}</option>`).join('')}</select>
      </div>
      <div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-strong)">
        <div><div style="font-weight:600">${dA.name.split(' ').pop()}</div><div style="font-size:11px;color:var(--text-muted)">${TEAMS[dA.team].name}</div></div>
        <div><div style="font-weight:600;text-align:right">${dB.name.split(' ').pop()}</div><div style="font-size:11px;color:var(--text-muted);text-align:right">${TEAMS[dB.team].name}</div></div>
      </div>
      ${rows.map(r => {
        const aWin = r.a > r.b, bWin = r.b > r.a;
        return `<div class="compare-row">
          <div class="compare-val l ${aWin?'win':''}">${r.a}</div>
          <div class="compare-label">${r.label}</div>
          <div class="compare-val r ${bWin?'win':''}">${r.b}</div>
        </div>`;
      }).join('')}
    `);
    $('#close-modal').addEventListener('click', closeModal);
    $('#cmp-a').addEventListener('change', e => { a = e.target.value; rerender(); });
    $('#cmp-b').addEventListener('change', e => { b = e.target.value; rerender(); });
  }
  rerender();
}

/* =================== PREDICT =================== */
function openPredict(raceId){
  const race = CALENDAR_2024.find(r => r.id === raceId);
  const existing = state.predictions.find(p => p.raceId === raceId) || { p1:'', p2:'', p3:'' };
  const opts = Object.keys(DRIVERS).map(c => `<option value="${c}">${DRIVERS[c].name}</option>`).join('');
  showModal(`
    <div class="modal-header">
      <div>
        <div class="modal-title">Predict podium</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${race.name}</div>
      </div>
      <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div><label class="caption" style="display:block;margin-bottom:4px">P1</label><select class="input" id="pp1"><option value="">Select driver…</option>${opts}</select></div>
      <div><label class="caption" style="display:block;margin-bottom:4px">P2</label><select class="input" id="pp2"><option value="">Select driver…</option>${opts}</select></div>
      <div><label class="caption" style="display:block;margin-bottom:4px">P3</label><select class="input" id="pp3"><option value="">Select driver…</option>${opts}</select></div>
    </div>
    <div id="predict-err" style="color:var(--danger);font-size:12px;margin-top:8px;display:none"></div>
    <div class="row" style="margin-top:16px; gap:8px; justify-content:flex-end">
      <button class="btn-ghost" id="predict-cancel">Cancel</button>
      <button class="btn-primary" id="predict-save">Save prediction</button>
    </div>
  `);
  $('#pp1').value = existing.p1;
  $('#pp2').value = existing.p2;
  $('#pp3').value = existing.p3;
  $('#close-modal').addEventListener('click', closeModal);
  $('#predict-cancel').addEventListener('click', closeModal);
  $('#predict-save').addEventListener('click', () => {
    const p1 = $('#pp1').value, p2 = $('#pp2').value, p3 = $('#pp3').value;
    const err = $('#predict-err');
    if (!p1 || !p2 || !p3) { err.textContent = 'Pick three drivers.'; err.style.display='block'; return; }
    if (new Set([p1,p2,p3]).size !== 3) { err.textContent = 'Drivers must be unique.'; err.style.display='block'; return; }
    state.predictions = state.predictions.filter(p => p.raceId !== raceId);
    state.predictions.push({ raceId, p1, p2, p3 });
    toast('Prediction locked in', 'success');
    closeModal();
    render();
  });
}

/* =================== SCENARIO =================== */
function openScenario(){
  const upcoming = CALENDAR_2024.filter(r => r.status === 'upcoming');
  function calc(){
    const projected = DRIVERS_STANDINGS.map(d => ({ ...d, projected: d.points }));
    upcoming.forEach(r => {
      const adj = state.scenarioAdjustments[r.id];
      if (adj) {
        const winner = projected.find(p => p.code === adj);
        if (winner) winner.projected += 25;
      }
    });
    projected.sort((a,b) => b.projected - a.projected);
    return projected;
  }
  function rerender(){
    const projected = calc();
    const opts = `<option value="">— No prediction —</option>` + Object.keys(DRIVERS).map(c => `<option value="${c}">${DRIVERS[c].name}</option>`).join('');
    showModal(`
      <div class="modal-header">
        <div class="modal-title">What-if calculator</div>
        <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div style="font-size:12px;color:var(--text-muted); margin-bottom:12px">Assign hypothetical race winners (25 pts each). See projected final standings.</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
        ${upcoming.map(r => `
          <div class="row-between" style="padding:8px;border:1px solid var(--border);border-radius:var(--radius-sm)">
            <div>
              <div style="font-weight:500;font-size:13px">${r.name}</div>
              <div style="font-size:11px;color:var(--text-muted)">Round ${r.round}</div>
            </div>
            <select class="input scen-pick" data-race="${r.id}" style="width:auto;max-width:50%">${opts.replace(`value="${state.scenarioAdjustments[r.id]||''}"`, `value="${state.scenarioAdjustments[r.id]||''}" selected`)}</select>
          </div>
        `).join('')}
      </div>
      <div class="caption" style="margin-bottom:8px">Projected final top 5</div>
      <table>
        <thead><tr><th>#</th><th>Driver</th><th class="numeric">Now</th><th class="numeric">Proj.</th></tr></thead>
        <tbody>
          ${projected.slice(0,5).map((p,i) => `<tr>
            <td>${posBadge(i+1)}</td>
            <td>${teamStrip(DRIVERS[p.code].team)}<strong>${DRIVERS[p.code].name}</strong></td>
            <td class="numeric muted">${p.points}</td>
            <td class="numeric"><strong>${p.projected}</strong></td>
          </tr>`).join('')}
        </tbody>
      </table>
    `);
    $('#close-modal').addEventListener('click', closeModal);
    $$('.scen-pick').forEach(sel => sel.addEventListener('change', e => {
      const rid = e.target.dataset.race;
      const val = e.target.value;
      if (val) state.scenarioAdjustments[rid] = val;
      else delete state.scenarioAdjustments[rid];
      rerender();
    }));
  }
  rerender();
}

/* =================== REMINDERS =================== */
function openReminders(){
  const active = Object.keys(state.reminders);
  showModal(`
    <div class="modal-header">
      <div class="modal-title">Race reminders</div>
      <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    ${active.length === 0 ? emptyState('No reminders set', 'Tap "Set reminder" on any upcoming race to get notified before lights out.') :
      active.map(rid => {
        const r = CALENDAR_2024.find(x => x.id === rid);
        if (!r) return '';
        return `<div class="session-row">
          <div>
            <div class="session-name">${r.name}</div>
            <div class="session-date">${state.reminders[rid]} min before · ${fmtDate(d(r.date))}</div>
          </div>
          <span></span>
          <button class="btn-ghost" data-action="clear-reminder" data-race="${rid}" style="font-size:11px">Remove</button>
        </div>`;
      }).join('')
    }
  `);
  $('#close-modal').addEventListener('click', closeModal);
  bindActions($('.modal'));
}

function setReminder(raceId){
  const opts = [15, 60, 240, 1440];
  showModal(`
    <div class="modal-header">
      <div class="modal-title">Set reminder</div>
      <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px">When should we notify you before lights out?</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${opts.map(m => `<button class="btn-secondary" data-mins="${m}" style="justify-content:flex-start;padding:10px 12px">${m === 15 ? '15 minutes' : m === 60 ? '1 hour' : m === 240 ? '4 hours (race morning)' : '1 day'} before</button>`).join('')}
    </div>
  `);
  $('#close-modal').addEventListener('click', closeModal);
  $$('[data-mins]').forEach(b => b.addEventListener('click', () => {
    state.reminders[raceId] = parseInt(b.dataset.mins);
    toast('Reminder set', 'success');
    closeModal();
    render();
  }));
}

/* =================== ACTION BINDING =================== */
function bindActions(scope){
  $$('[data-action]', scope).forEach(el => {
    if (el._bound) return;
    el._bound = true;
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const a = el.dataset.action;
      const data = el.dataset;
      if (a === 'open-race') openRace(data.race);
      else if (a === 'open-driver') openDriver(data.driver);
      else if (a === 'open-team') openTeam(data.team);
      else if (a === 'open-circuit') openCircuit(data.circuit);
      else if (a === 'compare-with') { closeModal(); openCompare(data.driver); }
      else if (a === 'compare-with-team') { closeModal(); toast('Team comparison coming soon — try driver compare for now.', 'info'); }
      else if (a === 'set-reminder') setReminder(data.race);
      else if (a === 'clear-reminder') { delete state.reminders[data.race]; toast('Reminder removed', 'info'); openReminders(); }
      else if (a === 'predict') openPredict(data.race);
      else if (a === 'open-scenario') openScenario();
      else if (a === 'open-compare') openCompare();
      else if (a === 'open-reminders') openReminders();
      else if (a === 'open-filters') openFilters();
      else if (a === 'goto-stats') navigate('stats');
      else if (a === 'set-season') { state.season = parseInt(data.season); render(); }
      else if (a === 'refresh-live') { state.liveData = null; state.staleSeconds = 0; toast('Live timing refreshed', 'success'); render(); }
      else if (a === 'track-map') openCircuit(CALENDAR_2024.find(r=>r.id===data.race).circuit);
      else if (a === 'share-feed') toast(`Copied stat card: "${data.title}"`, 'success');
      else if (a === 'share-race') toast('Race schedule copied to clipboard', 'success');
      else if (a === 'share-driver') toast(`Stat card for ${DRIVERS[data.driver].name} ready to share`, 'success');
    });

    // Long-press preview
    if (el.dataset.action === 'open-driver') {
      el.addEventListener('mousedown', (e) => {
        state.pressTimer = setTimeout(() => {
          e.preventDefault();
          showDriverPreview(el.dataset.driver);
        }, 500);
      });
      ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev => el.addEventListener(ev, () => clearTimeout(state.pressTimer)));
      el.addEventListener('touchstart', (e) => {
        state.pressTimer = setTimeout(() => showDriverPreview(el.dataset.driver), 500);
      }, {passive: true});
    }
  });
}

function showDriverPreview(code){
  const drv = DRIVERS[code];
  const st = DRIVERS_STANDINGS.find(d => d.code === code);
  toast(`${drv.name} · #${drv.num} · ${TEAMS[drv.team].name} · ${st ? st.points + ' pts' : 'no entry'} · ${drv.wins} career wins`, 'info');
}

function openFilters(){
  showModal(`
    <div class="modal-header">
      <div class="modal-title">Filter results</div>
      <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div><label class="caption" style="display:block;margin-bottom:4px">Track type</label>
        <select class="input"><option>All circuits</option><option>Street circuits only</option><option>Permanent only</option></select>
      </div>
      <div><label class="caption" style="display:block;margin-bottom:4px">Weather</label>
        <select class="input"><option>All conditions</option><option>Dry</option><option>Wet</option><option>Mixed</option></select>
      </div>
      <div><label class="caption" style="display:block;margin-bottom:4px">Tire compound</label>
        <select class="input"><option>All</option><option>Soft</option><option>Medium</option><option>Hard</option><option>Inter/Wet</option></select>
      </div>
    </div>
    <div class="row" style="margin-top:16px;gap:8px;justify-content:flex-end">
      <button class="btn-ghost" id="filt-cancel">Cancel</button>
      <button class="btn-primary" id="filt-apply">Apply filter</button>
    </div>
  `);
  $('#close-modal').addEventListener('click', closeModal);
  $('#filt-cancel').addEventListener('click', closeModal);
  $('#filt-apply').addEventListener('click', () => { toast('Filters applied to results view', 'success'); closeModal(); });
}

/* =================== RENDER ROUTING =================== */
function render(){
  if (state.page === 'home') renderHome();
  else if (state.page === 'timeline') renderTimeline();
  else if (state.page === 'stats') renderStats();
  else if (state.page === 'feed') renderFeed();
  else if (state.page === 'more') renderMore();
}

/* =================== INIT =================== */
function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  render();
}

function init(){
  applyTheme();
  $('#theme-toggle').addEventListener('click', toggleTheme);
  $('#compare-btn').addEventListener('click', () => openCompare());
  $('#notif-btn').addEventListener('click', () => openReminders());
  $$('.nav-item').forEach(b => b.addEventListener('click', () => navigate(b.dataset.page)));
  render();
  // Countdown ticker
  setInterval(updateCountdown, 1000);
  // Stale data ticker (for live)
  setInterval(() => {
    state.staleSeconds++;
    if (state.page === 'home' && state.liveData) {
      const bar = $('.refresh-bar .muted');
      if (bar) bar.textContent = `Updated ${state.staleSeconds}s ago`;
    }
  }, 1000);
  toast('Welcome to F1 Fan Hub', 'success');
}

// Wait for auth gate to finish before init
function waitForGate(){
  if (document.getElementById('dn-auth-overlay')) {
    setTimeout(waitForGate, 200);
  } else {
    init();
  }
}
waitForGate();

})();
</script>
</body>
</html>
