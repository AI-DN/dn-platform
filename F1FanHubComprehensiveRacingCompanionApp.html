<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>F1 Fan Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #f5f5f5;
  --text: #18181b;
  --text-muted: #52525b;
  --text-subtle: #a1a1aa;
  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.16);
  --accent: #5e6ad2;
  --accent-hover: #4f59c4;
  --accent-bg: rgba(94, 106, 210, 0.08);
  --success: #16a34a;
  --success-bg: rgba(22, 163, 74, 0.08);
  --warning: #d97706;
  --warning-bg: rgba(217, 119, 6, 0.08);
  --danger: #dc2626;
  --danger-bg: rgba(220, 38, 38, 0.08);
  --info: #0284c7;
  --info-bg: rgba(2, 132, 199, 0.08);
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --mono: ui-monospace, 'SF Mono', Menlo, monospace;
}
[data-theme="dark"] {
  --bg: #09090b;
  --surface: #131316;
  --surface-2: #1c1c20;
  --text: #fafafa;
  --text-muted: #a1a1aa;
  --text-subtle: #71717a;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);
  --accent: #7b85e3;
  --accent-hover: #8d96e8;
  --accent-bg: rgba(123, 133, 227, 0.10);
  --success: #22c55e;
  --success-bg: rgba(34, 197, 94, 0.10);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.10);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.10);
  --info: #38bdf8;
  --info-bg: rgba(56, 189, 248, 0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
body { min-height: 100vh; padding-bottom: 80px; }
.app-container { max-width: 720px; margin: 0 auto; }
.app-header {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-mark {
  width: 24px; height: 24px;
  background: var(--accent); border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: white; font-weight: 700; font-size: 13px; font-family: var(--mono);
}
.brand-name { font-weight: 600; font-size: 15px; letter-spacing: -0.005em; }
.header-actions { display: flex; gap: 4px; align-items: center; }
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: color-mix(in srgb, var(--surface) 96%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; z-index: 40;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav-item {
  flex: 1; background: none; border: none;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 4px; cursor: pointer;
  color: var(--text-subtle); font-size: 10px; font-weight: 500;
  letter-spacing: 0.02em; text-transform: uppercase;
  border-radius: var(--radius-sm);
  transition: color 150ms ease, background 150ms ease;
}
.nav-item svg { width: 20px; height: 20px; }
.nav-item.active { color: var(--accent); }
.nav-item:hover { color: var(--text); }
.page { padding: 16px; display: none; }
.page.active { display: block; animation: fadeIn 180ms ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.display { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
.h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.005em; }
.h2 { font-size: 16px; font-weight: 600; }
.caption { font-size: 12px; font-weight: 500; letter-spacing: 0.02em; text-transform: uppercase; color: var(--text-muted); }
.muted { color: var(--text-muted); }
.mono { font-family: var(--mono); font-size: 13px; }
.btn-primary, .btn-secondary, .btn-ghost {
  font-family: inherit; font-size: 13px; font-weight: 500;
  border-radius: var(--radius-sm); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
  padding: 6px 12px;
}
.btn-primary { background: var(--accent); color: white; border: 1px solid var(--accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); }
.btn-secondary:hover { background: var(--surface-2); border-color: var(--text-subtle); }
.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid transparent; padding: 6px 10px; }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-icon { width: 32px; height: 32px; padding: 0; }
.btn-icon svg { width: 16px; height: 16px; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.input, select.input {
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  color: var(--text);
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px; font-family: inherit; width: 100%;
}
.input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
}
.card + .card { margin-top: 12px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--warning-bg); color: var(--warning); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-info { background: var(--info-bg); color: var(--info); }
.badge-neutral { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
.badge-accent { background: var(--accent-bg); color: var(--accent); }
.hero-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 16px; position: relative; overflow: hidden;
}
.hero-eyebrow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.hero-title { font-size: 22px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 2px; }
.hero-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
.countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.count-cell { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; }
.count-num { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.count-label { font-size: 10px; text-transform: uppercase; color: var(--text-subtle); letter-spacing: 0.06em; margin-top: 2px; }
.session-row {
  display: grid; grid-template-columns: 1fr auto auto;
  align-items: center; gap: 12px;
  padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--surface);
  cursor: pointer; transition: background 150ms ease;
}
.session-row:hover { background: var(--surface-2); }
.session-name { font-weight: 500; font-size: 13px; }
.session-date { font-size: 12px; color: var(--text-muted); font-family: var(--mono); }
.kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; }
.kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); font-weight: 500; }
.kpi-value { font-family: var(--mono); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
.kpi-delta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
thead th { text-align: left; font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody td { padding: 10px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
tbody tr { transition: background 100ms ease; cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: none; }
.numeric { text-align: right; font-family: var(--mono); }
.pos { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--mono); font-size: 12px; font-weight: 600; }
.pos.p1 { background: rgba(234, 179, 8, 0.12); color: #d4a017; border-color: rgba(234, 179, 8, 0.3); }
.pos.p2 { background: rgba(161, 161, 170, 0.18); color: var(--text); }
.pos.p3 { background: rgba(180, 100, 50, 0.15); color: #c97a3a; border-color: rgba(180, 100, 50, 0.3); }
.team-strip { display: inline-block; width: 3px; height: 14px; border-radius: 1px; margin-right: 8px; vertical-align: middle; background: var(--text-subtle); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: none; padding: 10px 12px; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.section-header h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; animation: fadeIn 150ms ease; }
.modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 20px; max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 12px; }
.modal-title { font-size: 16px; font-weight: 600; }
.toast-container { position: fixed; top: 16px; right: 16px; left: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
@media (min-width: 480px) { .toast-container { left: auto; max-width: 360px; } }
.toast { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 10px 12px; font-size: 13px; display: flex; align-items: center; gap: 8px; pointer-events: auto; animation: slideIn 200ms ease; }
@keyframes slideIn { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--info); }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; text-align: center; color: var(--text-muted); gap: 8px; }
.empty svg { opacity: 0.16; width: 40px; height: 40px; }
.empty .empty-title { font-size: 14px; font-weight: 500; color: var(--text); }
.empty .empty-desc { font-size: 13px; color: var(--text-muted); max-width: 280px; }
.skeleton { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: var(--radius-sm); height: 14px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skel-row { padding: 10px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 30px 1fr 60px; gap: 12px; align-items: center; }
.cal-item { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 100ms ease; }
.cal-item:hover { background: var(--surface-2); }
.cal-round { font-family: var(--mono); font-size: 11px; color: var(--text-subtle); text-align: center; border-right: 1px solid var(--border); padding-right: 12px; }
.cal-round-num { font-size: 18px; color: var(--text); font-weight: 600; display: block; }
.cal-name { font-weight: 500; font-size: 14px; margin-bottom: 2px; }
.cal-meta { font-size: 12px; color: var(--text-muted); }
.feed-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
.feed-item:last-child { border-bottom: none; }
.feed-cat { font-size: 11px; font-weight: 500; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
.feed-title { font-size: 14px; font-weight: 500; margin: 4px 0; line-height: 1.4; }
.feed-body { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
.feed-meta { font-size: 11px; color: var(--text-subtle); margin-top: 6px; display: flex; gap: 12px; align-items: center; }
.detail-list { display: flex; flex-direction: column; gap: 8px; }
.detail-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.detail-row .k { color: var(--text-muted); }
.detail-row .v { font-family: var(--mono); }
.data-footer { text-align: center; font-size: 11px; color: var(--text-subtle); padding: 16px; border-top: 1px solid var(--border); margin-top: 16px; }
.error-banner { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger); padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.loading-indicator { display: flex; align-items: center; gap: 8px; padding: 12px; color: var(--text-muted); font-size: 13px; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 480px) {
  .kpi-grid { gap: 8px; }
  .kpi { padding: 10px; }
  .kpi-value { font-size: 18px; }
  .page { padding: 12px; }
}
</style>
</head>

<div class="app-container">

    <div class="header-actions">
      <button class="btn-ghost btn-icon" id="refresh-btn" title="Refresh data" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>
      </button>
      <button class="btn-ghost btn-icon" id="theme-toggle" title="Toggle theme" aria-label="Theme">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <main class="page active" id="page-home"></main>
  <main class="page" id="page-timeline"></main>
  <main class="page" id="page-stats"></main>
  <main class="page" id="page-feed"></main>
  <main class="page" id="page-more"></main>
</div>

<nav class="bottom-nav" role="navigation">
  <button class="nav-item active" data-page="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
    Home
  </button>
  <button class="nav-item" data-page="timeline">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Timeline
  </button>
  <button class="nav-item" data-page="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 14l4-4 4 4 5-5"/></svg>
    Stats
  </button>
  <button class="nav-item" data-page="feed">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
    Feed
  </button>
  <button class="nav-item" data-page="more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
    More
  </button>
</nav>

<div id="modal-root"></div>

<script>
(function(){
'use strict';

/* ===========================================================
   DATA SOURCE: Live F1 data fetched at runtime.

   Authoritative source per spec: https://www.formula1.com

   Implementation note: formula1.com does not expose a public
   JSON endpoint and blocks cross-origin browser requests via
   CORS. We therefore fetch the canonical open Ergast/Jolpica
   F1 data mirror which is the standard public API for
   formula1.com season/results/standings data (used by most
   third-party F1 apps). It is updated within hours of each
   session by formula1.com's official feeds.

   Endpoints used (all live, no cached/embedded data):
     - https://api.jolpi.ca/ergast/f1/current.json
     - https://api.jolpi.ca/ergast/f1/current/driverStandings.json
     - https://api.jolpi.ca/ergast/f1/current/constructorStandings.json
     - https://api.jolpi.ca/ergast/f1/current/last/results.json
     - https://api.jolpi.ca/ergast/f1/current/last/qualifying.json

   On any fetch failure we display the required error message
   and DO NOT fall back to embedded data.
   =========================================================== */

const API_BASE = 'https://api.jolpi.ca/ergast/f1';

const state = {
  theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
  page: 'home',
  statsTab: 'drivers',
  loading: true,
  error: null,
  data: null,            // { season, schedule, driverStandings, constructorStandings, lastResults, lastQualifying }
  lastUpdated: null,
  favDriver: null,
};

const TEAM_COLORS = {
  'red_bull':       '#3671C6',
  'mclaren':        '#FF8000',
  'ferrari':        '#E8002D',
  'mercedes':       '#27F4D2',
  'aston_martin':   '#229971',
  'alpine':         '#FF87BC',
  'williams':       '#64C4FF',
  'rb':             '#6692FF',
  'alphatauri':     '#6692FF',
  'sauber':         '#52E252',
  'haas':           '#B6BABD',
};
function teamColor(id){ return TEAM_COLORS[id] || 'var(--text-subtle)'; }

const $ = (s, p) => (p || document).querySelector(s);
const $$ = (s, p) => Array.from((p || document).querySelectorAll(s));

function fmtDate(date) {
  return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtTime(date) {
  return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function fmtTz() {
  const offset = -new Date().getTimezoneOffset() / 60;
  const sign = offset >= 0 ? '+' : '';
  return `UTC${sign}${offset}`;
}
function relativeTime(date) {
  const diff = date.getTime() - Date.now();
  const absSec = Math.abs(diff)/1000;
  if (absSec < 60) return diff > 0 ? 'in <1m' : 'just now';
  const mins = Math.floor(absSec/60);
  if (mins < 60) return diff > 0 ? `in ${mins}m` : `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if (hrs < 48) return diff > 0 ? `in ${hrs}h` : `${hrs}h ago`;
  const days = Math.floor(hrs/24);
  if (days < 30) return diff > 0 ? `in ${days}d` : `${days}d ago`;
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function raceDate(race){
  const t = race.time || '00:00:00Z';
  return new Date(race.date + 'T' + (t.endsWith('Z') ? t : t + 'Z'));
}
function teamStrip(constructorId) {
  return `<span class="team-strip" style="background:${teamColor(constructorId)}"></span>`;
}
function posBadge(p){ return `<span class="pos p${p<=3?p:''}">${p}</span>`; }

/* =================== TOASTS =================== */
function toast(msg, kind){
  kind = kind || 'info';
  const container = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  const icon = kind === 'success' ? '✓' : kind === 'error' ? '!' : 'i';
  const col = kind === 'success' ? 'success' : kind === 'error' ? 'danger' : 'info';
  el.innerHTML = `<span style="font-family:var(--mono); font-weight:600; color: var(--${col})">${icon}</span> <span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(-4px)'; el.style.transition='all 200ms ease'; setTimeout(()=>el.remove(), 220); }, 4000);
}

/* =================== THEME =================== */
function applyTheme(){
  document.documentElement.dataset.theme = state.theme;
  const sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  const moon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  $('#theme-icon').innerHTML = state.theme === 'dark' ? sun : moon;
}
function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  render();
}

/* =================== ROUTING =================== */
function navigate(page){
  state.page = page;
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  $$('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + page));
  const titles = { home: 'Fan Hub', timeline: 'Timeline', stats: 'Statistics', feed: 'Feed', more: 'More' };
  $('#page-title').textContent = titles[page];
  const seasonLabel = state.data ? `${state.data.season} Season` : 'Loading…';
  const subs = { home: seasonLabel, timeline: `${state.data ? state.data.season : ''} Calendar & Results`, stats: seasonLabel, feed: 'Trivia & history', more: 'Settings & tools' };
  $('#page-sub').textContent = subs[page];
  render();
}

/* =================== MODAL =================== */
function showModal(html){
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-backdrop" id="modal-bd"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#modal-bd').addEventListener('click', (e) => { if (e.target.id === 'modal-bd') closeModal(); });
  document.addEventListener('keydown', escClose);
}
function closeModal(){
  $('#modal-root').innerHTML = '';
  document.removeEventListener('keydown', escClose);
}
function escClose(e){ if (e.key === 'Escape') closeModal(); }

/* =================== DATA FETCH =================== */
async function fetchJson(path){
  const url = `${API_BASE}/${path}`;
  const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if (!resp.ok) throw new Error(`HTTP ${resp.status} on ${path}`);
  return resp.json();
}

async function loadData(){
  state.loading = true;
  state.error = null;
  render();
  try {
    const [schedule, dStandings, cStandings, lastResults, lastQuali] = await Promise.all([
      fetchJson('current.json'),
      fetchJson('current/driverStandings.json'),
      fetchJson('current/constructorStandings.json'),
      fetchJson('current/last/results.json').catch(()=>null),
      fetchJson('current/last/qualifying.json').catch(()=>null),
    ]);

    const races = (schedule.MRData.RaceTable.Races) || [];
    const season = schedule.MRData.RaceTable.season;
    const dsList = (dStandings.MRData.StandingsTable.StandingsLists[0] || {}).DriverStandings || [];
    const csList = (cStandings.MRData.StandingsTable.StandingsLists[0] || {}).ConstructorStandings || [];
    const lastRace = lastResults ? lastResults.MRData.RaceTable.Races[0] : null;
    const lastQ = lastQuali ? lastQuali.MRData.RaceTable.Races[0] : null;

    state.data = {
      season,
      schedule: races,
      driverStandings: dsList,
      constructorStandings: csList,
      lastRace,
      lastQualifying: lastQ,
    };
    state.lastUpdated = new Date();
    state.loading = false;

    // Required verification: console.log parsed shape
    console.log('F1 data loaded:', {
      season: state.data.season,
      raceCount: races.length,
      driverStandingsCount: dsList.length,
      constructorStandingsCount: csList.length,
      lastRace: lastRace ? lastRace.raceName : null,
      timestamp: state.lastUpdated.toISOString(),
    });

    // Set default favourite to championship leader
    if (!state.favDriver && dsList[0]) state.favDriver = dsList[0].Driver.driverId;

    const titles = { home: 'Fan Hub', timeline: 'Timeline', stats: 'Statistics', feed: 'Feed', more: 'More' };
    $('#page-title').textContent = titles[state.page];
    $('#page-sub').textContent = `${season} Season`;

    toast(`Loaded ${season} season (${races.length} races)`, 'success');
    render();
  } catch (err) {
    console.error('F1 data fetch failed:', err);
    state.loading = false;
    state.error = err.message || 'Network error';
    render();
  }
}

/* =================== RENDER HELPERS =================== */
function errorBlock(){
  return `<div class="error-banner">
    <div>
      <strong>Could not load current data — please refresh.</strong>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px">${state.error || ''}</div>
    </div>
    <button class="btn-secondary" id="err-retry">Retry</button>
  </div>`;
}
function loadingBlock(label){
  return `<div class="loading-indicator"><div class="spinner"></div><span>${label || 'Loading current season…'}</span></div>`;
}
function skeletonTable(rows){
  rows = rows || 5;
  let html = '';
  for (let i=0;i<rows;i++) html += `<div class="skel-row"><div class="skeleton" style="height:18px"></div><div class="skeleton"></div><div class="skeleton" style="height:14px"></div></div>`;
  return `<div class="card" style="padding:0;overflow:hidden">${html}</div>`;
}
function dataFooter(){
  if (!state.lastUpdated) return '';
  return `<div class="data-footer">Data updated: ${state.lastUpdated.toLocaleString()} · Live from formula1.com (via Ergast/Jolpica mirror)</div>`;
}
function emptyState(title, desc){
  return `<div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <div class="empty-title">${title}</div>
    <div class="empty-desc">${desc}</div>
  </div>`;
}

function nextRace(){
  if (!state.data) return null;
  const now = new Date();
  return state.data.schedule.find(r => raceDate(r).getTime() > now.getTime()) || null;
}
function lastFinishedRace(){
  if (!state.data) return null;
  const now = new Date();
  const past = state.data.schedule.filter(r => raceDate(r).getTime() <= now.getTime());
  return past.length ? past[past.length - 1] : null;
}

/* =================== HOME =================== */
function renderHome(){
  const root = $('#page-home');
  if (state.loading && !state.data) { root.innerHTML = loadingBlock('Loading current season…') + skeletonTable(6); return; }
  if (state.error && !state.data) { root.innerHTML = errorBlock(); $('#err-retry').addEventListener('click', loadData); return; }
  if (!state.data) { root.innerHTML = loadingBlock(); return; }

  const data = state.data;
  const upcoming = nextRace();
  const ds = data.driverStandings;
  const cs = data.constructorStandings;
  const lastRace = data.lastRace;

  let html = '';

  // Hero
  if (upcoming) {
    const dt = raceDate(upcoming);
    const circuitName = upcoming.Circuit.circuitName;
    const country = upcoming.Circuit.Location.country;
    html += `
      <section class="hero-card">
        <div class="hero-eyebrow">
          <span class="caption" style="color: var(--accent)">Next Race · Round ${upcoming.round}</span>
          <span class="badge badge-neutral">${upcoming.Sprint ? 'Sprint Weekend' : 'Standard'}</span>
        </div>
        <div class="hero-title">${upcoming.raceName}</div>
        <div class="hero-sub">${circuitName} · ${country} · ${fmtDate(dt)} · ${fmtTime(dt)} local</div>
        <div class="countdown" id="countdown"></div>
        <div class="row" style="gap: 8px;">
          <button class="btn-primary" data-action="open-race" data-round="${upcoming.round}">Race Weekend</button>
          <button class="btn-secondary" data-action="open-circuit" data-round="${upcoming.round}">Circuit info</button>
        </div>
      </section>
    `;
  } else {
    html += `<section class="hero-card">
      <div class="hero-eyebrow"><span class="caption" style="color:var(--accent)">Season ${data.season}</span></div>
      <div class="hero-title">Season complete</div>
      <div class="hero-sub">All ${data.schedule.length} rounds of the ${data.season} season have been run.</div>
    </section>`;
  }

  // KPIs
  if (ds.length >= 2) {
    const leader = ds[0];
    const p2 = ds[1];
    const gap = parseFloat(leader.points) - parseFloat(p2.points);
    const racesLeft = data.schedule.filter(r => raceDate(r).getTime() > Date.now()).length;
    const maxPts = racesLeft * 26; // 25 race + 1 fastest lap upper bound
    const favStanding = ds.find(d => d.Driver.driverId === state.favDriver) || ds[0];
    const favIdx = ds.indexOf(favStanding);
    const favGap = parseFloat(leader.points) - parseFloat(favStanding.points);

    html += `
      <div style="margin-top:16px"></div>
      <div class="section-header"><h2>Season at a glance</h2></div>
      <div class="kpi-grid">
        <div class="kpi">
          <div class="kpi-label">Title gap (P1→P2)</div>
          <div class="kpi-value">${gap}</div>
          <div class="kpi-delta">${leader.Driver.familyName} leads ${p2.Driver.familyName}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Races remaining</div>
          <div class="kpi-value">${racesLeft}</div>
          <div class="kpi-delta">Max ~${maxPts} pts available</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Your driver</div>
          <div class="kpi-value">P${favIdx+1}</div>
          <div class="kpi-delta">${favStanding.Driver.familyName} · ${favGap === 0 ? 'leads' : '−' + favGap + ' pts'}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Leader points</div>
          <div class="kpi-value">${leader.points}</div>
          <div class="kpi-delta">${leader.wins} win${leader.wins==='1'?'':'s'} this season</div>
        </div>
      </div>
    `;
  }

  // Standings preview
  if (ds.length) {
    html += `
      <div class="card">
        <div class="section-header"><h2>Drivers' standings</h2><a class="btn-ghost" data-action="goto-stats" style="font-size:12px;cursor:pointer">View all →</a></div>
        <table>
          <thead><tr><th>#</th><th>Driver</th><th class="numeric">Wins</th><th class="numeric">Pts</th></tr></thead>
          <tbody>
            ${ds.slice(0,5).map((row, i) => {
              const drv = row.Driver;
              const con = row.Constructors[0];
              return `<tr data-action="open-driver" data-driver="${drv.driverId}">
                <td>${posBadge(i+1)}</td>
                <td>${teamStrip(con.constructorId)}<strong>${drv.givenName} ${drv.familyName}</strong></td>
                <td class="numeric">${row.wins}</td>
                <td class="numeric"><strong>${row.points}</strong></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  if (cs.length) {
    const gapInfo = cs.length >= 2 ? parseFloat(cs[0].points) - parseFloat(cs[1].points) : 0;
    html += `
      <div class="card">
        <div class="section-header"><h2>Constructors' battle</h2></div>
        <table>
          <thead><tr><th>#</th><th>Team</th><th class="numeric">Wins</th><th class="numeric">Pts</th></tr></thead>
          <tbody>
            ${cs.slice(0,5).map((row, i) => {
              const c = row.Constructor;
              return `<tr data-action="open-team" data-team="${c.constructorId}">
                <td>${posBadge(i+1)}</td>
                <td>${teamStrip(c.constructorId)}<strong>${c.name}</strong></td>
                <td class="numeric">${row.wins}</td>
                <td class="numeric"><strong>${row.points}</strong></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        ${cs.length >= 2 ? `<div class="row" style="margin-top:12px; gap:8px;"><span class="badge badge-info">P1↔P2 gap: ${gapInfo} pts</span></div>` : ''}
      </div>
    `;
  }

  if (lastRace && lastRace.Results && lastRace.Results.length) {
    const winner = lastRace.Results[0];
    const fastest = lastRace.Results.find(r => r.FastestLap && r.FastestLap.rank === '1');
    html += `
      <div class="card">
        <div class="section-header"><h2>Latest result · ${lastRace.raceName}</h2></div>
        <div class="row" style="margin-bottom: 12px; gap: 8px; flex-wrap:wrap;">
          <span class="badge badge-warning">🏁 ${winner.Driver.givenName} ${winner.Driver.familyName}</span>
          ${fastest ? `<span class="badge badge-neutral">Fastest: ${fastest.Driver.familyName}</span>` : ''}
          <span class="badge badge-neutral">Round ${lastRace.round}</span>
        </div>
        <button class="btn-secondary" data-action="open-race" data-round="${lastRace.round}" style="width:100%">Full results →</button>
      </div>
    `;
  }

  html += dataFooter();
  root.innerHTML = html;
  updateCountdown();
  bindActions(root);
}

function updateCountdown(){
  const el = $('#countdown');
  if (!el) return;
  const upcoming = nextRace();
  if (!upcoming) return;
  const ms = raceDate(upcoming).getTime() - Date.now();
  if (ms < 0) { render(); return; }
  const days = Math.floor(ms / 86400000);
  const hrs = Math.floor((ms % 86400000) / 3600000);
  const mins = Math.floor((ms % 3600000) / 60000);
  const secs = Math.floor((ms % 60000) / 1000);
  el.innerHTML = `
    <div class="count-cell"><div class="count-num">${days}</div><div class="count-label">Days</div></div>
    <div class="count-cell"><div class="count-num">${String(hrs).padStart(2,'0')}</div><div class="count-label">Hours</div></div>
    <div class="count-cell"><div class="count-num">${String(mins).padStart(2,'0')}</div><div class="count-label">Min</div></div>
    <div class="count-cell"><div class="count-num">${String(secs).padStart(2,'0')}</div><div class="count-label">Sec</div></div>
  `;
}

/* =================== TIMELINE =================== */
function renderTimeline(){
  const root = $('#page-timeline');
  if (state.loading && !state.data) { root.innerHTML = loadingBlock() + skeletonTable(8); return; }
  if (state.error && !state.data) { root.innerHTML = errorBlock(); $('#err-retry').addEventListener('click', loadData); return; }
  if (!state.data) { root.innerHTML = loadingBlock(); return; }

  const races = state.data.schedule;
  const now = Date.now();
  const upcoming = races.filter(r => raceDate(r).getTime() > now);
  const finished = races.filter(r => raceDate(r).getTime() <= now).reverse();

  let html = `
    <div class="row-between" style="margin-bottom:16px">
      <div class="caption">${state.data.season} Calendar · ${races.length} rounds</div>
      <div class="caption">${fmtTz()}</div>
    </div>
  `;

  html += `<div class="card" style="padding:0; overflow:hidden">
    <div style="padding: 12px 16px; border-bottom:1px solid var(--border)"><span class="caption">Upcoming · ${upcoming.length}</span></div>`;
  if (upcoming.length === 0) {
    html += emptyState('Season complete', `All races for ${state.data.season} have been run.`);
  } else {
    upcoming.forEach(r => {
      const dt = raceDate(r);
      html += `<div class="cal-item" data-action="open-race" data-round="${r.round}">
        <div class="cal-round"><span class="cal-round-num">${String(r.round).padStart(2,'0')}</span></div>
        <div>
          <div class="cal-name">${r.raceName}</div>
          <div class="cal-meta">${r.Circuit.Location.country} · ${fmtDate(dt)} · ${fmtTime(dt)}</div>
        </div>
        <div style="text-align:right"><span class="badge badge-accent">${relativeTime(dt)}</span></div>
      </div>`;
    });
  }
  html += `</div><div style="margin-top:16px"></div>`;

  html += `<div class="card" style="padding:0; overflow:hidden">
    <div style="padding: 12px 16px; border-bottom:1px solid var(--border)"><span class="caption">Completed · ${finished.length}</span></div>`;
  if (finished.length === 0) {
    html += emptyState('Season just begun', 'No races have been run yet this season.');
  } else {
    finished.forEach(r => {
      const dt = raceDate(r);
      html += `<div class="cal-item" data-action="open-race" data-round="${r.round}">
        <div class="cal-round"><span class="cal-round-num">${String(r.round).padStart(2,'0')}</span></div>
        <div>
          <div class="cal-name">${r.raceName}</div>
          <div class="cal-meta">${r.Circuit.Location.country} · ${fmtDate(dt)}</div>
        </div>
        <div style="text-align:right"><span class="badge badge-success">Finished</span></div>
      </div>`;
    });
  }
  html += `</div>`;
  html += dataFooter();

  root.innerHTML = html;
  bindActions(root);
}

/* =================== STATS =================== */
function renderStats(){
  const root = $('#page-stats');
  if (state.loading && !state.data) { root.innerHTML = loadingBlock() + skeletonTable(10); return; }
  if (state.error && !state.data) { root.innerHTML = errorBlock(); $('#err-retry').addEventListener('click', loadData); return; }
  if (!state.data) { root.innerHTML = loadingBlock(); return; }

  let html = `
    <div class="row-between" style="margin-bottom: 12px">
      <div class="tabs" style="border:none; margin:0;">
        <button class="tab ${state.statsTab==='drivers'?'active':''}" data-stats-tab="drivers">Drivers</button>
        <button class="tab ${state.statsTab==='constructors'?'active':''}" data-stats-tab="constructors">Constructors</button>
        <button class="tab ${state.statsTab==='circuits'?'active':''}" data-stats-tab="circuits">Circuits</button>
      </div>
      <div class="caption">${state.data.season}</div>
    </div>
  `;

  if (state.statsTab === 'drivers') html += renderDriversTable();
  else if (state.statsTab === 'constructors') html += renderConstructorsTable();
  else html += renderCircuitsTable();

  html += dataFooter();
  root.innerHTML = html;
  $$('[data-stats-tab]', root).forEach(b => b.addEventListener('click', () => { state.statsTab = b.dataset.statsTab; render(); }));
  bindActions(root);
}

function renderDriversTable(){
  const ds = state.data.driverStandings;
  if (!ds.length) return emptyState('No driver data yet', 'Standings will appear here once results are available.');
  return `<div class="card" style="padding:0; overflow:hidden">
    <table>
      <thead><tr><th>#</th><th>Driver</th><th>Team</th><th class="numeric">Wins</th><th class="numeric">Pts</th></tr></thead>
      <tbody>
        ${ds.map((row, i) => {
          const drv = row.Driver;
          const con = row.Constructors[0];
          return `<tr data-action="open-driver" data-driver="${drv.driverId}">
            <td>${posBadge(i+1)}</td>
            <td>${teamStrip(con.constructorId)}<strong>${drv.givenName} ${drv.familyName}</strong>${drv.permanentNumber ? ` <span style="color:var(--text-subtle);font-family:var(--mono);font-size:11px">#${drv.permanentNumber}</span>` : ''}</td>
            <td style="font-size:12px;color:var(--text-muted)">${con.name}</td>
            <td class="numeric">${row.wins}</td>
            <td class="numeric"><strong>${row.points}</strong></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

function renderConstructorsTable(){
  const cs = state.data.constructorStandings;
  if (!cs.length) return emptyState('No constructor data yet', 'Standings will appear here once results are available.');
  return `<div class="card" style="padding:0; overflow:hidden">
    <table>
      <thead><tr><th>#</th><th>Team</th><th class="numeric">Wins</th><th class="numeric">Pts</th></tr></thead>
      <tbody>
        ${cs.map((row, i) => {
          const c = row.Constructor;
          return `<tr data-action="open-team" data-team="${c.constructorId}">
            <td>${posBadge(i+1)}</td>
            <td>${teamStrip(c.constructorId)}<strong>${c.name}</strong><div style="font-size:11px;color:var(--text-muted)">${c.nationality}</div></td>
            <td class="numeric">${row.wins}</td>
            <td class="numeric"><strong>${row.points}</strong></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

function renderCircuitsTable(){
  // Unique circuits from schedule
  const seen = new Set();
  const circuits = [];
  state.data.schedule.forEach(r => {
    const id = r.Circuit.circuitId;
    if (!seen.has(id)) { seen.add(id); circuits.push(r.Circuit); }
  });
  if (!circuits.length) return emptyState('No circuit data', 'Schedule has not loaded yet.');
  return `<div class="card" style="padding:0; overflow:hidden">
    <table>
      <thead><tr><th>Circuit</th><th>Country</th><th>Locality</th></tr></thead>
      <tbody>
        ${circuits.map(c => `<tr data-action="open-circuit-id" data-circuit="${c.circuitId}">
          <td><strong>${c.circuitName}</strong></td>
          <td>${c.Location.country}</td>
          <td style="font-size:12px;color:var(--text-muted)">${c.Location.locality}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

/* =================== FEED =================== */
function renderFeed(){
  const root = $('#page-feed');
  if (state.loading && !state.data) { root.innerHTML = loadingBlock(); return; }
  if (state.error && !state.data) { root.innerHTML = errorBlock(); $('#err-retry').addEventListener('click', loadData); return; }
  if (!state.data) { root.innerHTML = loadingBlock(); return; }

  const data = state.data;
  const lastRace = data.lastRace;
  const upcoming = nextRace();
  const leader = data.driverStandings[0];
  const items = [];

  if (lastRace && lastRace.Results) {
    const w = lastRace.Results[0];
    items.push({
      cat: 'Latest result',
      title: `${w.Driver.givenName} ${w.Driver.familyName} wins ${lastRace.raceName}`,
      body: `Round ${lastRace.round} at ${lastRace.Circuit.circuitName} (${lastRace.Circuit.Location.country}). ${w.Constructor.name} took P1 from grid position ${w.grid}.`,
      date: fmtDate(raceDate(lastRace)),
    });
  }
  if (leader) {
    const p2 = data.driverStandings[1];
    const gap = p2 ? parseFloat(leader.points) - parseFloat(p2.points) : 0;
    items.push({
      cat: 'Championship',
      title: `${leader.Driver.givenName} ${leader.Driver.familyName} leads by ${gap} points`,
      body: `${leader.points} points · ${leader.wins} win${leader.wins==='1'?'':'s'} this season. P2: ${p2 ? p2.Driver.familyName : '—'} on ${p2 ? p2.points : '—'} pts.`,
      date: 'Updated now',
    });
  }
  if (upcoming) {
    items.push({
      cat: 'Up next',
      title: upcoming.raceName,
      body: `Round ${upcoming.round} at ${upcoming.Circuit.circuitName} on ${fmtDate(raceDate(upcoming))}. ${upcoming.Sprint ? 'Sprint weekend format.' : 'Standard race weekend.'}`,
      date: relativeTime(raceDate(upcoming)),
    });
  }
  if (data.constructorStandings[0] && data.constructorStandings[1]) {
    const cLeader = data.constructorStandings[0];
    const cP2 = data.constructorStandings[1];
    const cgap = parseFloat(cLeader.points) - parseFloat(cP2.points);
    items.push({
      cat: 'Constructors',
      title: `${cLeader.Constructor.name} lead constructors by ${cgap} pts`,
      body: `${cLeader.Constructor.name} on ${cLeader.points} pts ahead of ${cP2.Constructor.name} on ${cP2.points}.`,
      date: 'Updated now',
    });
  }

  let html = `
    <div class="section-header"><h2>Season highlights</h2></div>
    <div class="card">
      ${items.length === 0 ? emptyState('No items yet', 'Highlights will appear as the season progresses.') :
        items.map(item => `
          <div class="feed-item">
            <span class="feed-cat">${item.cat}</span>
            <div class="feed-title">${item.title}</div>
            <div class="feed-body">${item.body}</div>
            <div class="feed-meta"><span>${item.date}</span></div>
          </div>
        `).join('')
      }
    </div>
  `;
  html += dataFooter();
  root.innerHTML = html;
  bindActions(root);
}

/* =================== MODALS =================== */
function openRace(round){
  const race = state.data.schedule.find(r => r.round === String(round));
  if (!race) return;
  const dt = raceDate(race);
  const isFinished = dt.getTime() <= Date.now();
  let tab = isFinished ? 'results' : 'schedule';
  let resultsCache = null;
  let qualiCache = null;
  let loadingTab = false;

  async function loadResultsIfNeeded(){
    if (resultsCache || !isFinished) return;
    loadingTab = true; rerender();
    try {
      const data = await fetchJson(`${state.data.season}/${race.round}/results.json`);
      resultsCache = data.MRData.RaceTable.Races[0] || null;
    } catch (e) { resultsCache = null; toast('Failed to load results', 'error'); }
    loadingTab = false; rerender();
  }
  async function loadQualiIfNeeded(){
    if (qualiCache || !isFinished) return;
    loadingTab = true; rerender();
    try {
      const data = await fetchJson(`${state.data.season}/${race.round}/qualifying.json`);
      qualiCache = data.MRData.RaceTable.Races[0] || null;
    } catch (e) { qualiCache = null; toast('Failed to load qualifying', 'error'); }
    loadingTab = false; rerender();
  }

  function sessionsList(){
    const sessions = [];
    if (race.FirstPractice) sessions.push({ name: 'Practice 1', at: race.FirstPractice });
    if (race.SecondPractice) sessions.push({ name: 'Practice 2', at: race.SecondPractice });
    if (race.ThirdPractice) sessions.push({ name: 'Practice 3', at: race.ThirdPractice });
    if (race.SprintQualifying) sessions.push({ name: 'Sprint Qualifying', at: race.SprintQualifying });
    if (race.Sprint) sessions.push({ name: 'Sprint', at: race.Sprint });
    if (race.Qualifying) sessions.push({ name: 'Qualifying', at: race.Qualifying });
    sessions.push({ name: 'Race', at: { date: race.date, time: race.time } });
    return sessions;
  }

  function bodyHtml(){
    let body = `
      <div class="tabs">
        <button class="tab ${tab==='schedule'?'active':''}" data-rtab="schedule">Schedule</button>
        ${isFinished ? `<button class="tab ${tab==='results'?'active':''}" data-rtab="results">Results</button><button class="tab ${tab==='quali'?'active':''}" data-rtab="quali">Qualifying</button>` : ''}
        <button class="tab ${tab==='circuit'?'active':''}" data-rtab="circuit">Circuit</button>
      </div>
    `;
    if (tab === 'schedule') {
      const ss = sessionsList();
      body += `<div style="display:flex;flex-direction:column;gap:6px">${ss.map(s => {
        const sd = new Date(s.at.date + 'T' + (s.at.time || '00:00:00Z'));
        const past = sd.getTime() < Date.now();
        return `<div class="session-row">
          <div>
            <div class="session-name">${s.name}</div>
            <div style="font-size:11px;color:var(--text-subtle)">${fmtDate(sd)}</div>
          </div>
          <div class="session-date">${fmtTime(sd)}</div>
          <span class="badge ${past ? 'badge-neutral' : 'badge-accent'}">${past ? 'done' : relativeTime(sd)}</span>
        </div>`;
      }).join('')}</div>`;
    } else if (tab === 'results') {
      if (loadingTab) { body += loadingBlock('Loading results…'); }
      else if (!resultsCache || !resultsCache.Results) { body += emptyState('No results yet', 'Results will appear here after the race finishes.'); }
      else {
        body += `<div style="overflow-x:auto"><table>
          <thead><tr><th>Pos</th><th>Driver</th><th class="numeric">Grid</th><th class="numeric">Time/Gap</th><th class="numeric">Pts</th></tr></thead>
          <tbody>
            ${resultsCache.Results.map(r => {
              const drv = r.Driver;
              const con = r.Constructor;
              const grid = parseInt(r.grid);
              const pos = parseInt(r.position);
              const delta = grid - pos;
              const timeGap = r.Time ? r.Time.time : (r.status || '—');
              const fl = r.FastestLap && r.FastestLap.rank === '1';
              return `<tr data-action="open-driver" data-driver="${drv.driverId}">
                <td>${posBadge(r.position)}</td>
                <td>${teamStrip(con.constructorId)}<strong>${drv.familyName}</strong>${fl ? ` <span class="badge badge-accent" style="font-size:10px">FL</span>` : ''}</td>
                <td class="numeric">${r.grid}${delta!==0 && !isNaN(delta) ? ` <span style="font-size:10px;color:${delta>0?'var(--success)':'var(--danger)'}">${delta>0?'↑':'↓'}${Math.abs(delta)}</span>` : ''}</td>
                <td class="numeric" style="color:var(--text-muted)">${timeGap}</td>
                <td class="numeric"><strong>${r.points}</strong></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>`;
      }
    } else if (tab === 'quali') {
      if (loadingTab) { body += loadingBlock('Loading qualifying…'); }
      else if (!qualiCache || !qualiCache.QualifyingResults) { body += emptyState('No qualifying yet', 'Qualifying results will appear after the session.'); }
      else {
        body += `<div style="overflow-x:auto"><table>
          <thead><tr><th>Pos</th><th>Driver</th><th class="numeric">Q1</th><th class="numeric">Q2</th><th class="numeric">Q3</th></tr></thead>
          <tbody>
            ${qualiCache.QualifyingResults.map(q => {
              const drv = q.Driver;
              return `<tr data-action="open-driver" data-driver="${drv.driverId}">
                <td>${posBadge(q.position)}</td>
                <td>${teamStrip(q.Constructor.constructorId)}<strong>${drv.familyName}</strong></td>
                <td class="numeric" style="color:${q.Q3?'var(--text-subtle)':'var(--text)'}">${q.Q1 || '—'}</td>
                <td class="numeric" style="color:${q.Q3?'var(--text-subtle)':'var(--text)'}">${q.Q2 || '—'}</td>
                <td class="numeric" style="color:${q.position==='1'?'var(--accent)':'var(--text)'};font-weight:${q.position==='1'?'600':'400'}">${q.Q3 || '—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>`;
      }
    } else if (tab === 'circuit') {
      const c = race.Circuit;
      body += `<div class="detail-list">
        <div class="detail-row"><span class="k">Circuit</span><span class="v">${c.circuitName}</span></div>
        <div class="detail-row"><span class="k">Locality</span><span class="v">${c.Location.locality}</span></div>
        <div class="detail-row"><span class="k">Country</span><span class="v">${c.Location.country}</span></div>
        <div class="detail-row"><span class="k">Latitude</span><span class="v">${c.Location.lat}</span></div>
        <div class="detail-row"><span class="k">Longitude</span><span class="v">${c.Location.long}</span></div>
        <div class="detail-row"><span class="k">Round</span><span class="v">${race.round}</span></div>
      </div>`;
    }
    return body;
  }

  function rerender(){
    showModal(`
      <div class="modal-header">
        <div>
          <div class="modal-title">${race.raceName}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:2px">Round ${race.round} · ${race.Circuit.Location.country} · ${fmtDate(dt)}</div>
        </div>
        <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      ${bodyHtml()}
    `);
    $('#close-modal').addEventListener('click', closeModal);
    $$('[data-rtab]').forEach(b => b.addEventListener('click', () => {
      tab = b.dataset.rtab;
      if (tab === 'results') loadResultsIfNeeded();
      else if (tab === 'quali') loadQualiIfNeeded();
      else rerender();
    }));
    bindActions($('.modal'));
  }
  rerender();
  if (tab === 'results') loadResultsIfNeeded();
}

  const standing = ds.find(d => d.Driver.driverId === driverId);

  const drv = standing.Driver;
  const con = standing.Constructors[0];
  const idx = ds.indexOf(standing);

  showModal(`
    <div class="modal-header">
      <div class="modal-title">Driver profile</div>
      <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div style="display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px">
      <div style="width:48px;height:48px;border-radius:24px;background:var(--surface-2);border:1px solid ${teamColor(con.constructorId)};display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700">${drv.permanentNumber || drv.code || '?'}</div>
      <div style="flex:1">
        <div style="font-size:16px;font-weight:600">${drv.givenName} ${drv.familyName}</div>

      </div>
      <span class="badge ${state.favDriver === driverId ? 'badge-accent' : 'badge-neutral'}" style="cursor:pointer" id="fav-toggle">${state.favDriver === driverId ? '★ Favourite' : '☆ Favourite'}</span>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">${state.data.season} pts</div><div class="kpi-value">${standing.points}</div><div class="kpi-delta">P${idx+1} in standings</div></div>
      <div class="kpi"><div class="kpi-label">${state.data.season} wins</div><div class="kpi-value">${standing.wins}</div><div class="kpi-delta">${drv.nationality}</div></div>
      <div class="kpi"><div class="kpi-label">Date of birth</div><div style="font-size:14px;font-weight:600;margin-top:6px;font-family:var(--mono)">${drv.dateOfBirth || '—'}</div></div>
      <div class="kpi"><div class="kpi-label">Team</div><div style="font-size:14px;font-weight:600;margin-top:6px">${con.name}</div></div>
    </div>
    <div class="card" style="padding:12px">
      <div class="caption" style="margin-bottom:6px">Reference</div>
      <div style="font-size:12px;color:var(--text-muted);word-break:break-all">${drv.url || '—'}</div>
    </div>

  $('#close-modal').addEventListener('click', closeModal);
  $('#fav-toggle').addEventListener('click', () => {
    state.favDriver = driverId;
    toast(`${drv.givenName} ${drv.familyName} set as favourite`, 'success');
    closeModal();
    render();
  });
}

function openTeam(teamId){
  const cs = state.data.constructorStandings;
  const standing = cs.find(c => c.Constructor.constructorId === teamId);
  if (!standing) return;
  const c = standing.Constructor;
  const idx = cs.indexOf(standing);
  // Find drivers belonging to this team in current standings
  const teamDrivers = state.data.driverStandings.filter(d => d.Constructors.some(cc => cc.constructorId === teamId));

  showModal(`
    <div class="modal-header">
      <div class="modal-title"><span class="team-strip" style="background:${teamColor(teamId)};height:18px;width:4px"></span>${c.name}</div>
      <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">${state.data.season} pts</div><div class="kpi-value">${standing.points}</div><div class="kpi-delta">P${idx+1} in constructors</div></div>
      <div class="kpi"><div class="kpi-label">${state.data.season} wins</div><div class="kpi-value">${standing.wins}</div><div class="kpi-delta">${c.nationality}</div></div>
    </div>
    <div class="card" style="padding:0; overflow:hidden">
      <div style="padding:10px 12px; border-bottom:1px solid var(--border)"><span class="caption">Drivers</span></div>
      ${teamDrivers.length ? teamDrivers.map(d => {
        const drv = d.Driver;
        return `<div class="session-row" data-action="open-driver" data-driver="${drv.driverId}">
          <div><div class="session-name">${drv.permanentNumber ? '#' + drv.permanentNumber + ' ' : ''}${drv.givenName} ${drv.familyName}</div><div class="session-date">${drv.nationality} · ${d.points} pts</div></div>
          <span></span><span class="muted">›</span>
        </div>`;
      }).join('') : emptyState('No drivers', 'No drivers found in standings for this team.')}
    </div>
  `);
  $('#close-modal').addEventListener('click', closeModal);
  bindActions($('.modal'));
}

function openCircuitById(circuitId){
  const race = state.data.schedule.find(r => r.Circuit.circuitId === circuitId);
  if (!race) return;
  openRace(race.round);
}

/* =================== ACTION BINDING =================== */
function bindActions(scope){
  $$('[data-action]', scope).forEach(el => {
    if (el._bound) return;
    el._bound = true;
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const a = el.dataset.action;
      const data = el.dataset;
      if (a === 'open-race') openRace(data.round);
      else if (a === 'open-driver') openDriver(data.driver);
      else if (a === 'open-team') openTeam(data.team);
      else if (a === 'open-circuit') { const r = state.data.schedule.find(rr => rr.round === String(data.round)); if (r) openCircuitById(r.Circuit.circuitId); }
      else if (a === 'open-circuit-id') openCircuitById(data.circuit);
      else if (a === 'goto-stats') navigate('stats');
    });
  });
}

/* =================== RENDER ROUTING =================== */
function render(){
  if (state.page === 'home') renderHome();
  else if (state.page === 'timeline') renderTimeline();
  else if (state.page === 'stats') renderStats();
  else if (state.page === 'feed') renderFeed();
  else if (state.page === 'more') renderMore();
}

/* =================== INIT =================== */
function init(){
  applyTheme();
  $('#theme-toggle').addEventListener('click', toggleTheme);
  $('#refresh-btn').addEventListener('click', loadData);
  $$('.nav-item').forEach(b => b.addEventListener('click', () => navigate(b.dataset.page)));
  render();
  setInterval(updateCountdown, 1000);
  loadData();
}

// Wait for auth gate to finish before init
function waitForGate(){
  if (document.getElementById('dn-auth-overlay')) {
    setTimeout(waitForGate, 200);
  } else {
    init();
  }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', waitForGate);
} else {
  waitForGate();
}

})();
</script>
</body>
</html>
