<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>F1 Fan Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #f5f5f5;
  --text: #18181b;
  --text-muted: #52525b;
  --text-subtle: #a1a1aa;
  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.16);
  --accent: #e10600;
  --accent-hover: #b80500;
  --accent-bg: rgba(225, 6, 0, 0.08);
  --success: #16a34a;
  --success-bg: rgba(22, 163, 74, 0.08);
  --warning: #d97706;
  --warning-bg: rgba(217, 119, 6, 0.08);
  --danger: #dc2626;
  --danger-bg: rgba(220, 38, 38, 0.08);
  --info: #0284c7;
  --info-bg: rgba(2, 132, 199, 0.08);
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --mono: ui-monospace, 'SF Mono', Menlo, monospace;
}
[data-theme="dark"] {
  --bg: #09090b;
  --surface: #131316;
  --surface-2: #1c1c20;
  --text: #fafafa;
  --text-muted: #a1a1aa;
  --text-subtle: #71717a;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);
  --accent: #ff2e1f;
  --accent-hover: #ff5547;
  --accent-bg: rgba(255, 46, 31, 0.12);
  --success: #22c55e;
  --success-bg: rgba(34, 197, 94, 0.10);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.10);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.10);
  --info: #38bdf8;
  --info-bg: rgba(56, 189, 248, 0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
body { min-height: 100vh; padding-bottom: 80px; }
.app-container { max-width: 760px; margin: 0 auto; }
.app-header {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-mark {
  width: 28px; height: 28px;
  background: var(--accent); border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: white; font-weight: 700; font-size: 12px; font-family: var(--mono);
  letter-spacing: -0.02em;
}
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.header-actions { display: flex; gap: 4px; align-items: center; }
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: color-mix(in srgb, var(--surface) 96%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; z-index: 40;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav-item {
  flex: 1; background: none; border: none;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 4px; cursor: pointer;
  color: var(--text-subtle); font-size: 10px; font-weight: 500;
  letter-spacing: 0.02em; text-transform: uppercase;
  border-radius: var(--radius-sm);
  transition: color 150ms ease, background 150ms ease;
  font-family: inherit;
}
.nav-item svg { width: 20px; height: 20px; }
.nav-item.active { color: var(--accent); }
.nav-item:hover { color: var(--text); }
.page { padding: 16px; display: none; }
.page.active { display: block; animation: fadeIn 180ms ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.display { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
.h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.005em; }
.h2 { font-size: 16px; font-weight: 600; }
.caption { font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
.muted { color: var(--text-muted); }
.mono { font-family: var(--mono); font-size: 13px; }
.btn-primary, .btn-secondary, .btn-ghost {
  font-family: inherit; font-size: 13px; font-weight: 500;
  border-radius: var(--radius-sm); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
  padding: 7px 12px;
}
.btn-primary { background: var(--accent); color: white; border: 1px solid var(--accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); }
.btn-secondary:hover { background: var(--surface-2); border-color: var(--text-subtle); }
.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid transparent; padding: 6px 10px; }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-icon { width: 32px; height: 32px; padding: 0; }
.btn-icon svg { width: 16px; height: 16px; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.input, select.input {
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  color: var(--text);
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px; font-family: inherit; width: 100%;
}
.input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
}
.card + .card { margin-top: 12px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--warning-bg); color: var(--warning); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-info { background: var(--info-bg); color: var(--info); }
.badge-neutral { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
.badge-accent { background: var(--accent-bg); color: var(--accent); }
.live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
.hero-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 16px; position: relative; overflow: hidden;
}
.hero-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--accent);
}
.hero-eyebrow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
.hero-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 2px; }
.hero-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
.countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.count-cell { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; }
.count-num { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.count-label { font-size: 10px; text-transform: uppercase; color: var(--text-subtle); letter-spacing: 0.06em; margin-top: 2px; }
.session-row {
  display: grid; grid-template-columns: 1fr auto auto;
  align-items: center; gap: 12px;
  padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--surface);
  cursor: pointer; transition: background 150ms ease;
}
.session-row:hover { background: var(--surface-2); }
.session-name { font-weight: 500; font-size: 13px; }
.session-date { font-size: 12px; color: var(--text-muted); font-family: var(--mono); }
.kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; position: relative; }
.kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); font-weight: 500; }
.kpi-value { font-family: var(--mono); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
.kpi-delta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
thead th { text-align: left; font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody td { padding: 10px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
tbody tr { transition: background 100ms ease; cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: none; }
.numeric { text-align: right; font-family: var(--mono); }
.pos { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--mono); font-size: 12px; font-weight: 600; }
.pos.p1 { background: rgba(234, 179, 8, 0.12); color: #d4a017; border-color: rgba(234, 179, 8, 0.3); }
.pos.p2 { background: rgba(161, 161, 170, 0.18); color: var(--text); }
.pos.p3 { background: rgba(180, 100, 50, 0.15); color: #c97a3a; border-color: rgba(180, 100, 50, 0.3); }
.team-strip { display: inline-block; width: 3px; height: 14px; border-radius: 1px; margin-right: 8px; vertical-align: middle; background: var(--text-subtle); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: none; padding: 10px 12px; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.section-header h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 10000; padding: 16px; animation: fadeIn 150ms ease; }
.modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 20px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 12px; }
.modal-title { font-size: 16px; font-weight: 600; }
.toast-container { position: fixed; top: 16px; right: 16px; left: 16px; z-index: 10100; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
@media (min-width: 480px) { .toast-container { left: auto; max-width: 360px; } }
.toast { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 10px 12px; font-size: 13px; display: flex; align-items: center; gap: 8px; pointer-events: auto; animation: slideIn 200ms ease; }
@keyframes slideIn { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--info); }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; text-align: center; color: var(--text-muted); gap: 8px; }
.empty svg { opacity: 0.16; width: 40px; height: 40px; }
.empty .empty-title { font-size: 14px; font-weight: 500; color: var(--text); }
.empty .empty-desc { font-size: 13px; color: var(--text-muted); max-width: 280px; }
.skeleton { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: var(--radius-sm); height: 14px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skel-row { padding: 10px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 30px 1fr 60px; gap: 12px; align-items: center; }
.cal-item { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 100ms ease; }
.cal-item:hover { background: var(--surface-2); }
.cal-round { font-family: var(--mono); font-size: 11px; color: var(--text-subtle); text-align: center; border-right: 1px solid var(--border); padding-right: 12px; }
.cal-round-num { font-size: 18px; color: var(--text); font-weight: 600; display: block; }
.cal-name { font-weight: 500; font-size: 14px; margin-bottom: 2px; }
.cal-meta { font-size: 12px; color: var(--text-muted); }
.feed-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
.feed-item:last-child { border-bottom: none; }
.feed-cat { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
.feed-title { font-size: 14px; font-weight: 500; margin: 4px 0; line-height: 1.4; }
.feed-body { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
.feed-meta { font-size: 11px; color: var(--text-subtle); margin-top: 6px; display: flex; gap: 12px; align-items: center; }
.detail-list { display: flex; flex-direction: column; gap: 8px; }
.detail-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.detail-row .k { color: var(--text-muted); }
.detail-row .v { font-family: var(--mono); }
.data-footer { text-align: center; font-size: 11px; color: var(--text-subtle); padding: 16px; border-top: 1px solid var(--border); margin-top: 16px; }
.error-banner { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger); padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.loading-indicator { display: flex; align-items: center; gap: 8px; padding: 12px; color: var(--text-muted); font-size: 13px; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.driver-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; font-size: 13px; flex-shrink: 0; overflow: hidden; }
.driver-avatar img { width: 100%; height: 100%; object-fit: cover; }
.driver-card { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 100ms ease; }
.driver-card:hover { background: var(--surface-2); }
.driver-card:last-child { border-bottom: none; }
.car-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); }
.driver-portrait { width: 88px; height: 88px; border-radius: 50%; background: var(--surface-2); border: 3px solid var(--accent); object-fit: cover; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; font-size: 22px; }
.driver-portrait img { width: 100%; height: 100%; object-fit: cover; }
.social-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.social-btn { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted); font-size: 11px; font-weight: 500; text-decoration: none; transition: all 150ms ease; }
.social-btn:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
.social-btn svg { width: 12px; height: 12px; }
.map-container { height: 380px; width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border); overflow: hidden; background: var(--surface-2); }
[data-theme="dark"] .leaflet-tile { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.85); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); box-shadow: none; }
.leaflet-popup-content { margin: 10px 12px; font-family: inherit; font-size: 13px; }
.leaflet-container { background: var(--surface-2); font-family: inherit; }
.map-pin { background: var(--accent); width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 0 1px var(--accent); }
.map-pin-hq { background: var(--info); width: 12px; height: 12px; border-radius: 2px; border: 2px solid white; box-shadow: 0 0 0 1px var(--info); transform: rotate(45deg); }
.map-legend { display: flex; gap: 12px; margin-top: 8px; padding: 8px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.vs-divider { text-align: center; font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--accent); padding: 4px 0; }
.compare-bar { background: var(--surface-2); height: 6px; border-radius: 3px; overflow: hidden; position: relative; display: flex; }
.compare-bar-l { background: var(--accent); height: 100%; }
.compare-bar-r { background: var(--info); height: 100%; }
.trivia-card { background: linear-gradient(180deg, var(--accent-bg) 0%, var(--surface) 60%); border: 1px solid var(--accent); border-radius: var(--radius-md); padding: 16px; }
.trivia-q { font-size: 15px; font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
.trivia-opt { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; font-size: 13px; color: var(--text); transition: all 150ms ease; }
.trivia-opt:hover { background: var(--surface-2); border-color: var(--accent); }
.trivia-opt.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); font-weight: 500; }
.trivia-opt.wrong { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
.trivia-opt:disabled { cursor: not-allowed; }
.prediction-card { padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; background: var(--surface); }
.prediction-driver { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.confidence-bar { flex: 1; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.confidence-fill { height: 100%; background: var(--accent); }
.fact-card { display: flex; gap: 10px; padding: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; }
.fact-icon { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--accent-bg); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.fact-text { font-size: 13px; color: var(--text); line-height: 1.5; }
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 4px 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; font-size: 12px; cursor: pointer; transition: all 150ms ease; }
.chip:hover { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--accent); color: white; border-color: var(--accent); }
.flag { display: inline-block; width: 18px; height: 13px; vertical-align: middle; margin-right: 6px; border-radius: 2px; font-size: 13px; line-height: 13px; }
@media (max-width: 480px) {
  .kpi-grid { gap: 8px; }
  .kpi { padding: 10px; }
  .kpi-value { font-size: 18px; }
  .page { padding: 12px; }
  .map-container { height: 320px; }
}
</style>
</head>

<!-- ===== DN Platform Auth Gate v1.0 ===== -->

function toast(msg, kind){

  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  const icon = kind === 'success' ? '✓' : kind === 'error' ? '!' : 'i';
  const col = kind === 'success' ? 'success' : kind === 'error' ? 'danger' : 'info';
  el.innerHTML = `<span style="font-family:var(--mono); font-weight:600; color: var(--${col})">${icon}</span> <span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(-4px)'; el.style.transition='all 200ms ease'; setTimeout(()=>el.remove(), 220); }, 4000);

/* =================== DATA FETCH =================== */
async function fetchJson(path){
  const resp = await fetch(`${API_BASE}/${path}`, { headers: { 'Accept': 'application/json' } });
  if (!resp.ok) throw new Error(`HTTP ${resp.status} on ${path}`);
  return resp.json();
}
async function loadData(){
  state.loading = true; state.error = null; render();
  try {
    const [schedule, dStandings, cStandings, lastResults, lastQuali] = await Promise.all([
      fetchJson('current.json'),
      fetchJson('current/driverStandings.json'),
      fetchJson('current/constructorStandings.json'),
      fetchJson('current/last/results.json').catch(()=>null),
      fetchJson('current/last/qualifying.json').catch(()=>null),
    ]);
    const races = schedule.MRData.RaceTable.Races || [];
    const season = schedule.MRData.RaceTable.season;
    const dsList = (dStandings.MRData.StandingsTable.StandingsLists[0] || {}).DriverStandings || [];
    const csList = (cStandings.MRData.StandingsTable.StandingsLists[0] || {}).ConstructorStandings || [];
    const lastRace = lastResults ? lastResults.MRData.RaceTable.Races[0] : null;
    const lastQ = lastQuali ? lastQuali.MRData.RaceTable.Races[0] : null;
    state.data = { season, schedule: races, driverStandings: dsList, constructorStandings: csList, lastRace, lastQualifying: lastQ };
    state.lastUpdated = new Date();
    state.loading = false;
    console.log('F1 data loaded:', { season, raceCount: races.length, drivers: dsList.length, constructors: csList.length });
    if (!state.favDriver && dsList[0]) state.favDriver = dsList[0].Driver.driverId;
    if (!state.favTeam && csList[0]) state.favTeam = csList[0].Constructor.constructorId;
    if (!state.compareA && dsList[0]) state.compareA = dsList[0].Driver.driverId;
    if (!state.compareB && dsList[1]) state.compareB = dsList[1].Driver.driverId;
    const titles = { home: 'Fan Hub', timeline: 'Race Weekends', stats: 'Statistics', map: 'World Map', fun: 'Fan Zone', more: 'More' };
    $('#page-title').textContent = titles[state.page];
    $('#page-sub').textContent = `${season} Season`;
    toast(`Loaded ${season} season · ${races.length} races`, 'success');
    render();
  } catch (err) {
    console.error('F1 data fetch failed:', err);
    state.loading = false; state.error = err.message || 'Network error'; render();
  }
}

function updateCountdown(){
  const el = $('#countdown'); if (!el) return;

  if (ms < 0) { render(); return; }
  const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000), m = Math.floor((ms%3600000)/60000), s = Math.floor((ms%60000)/1000);
  el.innerHTML = `<div class="count-cell"><div class="count-num">${d}</div><div class="count-label">Days</div></div><div class="count-cell"><div class="count-num">${String(h).padStart(2,'0')}</div><div class="count-label">Hours</div></div><div class="count-cell"><div class="count-num">${String(m).padStart(2,'0')}</div><div class="count-label">Min</div></div><div class="count-cell"><div class="count-num">${String(s).padStart(2,'0')}</div><div class="count-label">Sec</div></div>`;
}

function initMap(){
  const el = document.getElementById('world-map');
  if (!el || !window.L) return;
  if (state.mapInstance) { try { state.mapInstance.remove(); } catch(e){} state.mapInstance = null; }
  const map = L.map(el, { worldCopyJump: true, scrollWheelZoom: true }).setView([25, 15], 2);
  state.mapInstance = map;
  const isDark = state.theme === 'dark';
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '© OpenStreetMap', subdomains: 'abc',
  }).addTo(map);

  if (state.mapMode === 'all' || state.mapMode === 'circuits') {
    const now = Date.now();
    state.data.schedule.forEach(r => {
      const c = r.Circuit; const lat = parseFloat(c.Location.lat), lon = parseFloat(c.Location.long);
      if (isNaN(lat) || isNaN(lon)) return;
      const dt = raceDate(r); const isPast = dt.getTime() < now;
      const icon = L.divIcon({ className: '', html: `<div class="map-pin" style="opacity:${isPast ? 0.5 : 1}"></div>`, iconSize: [14,14], iconAnchor: [7,7] });
      const popup = `<div style="min-width:180px"><div style="font-weight:600;font-size:13px;margin-bottom:2px">${flag(c.Location.country)}${r.raceName}</div><div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">${c.circuitName}<br>${c.Location.locality}, ${c.Location.country}<br>Round ${r.round} · ${fmtDate(dt)}</div><button onclick="window.__f1Open('race','${r.round}')" style="width:100%;padding:6px 10px;background:var(--accent);color:white;border:none;border-radius:4px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit">Race details</button></div>`;
      L.marker([lat, lon], { icon }).addTo(map).bindPopup(popup);
    });
  }
  if (state.mapMode === 'all' || state.mapMode === 'hq') {
    const seenHqs = new Set();
    Object.entries(TEAMS).forEach(([id, t]) => {
      if (id === 'alphatauri') return;
      const key = t.hq.join(',');
      if (seenHqs.has(key)) return;
      seenHqs.add(key);
      const icon = L.divIcon({ className: '', html: `<div class="map-pin-hq"></div>`, iconSize: [12,12], iconAnchor: [6,6] });
      const popup = `<div style="min-width:170px"><div style="font-weight:600;font-size:13px;margin-bottom:2px;color:${t.color}">${t.name}</div><div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">📍 ${t.hqCity}<br>Engine: ${t.engine}<br>Founded: ${t.founded}</div><button onclick="window.__f1Open('team','${id}')" style="width:100%;padding:6px 10px;background:var(--accent);color:white;border:none;border-radius:4px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit">Team profile</button></div>`;
      L.marker(t.hq, { icon }).addTo(map).bindPopup(popup);
    });
  }
  setTimeout(() => { try { map.invalidateSize(); } catch(e){} }, 100);
}

function renderPredict(){
  const ds = state.data.driverStandings;
  const upcoming = nextRace();
  const cs = state.data.constructorStandings;
  if (!ds.length) return emptyState('Nothing to predict yet', 'Predictions need at least some season data.');

  // Simple form-based prediction: weight current points + recent wins
  const sorted = [...ds].sort((a, b) => {
    const aScore = parseFloat(a.points) + parseInt(a.wins) * 15;
    const bScore = parseFloat(b.points) + parseInt(b.wins) * 15;
    return bScore - aScore;
  });
  const top3 = sorted.slice(0, 3);
  const podiumLikely = sorted.slice(0, 6);

  // Championship odds
  const racesLeft = state.data.schedule.filter(r => raceDate(r).getTime() > Date.now()).length;
  const maxRemaining = racesLeft * 26;
  const leader = ds[0];
  const leaderPts = parseFloat(leader.points);
  const contenders = ds.filter(d => parseFloat(d.points) + maxRemaining >= leaderPts);

  let html = '';
  if (upcoming) {
    html += `<div class="section-header"><h2>🔮 ${upcoming.raceName} — Podium prediction</h2></div>
      <div class="card">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Based on current championship form and ${upcoming.Sprint ? 'sprint weekend dynamics' : 'standard race format'}.</div>
        ${top3.map((d, i) => {
          const conf = Math.max(20, 90 - i * 25);
          return `<div class="prediction-driver">
            <div style="font-family:var(--mono);font-weight:700;color:${i===0?'#d4a017':i===1?'var(--text-muted)':'#c97a3a'};width:24px">P${i+1}</div>
            ${driverAvatar(d.Driver, 32)}
            <div style="flex:1">
              <div style="font-weight:500;font-size:13px">${flag(d.Driver.nationality)}${d.Driver.givenName} ${d.Driver.familyName}</div>
              <div style="display:flex;align-items:center;gap:6px;margin-top:2px"><div class="confidence-bar"><div class="confidence-fill" style="width:${conf}%"></div></div><span style="font-size:10px;color:var(--text-subtle);font-family:var(--mono)">${conf}%</span></div>
            </div>
          </div>`;
        }).join('')}
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-subtle)">⚠️ Predictions are illustrative only — based on a simple form-weighted model.</div>
      </div>`;
  }

  html += `<div class="section-header" style="margin-top:16px"><h2>🏆 Title contenders</h2></div>
    <div class="card">
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">${racesLeft} races left · max ${maxRemaining} pts available. Drivers still mathematically in contention:</div>
      ${contenders.length === 0 ? emptyState('Title decided', 'The championship is mathematically locked.') :
        contenders.map(d => {
          const idx = ds.indexOf(d);
          const gap = leaderPts - parseFloat(d.points);
          const odds = idx === 0 ? 'Leader' : `−${gap} pts`;
          return `<div class="prediction-driver" data-action="open-driver" data-driver="${d.Driver.driverId}" style="cursor:pointer">
            <div style="font-family:var(--mono);font-weight:700;width:24px">P${idx+1}</div>
            ${driverAvatar(d.Driver, 32)}
            <div style="flex:1">
              <div style="font-weight:500;font-size:13px">${flag(d.Driver.nationality)}${d.Driver.familyName}</div>
              <div style="font-size:11px;color:var(--text-muted)">${d.Constructors[0].name} · ${d.points} pts</div>
            </div>
            <span class="badge ${idx===0?'badge-success':'badge-neutral'}">${odds}</span>
          </div>`;
        }).join('')}
    </div>`;

  return html;
}

      <div style="margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--text-subtle)">api.jolpi.ca/ergast/f1</div>
    </div>
    ${dataFooter()}
  `;
  root.innerHTML = html;
  const favSel = $('#fav-driver-select');
  if (favSel) favSel.addEventListener('change', e => { state.favDriver = e.target.value; toast('Favourite driver updated', 'success'); render(); });
  const favT = $('#fav-team-select');
  if (favT) favT.addEventListener('change', e => { state.favTeam = e.target.value; toast('Favourite team updated', 'success'); render(); });
  $('#theme-toggle-2').addEventListener('click', toggleTheme);
  $('#refresh-data').addEventListener('click', loadData);
}

/* =================== MODALS =================== */
function openRace(round){
  const race = state.data.schedule.find(r => r.round === String(round));
  if (!race) return;
  const dt = raceDate(race);
  const isFinished = dt.getTime() <= Date.now();
  let tab = isFinished ? 'results' : 'schedule';
  let resultsCache = null, qualiCache = null, loadingTab = false;

  async function loadResultsIfNeeded(){
    if (resultsCache || !isFinished) return;
    loadingTab = true; rerender();
    try { const data = await fetchJson(`${state.data.season}/${race.round}/results.json`); resultsCache = data.MRData.RaceTable.Races[0] || null; }
    catch(e){ resultsCache = null; toast('Failed to load results', 'error'); }
    loadingTab = false; rerender();
  }
  async function loadQualiIfNeeded(){
    if (qualiCache || !isFinished) return;
    loadingTab = true; rerender();
    try { const data = await fetchJson(`${state.data.season}/${race.round}/qualifying.json`); qualiCache = data.MRData.RaceTable.Races[0] || null; }
    catch(e){ qualiCache = null; toast('Failed to load qualifying', 'error'); }
    loadingTab = false; rerender();
  }

  function sessionsList(){
    const sessions = [];
    if (race.FirstPractice) sessions.push({ name: 'Practice 1', at: race.FirstPractice });
    if (race.SecondPractice) sessions.push({ name: 'Practice 2', at: race.SecondPractice });
    if (race.ThirdPractice) sessions.push({ name: 'Practice 3', at: race.ThirdPractice });
    if (race.SprintQualifying) sessions.push({ name: 'Sprint Qualifying', at: race.SprintQualifying });
    if (race.Sprint) sessions.push({ name: 'Sprint', at: race.Sprint });
    if (race.Qualifying) sessions.push({ name: 'Qualifying', at: race.Qualifying });
    sessions.push({ name: 'Race', at: { date: race.date, time: race.time } });
    return sessions;
  }

  function bodyHtml(){
    let body = `<div class="tabs">
      <button class="tab ${tab==='schedule'?'active':''}" data-rtab="schedule">Schedule</button>
      ${isFinished ? '<button class="tab ' + (tab==='results'?'active':'') + '" data-rtab="results">Results</button><button class="tab ' + (tab==='quali'?'active':'') + '" data-rtab="quali">Qualifying</button>' : ''}
      <button class="tab ${tab==='circuit'?'active':''}" data-rtab="circuit">Circuit</button>
    </div>`;
    if (tab === 'schedule') {
      const ss = sessionsList();
      body += `<div style="display:flex;flex-direction:column;gap:6px">${ss.map(s => {
        const sd = new Date(s.at.date + 'T' + (s.at.time || '00:00:00Z'));
        const past = sd.getTime() < Date.now();
        return `<div class="session-row"><div><div class="session-name">${s.name}</div><div style="font-size:11px;color:var(--text-subtle)">${fmtDate(sd)}</div></div><div class="session-date">${fmtTime(sd)}</div><span class="badge ${past ? 'badge-neutral' : 'badge-accent'}">${past ? 'done' : relativeTime(sd)}</span></div>`;
      }).join('')}</div>`;
    } else if (tab === 'results') {
      if (loadingTab) body += loadingBlock('Loading results…');
      else if (!resultsCache || !resultsCache.Results) body += emptyState('No results yet', 'Results will appear here after the race.');
      else {
        body += `<div style="overflow-x:auto"><table><thead><tr><th>Pos</th><th>Driver</th><th class="numeric">Grid</th><th class="numeric">Time/Gap</th><th class="numeric">Pts</th></tr></thead><tbody>
          ${resultsCache.Results.map(r => {
            const drv = r.Driver, con = r.Constructor;
            const grid = parseInt(r.grid), pos = parseInt(r.position);
            const delta = grid - pos;
            const timeGap = r.Time ? r.Time.time : (r.status || '—');
            const fl = r.FastestLap && r.FastestLap.rank === '1';
            return `<tr data-action="open-driver" data-driver="${drv.driverId}"><td>${posBadge(r.position)}</td><td>${teamStrip(con.constructorId)}<strong>${drv.familyName}</strong>${fl ? ` <span class="badge badge-accent" style="font-size:10px">⚡FL</span>` : ''}</td><td class="numeric">${r.grid}${delta!==0 && !isNaN(delta) ? ` <span style="font-size:10px;color:${delta>0?'var(--success)':'var(--danger)'}">${delta>0?'↑':'↓'}${Math.abs(delta)}</span>` : ''}</td><td class="numeric" style="color:var(--text-muted)">${timeGap}</td><td class="numeric"><strong>${r.points}</strong></td></tr>`;
          }).join('')}
        </tbody></table></div>`;
      }
    } else if (tab === 'quali') {
      if (loadingTab) body += loadingBlock('Loading qualifying…');
      else if (!qualiCache || !qualiCache.QualifyingResults) body += emptyState('No qualifying yet', 'Qualifying results appear after Q3.');
      else {
        body += `<div style="overflow-x:auto"><table><thead><tr><th>Pos</th><th>Driver</th><th class="numeric">Q1</th><th class="numeric">Q2</th><th class="numeric">Q3</th></tr></thead><tbody>
          ${qualiCache.QualifyingResults.map(q => {
            const drv = q.Driver;
            return `<tr data-action="open-driver" data-driver="${drv.driverId}"><td>${posBadge(q.position)}</td><td>${teamStrip(q.Constructor.constructorId)}<strong>${drv.familyName}</strong></td><td class="numeric" style="color:${q.Q3?'var(--text-subtle)':'var(--text)'}">${q.Q1 || '—'}</td><td class="numeric" style="color:${q.Q3?'var(--text-subtle)':'var(--text)'}">${q.Q2 || '—'}</td><td class="numeric" style="color:${q.position==='1'?'var(--accent)':'var(--text)'};font-weight:${q.position==='1'?'600':'400'}">${q.Q3 || '—'}</td></tr>`;
          }).join('')}
        </tbody></table></div>`;
      }
    } else if (tab === 'circuit') {
      const c = race.Circuit;
      body += `<div class="detail-list">
        <div class="detail-row"><span class="k">Circuit</span><span class="v">${c.circuitName}</span></div>
        <div class="detail-row"><span class="k">Locality</span><span class="v">${c.Location.locality}</span></div>
        <div class="detail-row"><span class="k">Country</span><span class="v">${flag(c.Location.country)}${c.Location.country}</span></div>
        <div class="detail-row"><span class="k">Coordinates</span><span class="v">${parseFloat(c.Location.lat).toFixed(3)}, ${parseFloat(c.Location.long).toFixed(3)}</span></div>
        <div class="detail-row"><span class="k">Round</span><span class="v">${race.round}</span></div>
      </div>
      <div style="margin-top:12px"><a class="btn-secondary" href="https://www.google.com/maps/search/?api=1&query=${c.Location.lat},${c.Location.long}" target="_blank" rel="noopener" style="width:100%;text-decoration:none">📍 Open in Google Maps</a></div>`;
    }
    return body;
  }

  function rerender(){
    showModal(`
      <div class="modal-header">
        <div>
          <div class="modal-title">${flag(race.Circuit.Location.country)}${race.raceName}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:2px">Round ${race.round} · ${race.Circuit.Location.country} · ${fmtDate(dt)}</div>
        </div>
        <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      ${bodyHtml()}
    `);
    $('#close-modal').addEventListener('click', closeModal);
    $$('[data-rtab]').forEach(b => b.addEventListener('click', () => {
      tab = b.dataset.rtab;
      if (tab === 'results') loadResultsIfNeeded();
      else if (tab === 'quali') loadQualiIfNeeded();
      else rerender();
    }));
    bindActions($('.modal'));
  }
  rerender();
  if (tab === 'results') loadResultsIfNeeded();
}

function openDriver(driverId){
  const ds = state.data.driverStandings;
  const standing = ds.find(d => d.Driver.driverId === driverId);
  if (!standing) return;
  const drv = standing.Driver, con = standing.Constructors[0];
  const idx = ds.indexOf(standing);
  const info = driverInfo(drv);

  showModal(`
    <div class="modal-header">
      <div class="modal-title">Driver Profile</div>
      <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div style="display:flex;gap:14px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px">
      <div class="driver-portrait" style="border-color:${teamColor(con.constructorId)}"><span>${driverInitials(drv)}</span></div>
      <div style="flex:1">
        <div style="font-size:18px;font-weight:700;letter-spacing:-0.01em">${drv.givenName} ${drv.familyName}</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${flag(drv.nationality)}${drv.nationality}${drv.permanentNumber ? ' · #' + drv.permanentNumber : ''}${drv.code ? ' · ' + drv.code : ''}</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${teamStrip(con.constructorId)}${con.name}</div>
      </div>
      <span class="badge ${state.favDriver === driverId ? 'badge-accent' : 'badge-neutral'}" style="cursor:pointer" id="fav-toggle">${state.favDriver === driverId ? '★ Fav' : '☆ Fav'}</span>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Season pts</div><div class="kpi-value">${standing.points}</div><div class="kpi-delta">P${idx+1} in standings</div></div>
      <div class="kpi"><div class="kpi-label">Season wins</div><div class="kpi-value">${standing.wins}</div><div class="kpi-delta">${state.data.season} season</div></div>
      <div class="kpi"><div class="kpi-label">Born</div><div style="font-size:14px;font-weight:600;margin-top:6px;font-family:var(--mono)">${drv.dateOfBirth || '—'}</div></div>
      <div class="kpi"><div class="kpi-label">Team</div><div style="font-size:14px;font-weight:600;margin-top:6px">${con.name}</div></div>
    </div>
    <div class="card" style="padding:12px">
      <div class="caption" style="margin-bottom:6px">Follow ${drv.familyName}</div>
      ${driverSocials(drv)}
    </div>
    <div style="margin-top:10px;text-align:center">
      <a href="${driverF1Url(drv)}" target="_blank" rel="noopener" style="font-size:11px;color:var(--text-subtle);font-family:var(--mono)">${driverF1Url(drv)}</a>
    </div>
  `);
  $('#close-modal').addEventListener('click', closeModal);
  $('#fav-toggle').addEventListener('click', () => {
    state.favDriver = driverId;
    toast(`${drv.givenName} ${drv.familyName} set as favourite`, 'success');
    closeModal();
    render();
  });
}

function openTeam(teamId){
  const cs = state.data.constructorStandings;
  const standing = cs.find(c => c.Constructor.constructorId === teamId);
  if (!standing) return;
  const c = standing.Constructor;
  const idx = cs.indexOf(standing);
  const teamDrivers = state.data.driverStandings.filter(d => d.Constructors.some(cc => cc.constructorId === teamId));
  const td = TEAMS[teamId] || {};

  showModal(`
    <div class="modal-header">
      <div class="modal-title" style="display:flex;align-items:center;gap:8px"><span style="display:inline-block;width:6px;height:24px;background:${teamColor(teamId)};border-radius:2px"></span>${c.name}</div>
      <button class="btn-ghost btn-icon" id="close-modal" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:14px">
      ${flag(c.nationality)}${c.nationality}${td.hqCity ? ' · 📍 ' + td.hqCity : ''}${td.founded ? ' · est. ' + td.founded : ''}${td.engine ? ' · ' + td.engine + ' power unit' : ''}
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Season pts</div><div class="kpi-value">${standing.points}</div><div class="kpi-delta">P${idx+1} constructors</div></div>
      <div class="kpi"><div class="kpi-label">Season wins</div><div class="kpi-value">${standing.wins}</div><div class="kpi-delta">${state.data.season}</div></div>
    </div>
    <div class="card" style="padding:0; overflow:hidden;margin-bottom:12px">
      <div style="padding:10px 12px; border-bottom:1px solid var(--border)"><span class="caption">Drivers</span></div>
      ${teamDrivers.length ? teamDrivers.map(d => {
        const drv = d.Driver;
        return `<div class="driver-card" data-action="open-driver" data-driver="${drv.driverId}">
          ${driverAvatar(drv, 36)}
          <div><div style="font-weight:600;font-size:13px">${flag(drv.nationality)}${drv.givenName} ${drv.familyName}</div><div style="font-size:11px;color:var(--text-muted)">${drv.permanentNumber ? '#' + drv.permanentNumber + ' · ' : ''}${d.points} pts</div></div>
          <span class="muted">›</span>
        </div>`;
      }).join('') : emptyState('No drivers', 'No drivers in standings for this team.')}
    </div>
    <div class="card" style="padding:12px">
      <div class="caption" style="margin-bottom:6px">Follow ${c.name}</div>
      ${teamSocials(teamId)}
    </div>
  `);
  $('#close-modal').addEventListener('click', closeModal);
  bindActions($('.modal'));
}

function openCircuitById(circuitId){
  const race = state.data.schedule.find(r => r.Circuit.circuitId === circuitId);
  if (race) openRace(race.round);
}

/* =================== ACTION BINDING =================== */
function bindActions(scope){
  $$('[data-action]', scope).forEach(el => {
    if (el._bound) return;
    el._bound = true;
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const a = el.dataset.action;
      const data = el.dataset;
      if (a === 'open-race') openRace(data.round);
      else if (a === 'open-driver') openDriver(data.driver);
      else if (a === 'open-team') openTeam(data.team);
      else if (a === 'open-circuit') { const r = state.data.schedule.find(rr => rr.round === String(data.round)); if (r) openCircuitById(r.Circuit.circuitId); }
      else if (a === 'open-circuit-id') openCircuitById(data.circuit);
      else if (a === 'goto-stats') navigate('stats');
      else if (a === 'goto-map') navigate('map');
    });
  });
}

/* =================== RENDER ROUTING =================== */
function render(){
  if (state.page === 'home') renderHome();
  else if (state.page === 'timeline') renderTimeline();
  else if (state.page === 'stats') renderStats();
  else if (state.page === 'map') renderMap();
  else if (state.page === 'fun') renderFun();
  else if (state.page === 'more') renderMore();
}

/* =================== INIT =================== */
function init(){
  applyTheme();
  $('#theme-toggle').addEventListener('click', toggleTheme);
  $('#refresh-btn').addEventListener('click', loadData);
  $$('.nav-item').forEach(b => b.addEventListener('click', () => navigate(b.dataset.page)));
  render();
  setInterval(updateCountdown, 1000);
  loadData();
}
function waitForGate(){
  if (document.getElementById('dn-auth-overlay')) setTimeout(waitForGate, 200);
  else init();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', waitForGate);
else waitForGate();

})();
</script>
</body>
</html>
