<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DN Operations Digital Twin</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fafafa;--surface:#ffffff;--surface-2:#f5f5f5;--text:#18181b;--text-muted:#52525b;--text-subtle:#a1a1aa;--border:rgba(0,0,0,0.08);--border-strong:rgba(0,0,0,0.16);--accent:#5e6ad2;--accent-hover:#4f59c4;--accent-bg:rgba(94,106,210,0.08);--success:#16a34a;--success-bg:rgba(22,163,74,0.08);--warning:#d97706;--warning-bg:rgba(217,119,6,0.08);--danger:#dc2626;--danger-bg:rgba(220,38,38,0.08);--info:#0284c7;--info-bg:rgba(2,132,199,0.08);--radius-sm:4px;--radius-md:6px;--radius-lg:8px}
[data-theme="dark"]{--bg:#09090b;--surface:#131316;--surface-2:#1c1c20;--text:#fafafa;--text-muted:#a1a1aa;--text-subtle:#71717a;--border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.14);--accent:#7b85e3;--accent-hover:#8d96e8;--accent-bg:rgba(123,133,227,0.10);--success:#22c55e;--success-bg:rgba(34,197,94,0.10);--warning:#f59e0b;--warning-bg:rgba(245,158,11,0.10);--danger:#ef4444;--danger-bg:rgba(239,68,68,0.10);--info:#38bdf8;--info-bg:rgba(56,189,248,0.10)}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10}
.header-left{display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;letter-spacing:-0.01em}
.brand-dot{width:8px;height:8px;background:var(--accent);border-radius:2px}
.nav{display:flex;gap:4px}
.nav-btn{background:transparent;border:1px solid transparent;color:var(--text-muted);padding:6px 10px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:all 150ms ease;font-family:inherit}
.nav-btn:hover{background:var(--surface-2);color:var(--text)}
.nav-btn.active{background:var(--accent-bg);color:var(--accent)}
.header-right{display:flex;align-items:center;gap:8px}
.time-selector{display:flex;align-items:center;gap:4px;padding:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.time-btn{background:transparent;border:none;color:var(--text-muted);padding:4px 8px;border-radius:3px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;font-variant-numeric:tabular-nums}
.time-btn.active{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.refresh-indicator{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.pulse{width:6px;height:6px;background:var(--success);border-radius:50%;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);width:30px;height:30px;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 150ms ease}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}
.role-select{background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);padding:5px 8px;border-radius:var(--radius-sm);font-size:12px;font-family:inherit;cursor:pointer}
.btn-primary{background:var(--accent);color:white;border:1px solid var(--accent);padding:6px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:background 150ms ease;font-family:inherit}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);padding:6px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:all 150ms ease;font-family:inherit}
.btn-secondary:hover{background:var(--surface-2);border-color:var(--text-subtle)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid transparent;padding:6px 10px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.main{flex:1;padding:24px;max-width:1600px;margin:0 auto;width:100%}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);margin-bottom:16px}
.breadcrumb-link{color:var(--text-muted);background:none;border:none;cursor:pointer;font-family:inherit;font-size:12px;padding:0}
.breadcrumb-link:hover{color:var(--text)}
.breadcrumb-sep{color:var(--text-subtle)}
.confidence-hero{display:grid;grid-template-columns:340px 1fr;gap:16px;margin-bottom:16px}
.hero-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;position:relative}
.hero-label{font-size:12px;font-weight:500;letter-spacing:0.02em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}
.hero-score{font-size:56px;font-weight:600;letter-spacing:-0.02em;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px}
.hero-score-suffix{font-size:18px;color:var(--text-muted);font-weight:500}
.score-trend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-variant-numeric:tabular-nums}
.score-bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:14px}
.score-bar-fill{height:100%;background:var(--accent);transition:width 400ms ease}
.score-meta{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--text-subtle);font-variant-numeric:tabular-nums}
.hero-meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px}
.kpi-label{font-size:11px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
.kpi-value{font-size:24px;font-weight:600;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi-sub{font-size:11px;color:var(--text-subtle);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi-value.critical{color:var(--danger)}
.kpi-value.warning{color:var(--warning)}
.kpi-value.success{color:var(--success)}
.tiles-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;cursor:pointer;transition:border-color 150ms ease}
.tile:hover{border-color:var(--border-strong)}
.tile-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tile-title{font-size:13px;font-weight:600}
.tile-health{font-size:28px;font-weight:600;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;line-height:1}
.tile-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.tile-bar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:10px}
.tile-bar-fill{height:100%;transition:width 400ms ease}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;font-variant-numeric:tabular-nums}
.badge-success{background:var(--success-bg);color:var(--success)}
.badge-warning{background:var(--warning-bg);color:var(--warning)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-neutral{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot-success{background:var(--success)}
.dot-warning{background:var(--warning)}
.dot-danger{background:var(--danger)}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:16px;overflow:hidden}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.section-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.section-actions{display:flex;align-items:center;gap:6px}
.chips{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.chip{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);padding:3px 10px;border-radius:12px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:500;transition:all 150ms ease}
.chip:hover{color:var(--text);border-color:var(--border-strong)}
.chip.active{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
thead th{text-align:left;font-size:11px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-muted);padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text)}
tbody tr{cursor:pointer;transition:background 150ms ease}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.numeric{text-align:right;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px}
.row-expand-btn{background:none;border:none;color:var(--text-subtle);cursor:pointer;font-family:inherit;padding:0;width:14px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;margin-right:6px;transition:transform 150ms ease}
.row-expand-btn.expanded{transform:rotate(90deg)}
.sub-row{background:var(--surface-2)}
.sub-row td{padding:7px 12px 7px 36px;font-size:12px}
.sparkline{display:inline-block;vertical-align:middle}
.input{background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);padding:7px 10px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;transition:all 150ms ease;width:100%}
.input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.input::placeholder{color:var(--text-subtle)}
.search-wrap{position:relative;width:240px}
.search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--text-subtle);pointer-events:none}
.search-wrap .input{padding-left:28px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn 150ms ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:0;max-width:560px;width:92vw;max-height:85vh;overflow:hidden;display:flex;flex-direction:column}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:15px;font-weight:600}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.side-panel-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:90;animation:fadeIn 150ms ease}
.side-panel{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:90vw;background:var(--surface);border-left:1px solid var(--border-strong);z-index:91;display:flex;flex-direction:column;animation:slideIn 200ms ease}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.toasts{position:fixed;top:60px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:8px;min-width:240px;max-width:380px;animation:toastIn 200ms ease;pointer-events:auto}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--info)}
.toast.warning{border-left:3px solid var(--warning)}
.slider-row{display:grid;grid-template-columns:160px 1fr 60px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.slider-row:last-child{border-bottom:none}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--surface-2);border-radius:2px;outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer;transition:background 150ms ease}
.slider::-webkit-slider-thumb:hover{background:var(--accent-hover)}
.slider::-moz-range-thumb{width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer;border:none}
.slider-value{font-family:ui-monospace,monospace;font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.flow-diagram{display:flex;align-items:center;gap:0;padding:20px;overflow-x:auto}
.flow-node{flex-shrink:0;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;min-width:140px;text-align:center}
.flow-node-title{font-size:11px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
.flow-node-value{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.flow-node-sub{font-size:11px;color:var(--text-subtle);margin-top:4px}
.flow-arrow{flex-shrink:0;height:2px;background:var(--border-strong);width:32px;position:relative}
.flow-arrow::after{content:'';position:absolute;right:-1px;top:-3px;width:0;height:0;border-left:6px solid var(--border-strong);border-top:4px solid transparent;border-bottom:4px solid transparent}
.flow-node.success{border-color:var(--success);background:var(--success-bg)}
.flow-node.warning{border-color:var(--warning);background:var(--warning-bg)}
.flow-node.danger{border-color:var(--danger);background:var(--danger-bg)}
.empty-state{padding:48px 24px;text-align:center;color:var(--text-muted)}
.empty-icon{opacity:0.14;margin:0 auto 16px;display:block}
.empty-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty-desc{font-size:13px;color:var(--text-muted);margin-bottom:16px}
.simulation-banner{background:var(--warning-bg);border:1px solid var(--warning);border-radius:var(--radius-md);padding:10px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--warning)}
.simulation-banner strong{font-weight:600}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-item{padding:10px 12px;background:var(--surface-2);border-radius:var(--radius-sm)}
.detail-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:3px}
.detail-value{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.threshold-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px;background:var(--surface-2)}
.threshold-seg-bau{background:var(--success);opacity:0.7}
.threshold-seg-warn{background:var(--warning);opacity:0.7}
.threshold-seg-crit{background:var(--danger);opacity:0.7}
.threshold-marker{position:relative}
.threshold-marker::after{content:'';position:absolute;top:-2px;width:2px;height:12px;background:var(--text)}
.sim-watermark{position:absolute;top:8px;right:8px;font-size:10px;color:var(--warning);background:var(--warning-bg);padding:2px 6px;border-radius:3px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;border:1px solid var(--warning)}
@media(max-width:1024px){.confidence-hero{grid-template-columns:1fr}.hero-meta-grid{grid-template-columns:repeat(2,1fr)}.tiles-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.main{padding:12px}.tiles-grid{grid-template-columns:1fr}.hero-meta-grid{grid-template-columns:1fr 1fr}.header{padding:8px 12px}.nav{display:none}.side-panel{width:100vw}}

  function thresholdClass(value, thresholds, inverse){
    if(inverse){
      if(value >= thresholds.bau) return 'bau';
      if(value >= thresholds.attention) return 'attention';

    if(!items.length) return 100;
    let sum = 0;
    items.forEach(i => {
      sum += i.status === 'bau' ? 100 : i.status === 'attention' ? 70 : 30;
    });
    return Math.round(sum / items.length);
  }

  function computeWeightedHealth(items, weightKey){
    if(!items.length) return 100;
    let totalWeight = 0, weightedSum = 0;
    items.forEach(i => {
      const w = i[weightKey] || 1;
      const v = i.status === 'bau' ? 100 : i.status === 'attention' ? 70 : 30;
      totalWeight += w;
      weightedSum += v * w;
    });
    return Math.round(weightedSum / totalWeight);
  }

  function getConfidenceScore(){
    const infraHealth = computeHealth(INFRASTRUCTURE.concat(POLLERS));
    const useCaseHealth = computeWeightedHealth(USE_CASES, 'weight');
    const etlHealth = computeHealth(ETL_PIPELINES);
    const appHealth = computeHealth(APPLICATIONS);
    const w = STATE.weights;
    const total = w.infrastructure + w.useCases + w.etl + w.applications;
    const score = (
      infraHealth * w.infrastructure +
      useCaseHealth * w.useCases +
      etlHealth * w.etl +
      appHealth * w.applications
    ) / total;
    return { overall: Math.round(score), infra: infraHealth, useCases: useCaseHealth, etl: etlHealth, apps: appHealth };

  // ===== SPARKLINE =====
  function sparkline(data, w, h, color){
    w = w || 70; h = h || 18; color = color || 'var(--text-muted)';
    const max = Math.max(...data), min = Math.min(...data);
    const range = max - min || 1;
    const step = w / (data.length - 1);
    let path = '';
    data.forEach((v, i) => {
      const x = i * step;
      const y = h - ((v - min) / range) * h;
      path += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    });
    return `<svg class="sparkline" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${path}" fill="none" stroke="${color}" stroke-width="1.2"/></svg>`;
  }

  function genSparkData(seed, trend){

      v += (r() - 0.5) * 12 + (trend || 0);
      v = Math.max(5, Math.min(95, v));
      arr.push(v);
    }
    return arr;

  function largeChart(data, color){
    const w = 800, h = 180, pad = 24;
    const max = Math.max(...data), min = Math.min(...data);
    const range = max - min || 1;
    const step = (w - pad * 2) / (data.length - 1);
    let path = '', area = '';
    data.forEach((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      path += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
      if(i === 0) area = 'M' + x + ',' + (h - pad) + ' L' + x + ',' + y;
      else area += ' L' + x + ',' + y;
    });
    area += ' L' + (pad + (data.length-1)*step) + ',' + (h-pad) + ' Z';
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.15"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--border)"/>
      <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="var(--border)"/>
      <path d="${area}" fill="url(#g)"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5"/>
    </svg>`;
  }

    `;
  }

  function weightSlider(label, key, value){
    return `
      <div class="slider-row">
        <div style="font-size:13px;font-weight:500">${label}</div>
        <input type="range" class="slider" min="0" max="100" value="${value}" oninput="window.__dnSetWeight('${key}', this.value)">
        <div class="slider-value" id="w_${key}">${value}%</div>
      </div>
    `;
  }

  function kpiWeightSlider(label, key){
    const v = STATE.weights.kpi[key];
    return `
      <div class="slider-row">
        <div style="font-size:13px;font-weight:500">${label}</div>
        <input type="range" class="slider" min="0" max="100" value="${v}" oninput="window.__dnSetKpiWeight('${key}', this.value)">
        <div class="slider-value" id="kw_${key}">${v}%</div>
      </div>
    `;
  }

  function viewExecutive(){
    const cs = getConfidenceScore();
    const critical = getCriticalCount();
    const attention = getAttentionCount();
    return `
      <div class="breadcrumb"><span>Executive Summary</span></div>
      <div class="confidence-hero">
        <div class="hero-card">
          <div class="hero-label">Overall Confidence</div>
          <div class="hero-score" style="color:${cs.overall >= 85 ? 'var(--success)' : cs.overall >= 70 ? 'var(--warning)' : 'var(--danger)'}">${cs.overall}<span class="hero-score-suffix">/ 100</span></div>
          <div style="margin-top:14px;font-size:13px;color:var(--text-muted)">${cs.overall >= 85 ? 'Systems performing within agreed SLAs.' : cs.overall >= 70 ? 'Multiple components require attention. Action recommended.' : 'Critical incidents in progress. Immediate review required.'}</div>
        </div>
        <div class="hero-meta-grid">
          <div class="kpi-card"><div class="kpi-label">Critical</div><div class="kpi-value ${critical > 0 ? 'critical' : ''}">${critical}</div></div>
          <div class="kpi-card"><div class="kpi-label">Attention</div><div class="kpi-value ${attention > 0 ? 'warning' : ''}">${attention}</div></div>
          <div class="kpi-card"><div class="kpi-label">Active Users</div><div class="kpi-value">${APPLICATIONS.reduce((s,a)=>s+a.concurrent,0)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Daily Throughput</div><div class="kpi-value">${(USE_CASES.reduce((s,u)=>s+u.throughput,0) * 24).toLocaleString()}</div></div>
        </div>
      </div>
      <div class="section">
        <div class="section-header"><div class="section-title">Critical Items Requiring Action</div></div>
        ${critical === 0 && attention === 0 ? emptyState('All clear', 'No critical or attention items at this time.') : `
          <table>
            <thead><tr><th>System</th><th>Component</th><th>Issue</th><th>Impact</th><th>Severity</th></tr></thead>
            <tbody>
              ${INFRASTRUCTURE.filter(i => i.status !== 'bau').map(i => `<tr><td>Infrastructure</td><td class="mono">${i.id}</td><td>CPU ${i.cpu}%, Mem ${i.mem}%, Swap ${i.swap}%</td><td>Host degradation</td><td>${statusBadge(i.status)}</td></tr>`).join('')}
              ${POLLERS.filter(i => i.status !== 'bau').map(i => `<tr><td>Pollers</td><td class="mono">${i.id}</td><td>Queue lag ${i.lag}s, depth ${i.queueDepth}</td><td>Polling delays</td><td>${statusBadge(i.status)}</td></tr>`).join('')}
              ${USE_CASES.filter(i => i.status !== 'bau').map(i => `<tr><td>Use Cases</td><td>${i.name}</td><td>Success ${i.success}%, Latency ${i.latency}ms</td><td>Customer impact</td><td>${statusBadge(i.status)}</td></tr>`).join('')}
              ${ETL_PIPELINES.filter(i => i.status !== 'bau').map(i => `<tr><td>ETL</td><td class="mono">${i.id}</td><td>Last run ${i.lastRun}, ${i.success ? 'success' : 'failed'}</td><td>Data freshness</td><td>${statusBadge(i.status)}</td></tr>`).join('')}
            </tbody>
          </table>
        `}
      </div>
      <div class="section">
        <div class="section-header"><div class="section-title">System Performance Summary</div></div>
        <table>
          <thead><tr><th>Domain</th><th class="numeric">Score</th><th>Weight</th><th>Trend</th><th>Status</th></tr></thead>
          <tbody>
            <tr><td>Infrastructure</td><td class="numeric">${cs.infra}%</td><td>${STATE.weights.infrastructure}%</td><td>${sparkline(genSparkData(21,-0.3), 80, 18)}</td><td>${statusBadge(cs.infra >= 85 ? 'bau' : cs.infra >= 70 ? 'attention' : 'critical')}</td></tr>
            <tr><td>Use Cases</td><td class="numeric">${cs.useCases}%</td><td>${STATE.weights.useCases}%</td><td>${sparkline(genSparkData(22,-0.2), 80, 18)}</td><td>${statusBadge(cs.useCases >= 85 ? 'bau' : cs.useCases >= 70 ? 'attention' : 'critical')}</td></tr>
            <tr><td>ETL</td><td class="numeric">${cs.etl}%</td><td>${STATE.weights.etl}%</td><td>${sparkline(genSparkData(23,-0.4), 80, 18)}</td><td>${statusBadge(cs.etl >= 85 ? 'bau' : cs.etl >= 70 ? 'attention' : 'critical')}</td></tr>
            <tr><td>Applications</td><td class="numeric">${cs.apps}%</td><td>${STATE.weights.applications}%</td><td>${sparkline(genSparkData(24,0), 80, 18)}</td><td>${statusBadge(cs.apps >= 85 ? 'bau' : cs.apps >= 70 ? 'attention' : 'critical')}</td></tr>
          </tbody>
        </table>
      </div>
    `;
  }

  function emptyState(title, desc, action){
    return `
      <div class="empty-state">
        <svg class="empty-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
        <div class="empty-title">${title}</div>
        <div class="empty-desc">${desc}</div>
        ${action || ''}
      </div>
    `;
  }

  // ===== SIDE PANEL =====
  function renderSidePanel(){
    const c = STATE.selectedComponent;
    if(!c) return '';
    let title = '', body = '';
    if(c.type === 'infra'){
      const item = INFRASTRUCTURE.find(i => i.id === c.id);
      if(!item) return '';
      title = item.id + ' — ' + item.host;
      body = `
        <div class="detail-grid">
          <div class="detail-item"><div class="detail-label">CPU</div><div class="detail-value">${item.cpu}%</div></div>
          <div class="detail-item"><div class="detail-label">Memory</div><div class="detail-value">${item.mem}%</div></div>
          <div class="detail-item"><div class="detail-label">Swap</div><div class="detail-value">${item.swap}%</div></div>
          <div class="detail-item"><div class="detail-label">Disk I/O</div><div class="detail-value">${item.diskIO} MB/s</div></div>
          <div class="detail-item"><div class="detail-label">Storage</div><div class="detail-value">${item.storage}%</div></div>
          <div class="detail-item"><div class="detail-label">Status</div><div class="detail-value">${statusBadge(item.status)}</div></div>
        </div>
        <div style="margin-top:16px"><div class="detail-label" style="margin-bottom:8px">CPU Trend (1h)</div>${sparkline(genSparkData(item.id.charCodeAt(7)+1), 400, 80, 'var(--accent)')}</div>
        <div style="margin-top:16px"><div class="detail-label" style="margin-bottom:8px">Recent incidents</div>
          <table><thead><tr><th>Time</th><th>Event</th></tr></thead><tbody>
            <tr><td class="mono">${getRelativeTime(12)}</td><td>CPU exceeded 80% threshold</td></tr>
            <tr><td class="mono">${getRelativeTime(248)}</td><td>Disk I/O sustained >400 MB/s for 8m</td></tr>
          </tbody></table>
        </div>
      `;
    } else if(c.type === 'poller'){
      const item = POLLERS.find(i => i.id === c.id);
      if(!item) return '';
      title = item.id + ' — ' + item.host;
      body = `
        <div class="detail-grid">
          <div class="detail-item"><div class="detail-label">NiFi</div><div class="detail-value">${pillState(item.nifi)}</div></div>
          <div class="detail-item"><div class="detail-label">ZooKeeper</div><div class="detail-value">${pillState(item.zk)}</div></div>
          <div class="detail-item"><div class="detail-label">Postgres</div><div class="detail-value">${pillState(item.pg)}</div></div>
          <div class="detail-item"><div class="detail-label">Queue Depth</div><div class="detail-value">${item.queueDepth.toLocaleString()}</div></div>
          <div class="detail-item"><div class="detail-label">Lag</div><div class="detail-value">${item.lag}s</div></div>
          <div class="detail-item"><div class="detail-label">Status</div><div class="detail-value">${statusBadge(item.status)}</div></div>
        </div>
        <div style="margin-top:16px"><div class="detail-label" style="margin-bottom:8px">Queue depth (1h)</div>${sparkline(genSparkData(item.id.charCodeAt(11)+99), 400, 80, 'var(--accent)')}</div>
      `;
    } else if(c.type === 'usecase'){
      const item = USE_CASES.find(i => i.id === c.id);
      if(!item) return '';
      title = item.id + ' · ' + item.name;
      body = `
        <div class="detail-grid">
          <div class="detail-item"><div class="detail-label">Tier</div><div class="detail-value">${item.tier}</div></div>
          <div class="detail-item"><div class="detail-label">Weight</div><div class="detail-value">${item.weight}</div></div>
          <div class="detail-item"><div class="detail-label">Throughput</div><div class="detail-value">${item.throughput.toLocaleString()}/hr</div></div>
          <div class="detail-item"><div class="detail-label">Success rate</div><div class="detail-value">${item.success}%</div></div>
          <div class="detail-item"><div class="detail-label">Latency</div><div class="detail-value">${item.latency} ms</div></div>
          <div class="detail-item"><div class="detail-label">Status</div><div class="detail-value">${statusBadge(item.status)}</div></div>
        </div>
        <div style="margin-top:16px"><div class="detail-label" style="margin-bottom:8px">Success rate (7d)</div>${sparkline(genSparkData(item.id.charCodeAt(3)+50), 400, 80, 'var(--accent)')}</div>
        <div style="margin-top:16px"><div class="detail-label" style="margin-bottom:8px">Dependencies</div>
          <div style="font-size:13px;color:var(--text-muted);line-height:1.7">→ DIGSPOLSVR-01..04 (Poller VMs)<br>→ Clickhouse cluster<br>→ NiFi flow ${item.id.toLowerCase()}_flow.xml<br>→ Postgres ${item.tier}_db</div>
        </div>
      `;
    } else if(c.type === 'etl'){
      const item = ETL_PIPELINES.find(i => i.id === c.id);
      if(!item) return '';
      title = item.id + ' · ' + item.name;
      body = `
        <div class="detail-grid">
          <div class="detail-item"><div class="detail-label">Rows (24h)</div><div class="detail-value">${item.rowCount.toLocaleString()}</div></div>
          <div class="detail-item"><div class="detail-label">Last run</div><div class="detail-value">${item.lastRun}</div></div>
          <div class="detail-item"><div class="detail-label">Last success</div><div class="detail-value">${item.success ? 'Yes' : 'No'}</div></div>
          <div class="detail-item"><div class="detail-label">Status</div><div class="detail-value">${statusBadge(item.status)}</div></div>
        </div>
      `;
    }

    return `
      <div class="side-panel-backdrop" onclick="window.__dnClosePanel()"></div>
      <div class="side-panel">
        <div class="modal-header">
          <div class="modal-title">${title}</div>
          <button class="icon-btn" onclick="window.__dnClosePanel()" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M6 18L18 6"/></svg></button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-footer">
          <button class="btn-ghost" onclick="window.__dnBookmark('${c.id}')">Bookmark</button>
          <button class="btn-secondary" onclick="window.__dnOpenSimModal('${c.id}')">Simulate failure</button>
          <button class="btn-primary" onclick="window.__dnClosePanel()">Close</button>
        </div>
      </div>
    `;
  }

  // ===== SIMULATION MODAL =====
  function renderSimModal(targetId){
    return `
      <div class="modal-backdrop" onclick="if(event.target===this)window.__dnCloseSimModal()">
        <div class="modal">
          <div class="modal-header"><div class="modal-title">Incident Simulation</div><button class="icon-btn" onclick="window.__dnCloseSimModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M6 18L18 6"/></svg></button></div>
          <div class="modal-body">
            <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px">Select a failure scenario to overlay on live data. Simulated state is clearly watermarked and never affects actual telemetry.</div>
            ${FAILURE_SCENARIOS.map(f => `
              <div style="padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:12px">
                <div>
                  <div style="font-weight:500;font-size:13px">${f.name}</div>
                  <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${f.impact}</div>
                </div>
                <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
                  ${statusBadge(f.severity)}
                  <button class="btn-secondary" onclick="window.__dnRunSim('${f.id}')">Simulate</button>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="modal-footer"><button class="btn-ghost" onclick="window.__dnCloseSimModal()">Cancel</button></div>
        </div>
      </div>
    `;
  }

  // ===== TIME =====
  function getCurrentTime(){
    const d = new Date();
    return d.toTimeString().slice(0, 8);
  }
  function getRelativeTime(min){
    if(min < 60) return min + 'm ago';
    return Math.floor(min/60) + 'h ' + (min % 60) + 'm ago';
  }
  function updateLastUpdated(){
    document.getElementById('lastUpdated').textContent = 'Updated ' + getCurrentTime();
  }

  // ===== RENDER =====
  function render(){
    renderNav();
    renderTimeSelector();
    const main = document.getElementById('main');
    let html = '';
    if(STATE.view === 'operations') html = viewOperations();
    else if(STATE.view === 'usecases') html = viewUseCases();
    else if(STATE.view === 'etl') html = viewETL();
    else if(STATE.view === 'trends') html = viewTrends();
    else if(STATE.view === 'admin') html = viewAdmin();
    else if(STATE.view === 'executive') html = viewExecutive();
    main.innerHTML = html;

    // overlays
    document.querySelectorAll('.side-panel-backdrop, .side-panel, .modal-backdrop').forEach(el => el.remove());
    if(STATE.selectedComponent){
      const overlay = document.createElement('div');
      overlay.innerHTML = renderSidePanel();
      while(overlay.firstChild) document.body.appendChild(overlay.firstChild);
    }
    if(STATE.simModalOpen){
      const overlay = document.createElement('div');
      overlay.innerHTML = renderSimModal(STATE.simModalTarget);
      while(overlay.firstChild) document.body.appendChild(overlay.firstChild);
    }
  }

  // ===== INTERACTION HANDLERS =====
  window.__dnGo = function(v){ STATE.view = v; STATE.selectedComponent = null; render(); };
  window.__dnDrill = function(id){
    if(id === 'infrastructure') { STATE.view = 'operations'; render(); }
    else if(id === 'usecases') { STATE.view = 'usecases'; render(); }
    else if(id === 'etl') { STATE.view = 'etl'; render(); }
    else if(id === 'applications') { STATE.view = 'etl'; render(); }
  };
  window.__dnToggleSection = function(key){
    STATE.expanded[key] = !(STATE.expanded[key] === undefined ? (key === 'stack' ? false : true) : STATE.expanded[key]);
    render();
  };
  window.__dnExpandAll = function(state){
    STATE.expanded = { infra: state, pollers: state, stack: state };
    render();
  };
  window.__dnFilter = function(sev){ STATE.filters.severity = sev; render(); };
  window.__dnSearch = function(v){
    STATE.filters.search = v;
    // Avoid full re-render on every keystroke; debounce briefly
    clearTimeout(window.__dnSearchT);
    window.__dnSearchT = setTimeout(render, 120);
  };
  window.__dnOpenPanel = function(type, id){ STATE.selectedComponent = { type, id }; render(); };
  window.__dnClosePanel = function(){ STATE.selectedComponent = null; render(); };
  window.__dnOpenSimModal = function(target){
    STATE.simModalOpen = true;
    STATE.simModalTarget = target;
    render();
  };
  window.__dnCloseSimModal = function(){ STATE.simModalOpen = false; render(); };
  window.__dnRunSim = function(fid){
    const f = FAILURE_SCENARIOS.find(s => s.id === fid);
    STATE.simulationMode = true;
    STATE.activeSimulations.push(f);
    STATE.simModalOpen = false;
    // Apply simulated effects
    if(fid === 'fs1'){ INFRASTRUCTURE[3].status = 'critical'; INFRASTRUCTURE[3].cpu = 99; INFRASTRUCTURE[3].mem = 96; }
    if(fid === 'fs2'){ POLLERS[2].nifi = 'down'; POLLERS[2].status = 'critical'; POLLERS[3].nifi = 'degraded'; }
    if(fid === 'fs3'){ POLLERS[3].pg = 'degraded'; POLLERS[3].lag = 45; }
    if(fid === 'fs4'){ ETL_PIPELINES[0].status = 'critical'; ETL_PIPELINES[0].lastRun = '4h 22m ago'; }
    if(fid === 'fs5'){ USE_CASES[3].status = 'critical'; USE_CASES[3].success = 78.2; }
    toast('Simulation started: ' + f.name, 'warning');
    render();
  };
  window.__dnExitSim = function(){
    STATE.simulationMode = false;
    STATE.activeSimulations = [];
    // restore: reload by resetting status values to original mock
    INFRASTRUCTURE[3].cpu = 89; INFRASTRUCTURE[3].mem = 91; INFRASTRUCTURE[3].status = 'critical';
    POLLERS[2].nifi = 'degraded'; POLLERS[2].status = 'attention';
    POLLERS[3].pg = 'degraded'; POLLERS[3].lag = 8; POLLERS[3].status = 'attention';
    ETL_PIPELINES[0].status = 'bau'; ETL_PIPELINES[0].lastRun = '12m ago';
    USE_CASES[3].status = 'critical'; USE_CASES[3].success = 91.3;
    toast('Simulation cleared, live data restored', 'success');
    render();
  };
  window.__dnSetWeight = function(key, val){
    STATE.weights[key] = +val;
    const el = document.getElementById('w_' + key); if(el) el.textContent = val + '%';
  };
  window.__dnSetKpiWeight = function(key, val){
    STATE.weights.kpi[key] = +val;
    const el = document.getElementById('kw_' + key); if(el) el.textContent = val + '%';
  };
  window.__dnSaveWeights = function(){ toast('Weights saved. Confidence score recalculated.', 'success'); render(); };
  window.__dnResetWeights = function(){
    STATE.weights = { infrastructure: 30, useCases: 35, etl: 20, applications: 15, kpi: { availability: 40, performance: 30, dataQuality: 20, timeliness: 10 } };
    toast('Weights reset to defaults', 'info');
    render();
  };
  window.__dnExport = function(){ toast('Snapshot exported as CSV', 'success'); };
  window.__dnBookmark = function(id){
    if(STATE.bookmarks.indexOf(id) === -1){ STATE.bookmarks.push(id); toast('Bookmarked ' + id, 'success'); }
    else toast(id + ' already bookmarked', 'info');
  };
  window.__dnAddAnnotation = function(){
    STATE.annotations.push({ time: 'just now', text: 'Operator note added', system: 'general' });
    toast('Annotation added to timeline', 'success');
    render();
  };

  // Role selector
  document.getElementById('roleSelect').addEventListener('change', function(){
    STATE.role = this.value;
    toast('Role changed to ' + this.options[this.selectedIndex].text, 'info');
    render();
  });

  // Keyboard
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      if(STATE.simModalOpen){ STATE.simModalOpen = false; render(); }
      else if(STATE.selectedComponent){ STATE.selectedComponent = null; render(); }
    }
  });

  // Auto-refresh tick
  setInterval(function(){
    if(!STATE.autoRefresh) return;
    updateLastUpdated();
    // jitter some metrics slightly to feel live
    INFRASTRUCTURE.forEach(i => {
      if(!STATE.simulationMode || i.id !== 'AX162-04'){
        i.cpu = Math.max(5, Math.min(99, i.cpu + Math.round((Math.random() - 0.5) * 4)));
      }
    });
    if(STATE.view === 'operations' && !STATE.selectedComponent && !STATE.simModalOpen){
      // light refresh: just update timestamp; full re-render is heavy
    }
  }, 5000);

  // Initial
  render();
  setTimeout(() => toast('Operations Twin ready · ' + (INFRASTRUCTURE.length + POLLERS.length + USE_CASES.length) + ' components monitored', 'success'), 400);
})();
</script>
</body></html>
